name: EGE11 Cauldron QA
on:
  pull_request:
    paths:
      - "games/ege11-cauldron/**"
      - ".github/workflows/ege11-cauldron-qa.yml"
  push:
    branches:
      - "feature/ege11-hell-cauldron-20261114"
    paths:
      - "games/ege11-cauldron/**"
      - ".github/workflows/ege11-cauldron-qa.yml"
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify iPhone-sized screens, WebKit, full rounds and Telegram payload
        run: node games/ege11-cauldron/browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ege11-qa-viewport-screenshots
          path: /tmp/ege11-*.png
          if-no-files-found: ignore
