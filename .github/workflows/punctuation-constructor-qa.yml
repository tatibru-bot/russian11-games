name: Punctuation Constructor QA
on:
  pull_request:
    paths:
      - "games/punctuation-constructor/**"
      - ".github/workflows/punctuation-constructor-qa.yml"
  push:
    branches:
      - "feature/punctuation-constructor-mvp-20261116"
      - "feature/legopunkt-reassembly-seams-20261117"
    paths:
      - "games/punctuation-constructor/**"
      - ".github/workflows/punctuation-constructor-qa.yml"
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify assembled sentences, seam audit and phone/tablet layouts
        run: node games/punctuation-constructor/browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punctuation-constructor-screenshots
          path: /tmp/punct-*.png
          if-no-files-found: ignore
