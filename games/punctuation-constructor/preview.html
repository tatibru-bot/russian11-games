function norm(s){return String(s).toLocaleLowerCase("ru").replace(/ё/g,"е")}
function locate(words,phrase){
 const p=phrase.match(/^(.*)#(\d+)$/),needle=p?p[1]:phrase,occ=p?Number(p[2]):null;
 const look=needle.trim().split(/\s+/).map(norm),hits=[];
 for(let i=0;i<=words.length-look.length;i++)if(look.every((v,j)=>norm(words[i+j])===v))hits.push(i);
 if(!hits.length||occ&&occ>hits.length||!occ&&hits.length!==1)throw Error("Ambiguous token '"+phrase+"' in "+words.join(" "));
 const at=hits[(occ||1)-1];return look.map((_,j)=>at+j)
}
function indices(words,spec){
 const arr=Array.isArray(spec)?spec:[spec],out=[];
 for(const phrase of arr){
  for(const part of phrase.split("|"))out.push(...locate(words,part.trim()));
 }
 return [...new Set(out)].sort((a,b)=>a-b)
}

 const mains=raw.mains.map(x=>({id:x.id,words:indices(words,x.words)}));

 const extras=(raw.extras||[]).map((x,i)=>({id:"e"+i,words:indices(words,x[0]),type:x[1]}));
 const hom=(raw.hom||[]).map((x,i)=>({id:"h"+i,words:indices(words,x)}));
 const general=(raw.general||[]).map((x,i)=>({id:"g"+i,words:indices(words,x)}));
 const junctions=(raw.junctions||[]).map(x=>({after:indices(words,[x[0]])[0],right:indices(words,[x[1]])[0],glued:x[2]}));
 const punct=(raw.punct||[]).map(x=>({after:indices(words,[x[0]])[0],sign:x[1],why:x[2]}));
 const duplicates=(items,key)=>items.filter((x,i)=>items.findIndex(y=>y[key]===x[key])!==i);
 if(duplicates(conjs,"at").length||duplicates(punct,"after").length)throw Error("Duplicate conjs/punctuation in "+base);
 if(junctions.some(x=>x.right!==x.after+1))throw Error("Junction must be adjacent "+base);
 if(subs.some(x=>!bases.some(b=>b.words.some(n=>x.words.includes(n)))))throw Error("Sub missing base "+base);
 const allSub=new Set(subs.flatMap(x=>x.words));if(subs.reduce((n,x)=>n+x.words.length,0)!==allSub.size)throw Error("Overlapping sub word spans: "+base);
 return {id:base,num:raw.num,short:raw.short,words,bases,mains,common,subs,conjs,turns,extras,hom,general,junctions,punct,insight:raw.insight};
});

/* ЛЕГОПУНКТ: оригинальная цветовая система учебного конструктора; без использования логотипов LEGO. */
:root{--bg:#10243d;--panel:#203956;--line:#52718b;--cyan:#6fdef4;--gold:#ffdd73;--rose:#ff9eaa;--purple:#bba4ff;--green:#8de9ae;--orange:#ffb879}
body{background:radial-gradient(ellipse at 13% 10%,#2b4c70 0,transparent 42%),linear-gradient(150deg,#11243c,#152f50 75%,#0e2440)}
.panel{border-color:#62819c;box-shadow:inset 0 1px #ffffff25,0 2px 0 #0a172a}

.modeTile:nth-child(2){border-color:#f68d97;background:linear-gradient(145deg,#913f57,#432c51)}
.modeTile:nth-child(3){border-color:#74c4ff;background:linear-gradient(145deg,#245b99,#263853)}
.modeTile:nth-child(4){border-color:#8edbad;background:linear-gradient(145deg,#236b61,#223953)}
.modeTile:nth-child(5){border-color:#c5a8ff;background:linear-gradient(145deg,#654a91,#333554)}
.modeTile strong{color:#ffedbd}
.workarea{flex:1;min-height:0;display:grid;grid-template-rows:minmax(50px,max-content) minmax(0,1fr);gap:6px}
.wordsPanel{gap:3px;padding:7px 10px;display:block;min-height:0}
.cleanSentence{font-size:clamp(13px,1.7vw,17px);line-height:1.5;color:#fff;max-height:66px;overflow:auto;font-weight:600;white-space:normal}

.buildPanel,.diagramPanel{display:flex;flex-direction:column;gap:4px;min-height:0;padding:7px 9px}
.blueprint{position:relative;overflow:auto;min-height:0;flex:1;scrollbar-width:thin}
.blueprintContent{position:relative;min-height:100%;padding:2px 2px 9px}
.track{position:relative;display:flex;align-items:flex-start;flex-wrap:wrap;gap:5px 4px;margin:3px 0 7px;padding:7px 6px 8px 6px;min-height:52px;border-radius:9px;border:1px solid #577e9c;background:#142c45}
.track.secondary{background:#242448;border-color:#8b81dc}
.track.tertiary{background:#3c2946;border-color:#d797b4}
.trackLabel{flex:0 0 100%;font-size:10px;color:#bfdfe8;text-transform:uppercase;letter-spacing:.06em;font-weight:850}
.track.secondary .trackLabel{color:#c7bcff}.track.tertiary .trackLabel{color:#ffd3e5}
.emptyTrack{font-size:11px;color:#8cabc4;font-style:italic}
.brick{display:inline-flex;align-items:center;position:relative;gap:0;min-height:38px;padding-top:8px;z-index:2}
.brick .word{border-radius:5px;min-height:30px;font-size:clamp(12px,1.5vw,15px);padding:5px 7px;box-shadow:inset 0 4px #ffffff25,0 3px #091728;font-weight:750;white-space:nowrap}
.brick .word.subject .wtext{text-decoration-line:underline;text-decoration-style:solid;text-decoration-color:#ffe48a;text-decoration-thickness:2px;text-underline-offset:4px}
.brick .word.predicate .wtext{text-decoration-line:underline;text-decoration-style:double;text-decoration-color:#ffca80;text-decoration-thickness:2px;text-underline-offset:4px}
.brick .word.common{background:#216446;border-color:#90dfa3;color:#fcffed}
.brick .word.turn{background:#66502b;border-color:#f7c879}
.brick .word.extra{background:#603454;border-color:#f6b3df}
.brick .word.hom{border-radius:24px;outline:1px solid #a8e7b3}
.brick .word.general{outline:3px double #ffe9a0}
.brick .word.selected{background:#ffeeab;color:#151f31;outline:2px solid #fff3b5}
.brick .above{position:absolute;top:-10px;left:50%;transform:translateX(-50%);height:16px;color:#ffdd6c;font-size:17px;font-weight:1000;pointer-events:none}
.brick.turnBegin:before{content:"│";position:absolute;left:-5px;bottom:1px;color:#f9d595;font-size:24px;font-weight:bold}
.brick.turnEnd:after{content:"│";position:absolute;right:-5px;bottom:1px;color:#f9d595;font-size:24px;font-weight:bold}
.syntaxBracket{font-weight:900;font-size:clamp(19px,2vw,25px);line-height:1.5;color:#88dbfd;align-self:center}
.syntaxBracket.sub{color:#c2afff}.syntaxBracket.common{color:#9fe6ab}
.blueprint .punctGap{min-width:17px;padding:1px 2px;margin-left:1px}
.arrowOverlay{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:4}
.diagramPanel .diagram{display:flex;flex-direction:column;gap:5px}
.schemeNote{font-size:10px;line-height:1.4;color:#bcd0e3}

.schemeJoin{color:#ffda6e;font-weight:850;padding:0 2px}
.schemeCommon{color:#a4edbf;border-bottom:2px solid #a4edbf;font-weight:800;font-size:12px}
.schemeExtra{font-size:12px;color:#f2bcde}
.schemeTurn{font-size:12px;color:#ffd090}
.graphLinks{display:flex;flex-direction:column;gap:5px;border-top:1px dashed #64768a;padding-top:6px;margin-top:7px}
.graphLinks .graphLink{font-size:12px;color:#e7e0fd;padding:5px;border-left:3px solid #b3a4f6;background:#2d2b4a;border-radius:4px}
.selectionHint{font-size:10px;color:#e5debb;min-height:12px}

 .modeGrid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}

}

.brick .word.pendingTurn{outline:2px solid #ffde82;outline-offset:1px}
.brick .word.turn.selected,.brick .word.pendingTurn.selected{background:#76501c;color:#fff8da;border-color:#ffcd67}

</style></head>
<body><div class="app">
<header class="top"><div class="brand"><span class="glyph" aria-hidden="true">🧱</span><div><strong>ЛЕГОПУНКТ</strong><small>Собери предложение · ЕГЭ 16–20</small></div></div><span class="status" id="status">черновик 0.1</span></header>
<main id="main"></main>
</div><script>
(function(){
"use strict";
const tasks=window.PUNCT_DATA||[],help=window.PUNCT_HELP||{},main=document.getElementById("main"),status=document.getElementById("status");
const modes=["16","17","18","19","20","HARD"],subtitles={"16":"Однородные и ССП","17":"Обособленные члены","18":"Вводные и обращения","19":"Придаточные","20":"Разные виды связи","HARD":"Все конструкции вместе"};
const q=(x)=>String(x??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const norm=x=>String(x||"").toLocaleLowerCase("ru").replace(/ё/g,"е");
const SAME=(a,b)=>a.length===b.length&&a.slice().sort((x,y)=>x-y).every((x,i)=>x===b.slice().sort((x,y)=>x-y)[i]);
const has=(arr,id)=>arr.includes(id);
const STORE="punct:constructor:mvp:completed:v1";
let completed={};try{completed=JSON.parse(localStorage.getItem(STORE)||"{}")||{}}catch(e){}
let st={view:"menu",task:null,step:0,picked:[],pending:null,anchor:null,question:"",marks:null,glues:[],gap:null,sign:",",hint:"",hintType:"",fail:0,choiceKind:"coord",choiceRole:"parts"};
function resetMarks(){return {bases:[],common:[],subs:[],conjs:[],turns:[],extras:[],hom:[],general:[],punct:{}}}
function list(kind){return st.task[kind]||[]}
function selectedMatch(kind){return list(kind).find(x=>!has(st.marks[kind],x.id)&&SAME(x.words,st.picked))}
function progress(){const a=st.task;return [
 [st.marks.bases.length+st.marks.common.length,a.bases.length+a.common.length],
 [st.marks.subs.length,a.subs.length],
 [st.marks.conjs.length,a.conjs.length],
 [st.marks.turns.length,a.turns.length],
 [st.marks.extras.length,a.extras.length],
 [st.marks.hom.length+st.marks.general.length,a.hom.length+a.general.length],
 [Object.entries(st.marks.punct).filter(([k,v])=>v).length,a.punct.length]
 ][st.step]}
function stageReady(){const p=progress();if(!p||p[0]!==p[1]||st.pending)return false;if(st.step===2){return list("junctions").every(j=>st.glues.includes(j.after)===j.glued)}return true}
function note(s,type=""){st.hint=s;st.hintType=type}
function launch(num,index=0){const a=tasks.filter(x=>x.num===num);st={view:"game",num,index,task:a[index%a.length],step:0,picked:[],pending:null,anchor:null,question:"",marks:resetMarks(),glues:[],gap:null,sign:",",hint:"",hintType:"",fail:0,choiceKind:"coord",choiceRole:"parts"};render()}
function launchNext(){const a=tasks.filter(x=>x.num===st.num);launch(st.num,(st.index+1)%a.length)}
function taskCount(num){return tasks.filter(x=>x.num===num).length}
function menu(){
 st.view="menu";status.textContent="методический прототип";
 main.innerHTML='<div class="menu"><div class="intro panel"><h1>🧱 ЛЕГОПУНКТ: построй предложение!</h1><p>Каждое слово — кирпичик. Найди основы, опусти придаточные, соедини стрелками, выдели обороты — и собери точную пунктуационную схему. Это учебный прототип, пока без передачи оценок в Telegram.</p></div><div class="modeGrid">'+modes.map(n=>'<button class="modeTile '+(n==="HARD"?"hard":"")+'" data-act="launch" data-num="'+n+'"><strong>'+(n==="HARD"?"⚡ Хард-уровень":"№ "+n)+'</strong><small>'+subtitles[n]+'</small><b>'+taskCount(n)+' '+(taskCount(n)===1?"пример":"примера")+' · '+tasks.filter(t=>t.num===n&&completed[t.id]).length+' решено</b></button>').join("")+'</div><div class="bottomNote">Три дорожки и схемы собираются из слов предложения. Без системной клавиатуры; статистика пока локальная.</div></div>';
}
function pickedText(){return st.picked.map(i=>st.task.words[i]).join(" · ")}
function clearChoice(){st.picked=[];st.anchor=null;st.question="";st.pending=null}
function foundTag(i,kind){
 if(kind==="conjs")return list("conjs").find(x=>x.at===i&&st.marks.conjs.includes("c"+i));
 const groups=st.marks[kind];return list(kind).find(x=>has(groups,x.id)&&x.words.includes(i));
}
function descMark(i){
 const a=[];if(st.marks.bases.some(id=>st.task.bases.find(x=>x.id===id)?.words.includes(i)))a.push("base");
 if(foundTag(i,"subs"))a.push("subword");
 if(foundTag(i,"conjs"))a.push("conj");
 if(foundTag(i,"turns"))a.push("turn");
 if(foundTag(i,"extras"))a.push("extra");
 if(foundTag(i,"hom"))a.push("hom");
 if(foundTag(i,"general"))a.push("general");
 return a.join(" ");
}
function stripExtras(indices){const hidden=new Set([...st.marks.extras.flatMap(id=>st.task.extras.find(x=>x.id===id)?.words||[])]);return indices.filter(i=>!hidden.has(i))}
function tokenString(indices){return indices.map(i=>q(st.task.words[i])).join(" ")}


function parentOf(sub){return st.task.subs.find(x=>x.id!==sub.id&&x.words.includes(sub.head))||null}
function subDepth(sub,seen=new Set()){
 if(seen.has(sub.id))throw Error("Зацикленная зависимость придаточных");
 seen.add(sub.id);const parent=parentOf(sub);
 return parent?subDepth(parent,seen)+1:1;
}
function fullSubWords(sub){
 const seen=new Set(),all=new Set(sub.words);
 function visit(s){if(seen.has(s.id))throw Error("Зацикленная зависимость");seen.add(s.id);
  for(const child of st.task.subs.filter(x=>parentOf(x)?.id===s.id)){
   child.words.forEach(i=>all.add(i));visit(child);
  }
 }
 visit(sub);return [...all].sort((a,b)=>a-b);
}
function laneOf(i){
 const a=st.task,marked=a.subs.filter(x=>st.marks.subs.includes(x.id));
 const maxDepth=Math.max(0,...marked.map(x=>subDepth(x)));
 if(st.marks.extras.some(id=>a.extras.find(e=>e.id===id)?.words.includes(i)))return Math.max(1,maxDepth)+1;
 const inside=marked.filter(x=>fullSubWords(x).includes(i));
 if(inside.length)return Math.max(...inside.map(x=>subDepth(x)));
 const between=a.conjs.find(c=>c.at===i&&c.role==="between-subs");
 if(between&&marked.length>1)return Math.min(...marked.map(x=>subDepth(x)));
 return 0;
}

function isInMark(i,kind){return st.marks[kind].some(id=>st.task[kind].find(x=>x.id===id)?.words.includes(i))}
function wordPiece(i){
 const a=st.task,w=a.words[i],punct=st.step===6;
 let classes=descMark(i),picked=st.picked.includes(i)||(st.pending&&st.anchor===i);
 const pendingTurn=st.pending?.kind==="turns"?a.turns.find(t=>t.id===st.pending.id):null;
 if(pendingTurn?.words.includes(i))classes+=" pendingTurn";
 if(st.marks.bases.some(id=>a.bases.find(x=>x.id===id)?.subjects.includes(i)))classes+=" subject";
 if(st.marks.bases.some(id=>a.bases.find(x=>x.id===id)?.predicates.includes(i)))classes+=" predicate";
 if(isInMark(i,"common"))classes+=" common";
 if(picked)classes+=" selected";
 const turns=a.turns.filter(t=>st.marks.turns.includes(t.id)||(pendingTurn?.id===t.id));
 const first=turns.some(t=>t.words[0]===i),last=turns.some(t=>t.words[t.words.length-1]===i);
 const anchor=turns.some(t=>(t.type==="part"||t.type==="appos")&&t.head===i&&(st.marks.turns.includes(t.id)||st.anchor===t.head));
 const gap=punct?'<button class="punctGap '+(st.gap===i?"target":"")+(st.marks.punct[i]?" filled":"")+'" data-act="gap" data-i="'+i+'" aria-label="Знак после '+q(w)+'">'+q(st.marks.punct[i]||"·")+'</button>':"";
 return '<span class="brick '+(first?"turnBegin ":"")+(last?"turnEnd":"")+'" data-i="'+i+'">'+(anchor?'<span class="above" aria-label="определяемое слово">×</span>':"")+'<button class="word '+classes+'" data-act="token" data-i="'+i+'" aria-pressed="'+!!picked+'"><span class="wtext">'+q(w)+'</span></button>'+gap+'</span>';
}

function bracketGroups(level,visible){
 const a=st.task,used=new Set(visible),common=new Set(a.common.filter(x=>st.marks.common.includes(x.id)).flatMap(x=>x.words));
 const groups=level===0?(st.marks.bases.length?a.mains:[]):a.subs.filter(x=>st.marks.subs.includes(x.id)&&subDepth(x)===level);
 return groups.map(g=>{
  const positions=g.words.filter(i=>used.has(i)&&!(level===0&&common.has(i)));
  return positions.length?{id:g.id,min:Math.min(...positions),max:Math.max(...positions),sub:level>0}:null;
 }).filter(Boolean);
}
function activeLevels(){
 const depths=st.task.subs.filter(x=>st.marks.subs.includes(x.id)).map(x=>subDepth(x));
 const levels=[0,...new Set(depths)].sort((a,b)=>a-b);
 if(st.marks.extras.length)levels.push(Math.max(1,...depths)+1);
 return levels;
}
function laneHTML(level,extraLevel){
 const a=st.task,visible=a.words.map((_,i)=>i).filter(i=>laneOf(i)===level),extra=level===extraLevel;
 const groups=extra?[]:bracketGroups(level,visible);
 const name=extra?"↓ Не члены предложения":level===0?"Главные части":"↓ Придаточные · уровень "+level;
 let pieces="";
 for(const i of visible){
  for(const g of groups.filter(x=>x.min===i).sort((x,y)=>y.max-x.max))
   pieces+='<span class="syntaxBracket '+(g.sub?"sub":"")+'">'+(g.sub?"(":"[")+'</span>';
  pieces+=wordPiece(i);
  for(const g of groups.filter(x=>x.max===i).sort((x,y)=>y.min-x.min))
   pieces+='<span class="syntaxBracket '+(g.sub?"sub":"")+'">'+(g.sub?")":"]")+'</span>';
 }
 return '<div class="track '+(extra?"tertiary":level?"secondary":"")+'" data-lane="'+level+'"><div class="trackLabel">'+name+'</div>'+pieces+'</div>';
}
function blueprint(){
 const levels=activeLevels(),extraLevel=st.marks.extras.length?levels[levels.length-1]:-1;
 return '<div class="blueprint" id="blueprint"><div class="blueprintContent" id="blueprintSurface">'+levels.map(level=>laneHTML(level,extraLevel)).join("")+'<svg class="arrowOverlay" aria-hidden="true"><defs><marker id="brickArrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#ffdc7c" stroke-width="1.4"/></marker></defs><g id="arrowPaths"></g></svg></div></div>';
}
function drawArrows(){
 const surface=document.getElementById("blueprintSurface"),svg=surface?.querySelector(".arrowOverlay"),paths=document.getElementById("arrowPaths");
 if(!surface||!svg||!paths||!st.task)return;
 const b=surface.getBoundingClientRect(),items=[];
 const point=i=>{const el=surface.querySelector('.brick[data-i="'+i+'"] .word');if(!el)return null;const r=el.getBoundingClientRect();return {x:r.left+r.width/2-b.left,y:r.top-b.top}};
 for(const id of st.marks.subs){const sub=st.task.subs.find(x=>x.id===id);items.push({from:sub.head,to:sub.words[0],label:sub.question,stroke:"#cab7ff"})}
 for(const id of st.marks.turns){const t=st.task.turns.find(x=>x.id===id);items.push({from:t.head,to:t.words[0],label:t.type==="ger"?"действие":"×",stroke:"#ffcf80"})}
 const w=Math.max(surface.scrollWidth,surface.clientWidth),h=Math.max(surface.scrollHeight,surface.clientHeight);
 svg.setAttribute("width",w);svg.setAttribute("height",h);
 paths.innerHTML=items.map(x=>{
  const p=point(x.from),t=point(x.to);if(!p||!t)return "";
  const y1=p.y-2,y2=t.y-2,control=Math.min(y1,y2)-Math.max(15,Math.min(35,Math.abs(p.x-t.x)/4));
  const middle=(p.x+t.x)/2;
  return '<path d="M'+p.x+' '+y1+' Q'+middle+' '+control+' '+t.x+' '+y2+'" fill="none" stroke="'+x.stroke+'" stroke-width="2" marker-end="url(#brickArrow)"/><text x="'+middle+'" y="'+(control+7)+'" text-anchor="middle" font-size="13" font-weight="800" fill="'+x.stroke+'" paint-order="stroke" stroke="#132a43" stroke-width="3">'+q(x.label)+'</text>';
 }).join("");
}


function schema(){
 const a=st.task,markedBases=a.bases.filter(x=>st.marks.bases.includes(x.id));
 if(!markedBases.length)return '<div class="schemeEmpty">Сначала найди грамматические основы — здесь появится схема.</div>';
 const common=a.common.some(x=>st.marks.common.includes(x.id));
 const mainLines=a.mains.map(m=>{
  const bases=markedBases.filter(b=>b.words.some(i=>m.words.includes(i)));
  const parts=bases.map(b=>b.subjects.length?"— ═":"═").join(" ");
  return '<span class="schemeNode">[ '+(parts||"— ═")+' ]</span>';
 });
 const mainConj=a.conjs.find(c=>c.role==="parts");
 const join=mainConj&&st.marks.conjs.includes("c"+mainConj.at)?q(a.words[mainConj.at]):"";
 const main='<div class="schemeRow schemeMain">'+(common?'<span class="schemeCommon">ОВЧ</span>':"")+mainLines.join(join?'<span class="schemeJoin">'+join+'</span>':" ")+'</div>';
 const markedSubs=a.subs.filter(x=>st.marks.subs.includes(x.id)).sort((a,b)=>subDepth(a)-subDepth(b));
 const branches=markedSubs.map(x=>{
  const base=markedBases.find(b=>b.words.some(i=>x.words.includes(i)));
  const hasSubject=!!base?.subjects?.length;
  const conjunction=a.conjs.find(c=>x.words.includes(c.at)&&c.role==="inside"&&st.marks.conjs.includes("c"+c.at));
  const role=conjunction?q(a.words[conjunction.at])+" ":"";
  return '<div class="schemeRow schemeBranch" style="margin-left:'+(subDepth(x)-1)*22+'px"><span class="schemeQuestion">↳ '+q(x.question)+'</span><span class="schemeNode sub">( '+role+(hasSubject?"— ═":"═")+' )</span></div>';
 }).join("");
 const turnCount=st.marks.turns.length,homCount=st.marks.hom.length,generalCount=st.marks.general.length;
 const note=(turnCount||homCount||generalCount)?'<div class="schemeMarks">'+(turnCount?"× ─ │оборот│ ":"")+(homCount?" ◯ однородные ":"")+(generalCount?" ◎ обобщающее":"")+'</div>':"";
 return '<div class="schemeCompact">'+main+branches+note+'</div>';
}

function toolbar(){
 const a=st.task,step=st.step,done=stageReady();
 const next='<button class="primary" data-act="nextstage">'+(step===6?"Проверить пунктуацию":"Следующий этап →")+'</button>';
 if(step===6){
  return '<div class="actionLine"><span class="field">Нажми границу после слова, затем знак:</span><div class="punctBar">'+[[",","Запятая"],["—","Тире"],[":","Двоеточие"],[";","Точка с запятой"],["","Нет знака"]].map(x=>'<button title="'+x[1]+'" data-act="set-sign" data-sign="'+x[0]+'">'+(x[0]||"∅")+'</button>').join("")+'</div><span class="stretch"></span>'+next+'</div>';
 }
 if(st.pending){
  const p=st.pending,pendingTurn=p.kind==="turns"?a.turns.find(t=>t.id===p.id):null;
  const headLabel=pendingTurn?(pendingTurn.type==="ger"?"Сказуемое":"Определяемое слово"):"Опорное слово",questions=p.kind==="subs"?'<label class="field">Вопрос: <select id="question"><option value="">Выбери вопрос</option>'+[...new Set([...help.questions,...a.subs.map(s=>s.question)])].map(x=>'<option value="'+q(x)+'"'+(st.question===x?" selected":"")+'>'+q(x)+'</option>').join("")+'</select></label>':'';
  return '<div class="actionLine"><span class="field">Выделено: '+q(tokenString(p.words).replace(/<[^>]+>/g,""))+'</span>'+questions+'<span class="field">'+headLabel+': '+(st.anchor==null?"нажми в предложении":'<b>'+q(a.words[st.anchor])+'</b>')+'</span><span class="stretch"></span><button class="primary" data-act="link">Связать ↗</button><button data-act="cancel">Отмена</button></div>';
 }
 if(step===0)return '<div class="actionLine"><button class="primary" data-act="mark" data-kind="bases">Подчеркнуть основы</button><button class="gold" data-act="mark" data-kind="common">Выделить ОВЧ</button><span class="stretch"></span><button data-act="clear">Снять выделение</button>'+ (done?next:"")+'</div>';
 if(step===1)return '<div class="actionLine"><button class="primary" data-act="mark" data-kind="subs">Спустить придаточное ↓</button><span class="stretch"></span><button data-act="clear">Снять выделение</button>'+(done?next:"")+'</div>';
 if(step===2)return '<div class="actionLine"><label class="field">Тип: <select id="kind">'+[["coord","Сочинительный"],["sub","Подчинительный"],["relative","Союзное слово"],["correlate","Указательное «то»"]].map(([v,label])=>'<option value="'+v+'"'+(st.choiceKind===v?" selected":"")+'>'+label+'</option>').join("")+'</select></label><label class="field">Связь: <select id="role">'+[["parts","Части ССП (две основы)"],["members","Однородные члены"],["between-subs","Однородные придаточные"],["inside","Внутри придаточного"]].map(([v,label])=>'<option value="'+v+'"'+(st.choiceRole===v?" selected":"")+'>'+label+'</option>').join("")+'</select></label><button class="primary" data-act="mark" data-kind="conjs">Разметить союз</button><span class="stretch"></span>'+(done?next:"")+'</div>'+junctionButtons();
  if(step===3)return '<div class="actionLine"><label class="field">Вид: <select id="kind">'+[["part","Причастный"],["ger","Деепричастный"],["appos","Приложение"],["detail","Уточнение"],["compare","Сравнительный"]].map(([v,label])=>'<option value="'+v+'"'+(st.choiceKind===v?" selected":"")+'>'+label+'</option>').join("")+'</select></label><button class="primary" data-act="mark" data-kind="turns">Выделить оборот │ │</button><span class="stretch"></span>'+(done?next:"")+'</div>';
  if(step===4)return '<div class="actionLine"><label class="field">Вид: <select id="kind">'+[["intro","Вводное"],["address","Обращение"],["insert","Вставка"]].map(([v,label])=>'<option value="'+v+'"'+(st.choiceKind===v?" selected":"")+'>'+label+'</option>').join("")+'</select></label><button class="primary" data-act="mark" data-kind="extras">На отдельную дорожку ↓</button><span class="stretch"></span>'+(done?next:"")+'</div>';
  return '<div class="actionLine"><button class="primary" data-act="mark" data-kind="hom">Однородные ◯</button><button class="gold" data-act="mark" data-kind="general">Обобщающее ◎</button><span class="stretch"></span>'+(done?next:"")+'</div>';
}
function junctionButtons(){
 const a=list("junctions");if(!a.length)return "";
 return '<div class="actionLine">'+a.map(x=>'<button data-act="glue" data-i="'+x.after+'" class="'+(st.glues.includes(x.after)?"gold":"ghost")+'">⛓ Стык «'+q(st.task.words[x.after])+' + '+q(st.task.words[x.right])+'»: '+(st.glues.includes(x.after)?"склеено":"не склеено")+'</button>').join("")+'</div>';
}

function render(){
 if(st.view==="menu"){menu();return}
 if(st.view==="finish"){finish();return}
 const a=st.task,step=st.step,p=progress();
 status.textContent="этап "+(step+1)+" / 7";
 const instructions=[
  "Выдели все грамматические основы сразу. Если есть общий второстепенный член, отметь его отдельно.",
  "Спусти всё придаточное целиком. Если внутри есть ещё одно, сначала перенеси внешнее, затем из него — внутреннее. Укажи вопрос и опорное слово.",
  "Найди союз или союзное слово. Выбери тип и связь, затем нажми «Разметить союз».",
  "Выдели оборот: причастный свяжи с определяемым словом (×), деепричастный — со сказуемым. Выделение сохраняется.",
  "Перенеси на нижнюю дорожку вводные слова, обращения и вставки.",
  "Найди однородные члены и обобщающие слова. Они останутся выделенными.",
  "Расставь знаки препинания в разобранном предложении."
 ];
 const hasNoItems=step>0&&step<6&&p[1]===0;
 const needsSchema=st.marks.bases.length>0;
 main.innerHTML='<div class="game"><div class="titleline"><div class="meta"><b>'+(a.num==="HARD"?"⚡ Сложный уровень":"№ "+a.num)+' · '+q(a.short)+'</b></div><button class="ghost" data-act="menu">Меню</button></div>'+
  '<div class="stepTitle panel"><span class="stepNumber">'+(step+1)+'/7</span><div><strong>'+q(help.stages[step])+'</strong><p>'+q(instructions[step])+(hasNoItems?' <span class="stepSkip">Здесь такого элемента нет — переходи дальше.</span>':"")+'</p></div></div>'+
  '<div class="workarea"><section class="wordsPanel panel"><div class="panelHeader">Предложение</div><div class="cleanSentence">'+q(a.words.join(" "))+'</div></section>'+
  '<div class="buildGrid '+(!needsSchema?"noSchema":"")+'"><section class="buildPanel panel"><div class="panelHeader">Разбор по дорожкам</div>'+blueprint()+'</section>'+
  (needsSchema?'<section class="diagramPanel panel"><div class="panelHeader">Схема</div><div class="diagram">'+schema()+'</div></section>':"")+'</div></div>'+
  '<div class="controls panel">'+toolbar()+'<div class="hint '+q(st.hintType)+'" role="status">'+q(st.hint||"")+'</div></div></div>';
 requestAnimationFrame(drawArrows);
}

function fail(msg){st.fail++;note(msg,"error");render()}
function chooseToken(i){
 if(st.pending){
   st.anchor=i;
   const t=st.pending.kind==="turns"?st.task.turns.find(x=>x.id===st.pending.id):null;
   const label=t?(t.type==="ger"?"Сказуемое":"Определяемое слово"):"Опорное слово";
   note(label+" «"+st.task.words[i]+"» выбрано."+(st.pending.kind==="subs"?" Теперь укажи вопрос.":" Нажми «Связать»."),"");
   render();return;
  }
 if(st.step===6)return;
 st.picked=st.picked.includes(i)?st.picked.filter(x=>x!==i):[...st.picked,i].sort((a,b)=>a-b);
 note("");render();
}
function mark(kind){
 if(!st.picked.length){fail("Сначала выдели нужное слово или группу слов.");return}
 const a=st.task;
 if(kind==="bases"){
   const expected=[...new Set(a.bases.flatMap(x=>x.words))].sort((x,y)=>x-y);
   if(!SAME(st.picked,expected)){fail("Неверно выделены основы");return}
   st.marks.bases=a.bases.map(x=>x.id);
   clearChoice();note(a.common.length?"Все основы найдены! Теперь выдели общий второстепенный член.":"Все основы выделены верно.","ok");render();return;
  }
  if(kind==="conjs"){
  if(st.picked.length!==1){fail("Выбери один союз или союзное слово, затем его функцию.");return}
  const at=st.picked[0],target=a.conjs.find(x=>x.at===at&&!st.marks.conjs.includes("c"+at));
  if(!target){fail("Это слово не является союзом/союзным словом в данном предложении или уже разобрано.");return}
  const userKind=st.choiceKind,role=st.choiceRole;
  if(userKind!==target.type||role!==target.role){
   if(userKind===target.type&&target.role==="parts"&&role==="members"){
    fail("Здесь две грамматические основы, значит И соединяет части сложносочинённого предложения, а не однородные члены."+(a.common.length?" Общий второстепенный член отменяет запятую перед И, но не меняет тип связи.":""));return;
   }
   if(userKind===target.type&&target.role==="members"&&role==="parts"){
    fail("Здесь союз соединяет однородные члены внутри одной части, а не два простых предложения. Проверь число грамматических основ.");return;
   }
   if(userKind!==target.type){fail("Тип связующего слова выбран неверно: различай сочинительный союз, подчинительный союз и союзное слово.");return}
   fail("Неверна роль союза. Посмотри, что именно он соединяет: части ССП, однородные члены или придаточные.");return;
  }
  st.marks.conjs.push("c"+at);clearChoice();note("Связующее слово распознано.","ok");render();return;
 }
 const candidates=a[kind],item=candidates.find(x=>!st.marks[kind].includes(x.id)&&SAME(kind==="subs"?fullSubWords(x):x.words,st.picked));
 if(!item){fail("Границы конструкции выбраны неточно. Её нужно выделить целиком (допускаются разорванные части).");return}
 if(kind==="subs"||kind==="turns"){
   if(kind==="subs"&&parentOf(item)&&!st.marks.subs.includes(parentOf(item).id)){fail("Сначала спусти внешнее придаточное целиком, затем из него — вложенное.");return}
   if(kind==="turns"&&item.type!==st.choiceKind){fail("Это другой вид оборота. Уточни его тип.");return}
   st.pending={kind,id:item.id,words:kind==="subs"?fullSubWords(item):item.words};st.picked=[];st.anchor=null;st.question="";
   const instruction=kind==="subs"?"Выбери опорное слово и вопрос.":item.type==="ger"?"Деепричастный оборот выделен. Укажи сказуемое, от которого зависит действие.":"Причастный оборот выделен. Укажи определяемое слово (×).";
   note(instruction);render();return;
  }
  if(kind==="extras"&&st.choiceKind!==item.type){fail("Слова выбраны правильно, но тип конструкции не совпал: вводное, обращение или вставка?");return}
 st.marks[kind].push(item.id);clearChoice();note("Конструкция отмечена.","ok");render();
}
function link(){
 if(!st.pending)return;
 const group=st.task[st.pending.kind].find(x=>x.id===st.pending.id);
 if(st.anchor==null){
  fail(st.pending.kind==="subs"?"Укажи опорное слово в предложении.":group.type==="ger"?"Укажи сказуемое, к которому относится деепричастный оборот.":"Укажи определяемое слово в предложении.");return;
 }
 if(st.pending.kind==="subs"){
  const question=document.getElementById("question");if(question)st.question=question.value;
  if(st.question!==group.question){fail("Вопрос к придаточному неверный. Подумай, от какого слова он задаётся.");return}
 }
 if(st.anchor!==group.head){
  fail(st.pending.kind==="subs"?"Стрелка направлена не к тому слову. Найди опорное слово.":group.type==="ger"?"Выбери сказуемое, к которому относится деепричастный оборот.":"Неверно выбрано определяемое слово. Найди существительное, к которому относится оборот.");return;
 }
 st.marks[st.pending.kind].push(group.id);clearChoice();note("Связь построена: теперь это часть синтаксической схемы.","ok");render();
}
function glue(i){st.glues=st.glues.includes(i)?st.glues.filter(n=>n!==i):[...st.glues,i];note("Склейка — это отсутствие запятой на стыке двух союзов. Проверь, есть ли продолжение ТО.","");render()}
function punctuation(i){st.gap=i;note("Граница после «"+st.task.words[i]+"». Выбери знак или ∅.","");render()}
function setSign(sign){if(st.gap==null){fail("Сначала нажми промежуток после нужного слова.");return}if(sign)st.marks.punct[st.gap]=sign;else delete st.marks.punct[st.gap];note("Знак выбран. Можно перейти к следующей границе.");render()}
function nextStage(){
 if(st.step!==6&&!stageReady()){fail("Этап ещё не завершён. Проверь неразмеченные элементы и стык союзов.");return}
 if(st.step===6){
  const target=Object.fromEntries(st.task.punct.map(p=>[String(p.after),p.sign]));
  const actual=st.marks.punct;
  const wrong=[...new Set([...Object.keys(target),...Object.keys(actual)])].filter(key=>(target[key]||"")!==(actual[key]||""));
  if(wrong.length){const some=wrong.slice(0,3).map(i=>{const obj=st.task.punct.find(p=>p.after===+i);return 'после «'+st.task.words[i]+'»: '+(obj?.why||"знак здесь не нужен")}).join(" · ");fail("Не совпали "+wrong.length+" границ(ы). Подумай: "+some);return}
  completed[st.task.id]=true;try{localStorage.setItem(STORE,JSON.stringify(completed))}catch(e){}
  st.view="finish";render();return;
 }
 st.step++;st.picked=[];st.pending=null;st.anchor=null;st.question="";
 st.choiceKind=({2:"coord",3:"part",4:"intro"})[st.step]||"coord";st.choiceRole="parts";note(st.step===6?"Финал: запятые теперь должны вытекать из твоей схемы.":"Конструкция готова — теперь добавь следующий слой.","ok");render();
}
function finish(){
 const a=st.task,punctText=a.words.map((w,i)=>w+(a.punct.find(p=>p.after===i)?.sign||"")).join(" ")+".";
 const dots=a.punct.map(p=>'<div class="reviewRow"><b>После «'+q(a.words[p.after])+'»:</b> '+q(p.sign)+' — '+q(p.why)+'</div>').join("")||'<div class="reviewRow">Запятых нет: '+q(a.insight)+'</div>';
 main.innerHTML='<div class="finish"><div class="head panel"><h2>🏁 Конструктор собран!</h2><p><b>'+q(a.num==="HARD"?"Хард":("№ "+a.num))+' · '+q(a.short)+'</b></p><p>'+q(punctText)+'</p><p>'+q(a.insight)+'</p></div><div class="scroll panel"><strong>Почему стоят именно эти знаки</strong>'+dots+'</div><div class="actionLine"><button class="primary" data-act="nexttask">Следующее предложение →</button><button class="ghost" data-act="menu">В меню</button></div></div>';
}

function showAnswer(){
 const a=st.task,oldMarks=st.marks,oldStep=st.step;
 st.marks={bases:a.bases.map(x=>x.id),common:a.common.map(x=>x.id),subs:a.subs.map(x=>x.id),conjs:a.conjs.map(x=>"c"+x.at),turns:a.turns.map(x=>x.id),extras:a.extras.map(x=>x.id),hom:a.hom.map(x=>x.id),general:a.general.map(x=>x.id),punct:Object.fromEntries(a.punct.map(x=>[x.after,x.sign]))};
 st.step=6;
 const levels=activeLevels(),extra=st.marks.extras.length?levels[levels.length-1]:-1;
 const visual='<div class="previewBuild">'+levels.map(level=>laneHTML(level,extra)).join("").replace(/data-act="(token|gap)"/g,'data-act="noop"')+'</div>';
 const graphic=schema();st.marks=oldMarks;st.step=oldStep;
 const full=a.words.map((w,i)=>w+(a.punct.find(p=>p.after===i)?.sign||"")).join(" ")+".";
 const id="answerModal";document.getElementById(id)?.remove();const modal=document.createElement("div");modal.id=id;modal.className="modalBack";
 modal.innerHTML='<section class="modal panel"><h3>Собранная конструкция</h3><div class="cleanSentence">'+q(full)+'</div><div class="answerGrid">'+visual+'<div class="diagram">'+graphic+'</div></div><p>'+q(a.insight)+'</p><button class="primary" data-act="close-answer">Закрыть</button></section>';
 document.body.append(modal);
}
document.addEventListener("change",e=>{if(e.target.id==="question")st.question=e.target.value;else if(e.target.id==="kind")st.choiceKind=e.target.value;else if(e.target.id==="role")st.choiceRole=e.target.value});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const act=b.dataset.act;
 if(act==="close-answer"){document.getElementById("answerModal")?.remove();return}
 if(act==="menu"){menu();return}
 if(act==="launch"){launch(b.dataset.num);return}
 if(act==="show-answer"){showAnswer();return}
 if(act==="token"){chooseToken(Number(b.dataset.i));return}
 if(act==="mark"){mark(b.dataset.kind);return}
 if(act==="link"){link();return}
 if(act==="cancel"){clearChoice();note("");render();return}
 if(act==="clear"){st.picked=[];note("");render();return}
 if(act==="glue"){glue(Number(b.dataset.i));return}
 if(act==="gap"){punctuation(Number(b.dataset.i));return}
 if(act==="set-sign"){setSign(b.dataset.sign);return}
 if(act==="nextstage"){nextStage();return}
 if(act==="nexttask"){launchNext();return}
});
if(!tasks.length){main.innerHTML='<div class="panel">База заданий не загрузилась.</div>';return}
menu();
window.__PUNCT_QA={tasks:tasks.length,launch, getTask:()=>st.task, getState:()=>st,render,mark,link,glue,nextStage,select(indices){st.picked=indices;render()},markAllForTest(){
  const a=st.task;st.marks={bases:a.bases.map(x=>x.id),common:a.common.map(x=>x.id),subs:a.subs.map(x=>x.id),conjs:a.conjs.map(x=>"c"+x.at),turns:a.turns.map(x=>x.id),extras:a.extras.map(x=>x.id),hom:a.hom.map(x=>x.id),general:a.general.map(x=>x.id),punct:Object.fromEntries(a.punct.map(x=>[x.after,x.sign]))};st.glues=a.junctions.filter(x=>x.glued).map(x=>x.after);st.step=6;render();}};
})();
</script></body></html>
