<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101d30"><meta name="color-scheme" content="dark">
<title>Конструктор предложения · Лаборатория пунктуации</title>
<script src="./data.js"></script>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#0b1728;color:#eef4fa;--bg:#0b1728;--panel:#15283c;--line:#355269;--muted:#b4c8d7;--cyan:#83e7e9;--gold:#ffdb85;--rose:#ff9fc0;--purple:#bba5fb;--green:#95e8b4;--orange:#ffb27a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 17% 5%,#193954 0,transparent 47%),linear-gradient(140deg,#0a1728,#13253a 65%,#0c1a2a);line-height:1.3}
button,select{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:1px solid #45657a;border-radius:10px;background:#233a50;min-height:36px;padding:6px 9px}
button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid #ffd681;outline-offset:2px}button.primary{background:linear-gradient(130deg,#66dbda,#70b8ee);border-color:#b3f6ec;color:#092638;font-weight:800}
button.gold{background:#69512b;color:#fff3c7;border-color:#b49a64}
button.ghost{background:#172c42}.app{height:100%;height:100dvh;max-width:1250px;margin:0 auto;display:flex;flex-direction:column;gap:7px;padding:7px 10px;overflow:hidden}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto;min-height:37px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}.brand .glyph{font-size:24px}.brand strong{font-size:clamp(13px,2.5vw,18px);display:block;line-height:1.12}.brand small{display:block;color:#b0ccdf;font-size:10px}
.status{font-size:12px;color:#94e0df;background:#23405a;border:1px solid #3a6579;padding:5px 9px;border-radius:20px;white-space:nowrap}
main{flex:1;min-height:0;overflow:hidden}.panel{background:#162b40e8;border:1px solid #38556c;border-radius:14px;box-shadow:inset 0 1px #c7e7ff12}
.menu{height:100%;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.intro{padding:12px 14px;flex:0 0 auto}.intro h1{font-size:clamp(20px,4vw,28px);margin:0 0 6px;color:#e8fbff}.intro p{font-size:12px;color:#bed7e1;margin:0;max-width:850px}
.modeGrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:8px}
.modeTile{text-align:left;background:linear-gradient(130deg,#1e3f58,#1b2e46);display:flex;flex-direction:column;justify-content:center;gap:5px;min-height:0;padding:8px 13px}
.modeTile strong{font-size:clamp(16px,2.8vw,23px);color:#a3eff1}.modeTile small{font-size:clamp(10px,1.8vw,13px);color:#c8d9e4}.modeTile b{font-size:11px;color:#ffdba6}
.modeTile.hard{background:linear-gradient(120deg,#49324f,#2c2b52)}.modeTile.hard strong{color:#ffc3eb}
.bottomNote{font-size:11px;text-align:center;color:#c7cedd;padding:5px}
.game{height:100%;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.titleline{display:flex;align-items:center;gap:8px;justify-content:space-between;flex:0 0 auto}
.titleline .meta{font-size:11px;color:#b6d0df;min-width:0}.titleline .meta b{color:#ffdf9c;display:block;font-size:13px}
.titleline button{min-height:31px;font-size:11px;padding:4px 8px}
.stepTitle{padding:6px 10px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.stepNumber{border-radius:9px;background:#264c62;padding:5px 8px;color:#a5f6f3;font-weight:900;font-size:14px;flex:0 0 auto}
.stepTitle strong{font-size:clamp(12px,2.2vw,15px);color:#fbe5b2}.stepTitle p{margin:2px 0 0;color:#bdcfdb;font-size:11px}
.workarea{flex:1;min-height:0;display:grid;grid-template-rows:minmax(70px,43%) minmax(100px,57%);gap:6px}
.diagramPanel{display:flex;flex-direction:column;min-height:0;padding:7px 10px;gap:5px}
.panelHeader{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:#93d4d8;font-weight:850}
.diagram{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:4px}
.lane{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 7px;background:#142639;border-left:3px solid #65cdd8;border-radius:7px;font-size:clamp(11px,1.7vw,13px)}
.lane.lower{border-color:#b6a4f2;background:#211e40}.lane.extra{border-color:#eea4bf;background:#38223d}.lane.turnlane{border-color:#f6b377;background:#392c34}
.bracket{border:1px solid #78d5e5;background:#183c54;padding:3px 6px;border-radius:7px;color:#e1fbff;font-weight:700}
.bracket.subbr{background:#30254f;border-color:#b2a8f0;color:#f1eaff}.branch{font-size:10px;color:#cbd1ef}.junction{color:#a6eded;font-weight:850}
.emptyLane{font-size:11px;color:#94abbf;padding:9px 5px}
.wordsPanel{display:flex;flex-direction:column;gap:6px;min-height:0;padding:7px 10px}
.sentence{flex:1;min-height:0;overflow:auto;align-content:start;display:flex;flex-wrap:wrap;align-items:flex-start;gap:5px 4px;scrollbar-width:thin;padding:1px 0}
.tokenWrap{display:inline-flex;align-items:center;gap:0;min-height:29px}
.word{min-height:28px;border:1px solid #55768b;background:#1e364f;border-radius:7px;padding:4px 6px;font-size:clamp(12px,1.85vw,15px);line-height:1.2;font-weight:650}
.word.selected{background:#ffe7a0;color:#202432;border-color:#fff2bc;box-shadow:0 0 0 2px #ffcf6c45}
.word.base{box-shadow:inset 0 -3px #6bf2d0}.word.subword{border-color:#aa96ee;background:#302951}
.word.conj{color:#9aedf5;border-color:#3babb5}.word.turn{border-color:#e4a169;box-shadow:inset 0 -2px #e4a169}
.word.extra{border-color:#ed8cbd;background:#4a2846}.word.hom{border-radius:30px;border-color:#93d6a4}.word.general{outline:2px double #e9dc9f}
.word .mark{color:#c6ffee;margin-right:2px}.punctGap{border:1px dashed #7293a6;background:#15283b;color:#d1e2ed;min-width:23px;height:25px;min-height:25px;padding:1px 3px;border-radius:7px;font-size:15px}
.punctGap:focus,.punctGap.target{border:2px solid #ffe6a0;color:#ffe6a0;background:#423a45}.punctGap.filled{color:#7bf3c8}.noGap{padding-right:2px;color:#91a9b8}
.selectionHint{font-size:11px;color:#b9cedb;flex:0 0 auto}
.controls{display:flex;flex-direction:column;gap:5px;flex:0 0 auto;padding:7px 9px}
.actionLine{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.actionLine button{min-height:34px;font-size:12px}
.actionLine .field{font-size:11px;color:#bed3e2}.actionLine select{font-size:12px;min-height:32px;padding:3px 6px;min-width:90px}
.actionLine .stretch{flex:1}.hint{font-size:11px;color:#f5d7a2;padding:2px 3px;min-height:15px;overflow-wrap:anywhere}
.hint.ok{color:#9af7c5}.hint.error{color:#ffabab}
.footer{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;color:#aebfd2;flex:0 0 auto}
.footer button{font-size:11px;min-height:27px;padding:3px 8px}
.punctBar{display:flex;gap:5px;align-items:center}
.punctBar button{min-width:39px;min-height:33px;font-size:17px;font-weight:900}
.punctBar button.selected{background:#72603e;border-color:#ffd483}
.finish{height:100%;display:flex;flex-direction:column;gap:8px;overflow:hidden}.finish .head{padding:12px}
.finish h2{margin:0 0 6px;color:#b8f6ec;font-size:22px}.finish p{font-size:13px;color:#d8e9ee}
.finish .scroll{flex:1;min-height:0;overflow:auto;padding:10px}.reviewRow{font-size:12px;padding:6px;border-bottom:1px solid #365266}
.modalBack{position:fixed;inset:0;background:#071322da;z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{width:min(630px,100%);max-height:min(90dvh,750px);overflow:auto;padding:16px}
.modal h3{margin:0 0 8px;color:#ffe5a4;font-size:19px}.modal p,.modal li{font-size:13px;color:#d8e6f0}
.modal button{margin-top:8px}
@media(max-width:600px){.app{gap:5px;padding:5px 6px}.modeGrid{gap:5px}.modeTile{padding:6px 9px}.intro{padding:9px 11px}.intro p{font-size:11px}.titleline .meta b{font-size:12px}.workarea{grid-template-rows:minmax(66px,42%) minmax(98px,58%)}.diagramPanel,.wordsPanel{padding:6px 7px}.controls{padding:5px 6px}.actionLine{gap:4px}.actionLine button{font-size:11px}.word{font-size:12px;padding:3px 5px}.panelHeader{font-size:9px}.footer{font-size:9px}}
@media(max-width:370px){.brand strong{font-size:12px}.brand small{font-size:9px}.modeTile strong{font-size:15px}.status{font-size:10px}.stepTitle p{font-size:10px}.actionLine button{min-height:30px;padding:3px 6px}.actionLine select{min-height:29px;font-size:11px}}
@media(max-height:640px){header.top{min-height:31px}.brand .glyph{font-size:19px}.intro{padding:7px 11px}.stepTitle{padding:4px 8px}.controls{gap:3px}.workarea{grid-template-rows:minmax(58px,40%) minmax(85px,60%)}.word{min-height:24px}.tokenWrap{min-height:25px}.lane{padding:3px 6px}.bottomNote{padding:2px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><span class="glyph" aria-hidden="true">🧩</span><div><strong>Конструктор предложения</strong><small>Лаборатория пунктуации · ЕГЭ 16–20</small></div></div><span class="status" id="status">черновик 0.1</span></header>
<main id="main"></main>
</div><script>
(function(){
"use strict";
const tasks=window.PUNCT_DATA||[],help=window.PUNCT_HELP||{},main=document.getElementById("main"),status=document.getElementById("status");
const modes=["16","17","18","19","20","HARD"],subtitles={"16":"Однородные и ССП","17":"Обособленные члены","18":"Вводные и обращения","19":"Придаточные","20":"Разные виды связи","HARD":"Все конструкции вместе"};
const q=(x)=>String(x??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const norm=x=>String(x||"").toLocaleLowerCase("ru").replace(/ё/g,"е");
const SAME=(a,b)=>a.length===b.length&&a.slice().sort((x,y)=>x-y).every((x,i)=>x===b.slice().sort((x,y)=>x-y)[i]);
const has=(arr,id)=>arr.includes(id);
const STORE="punct:constructor:mvp:completed:v1";
let completed={};try{completed=JSON.parse(localStorage.getItem(STORE)||"{}")||{}}catch(e){}
let st={view:"menu",task:null,step:0,picked:[],pending:null,anchor:null,question:"",marks:null,glues:[],gap:null,sign:",",hint:"",hintType:"",fail:0,helpOpen:false};
function resetMarks(){return {bases:[],subs:[],conjs:[],turns:[],extras:[],hom:[],general:[],punct:{}}}
function list(kind){return st.task[kind]||[]}
function selectedMatch(kind){return list(kind).find(x=>!has(st.marks[kind],x.id)&&SAME(x.words,st.picked))}
function progress(){const a=st.task;return [
 [st.marks.bases.length,a.bases.length],
 [st.marks.subs.length,a.subs.length],
 [st.marks.conjs.length,a.conjs.length],
 [st.marks.turns.length,a.turns.length],
 [st.marks.extras.length,a.extras.length],
 [st.marks.hom.length+st.marks.general.length,a.hom.length+a.general.length],
 [Object.entries(st.marks.punct).filter(([k,v])=>v).length,a.punct.length]
 ][st.step]}
function stageReady(){const p=progress();if(!p||p[0]!==p[1]||st.pending)return false;if(st.step===2){return list("junctions").every(j=>st.glues.includes(j.after)===j.glued)}return true}
function note(s,type=""){st.hint=s;st.hintType=type}
function launch(num,index=0){const a=tasks.filter(x=>x.num===num);st={view:"game",num,index,task:a[index%a.length],step:0,picked:[],pending:null,anchor:null,question:"",marks:resetMarks(),glues:[],gap:null,sign:",",hint:"",hintType:"",fail:0,helpOpen:false};render()}
function launchNext(){const a=tasks.filter(x=>x.num===st.num);launch(st.num,(st.index+1)%a.length)}
function taskCount(num){return tasks.filter(x=>x.num===num).length}
function menu(){
 st.view="menu";status.textContent="черновик 0.1";
 main.innerHTML='<div class="menu"><div class="intro panel"><h1>Разбери предложение по этажам</h1><p>Сначала основы и связи, затем обороты и вводные, только потом знаки. Касайся нужных слов — они превратятся в схему. Это прототип для методического испытания: оценки не отправляются в бот.</p></div><div class="modeGrid">'+modes.map(n=>'<button class="modeTile '+(n==="HARD"?"hard":"")+'" data-act="launch" data-num="'+n+'"><strong>'+(n==="HARD"?"⚡ Хард-уровень":"№ "+n)+'</strong><small>'+subtitles[n]+'</small><b>'+taskCount(n)+' '+(taskCount(n)===1?"пример":"примера")+' · '+tasks.filter(t=>t.num===n&&completed[t.id]).length+' решено</b></button>').join("")+'</div><div class="bottomNote">Это исследовательский черновик. Управление касаниями, без системной клавиатуры и без Telegram-статистики.</div></div>';
}
function pickedText(){return st.picked.map(i=>st.task.words[i]).join(" · ")}
function clearChoice(){st.picked=[];st.anchor=null;st.question="";st.pending=null}
function foundTag(i,kind){
 const groups=st.marks[kind];return list(kind).find(x=>has(groups,x.id)&&(kind==="conjs"?x.at===i:x.words.includes(i)));
}
function descMark(i){
 const a=[];if(st.marks.bases.some(id=>st.task.bases.find(x=>x.id===id)?.words.includes(i)))a.push("base");
 if(foundTag(i,"subs"))a.push("subword");
 if(foundTag(i,"conjs"))a.push("conj");
 if(foundTag(i,"turns"))a.push("turn");
 if(foundTag(i,"extras"))a.push("extra");
 if(foundTag(i,"hom"))a.push("hom");
 if(foundTag(i,"general"))a.push("general");
 return a.join(" ");
}
function stripExtras(indices){const hidden=new Set([...st.marks.extras.flatMap(id=>st.task.extras.find(x=>x.id===id)?.words||[])]);return indices.filter(i=>!hidden.has(i))}
function tokenString(indices){return indices.map(i=>q(st.task.words[i])).join(" ")}
function schema(){
 const a=st.task,sections=[];
 if(st.marks.bases.length){
  const mains=a.mains.map(m=>'<span class="bracket">[ '+tokenString(stripExtras(m.words.filter(i=>!st.marks.subs.some(id=>a.subs.find(s=>s.id===id)?.words.includes(i)))))+' ]</span>').join(' <span class="junction">— союзная связь —</span> ');
  sections.push('<div class="lane"><b>1-я дорожка</b> '+mains+'</div>');
 }else sections.push('<div class="emptyLane">Схема появится над предложением после выделения первой основы.</div>');
 for(const id of st.marks.subs){const s=a.subs.find(x=>x.id===id),head=a.words[s.head],extra=stripExtras(s.words);
  const parent=a.subs.find(x=>x.id!==id&&x.words.includes(s.head)),level=parent?"↳ ↳":"↳";
  sections.push('<div class="lane lower"><span class="branch">'+level+'</span><span class="bracket subbr">( '+tokenString(extra)+' )</span><span class="branch">'+q(s.question)+' → «'+q(head)+'»</span></div>');
 }
 if(st.marks.turns.length){
  const lines=st.marks.turns.map(id=>{const t=a.turns.find(x=>x.id===id);return '<span>│ '+tokenString(t.words)+' │ → ×'+q(a.words[t.head])+'</span>'}).join(" · ");
  sections.push('<div class="lane turnlane"><b>Обороты</b> '+lines+'</div>');
 }
 if(st.marks.extras.length){
  const words=st.marks.extras.map(id=>a.extras.find(x=>x.id===id)).map(x=>tokenString(x.words)+' ('+q(help.types[x.type])+')').join(" · ");
  sections.push('<div class="lane extra"><b>Не члены предложения</b> '+words+'</div>');
 }
 return sections.join("");
}
function sentence(){
 const a=st.task,punct=st.step===6,words=a.words.map((w,i)=>{
  const picked=st.picked.includes(i)?' selected':'',heads=st.pending&&st.anchor===i?' selected':'';
  const gap=punct?'<button class="punctGap '+(st.gap===i?"target":"")+(st.marks.punct[i]?" filled":"")+'" data-act="gap" data-i="'+i+'" aria-label="Знак после '+q(w)+'">'+q(st.marks.punct[i]||"·")+'</button>':'';
  return '<span class="tokenWrap"><button class="word '+descMark(i)+picked+heads+'" data-act="token" data-i="'+i+'" aria-pressed="'+st.picked.includes(i)+'">'+q(w)+'</button>'+gap+'</span>'
 }).join("");
 return words+(punct?'<span class="noGap">.</span>':'');
}
function toolbar(){
 const a=st.task,step=st.step,done=stageReady();
 const next='<button class="primary" data-act="nextstage">'+(step===6?"Проверить пунктуацию":"Следующий этап →")+'</button>';
 if(step===6){
  return '<div class="actionLine"><span class="field">Нажми границу после слова, затем знак:</span><div class="punctBar">'+[[",","Запятая"],["—","Тире"],[":","Двоеточие"],[";","Точка с запятой"],["","Нет знака"]].map(x=>'<button title="'+x[1]+'" data-act="set-sign" data-sign="'+x[0]+'">'+(x[0]||"∅")+'</button>').join("")+'</div><span class="stretch"></span>'+next+'</div>';
 }
 if(st.pending){
  const p=st.pending,questions=p.kind==="subs"?'<label class="field">Вопрос: <select id="question"><option value="">Выбери вопрос</option>'+help.questions.map(x=>'<option value="'+q(x)+'"'+(st.question===x?" selected":"")+'>'+q(x)+'</option>').join("")+'</select></label>':'';
  return '<div class="actionLine"><span class="field">Выделено: '+q(tokenString(p.words).replace(/<[^>]+>/g,""))+'</span>'+questions+'<span class="field">Опорное слово: '+(st.anchor==null?"нажми в предложении":'<b>'+q(a.words[st.anchor])+'</b>')+'</span><span class="stretch"></span><button class="primary" data-act="link">Связать ↗</button><button data-act="cancel">Отмена</button></div>';
 }
 if(step===0)return '<div class="actionLine"><button class="primary" data-act="mark" data-kind="bases">Подчеркнуть основу</button><span class="stretch"></span><button data-act="clear">Снять выделение</button>'+ (done?next:"")+'</div>';
 if(step===1)return '<div class="actionLine"><button class="primary" data-act="mark" data-kind="subs">Спустить придаточное ↓</button><span class="stretch"></span><button data-act="clear">Снять выделение</button>'+(done?next:"")+'</div>';
 if(step===2)return '<div class="actionLine"><label class="field">Тип: <select id="kind"><option value="coord">Сочинительный</option><option value="sub">Подчинительный</option><option value="relative">Союзное слово</option><option value="correlate">Указательное «то»</option></select></label><label class="field">Связь: <select id="role"><option value="parts">Между главными</option><option value="members">Между однородными</option><option value="between-subs">Между придаточными</option><option value="inside">Внутри придаточного</option></select></label><button class="primary" data-act="mark" data-kind="conjs">Разметить союз</button><span class="stretch"></span>'+(done?next:"")+'</div>'+junctionButtons();
 if(step===3)return '<div class="actionLine"><label class="field">Вид: <select id="kind"><option value="part">Причастный │ │</option><option value="ger">Деепричастный │ │</option><option value="appos">Приложение</option><option value="detail">Уточнение</option><option value="compare">Сравнительный</option></select></label><button class="primary" data-act="mark" data-kind="turns">Выделить оборот │ │</button><span class="stretch"></span>'+(done?next:"")+'</div>';
 if(step===4)return '<div class="actionLine"><label class="field">Вид: <select id="kind"><option value="intro">Вводное</option><option value="address">Обращение</option><option value="insert">Вставная конструкция</option></select></label><button class="primary" data-act="mark" data-kind="extras">На отдельную дорожку ↓</button><span class="stretch"></span>'+(done?next:"")+'</div>';
 return '<div class="actionLine"><button class="primary" data-act="mark" data-kind="hom">Однородные ◯</button><button class="gold" data-act="mark" data-kind="general">Обобщающее ◎</button><span class="stretch"></span>'+(done?next:"")+'</div>';
}
function junctionButtons(){
 const a=list("junctions");if(!a.length)return "";
 return '<div class="actionLine">'+a.map(x=>'<button data-act="glue" data-i="'+x.after+'" class="'+(st.glues.includes(x.after)?"gold":"ghost")+'">⛓ Стык «'+q(st.task.words[x.after])+' + '+q(st.task.words[x.right])+'»: '+(st.glues.includes(x.after)?"склеено":"не склеено")+'</button>').join("")+'</div>';
}
function render(){
 if(st.view==="menu"){menu();return}
 if(st.view==="finish"){finish();return}
 const a=st.task,step=st.step,p=progress();
 status.textContent="этап "+(step+1)+" / 7";
 const instructions=[
 "Нажми слова, образующие одну грамматическую основу (они могут быть не рядом). Затем подчеркни её.",
 "Выдели ВСЕ слова каждого придаточного, в том числе союз, но без вложенного придаточного. Перенеси вниз, задай вопрос и нажми опорное слово.",
 "Выбери ОДНО слово-союз, установи тип и роль. Если рядом стоят два союза, реши, нужна ли склейка.",
 "Выдели оборот целиком, выбери тип, затем нажми главное слово, к которому он относится.",
 "Выдели вводное слово, обращение или вставную конструкцию целиком и перенеси на отдельную дорожку.",
 "Собери однородные члены в кружок ◯; обобщающее слово — в двойной круг ◎.",
 "Теперь реши пунктуацию: коснись промежутка после слова, затем поставь запятую, тире, двоеточие, точку с запятой или ничего."
 ];
 main.innerHTML='<div class="game"><div class="titleline"><div class="meta"><b>'+(a.num==="HARD"?"⚡ Хард-уровень":"ЕГЭ № "+a.num)+' · '+q(a.short)+'</b>Пример '+(st.index+1)+' из '+taskCount(a.num)+' · конструкций готово '+p[0]+'/'+p[1]+'</div><div><button class="ghost" data-act="help">? Теория</button> <button class="ghost" data-act="menu">✕ Меню</button></div></div><div class="stepTitle panel"><span class="stepNumber">'+(step+1)+'/7</span><div><strong>'+q(help.stages[step])+'</strong><p>'+q(instructions[step])+'</p></div></div><div class="workarea"><section class="diagramPanel panel"><div class="panelHeader">СХЕМА — СОБИРАЕТСЯ ПО МЕРЕ РАЗБОРА</div><div class="diagram">'+schema()+'</div></section><section class="wordsPanel panel"><div class="panelHeader">ИСХОДНОЕ ПРЕДЛОЖЕНИЕ · ВЫДЕЛЯЙ СЛОВА КАСАНИЯМИ</div><div class="sentence">'+sentence()+'</div><div class="selectionHint">Выделено: '+q(pickedText()||"ничего")+'</div></section></div><div class="controls panel">'+toolbar()+'<div class="hint '+q(st.hintType)+'" role="status">'+q(st.hint||((!p[1]&&step!==6)?"В этом примере таких элементов нет — переходи дальше.":""))+'</div></div><div class="footer"><span>Черновик · отдельные этапы, без оценки в журнал</span><button class="ghost" data-act="show-answer">Показать готовый разбор</button></div></div>'+(st.helpOpen?renderModal(): "");
}
function renderModal(){
 return '<div class="modalBack"><section class="modal panel"><h3>📖 Почему именно такой порядок?</h3><p>'+q(help.theory[st.step])+'</p><p>Приём: сначала определи устройство предложения, затем сравни границы, и только после этого решай, где нужен знак. Разбор пока не подсказывает, какие слова выделять.</p><button class="primary" data-act="help">Продолжить</button></section></div>'
}
function fail(msg){st.fail++;note(msg,"error");render()}
function chooseToken(i){
 if(st.pending){st.anchor=i;note("Выбрано опорное слово «"+st.task.words[i]+"». Теперь укажи вопрос, если это придаточное.","");render();return}
 if(st.step===6)return;
 st.picked=st.picked.includes(i)?st.picked.filter(x=>x!==i):[...st.picked,i].sort((a,b)=>a-b);
 note("");render();
}
function mark(kind){
 if(!st.picked.length){fail("Сначала выдели нужное слово или группу слов.");return}
 const a=st.task;
 if(kind==="bases"){
  const id=a.bases.findIndex((x,i)=>!st.marks.bases.includes(x.id)&&SAME(st.picked,x.words));
  if(id<0){fail("Это не полная грамматическая основа. Проверь подлежащее и составное/однородное сказуемое.");return}
  st.marks.bases.push(a.bases[id].id);clearChoice();note("Основа найдена. Теперь посмотри, сколько самостоятельных частей получилось.","ok");render();return;
 }
 if(kind==="conjs"){
  if(st.picked.length!==1){fail("Выбери один союз или союзное слово, затем его функцию.");return}
  const at=st.picked[0],target=a.conjs.find(x=>x.at===at&&!st.marks.conjs.includes("c"+at));
  if(!target){fail("Это слово не является союзом/союзным словом в данном предложении или уже разобрано.");return}
  const userKind=document.getElementById("kind").value,role=document.getElementById("role").value;
  if(userKind!==target.type||role!==target.role){fail("Проверь функцию: союз соединяет части, однородные члены или однородные придаточные? Союзное слово — член придаточного.");return}
  st.marks.conjs.push("c"+at);clearChoice();note("Связующее слово распознано.","ok");render();return;
 }
 const candidates=a[kind],item=candidates.find(x=>!st.marks[kind].includes(x.id)&&SAME(x.words,st.picked));
 if(!item){fail("Границы конструкции выбраны неточно. Её нужно выделить целиком (допускаются разорванные части).");return}
 if(kind==="subs"||kind==="turns"){
  if(kind==="turns"&&item.type!==document.getElementById("kind").value){fail("Это другой вид оборота. Сначала уточни, чем он выражен.");return}
  st.pending={kind,id:item.id,words:item.words};st.picked=[];st.anchor=null;st.question="";note("Конструкция спущена. Нажми в исходном предложении слово, от которого она зависит.");render();return;
 }
 if(kind==="extras"&&document.getElementById("kind").value!==item.type){fail("Слова выбраны правильно, но тип конструкции не совпал: вводное, обращение или вставка?");return}
 st.marks[kind].push(item.id);clearChoice();note("Конструкция отмечена.","ok");render();
}
function link(){
 if(!st.pending)return;
 const group=st.task[st.pending.kind].find(x=>x.id===st.pending.id);
 if(st.anchor==null){fail("Нажми опорное слово в исходном предложении.");return}
 if(st.pending.kind==="subs"){
  const question=document.getElementById("question");if(question)st.question=question.value;
  if(st.question!==group.question){fail("Вопрос к придаточному неверный. Подумай, от какого слова он задаётся.");return}
 }
 if(st.anchor!==group.head){fail("Сейчас стрелка направлена не к тому слову. Найди, от чего зависит эта конструкция.");return}
 st.marks[st.pending.kind].push(group.id);clearChoice();note("Связь построена: теперь это часть синтаксической схемы.","ok");render();
}
function glue(i){st.glues=st.glues.includes(i)?st.glues.filter(n=>n!==i):[...st.glues,i];note("Склейка — это отсутствие запятой на стыке двух союзов. Проверь, есть ли продолжение ТО.","");render()}
function punctuation(i){st.gap=i;note("Граница после «"+st.task.words[i]+"». Выбери знак или ∅.","");render()}
function setSign(sign){if(st.gap==null){fail("Сначала нажми промежуток после нужного слова.");return}if(sign)st.marks.punct[st.gap]=sign;else delete st.marks.punct[st.gap];note("Знак выбран. Можно перейти к следующей границе.");render()}
function nextStage(){
 if(st.step!==6&&!stageReady()){fail("Этап ещё не завершён. Проверь неразмеченные элементы и стык союзов.");return}
 if(st.step===6){
  const target=Object.fromEntries(st.task.punct.map(p=>[String(p.after),p.sign]));
  const actual=st.marks.punct;
  const wrong=[...new Set([...Object.keys(target),...Object.keys(actual)])].filter(key=>(target[key]||"")!==(actual[key]||""));
  if(wrong.length){const some=wrong.slice(0,3).map(i=>{const obj=st.task.punct.find(p=>p.after===+i);return 'после «'+st.task.words[i]+'»: '+(obj?.why||"знак здесь не нужен")}).join(" · ");fail("Не совпали "+wrong.length+" границ(ы). Подумай: "+some);return}
  completed[st.task.id]=true;try{localStorage.setItem(STORE,JSON.stringify(completed))}catch(e){}
  st.view="finish";render();return;
 }
 st.step++;st.picked=[];st.pending=null;st.anchor=null;st.question="";note(st.step===6?"Финал: запятые теперь должны вытекать из твоей схемы.":"Конструкция готова — теперь добавь следующий слой.","ok");render();
}
function finish(){
 const a=st.task,punctText=a.words.map((w,i)=>w+(a.punct.find(p=>p.after===i)?.sign||"")).join(" ")+".";
 const dots=a.punct.map(p=>'<div class="reviewRow"><b>После «'+q(a.words[p.after])+'»:</b> '+q(p.sign)+' — '+q(p.why)+'</div>').join("")||'<div class="reviewRow">Запятых нет: '+q(a.insight)+'</div>';
 main.innerHTML='<div class="finish"><div class="head panel"><h2>🏁 Конструктор собран!</h2><p><b>'+q(a.num==="HARD"?"Хард":("№ "+a.num))+' · '+q(a.short)+'</b></p><p>'+q(punctText)+'</p><p>'+q(a.insight)+'</p></div><div class="scroll panel"><strong>Почему стоят именно эти знаки</strong>'+dots+'</div><div class="actionLine"><button class="primary" data-act="nexttask">Следующее предложение →</button><button class="ghost" data-act="menu">В меню</button></div></div>';
}
function showAnswer(){
 const a=st.task;const lines=[
 "<b>Грамматические основы:</b> "+a.bases.map(b=>tokenString(b.words)).join(" · "),
 "<b>Придаточные:</b> "+(a.subs.map(s=>"("+tokenString(s.words)+") → "+a.words[s.head]+" ("+s.question+")").join(" · ")||"нет"),
 "<b>Связующие слова:</b> "+(a.conjs.map(c=>a.words[c.at]+": "+help.types[c.type]+" / "+c.role).join(" · ")||"нет"),
 "<b>Обороты:</b> "+(a.turns.map(t=>tokenString(t.words)+" → "+a.words[t.head]).join(" · ")||"нет"),
 "<b>Вводные, обращения:</b> "+(a.extras.map(x=>tokenString(x.words)+" — "+help.types[x.type]).join(" · ")||"нет"),
 "<b>Однородные:</b> "+(a.hom.map(x=>tokenString(x.words)).join(" · ")||"нет"),
 "<b>Знаки:</b> "+(a.punct.map(x=>"после «"+a.words[x.after]+"» "+x.sign).join("; ")||"нет")
 ];
 st.helpOpen=false;
 const id="answerModal";document.getElementById(id)?.remove();const modal=document.createElement("div");modal.id=id;modal.className="modalBack";
 modal.innerHTML='<section class="modal panel"><h3>🔍 Полная модель разбора</h3>'+lines.map(x=>'<p>'+x+'</p>').join("")+'<p>'+q(a.insight)+'</p><button class="primary" data-act="close-answer">Вернуться к заданию</button></section>';document.body.append(modal);
}
document.addEventListener("change",e=>{if(e.target.id==="question")st.question=e.target.value});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const act=b.dataset.act;
 if(act==="close-answer"){document.getElementById("answerModal")?.remove();return}
 if(act==="menu"){menu();return}
 if(act==="launch"){launch(b.dataset.num);return}
 if(act==="help"){st.helpOpen=!st.helpOpen;render();return}
 if(act==="show-answer"){showAnswer();return}
 if(act==="token"){chooseToken(Number(b.dataset.i));return}
 if(act==="mark"){mark(b.dataset.kind);return}
 if(act==="link"){link();return}
 if(act==="cancel"){clearChoice();note("");render();return}
 if(act==="clear"){st.picked=[];note("");render();return}
 if(act==="glue"){glue(Number(b.dataset.i));return}
 if(act==="gap"){punctuation(Number(b.dataset.i));return}
 if(act==="set-sign"){setSign(b.dataset.sign);return}
 if(act==="nextstage"){nextStage();return}
 if(act==="nexttask"){launchNext();return}
});
if(!tasks.length){main.innerHTML='<div class="panel">База заданий не загрузилась.</div>';return}
menu();
window.__PUNCT_QA={tasks:tasks.length,launch, getTask:()=>st.task, getState:()=>st,render,mark,link,glue,nextStage,select(indices){st.picked=indices;render()},markAllForTest(){
  const a=st.task;st.marks={bases:a.bases.map(x=>x.id),subs:a.subs.map(x=>x.id),conjs:a.conjs.map(x=>"c"+x.at),turns:a.turns.map(x=>x.id),extras:a.extras.map(x=>x.id),hom:a.hom.map(x=>x.id),general:a.general.map(x=>x.id),punct:Object.fromEntries(a.punct.map(x=>[x.after,x.sign]))};st.glues=a.junctions.filter(x=>x.glued).map(x=>x.after);st.step=6;render();}};
})();
</script></body></html>
