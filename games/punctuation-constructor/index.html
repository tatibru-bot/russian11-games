<body><div class="app">
<header class="top"><div class="brand"><span class="glyph" aria-hidden="true">🧱</span><div><strong>ЛЕГОПУНКТ</strong><small>Собери предложение · ЕГЭ 16–20</small></div></div><span class="status" id="status">черновик 0.1</span></header>
<main id="main"></main>
</div><script>
(function(){
"use strict";
const tasks=window.PUNCT_DATA||[],help=window.PUNCT_HELP||{},main=document.getElementById("main"),status=document.getElementById("status");
const modes=["16","17","18","19","20","HARD"],subtitles={"16":"Однородные и ССП","17":"Обособленные члены","18":"Вводные и обращения","19":"Придаточные","20":"Разные виды связи","HARD":"Все конструкции вместе"};
const q=(x)=>String(x??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const norm=x=>String(x||"").toLocaleLowerCase("ru").replace(/ё/g,"е");
const SAME=(a,b)=>a.length===b.length&&a.slice().sort((x,y)=>x-y).every((x,i)=>x===b.slice().sort((x,y)=>x-y)[i]);
const has=(arr,id)=>arr.includes(id);
const STORE="punct:constructor:mvp:completed:v1";
let completed={};try{completed=JSON.parse(localStorage.getItem(STORE)||"{}")||{}}catch(e){}
let st={view:"menu",task:null,step:0,picked:[],pending:null,anchor:null,question:"",marks:null,glues:[],gap:null,sign:",",hint:"",hintType:"",fail:0,helpOpen:false};
function resetMarks(){return {bases:[],subs:[],conjs:[],turns:[],extras:[],hom:[],general:[],punct:{}}}
function list(kind){return st.task[kind]||[]}
function selectedMatch(kind){return list(kind).find(x=>!has(st.marks[kind],x.id)&&SAME(x.words,st.picked))}
function progress(){const a=st.task;return [
 [st.marks.bases.length,a.bases.length],
 [st.marks.subs.length,a.subs.length],
 [st.marks.conjs.length,a.conjs.length],
 [st.marks.turns.length,a.turns.length],
 [st.marks.extras.length,a.extras.length],
 [st.marks.hom.length+st.marks.general.length,a.hom.length+a.general.length],
 [Object.entries(st.marks.punct).filter(([k,v])=>v).length,a.punct.length]
 ][st.step]}
function stageReady(){const p=progress();if(!p||p[0]!==p[1]||st.pending)return false;if(st.step===2){return list("junctions").every(j=>st.glues.includes(j.after)===j.glued)}return true}
function note(s,type=""){st.hint=s;st.hintType=type}
function launch(num,index=0){const a=tasks.filter(x=>x.num===num);st={view:"game",num,index,task:a[index%a.length],step:0,picked:[],pending:null,anchor:null,question:"",marks:resetMarks(),glues:[],gap:null,sign:",",hint:"",hintType:"",fail:0,helpOpen:false};render()}
function launchNext(){const a=tasks.filter(x=>x.num===st.num);launch(st.num,(st.index+1)%a.length)}
function taskCount(num){return tasks.filter(x=>x.num===num).length}
function menu(){
 st.view="menu";status.textContent="черновик 0.1";
 main.innerHTML='<div class="menu"><div class="intro panel"><h1>Разбери предложение по этажам</h1><p>Сначала основы и связи, затем обороты и вводные, только потом знаки. Касайся нужных слов — они превратятся в схему. Это прототип для методического испытания: оценки не отправляются в бот.</p></div><div class="modeGrid">'+modes.map(n=>'<button class="modeTile '+(n==="HARD"?"hard":"")+'" data-act="launch" data-num="'+n+'"><strong>'+(n==="HARD"?"⚡ Хард-уровень":"№ "+n)+'</strong><small>'+subtitles[n]+'</small><b>'+taskCount(n)+' '+(taskCount(n)===1?"пример":"примера")+' · '+tasks.filter(t=>t.num===n&&completed[t.id]).length+' решено</b></button>').join("")+'</div><div class="bottomNote">Это исследовательский черновик. Управление касаниями, без системной клавиатуры и без Telegram-статистики.</div></div>';
}
function pickedText(){return st.picked.map(i=>st.task.words[i]).join(" · ")}
function clearChoice(){st.picked=[];st.anchor=null;st.question="";st.pending=null}
function foundTag(i,kind){
 const groups=st.marks[kind];return list(kind).find(x=>has(groups,x.id)&&(kind==="conjs"?x.at===i:x.words.includes(i)));
}
function descMark(i){
 const a=[];if(st.marks.bases.some(id=>st.task.bases.find(x=>x.id===id)?.words.includes(i)))a.push("base");
 if(foundTag(i,"subs"))a.push("subword");
 if(foundTag(i,"conjs"))a.push("conj");
 if(foundTag(i,"turns"))a.push("turn");
 if(foundTag(i,"extras"))a.push("extra");
 if(foundTag(i,"hom"))a.push("hom");
 if(foundTag(i,"general"))a.push("general");
 return a.join(" ");
}
function stripExtras(indices){const hidden=new Set([...st.marks.extras.flatMap(id=>st.task.extras.find(x=>x.id===id)?.words||[])]);return indices.filter(i=>!hidden.has(i))}
function tokenString(indices){return indices.map(i=>q(st.task.words[i])).join(" ")}

function laneOf(i){
 const a=st.task;
 if(st.marks.extras.some(id=>a.extras.find(e=>e.id===id)?.words.includes(i)))return 2;
 if(st.marks.subs.some(id=>a.subs.find(x=>x.id===id)?.words.includes(i)))return 1;
 if(a.conjs.some(c=>c.at===i&&c.role==="between-subs")&&st.marks.subs.length)return 1;
 return 0;
}
function isInMark(i,kind){return st.marks[kind].some(id=>st.task[kind].find(x=>x.id===id)?.words.includes(i))}
function wordPiece(i){
 const a=st.task,w=a.words[i],punct=st.step===6;
 let classes=descMark(i),picked=st.picked.includes(i)||(st.pending&&st.anchor===i);
 if(st.marks.bases.some(id=>a.bases.find(x=>x.id===id)?.subjects.includes(i)))classes+=" subject";
 if(st.marks.bases.some(id=>a.bases.find(x=>x.id===id)?.predicates.includes(i)))classes+=" predicate";
 if(isInMark(i,"common"))classes+=" common";
 if(picked)classes+=" selected";
 const turns=a.turns.filter(t=>st.marks.turns.includes(t.id));
 const first=turns.some(t=>t.words[0]===i),last=turns.some(t=>t.words[t.words.length-1]===i);
 const anchor=turns.some(t=>(t.type==="part"||t.type==="appos")&&t.head===i);
 const gap=punct?'<button class="punctGap '+(st.gap===i?"target":"")+(st.marks.punct[i]?" filled":"")+'" data-act="gap" data-i="'+i+'" aria-label="Знак после '+q(w)+'">'+q(st.marks.punct[i]||"·")+'</button>':"";
 return '<span class="brick '+(first?"turnBegin ":"")+(last?"turnEnd":"")+'" data-i="'+i+'">'+(anchor?'<span class="above" aria-label="определяемое слово">×</span>':"")+'<button class="word '+classes+'" data-act="token" data-i="'+i+'" aria-pressed="'+!!picked+'"><span class="wtext">'+q(w)+'</span></button>'+gap+'</span>';
}
function bracketGroups(level,visible){
 const a=st.task,v=new Set(visible),common=new Set(a.common.filter(x=>st.marks.common.includes(x.id)).flatMap(x=>x.words));
 const groups=level===0?(st.marks.bases.length?a.mains:[]):level===1?a.subs.filter(x=>st.marks.subs.includes(x.id)):[];
 return groups.map(g=>{
  const positions=g.words.filter(i=>v.has(i)&&!(level===0&&common.has(i)));
  if(!positions.length)return null;
  return {id:g.id,min:Math.min(...positions),max:Math.max(...positions),sub:level===1};
 }).filter(Boolean);
}
function laneHTML(level){
 const a=st.task,visible=a.words.map((_,i)=>i).filter(i=>laneOf(i)===level);
 const name=["1 · Главные части","2 · Придаточные","3 · Не члены предложения"][level];
 const groups=bracketGroups(level,visible);
 let pieces="";
 for(const i of visible){
  const opens=groups.filter(g=>g.min===i).sort((x,y)=>y.max-x.max);
  for(const g of opens)pieces+='<span class="syntaxBracket '+(g.sub?"sub":"")+'">'+(g.sub?"(":"[")+'</span>';
  pieces+=wordPiece(i);
  const closes=groups.filter(g=>g.max===i).sort((x,y)=>y.min-x.min);
  for(const g of closes)pieces+='<span class="syntaxBracket '+(g.sub?"sub":"")+'">'+(g.sub?")":"]")+'</span>';
 }
 return '<div class="track '+(level===1?"secondary":level===2?"tertiary":"")+'" data-lane="'+level+'"><div class="trackLabel">'+name+'</div>'+(pieces||'<span class="emptyTrack">'+(level===1?"Пока не спущено ни одного придаточного":level===2?"Пока нет выделенных вводных или обращений":"")+" </span>")+'</div>';
}

function drawArrows(){

 }).join("");

function schema(){
 const a=st.task,baseIds=new Set(st.marks.bases),subIds=new Set(st.marks.subs);
 const commonIds=new Set(a.common.filter(x=>st.marks.common.includes(x.id)).flatMap(x=>x.words));
 const extraIds=new Set(a.extras.filter(x=>st.marks.extras.includes(x.id)).flatMap(x=>x.words));
 const turnIds=new Set(a.turns.filter(x=>st.marks.turns.includes(x.id)).flatMap(x=>x.words));
 const allGroups=[
  ...(baseIds.size?a.mains.map(g=>({type:"main",words:g.words.filter(i=>!commonIds.has(i)&&!extraIds.has(i))})):[]),
  ...a.subs.filter(g=>subIds.has(g.id)).map(g=>({type:"sub",words:g.words.filter(i=>!extraIds.has(i))}))
 ].filter(g=>g.words.length).map(g=>({...g,min:Math.min(...g.words),max:Math.max(...g.words)}));
 const subjects=new Set(a.bases.filter(x=>baseIds.has(x.id)).flatMap(x=>x.subjects));
 const predicates=new Set(a.bases.filter(x=>baseIds.has(x.id)).flatMap(x=>x.predicates));
 const seenCommon=new Set(),seenTurns=new Set(),shownBase=new Set();
 let parts="";
 for(let i=0;i<a.words.length;i++){
  for(const g of allGroups.filter(x=>x.min===i).sort((x,y)=>y.max-x.max))parts+='<span class="schemePart '+(g.type==="sub"?"sub":"")+'">'+(g.type==="sub"?"(":"[")+'</span>';
  let symbol="";
  if(commonIds.has(i)){
   if(!seenCommon.has(i)){symbol='<span class="schemeCommon">ОВЧ</span>';seenCommon.add(i)}
  }else if(subjects.has(i)&&predicates.has(i))symbol='<span class="schemeMark">— ═</span>';
  else if(subjects.has(i))symbol='<span class="schemeMark">—</span>';
  else if(predicates.has(i))symbol='<span class="schemeMark">═</span>';
  else if(extraIds.has(i))symbol='<span class="schemeExtra">⊕</span>';
  else if(turnIds.has(i)){
   const t=a.turns.find(x=>st.marks.turns.includes(x.id)&&x.words.includes(i));
   if(t&&!seenTurns.has(t.id)){symbol='<span class="schemeTurn">│об.│</span>';seenTurns.add(t.id)}
  }else{
   const c=a.conjs.find(x=>x.at===i&&st.marks.conjs.includes("c"+i));
   if(c)symbol='<span class="schemeJoin">'+q(a.words[i])+'</span>';
   else if(a.subs.some(x=>subIds.has(x.id)&&x.words[0]===i))symbol='<span class="schemeJoin">'+q(a.words[i])+'</span>';
   else if(a.hom.some(x=>st.marks.hom.includes(x.id)&&x.words.includes(i)))symbol='<span class="schemeMark hom">○</span>';
   else if(a.general.some(x=>st.marks.general.includes(x.id)&&x.words.includes(i)))symbol='<span class="schemeMark general">◎</span>';
  }
  // Common or connecting words remain outside brackets whenever they are not part of any clause.
  parts+=symbol;
  for(const g of allGroups.filter(x=>x.max===i).sort((x,y)=>y.min-x.min))parts+='<span class="schemePart '+(g.type==="sub"?"sub":"")+'">'+(g.type==="sub"?")":"]")+'</span>';
 }
 const links=a.subs.filter(x=>subIds.has(x.id)).map(x=>'<div class="graphLink">↳ ('+q(x.question)+') от <b>'+q(a.words[x.head])+'</b></div>').join("");
 const relations=a.subs.filter(x=>subIds.has(x.id));
 const homo=relations.length>=2&&relations.every(x=>x.head===relations[0].head&&x.question===relations[0].question);
 const nested=relations.some(x=>relations.some(y=>x!==y&&y.words.includes(x.head)));
 const pattern=relations.length<2?"":homo?"Однородное подчинение":nested?"Последовательное или комбинированное подчинение":"Параллельное или комбинированное подчинение";
 return (parts?'<div class="schemeGraphic">'+parts+'</div>':'<div class="emptyLane">После выделения основ появятся скобки и условные знаки.</div>')+
  (pattern?'<div class="schemeNote"><b>'+pattern+'</b></div>':"")+
  (links?'<div class="graphLinks">'+links+'</div>':"")+
  '<div class="schemeNote">[ ] — главная часть; ( ) — придаточная; — подлежащее; ═ сказуемое; ⊕ не член предложения; ○ однородный член.</div>';
}

function mark(kind){
 if(!st.picked.length){fail("Сначала выдели нужное слово или группу слов.");return}
 const a=st.task;
 if(kind==="bases"){
  const id=a.bases.findIndex((x,i)=>!st.marks.bases.includes(x.id)&&SAME(st.picked,x.words));
  if(id<0){fail("Это не полная грамматическая основа. Проверь подлежащее и составное/однородное сказуемое.");return}
  st.marks.bases.push(a.bases[id].id);clearChoice();note("Основа найдена. Теперь посмотри, сколько самостоятельных частей получилось.","ok");render();return;
 }
 if(kind==="conjs"){
  if(st.picked.length!==1){fail("Выбери один союз или союзное слово, затем его функцию.");return}
  const at=st.picked[0],target=a.conjs.find(x=>x.at===at&&!st.marks.conjs.includes("c"+at));
  if(!target){fail("Это слово не является союзом/союзным словом в данном предложении или уже разобрано.");return}
  const userKind=document.getElementById("kind").value,role=document.getElementById("role").value;
  if(userKind!==target.type||role!==target.role){fail("Проверь функцию: союз соединяет части, однородные члены или однородные придаточные? Союзное слово — член придаточного.");return}
  st.marks.conjs.push("c"+at);clearChoice();note("Связующее слово распознано.","ok");render();return;
 }
 const candidates=a[kind],item=candidates.find(x=>!st.marks[kind].includes(x.id)&&SAME(x.words,st.picked));
 if(!item){fail("Границы конструкции выбраны неточно. Её нужно выделить целиком (допускаются разорванные части).");return}
 if(kind==="subs"||kind==="turns"){
  if(kind==="turns"&&item.type!==document.getElementById("kind").value){fail("Это другой вид оборота. Сначала уточни, чем он выражен.");return}
  st.pending={kind,id:item.id,words:item.words};st.picked=[];st.anchor=null;st.question="";note("Конструкция спущена. Нажми в исходном предложении слово, от которого она зависит.");render();return;

 if(kind==="extras"&&document.getElementById("kind").value!==item.type){fail("Слова выбраны правильно, но тип конструкции не совпал: вводное, обращение или вставка?");return}

}
function glue(i){st.glues=st.glues.includes(i)?st.glues.filter(n=>n!==i):[...st.glues,i];note("Склейка — это отсутствие запятой на стыке двух союзов. Проверь, есть ли продолжение ТО.","");render()}
function punctuation(i){st.gap=i;note("Граница после «"+st.task.words[i]+"». Выбери знак или ∅.","");render()}
function setSign(sign){if(st.gap==null){fail("Сначала нажми промежуток после нужного слова.");return}if(sign)st.marks.punct[st.gap]=sign;else delete st.marks.punct[st.gap];note("Знак выбран. Можно перейти к следующей границе.");render()}
function nextStage(){
 if(st.step!==6&&!stageReady()){fail("Этап ещё не завершён. Проверь неразмеченные элементы и стык союзов.");return}
 if(st.step===6){
  const target=Object.fromEntries(st.task.punct.map(p=>[String(p.after),p.sign]));
  const actual=st.marks.punct;
  const wrong=[...new Set([...Object.keys(target),...Object.keys(actual)])].filter(key=>(target[key]||"")!==(actual[key]||""));
  if(wrong.length){const some=wrong.slice(0,3).map(i=>{const obj=st.task.punct.find(p=>p.after===+i);return 'после «'+st.task.words[i]+'»: '+(obj?.why||"знак здесь не нужен")}).join(" · ");fail("Не совпали "+wrong.length+" границ(ы). Подумай: "+some);return}
  completed[st.task.id]=true;try{localStorage.setItem(STORE,JSON.stringify(completed))}catch(e){}
  st.view="finish";render();return;
 }
 st.step++;st.picked=[];st.pending=null;st.anchor=null;st.question="";note(st.step===6?"Финал: запятые теперь должны вытекать из твоей схемы.":"Конструкция готова — теперь добавь следующий слой.","ok");render();
}
function finish(){
 const a=st.task,punctText=a.words.map((w,i)=>w+(a.punct.find(p=>p.after===i)?.sign||"")).join(" ")+".";
 const dots=a.punct.map(p=>'<div class="reviewRow"><b>После «'+q(a.words[p.after])+'»:</b> '+q(p.sign)+' — '+q(p.why)+'</div>').join("")||'<div class="reviewRow">Запятых нет: '+q(a.insight)+'</div>';
 main.innerHTML='<div class="finish"><div class="head panel"><h2>🏁 Конструктор собран!</h2><p><b>'+q(a.num==="HARD"?"Хард":("№ "+a.num))+' · '+q(a.short)+'</b></p><p>'+q(punctText)+'</p><p>'+q(a.insight)+'</p></div><div class="scroll panel"><strong>Почему стоят именно эти знаки</strong>'+dots+'</div><div class="actionLine"><button class="primary" data-act="nexttask">Следующее предложение →</button><button class="ghost" data-act="menu">В меню</button></div></div>';
}
function showAnswer(){
 const a=st.task;const lines=[
 "<b>Грамматические основы:</b> "+a.bases.map(b=>tokenString(b.words)).join(" · "),
 "<b>Придаточные:</b> "+(a.subs.map(s=>"("+tokenString(s.words)+") → "+a.words[s.head]+" ("+s.question+")").join(" · ")||"нет"),
 "<b>Связующие слова:</b> "+(a.conjs.map(c=>a.words[c.at]+": "+help.types[c.type]+" / "+c.role).join(" · ")||"нет"),
 "<b>Обороты:</b> "+(a.turns.map(t=>tokenString(t.words)+" → "+a.words[t.head]).join(" · ")||"нет"),
 "<b>Вводные, обращения:</b> "+(a.extras.map(x=>tokenString(x.words)+" — "+help.types[x.type]).join(" · ")||"нет"),
 "<b>Однородные:</b> "+(a.hom.map(x=>tokenString(x.words)).join(" · ")||"нет"),
 "<b>Знаки:</b> "+(a.punct.map(x=>"после «"+a.words[x.after]+"» "+x.sign).join("; ")||"нет")
 ];
 st.helpOpen=false;
 const id="answerModal";document.getElementById(id)?.remove();const modal=document.createElement("div");modal.id=id;modal.className="modalBack";
 modal.innerHTML='<section class="modal panel"><h3>🔍 Полная модель разбора</h3>'+lines.map(x=>'<p>'+x+'</p>').join("")+'<p>'+q(a.insight)+'</p><button class="primary" data-act="close-answer">Вернуться к заданию</button></section>';document.body.append(modal);
}
document.addEventListener("change",e=>{if(e.target.id==="question")st.question=e.target.value});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const act=b.dataset.act;
 if(act==="close-answer"){document.getElementById("answerModal")?.remove();return}
 if(act==="menu"){menu();return}
 if(act==="launch"){launch(b.dataset.num);return}
 if(act==="help"){st.helpOpen=!st.helpOpen;render();return}
 if(act==="show-answer"){showAnswer();return}
 if(act==="token"){chooseToken(Number(b.dataset.i));return}
 if(act==="mark"){mark(b.dataset.kind);return}
 if(act==="link"){link();return}
 if(act==="cancel"){clearChoice();note("");render();return}
 if(act==="clear"){st.picked=[];note("");render();return}
 if(act==="glue"){glue(Number(b.dataset.i));return}
 if(act==="gap"){punctuation(Number(b.dataset.i));return}
 if(act==="set-sign"){setSign(b.dataset.sign);return}
 if(act==="nextstage"){nextStage();return}
 if(act==="nexttask"){launchNext();return}
});
if(!tasks.length){main.innerHTML='<div class="panel">База заданий не загрузилась.</div>';return}
menu();
window.__PUNCT_QA={tasks:tasks.length,launch, getTask:()=>st.task, getState:()=>st,render,mark,link,glue,nextStage,select(indices){st.picked=indices;render()},markAllForTest(){
  const a=st.task;st.marks={bases:a.bases.map(x=>x.id),subs:a.subs.map(x=>x.id),conjs:a.conjs.map(x=>"c"+x.at),turns:a.turns.map(x=>x.id),extras:a.extras.map(x=>x.id),hom:a.hom.map(x=>x.id),general:a.general.map(x=>x.id),punct:Object.fromEntries(a.punct.map(x=>[x.after,x.sign]))};st.glues=a.junctions.filter(x=>x.glued).map(x=>x.after);st.step=6;render();}};
})();
</script></body></html>
