"APP", "hint": "После названия парка «Рускеала» поясняется, что он представляет собой бывший карьер."}]}, {"id": "14907", "answer": [2, 5], "items": [{"n": 1, "text": "Я любил русскую классическую поэзию: Кольцова, Некрасова, Никитина, Пушкина, Лермонтова, впоследствии Бунина — и в то же время не мог не завидовать моему новому другу, романтической манере его декламации, даже его претенциозному псевдониму.", "cat": "JOIN", "hint": "Тире усиливает переход после ряда имён к противопоставленному сообщению («и в то же время»)."}, {"n": 2, "text": "Птицелов, мой новый друг, ютился вместе со всеми своими книгами приключений, а также толстым томом «Жизни животных» Брема — его любимой книгой — на антресолях двухкомнатной квартирки.", "cat": "APP", "hint": "«Его любимой книгой» — поясняющее приложение к тому «Жизни животных»."}, {"n": 3, "text": "— Там, где выступ холодный и серый водопадом свергается вниз, я кричу у безмолвной пещеры… — декламировал он на бис своё коронное стихотворение.", "cat": "DIRECT", "hint": ""}, {"n": 4, "text": "Птицелов выглядел силачом, атлетом, но впоследствии я узнал, что с детства он страдает бронхиальной астмой и вся его как бы гладиаторская внешность — не что иное, как не без труда давшаяся поза.", "cat": "PRED", "hint": "Подлежащее «внешность» и именное сказуемое «не что иное ... поза»."}, {"n": 5, "text": "Даже небольшой шрам на его мускулисто напряжённой щеке — след детского пореза осколком оконного стекла — воспринимался как зарубцевавшаяся рана от удара пиратской шпаги.", "cat": "APP", "hint": "«След детского пореза» поясняет слово «шрам»; приложение обособлено двумя тире."}], "full": [{"n": 1, "text": "Я любил русскую классическую поэзию: Кольцова, Некрасова, Никитина, Пушкина, Лермонтова, впоследствии Бунина — и в то же время не мог не завидовать моему новому другу, романтической манере его декламации, даже его претенциозному псевдониму.", "cat": "JOIN", "hint": "Тире усиливает переход после ряда имён к противопоставленному сообщению («и в то же время»)."}, {"n": 2, "text": "Птицелов, мой новый друг, ютился вместе со всеми своими книгами приключений, а также толстым томом «Жизни животных» Брема — его любимой книгой — на антресолях двухкомнатной квартирки.", "cat": "APP", "hint": "«Его любимой книгой» — поясняющее приложение к тому «Жизни животных»."}, {"n": 3, "text": "— Там, где выступ холодный и серый водопадом свергается вниз, я кричу у безмолвной пещеры… — декламировал он на бис своё коронное стихотворение.", "cat": "DIRECT", "hint": ""}, {"n": 4, "text": "Птицелов выглядел силачом, атлетом, но впоследствии я узнал, что с детства он страдает бронхиальной астмой и вся его как бы гладиаторская внешность — не что иное, как не без труда давшаяся поза.", "cat": "PRED", "hint": "Подлежащее «внешность» и именное сказуемое «не что иное ... поза»."}, {"n": 5, "text": "Даже небольшой шрам на его мускулисто напряжённой щеке — след детского пореза осколком оконного стекла — воспринимался как зарубцевавшаяся рана от удара пиратской шпаги.", "cat": "APP", "hint": "«След детского пореза» поясняет слово «шрам»; приложение обособлено двумя тире."}]}, {"id": "14941", "answer": [1, 3], "items": [{"n": 1, "text": "Уральские горы — уникальный для нашей страны природный объект — пересекают Россию с севера на юг и являются границей между двумя частями света и двумя крупнейшими частями страны.", "cat": "APP", "hint": "«Уникальный ... природный объект» — приложение к названию «Уральские горы»."}, {"n": 3, "text": "Она начинается ещё в протерозойскую эру — настолько древний и малоисследованный этап истории нашей планеты, что учёные даже не делят его на периоды и эпохи.", "cat": "APP", "hint": "«Настолько древний ... этап» объясняет, что такое протерозойская эра."}, {"n": 4, "text": "Новые крупные поднятия на Урале возобновились лишь 30 миллионов лет назад, в ходе которых Полярная, Приполярная, Северная и Южная части гор были приподняты почти на километр, а Средний Урал — примерно на 300–400 метров.", "cat": "ELL", "hint": "Во второй части пропущено сказуемое «были приподняты»."}, {"n": 5, "text": "В настоящее время Уральские горы стабилизировались — крупных движений земной коры здесь не наблюдается.", "cat": "BSP", "hint": "Части: «горы стабилизировались» и «движений ... не наблюдается»."}, {"n": 6, "text": "Уральский хребет составляют средние и низкие по высоте горы, наивысшая точка — гора Народная на Приполярном Урале, достигающая 1895 метров.", "cat": "PRED", "hint": ""}], "full": [{"n": 1, "text": "Уральские горы — уникальный для нашей страны природный объект — пересекают Россию с севера на юг и являются границей между двумя частями света и двумя крупнейшими частями страны.", "cat": "APP", "hint": "«Уникальный ... природный объект» — приложение к названию «Уральские горы»."}, {"n": 2, "text": "Уральские горы имеют длинную и сложную историю.", "cat": null, "hint": ""}, {"n": 3, "text": "Она начинается ещё в протерозойскую эру — настолько древний и малоисследованный этап истории нашей планеты, что учёные даже не делят его на периоды и эпохи.", "cat": "APP", "hint": "«Настолько древний ... этап» объясняет, что такое протерозойская эра."}, {"n": 4, "text": "Новые крупные поднятия на Урале возобновились лишь 30 миллионов лет назад, в ходе которых Полярная, Приполярная, Северная и Южная части гор были приподняты почти на километр, а Средний Урал — примерно на 300–400 метров.", "cat": "ELL", "hint": "Во второй части пропущено сказуемое «были приподняты»."}, {"n": 5, "text": "В настоящее время Уральские горы стабилизировались — крупных движений земной коры здесь не наблюдается.", "cat": "BSP", "hint": "Части: «горы стабилизировались» и «движений ... не наблюдается»."}, {"n": 6, "text": "Уральский хребет составляют средние и низкие по высоте горы, наивысшая точка — гора Народная на Приполярном Урале, достигающая 1895 метров.", "cat": "PRED", "hint": ""}, {"n": 7, "text": "Любопытно, что вторая по высоте вершина Ямантау находится на Южном Урале.", "cat": null, "hint": ""}, {"n": 8, "text": "Вообще, в профиль Уральские горы напоминают впадину: самые высокие хребты расположены на севере и юге, а средняя часть не превышает 500 метров, так что, пересекая Средний Урал, можно даже не заметить гор.", "cat": null, "hint": ""}]}, {"id": "17042", "answer": [1, 2, 3, 6], "items": [{"n": 1, "text": "Севернее города Одинцово раскинулся Подушкинский лесопарк — живописная лесная территория.", "cat": "APP", "hint": "«Живописная лесная территория» раскрывает название «Подушкинский лесопарк»."}, {"n": 2, "text": "Этот лес получил своё название благодаря селу Подушкино и лично Ивану Владимировичу Подушке — помещику, которому принадлежали эти земли в XV веке.", "cat": "APP", "hint": ""}, {"n": 3, "text": "Село Подушкино и прилегающие к нему леса не раз меняли хозяев: так, одно время этими угодьями владел Илья Данилович Милославский, дед царевны Софьи и двух царей — Фёдора III и Ивана V.", "cat": "APP", "hint": "После слова «царей» перечисляются их имена — поясняющее приложение."}, {"n": 4, "text": "А в XIX веке в Подушкино провели железную дорогу — здесь появились дачники.", "cat": "BSP", "hint": "Две основы: «провели дорогу» и «появились дачники»."}, {"n": 6, "text": "По оценкам биологов, в Подушкинском лесу обитает 73 вида животных, причём помимо привычных белок и зайцев в лесной глуши можно увидеть норы барсука и встретить орешниковую соню — небольшого грызуна, занесённого в Красную книгу.", "cat": "APP", "hint": "«Небольшого грызуна» поясняет название животного «соня»."}, {"n": 7, "text": "Зелёные дятлы, глухари, рябчики, чёрные коршуны и сапсаны — эти редкие птицы также обитают на территории Подушкинского лесопарка.", "cat": "GEN", "hint": "Обобщающее «эти редкие птицы» стоит после названий птиц."}], "full": [{"n": 1, "text": "Севернее города Одинцово раскинулся Подушкинский лесопарк — живописная лесная территория.", "cat": "APP", "hint": "«Живописная лесная территория» раскрывает название «Подушкинский лесопарк»."}, {"n": 2, "text": "Этот лес получил своё название благодаря селу Подушкино и лично Ивану Владимировичу Подушке — помещику, которому принадлежали эти земли в XV веке.", "cat": "APP", "hint": ""}, {"n": 3, "text": "Село Подушкино и прилегающие к нему леса не раз меняли хозяев: так, одно время этими угодьями владел Илья Данилович Милославский, дед царевны Софьи и двух царей — Фёдора III и Ивана V.", "cat": "APP", "hint": "После слова «царей» перечисляются их имена — поясняющее приложение."}, {"n": 4, "text": "А в XIX веке в Подушкино провели железную дорогу — здесь появились дачники.", "cat": "BSP", "hint": "Две основы: «провели дорогу» и «появились дачники»."}, {"n": 5, "text": "Сейчас, прогуливаясь по парку, можно увидеть двухсотлетние дубы, однако бóльшая часть сохранившихся на сегодня деревьев появилась 50−80 лет назад.", "cat": null, "hint": ""}, {"n": 6, "text": "По оценкам биологов, в Подушкинском лесу обитает 73 вида животных, причём помимо привычных белок и зайцев в лесной глуши можно увидеть норы барсука и встретить орешниковую соню — небольшого грызуна, занесённого в Красную книгу.", "cat": "APP", "hint": "«Небольшого грызуна» поясняет название животного «соня»."}, {"n": 7, "text": "Зелёные дятлы, глухари, рябчики, чёрные коршуны и сапсаны — эти редкие птицы также обитают на территории Подушкинского лесопарка.", "cat": "GEN", "hint": "Обобщающее «эти редкие птицы» стоит после названий птиц."}]}, {"id": "28394", "answer": [1, 3], "items": [{"n": 1, "text": "Таймыр — озеро в Азиатской части России, расположенное на полуострове Таймыр в Красноярском крае.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Название озера имеет эвенкийское происхождение от древнетунгусского «тамура» («ценный, дорогой, богатый») — так эвенки называли реку Таймыру, изобиловавшую рыбой.", "cat": "BSP", "hint": "Две основы: «название имеет происхождение» и «эвенки называли»."}, {"n": 3, "text": "Таймыр — самое северное в мире естественное крупное озеро; оно относится к бассейну Карского моря.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "Через озеро протекает река Таймыра (до впадения в озеро —Верхняя Таймыра, после озера — Нижняя Таймыра), берущая начало на южных склонах хребта Бырранга и впадающая в Таймырскую губу Карского моря.", "cat": "ELL", "hint": "Пропущено «река называется»: «до впадения ... — Верхняя Таймыра»."}, {"n": 6, "text": "Первые исследования Таймыра — крупнейшего озера Красноярского края и пятого озера России по площади водного зеркала — были проведены Василием Прончищевым в 1730-х гг., когда была организована Великая Северная экспедиция.", "cat": "APP", "hint": "Внутри предложения поясняется озеро Таймыр: «крупнейшего озера ...»."}], "full": [{"n": 1, "text": "Таймыр — озеро в Азиатской части России, расположенное на полуострове Таймыр в Красноярском крае.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Название озера имеет эвенкийское происхождение от древнетунгусского «тамура» («ценный, дорогой, богатый») — так эвенки называли реку Таймыру, изобиловавшую рыбой.", "cat": "BSP", "hint": "Две основы: «название имеет происхождение» и «эвенки называли»."}, {"n": 3, "text": "Таймыр — самое северное в мире естественное крупное озеро; оно относится к бассейну Карского моря.", "cat": "PRED", "hint": ""}, {"n": 4, "text": "Само озеро представляет собой пресноводный водоём значительных размеров, вытянутый в широтном направлении на 180–190 км.", "cat": null, "hint": ""}, {"n": 5, "text": "Через озеро протекает река Таймыра (до впадения в озеро —Верхняя Таймыра, после озера — Нижняя Таймыра), берущая начало на южных склонах хребта Бырранга и впадающая в Таймырскую губу Карского моря.", "cat": "ELL", "hint": "Пропущено «река называется»: «до впадения ... — Верхняя Таймыра»."}, {"n": 6, "text": "Первые исследования Таймыра — крупнейшего озера Красноярского края и пятого озера России по площади водного зеркала — были проведены Василием Прончищевым в 1730-х гг., когда была организована Великая Северная экспедиция.", "cat": "APP", "hint": "Внутри предложения поясняется озеро Таймыр: «крупнейшего озера ...»."}]}, {"id": "34132", "answer": [1, 4, 6], "items": [{"n": 1, "text": "Суздаль — один из самых интересных древнерусских городов, сохранившихся до наших дней.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Он славен старинной архитектурой — нарядными белокаменными храмами и памятниками деревянного зодчества.", "cat": "APP", "hint": "«Нарядными белокаменными храмами...» поясняет слово «архитектурой»."}, {"n": 3, "text": "Суздаль входит в маршрут Золотого кольца России — ежегодно сюда приезжают тысячи туристов.", "cat": "BSP", "hint": "После тире новая грамматическая основа: «туристы приезжают»."}, {"n": 4, "text": "Одна из самых известных достопримечательностей Суздаля — Суздальский кремль.", "cat": "PRED", "hint": ""}, {"n": 6, "text": "Древнейшая постройка Суздальского кремля — собор Рождества Богородицы, его построили в XIII веке при князе Георгии Всеволодовиче.", "cat": "PRED", "hint": ""}], "full": [{"n": 1, "text": "Суздаль — один из самых интересных древнерусских городов, сохранившихся до наших дней.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Он славен старинной архитектурой — нарядными белокаменными храмами и памятниками деревянного зодчества.", "cat": "APP", "hint": "«Нарядными белокаменными храмами...» поясняет слово «архитектурой»."}, {"n": 3, "text": "Суздаль входит в маршрут Золотого кольца России — ежегодно сюда приезжают тысячи туристов.", "cat": "BSP", "hint": "После тире новая грамматическая основа: «туристы приезжают»."}, {"n": 4, "text": "Одна из самых известных достопримечательностей Суздаля — Суздальский кремль.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "Его возвели в XI–XII веках, чтобы защищать город от врагов с востока, юга и запада.", "cat": null, "hint": ""}, {"n": 6, "text": "Древнейшая постройка Суздальского кремля — собор Рождества Богородицы, его построили в XIII веке при князе Георгии Всеволодовиче.", "cat": "PRED", "hint": ""}, {"n": 7, "text": "В XVII веке в центре главной площади кремля возвели каменные здания Архиерейских палат, которые включали в себя жилые и хозяйственные постройки.", "cat": null, "hint": ""}, {"n": 8, "text": "До конца XVIII века Суздальский кремль служил резиденцией владимиро-суздальских архиереев, а сегодня он представляет собой музейный комплекс, памятник древнерусского искусства и зодчества.", "cat": null, "hint": ""}]}, {"id": "37095", "answer": [3, 4], "items": [{"n": 1, "text": "Особую группу из семейства полорогих образуют антилопы — животные довольно разнообразного строения и вида.", "cat": "APP", "hint": "«Животные довольно разнообразного строения...» — приложение к слову «антилопы»."}, {"n": 3, "text": "Поэтому общая характеристика их — дело очень трудное.", "cat": "PRED", "hint": ""}, {"n": 4, "text": "Можно только сказать, что все антилопы — животные, похожие на оленей, с более или менее выгнутыми рогами.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "Большинство их любит равнины, но некоторые встречаются только в горах, другие предпочитают болота, третьи — лес.", "cat": "ELL", "hint": "Пропущено «предпочитают»: «третьи — лес»."}, {"n": 6, "text": "Крупные виды живут группами или стадами — мелкие чаще встречаются парами.", "cat": "BSP", "hint": "Противопоставление в БСП: крупные виды живут стадами — мелкие парами."}], "full": [{"n": 1, "text": "Особую группу из семейства полорогих образуют антилопы — животные довольно разнообразного строения и вида.", "cat": "APP", "hint": "«Животные довольно разнообразного строения...» — приложение к слову «антилопы»."}, {"n": 2, "text": "К антилопам относятся самые красивые и изящные полорогие, однако встречаются неуклюжие и грузные создания.", "cat": null, "hint": ""}, {"n": 3, "text": "Поэтому общая характеристика их — дело очень трудное.", "cat": "PRED", "hint": ""}, {"n": 4, "text": "Можно только сказать, что все антилопы — животные, похожие на оленей, с более или менее выгнутыми рогами.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "Большинство их любит равнины, но некоторые встречаются только в горах, другие предпочитают болота, третьи — лес.", "cat": "ELL", "hint": "Пропущено «предпочитают»: «третьи — лес»."}, {"n": 6, "text": "Крупные виды живут группами или стадами — мелкие чаще встречаются парами.", "cat": "BSP", "hint": "Противопоставление в БСП: крупные виды живут стадами — мелкие парами."}, {"n": 7, "text": "По характеру одни антилопы миролюбивы, другие, напротив, злы.", "cat": null, "hint": ""}]}, {"id": "44673", "answer": [2, 4], "items": [{"n": 1, "text": "Коломна — это неповторимый провинциальный город.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "В центре Коломны находится Коломенский кремль — памятник древнерусского зодчества, раньше служивший оборонительным рубежом.", "cat": "APP", "hint": "«Памятник древнерусского зодчества» — приложение к слову «кремль»."}, {"n": 4, "text": "С одной из них — Маринкиной башней — связана легенда, рассказывающая о том, что в этой башне была замурована Марина Мнишек, жена Лжедмитрия II.", "cat": "APP", "hint": "«Маринкиной башней» уточняет местоимение «одной из них»."}, {"n": 6, "text": "В Коломенском кремле можно увидеть пятиглавый Успенский собор, Воскресенскую церковь, Тихвинский собор в псевдорусском стиле — словом, множество исторических памятников архитектуры.", "cat": "GEN", "hint": "«Словом, множество ... памятников» обобщает список зданий."}, {"n": 7, "text": "В Коломне, помимо кремля, находится много других архитектурных памятников XVI−XIX веков — все они создают неповторимый колорит города.", "cat": "BSP", "hint": "Две основы: «находится много ... памятников» и «они создают»."}], "full": [{"n": 1, "text": "Коломна — это неповторимый провинциальный город.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "В центре Коломны находится Коломенский кремль — памятник древнерусского зодчества, раньше служивший оборонительным рубежом.", "cat": "APP", "hint": "«Памятник древнерусского зодчества» — приложение к слову «кремль»."}, {"n": 3, "text": "На территории кремля множество сторожевых вышек и башен.", "cat": null, "hint": ""}, {"n": 4, "text": "С одной из них — Маринкиной башней — связана легенда, рассказывающая о том, что в этой башне была замурована Марина Мнишек, жена Лжедмитрия II.", "cat": "APP", "hint": "«Маринкиной башней» уточняет местоимение «одной из них»."}, {"n": 5, "text": "Говорили, что в Маринкиной башне Мнишек спрятала сокровища, но в ходе раскопок в 1903 году ни её тела, ни драгоценностей обнаружено не было.", "cat": null, "hint": ""}, {"n": 6, "text": "В Коломенском кремле можно увидеть пятиглавый Успенский собор, Воскресенскую церковь, Тихвинский собор в псевдорусском стиле — словом, множество исторических памятников архитектуры.", "cat": "GEN", "hint": "«Словом, множество ... памятников» обобщает список зданий."}, {"n": 7, "text": "В Коломне, помимо кремля, находится много других архитектурных памятников XVI−XIX веков — все они создают неповторимый колорит города.", "cat": "BSP", "hint": "Две основы: «находится много ... памятников» и «они создают»."}, {"n": 8, "text": "Можно также побывать в музее пастилы, музее «Школа ремёсел», музее-проекте «Арткоммуналка».", "cat": null, "hint": ""}]}, {"id": "53342", "answer": [2, 3, 5, 9], "items": [{"n": 1, "text": "Усадьба Кусково — архитектурно-художественный ансамбль, расположенный на востоке современной Москвы, на территории района Вешняки.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Владельцами Кускова издавна были графы Шереметевы — представители одного из виднейших боярских родов.", "cat": "APP", "hint": ""}, {"n": 3, "text": "Под дворцово-парковый ансамбль отвели площадь в 300 с лишним гектаров, и в 1749 году появилась первая из кусковских построек, сохранившихся до наших дней, — Голландский домик.", "cat": "APP", "hint": "«Голландский домик» поясняет, какая именно постройка была первой."}, {"n": 4, "text": "Изначально пейзаж вокруг села был невзрачным, а само место низинным и болотистым, поэтому топи осушали, избытки воды собирали в многочисленные пруды — их в имении насчитывалось 17.", "cat": "BSP", "hint": "После тире сообщается следствие: «их ... насчитывалось 17»."}, {"n": 5, "text": "От пруда возле церкви на юг к Вешнякову прорыли протяжённый канал, восточнее которого обширный зелёный массив превратился в Зверинец — смесь заповедника и зоопарка, где содержались медведи, редкие чёрные волки, олени, дикие козы и зайцы.", "cat": "APP", "hint": "«Смесь заповедника и зоопарка» — поясняющее приложение к слову «Зверинец»."}, {"n": 6, "text": "Мраморные мавзолеи сменяли живописные мостики с позолоченными решётками, аллеи кедров — выставленные вдоль партера в кадках лимонные, апельсиновые, померанцевые деревья и огромные благородные лавры.", "cat": "ELL", "hint": "Во второй части опущено «сменяли»: аллеи кедров — деревья в кадках."}, {"n": 8, "text": "«Зелёный театр» — получил своё название по травяному амфитеатру и кулисам из кустарников — был предназначен для представлений небольших французских опер под открытым небом.", "cat": "INSERT", "hint": "«Получил своё название...» — вставное замечание между двумя тире."}, {"n": 9, "text": "Второй театр — «Малый» — располагался в турецком киоске, а третий был построен в классическом стиле и ни в чём не уступал императорскому.", "cat": "APP", "hint": "Название «Малый» выделено двумя тире как поясняющее приложение."}], "full": [{"n": 1, "text": "Усадьба Кусково — архитектурно-художественный ансамбль, расположенный на востоке современной Москвы, на территории района Вешняки.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Владельцами Кускова издавна были графы Шереметевы — представители одного из виднейших боярских родов.", "cat": "APP", "hint": ""}, {"n": 3, "text": "Под дворцово-парковый ансамбль отвели площадь в 300 с лишним гектаров, и в 1749 году появилась первая из кусковских построек, сохранившихся до наших дней, — Голландский домик.", "cat": "APP", "hint": "«Голландский домик» поясняет, какая именно постройка была первой."}, {"n": 4, "text": "Изначально пейзаж вокруг села был невзрачным, а само место низинным и болотистым, поэтому топи осушали, избытки воды собирали в многочисленные пруды — их в имении насчитывалось 17.", "cat": "BSP", "hint": "После тире сообщается следствие: «их ... насчитывалось 17»."}, {"n": 5, "text": "От пруда возле церкви на юг к Вешнякову прорыли протяжённый канал, восточнее которого обширный зелёный массив превратился в Зверинец — смесь заповедника и зоопарка, где содержались медведи, редкие чёрные волки, олени, дикие козы и зайцы.", "cat": "APP", "hint": "«Смесь заповедника и зоопарка» — поясняющее приложение к слову «Зверинец»."}, {"n": 6, "text": "Мраморные мавзолеи сменяли живописные мостики с позолоченными решётками, аллеи кедров — выставленные вдоль партера в кадках лимонные, апельсиновые, померанцевые деревья и огромные благородные лавры.", "cat": "ELL", "hint": "Во второй части опущено «сменяли»: аллеи кедров — деревья в кадках."}, {"n": 7, "text": "Одних театров в Кускове существовало три.", "cat": null, "hint": ""}, {"n": 8, "text": "«Зелёный театр» — получил своё название по травяному амфитеатру и кулисам из кустарников — был предназначен для представлений небольших французских опер под открытым небом.", "cat": "INSERT", "hint": "«Получил своё название...» — вставное замечание между двумя тире."}, {"n": 9, "text": "Второй театр — «Малый» — располагался в турецком киоске, а третий был построен в классическом стиле и ни в чём не уступал императорскому.", "cat": "APP", "hint": "Название «Малый» выделено двумя тире как поясняющее приложение."}]}, {"id": "57551", "answer": [2, 4, 8], "items": [{"n": 1, "text": "Григорий Семёнович Мусикийский — первый русский художник-миниатюрист по эмали (финифти).", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Применение расписной эмали в декоративно-прикладном искусстве известно в Европе с раннего средневековья, а в России — с XVII века.", "cat": "ELL", "hint": "Опущено «известно»: «а в России — с XVII века»."}, {"n": 4, "text": "Мусикийский работал в московской Оружейной палате, а с 1711 года — в Петербургской Оружейной канцелярии.", "cat": "ELL", "hint": "Опущено «работал»: «а с 1711 года — в ... канцелярии»."}, {"n": 6, "text": "Многофигурные композиции Мусикийского — они интересны в иконографическом плане — привлекают внимание декоративной цветовой гаммой.", "cat": "INSERT", "hint": ""}, {"n": 8, "text": "На фоне портрета Петра I изображена Петропавловская крепость — историческое ядро Северной столицы; на фоне портрета Екатерины I — её загородная резиденция Екатерингофский дворец.", "cat": "ELL", "hint": "Вторая конструкция: «на фоне портрета Екатерины I — её ... резиденция»; опущено «изображена». В первой части также есть приложение."}], "full": [{"n": 1, "text": "Григорий Семёнович Мусикийский — первый русский художник-миниатюрист по эмали (финифти).", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Применение расписной эмали в декоративно-прикладном искусстве известно в Европе с раннего средневековья, а в России — с XVII века.", "cat": "ELL", "hint": "Опущено «известно»: «а в России — с XVII века»."}, {"n": 3, "text": "Однако портретная миниатюра по эмали появилась лишь в начале XVIII столетия в связи с развитием в Петровское время жанра портрета.", "cat": null, "hint": ""}, {"n": 4, "text": "Мусикийский работал в московской Оружейной палате, а с 1711 года — в Петербургской Оружейной канцелярии.", "cat": "ELL", "hint": "Опущено «работал»: «а с 1711 года — в ... канцелярии»."}, {"n": 5, "text": "Он исполнял большое количество миниатюрных изображений Петра I, которые царь жаловал в качестве высокой награды.", "cat": null, "hint": ""}, {"n": 6, "text": "Многофигурные композиции Мусикийского — они интересны в иконографическом плане — привлекают внимание декоративной цветовой гаммой.", "cat": "INSERT", "hint": ""}, {"n": 7, "text": "Парные подписные портреты Петра I и Екатерины I созданы в честь 20-летия со дня основания Петербурга.", "cat": null, "hint": ""}, {"n": 8, "text": "На фоне портрета Петра I изображена Петропавловская крепость — историческое ядро Северной столицы; на фоне портрета Екатерины I — её загородная резиденция Екатерингофский дворец.", "cat": "ELL", "hint": "Вторая конструкция: «на фоне портрета Екатерины I — её ... резиденция»; опущено «изображена». В первой части также есть приложение."}]}, {"id": "59257", "answer": [1, 2, 9], "items": [{"n": 1, "text": "Судно — это сооружение, созданное для плавания.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Часто полагают, что слова «судно» и «корабль» — синонимы.", "cat": "PRED", "hint": ""}, {"n": 4, "text": "В современном торговом флоте применяют исключительно термин «судно», в военном — «корабль».", "cat": "ELL", "hint": "Пропущено «применяют термин»: «в военном — „корабль“»."}, {"n": 6, "text": "В парусную эпоху кораблём называли лишь определённый тип судов — плавучее сооружение с прямыми парусами на всех мачтах, которых должно было быть не менее трёх.", "cat": "APP", "hint": "«Плавучее сооружение...» поясняет, какой тип судна назван кораблём."}, {"n": 8, "text": "Ещё сто лет назад моряк никогда бы не назвал двухмачтовое военное судно кораблём — это сочли бы безграмотным.", "cat": "BSP", "hint": "После тире новая предикативная часть: «это сочли бы безграмотным»."}, {"n": 9, "text": "Пожалуй, сегодня одна из самых важных характеристик судна — тип двигателя, или, если следовать терминологии кораблестроителей, тип энергетической установки.", "cat": "PRED", "hint": ""}], "full": [{"n": 1, "text": "Судно — это сооружение, созданное для плавания.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Часто полагают, что слова «судно» и «корабль» — синонимы.", "cat": "PRED", "hint": ""}, {"n": 3, "text": "Однако это не совсем правильно.", "cat": null, "hint": ""}, {"n": 4, "text": "В современном торговом флоте применяют исключительно термин «судно», в военном — «корабль».", "cat": "ELL", "hint": "Пропущено «применяют термин»: «в военном — „корабль“»."}, {"n": 5, "text": "Подобное разделение сложилось постепенно.", "cat": null, "hint": ""}, {"n": 6, "text": "В парусную эпоху кораблём называли лишь определённый тип судов — плавучее сооружение с прямыми парусами на всех мачтах, которых должно было быть не менее трёх.", "cat": "APP", "hint": "«Плавучее сооружение...» поясняет, какой тип судна назван кораблём."}, {"n": 7, "text": "Таким образом, настоящими кораблями считались только линкоры, фрегаты, корветы и некоторые торговые суда.", "cat": null, "hint": ""}, {"n": 8, "text": "Ещё сто лет назад моряк никогда бы не назвал двухмачтовое военное судно кораблём — это сочли бы безграмотным.", "cat": "BSP", "hint": "После тире новая предикативная часть: «это сочли бы безграмотным»."}, {"n": 9, "text": "Пожалуй, сегодня одна из самых важных характеристик судна — тип двигателя, или, если следовать терминологии кораблестроителей, тип энергетической установки.", "cat": "PRED", "hint": ""}]}, {"id": "59885", "answer": [3, 6], "items": [{"n": 1, "text": "Капибара — самый крупный современный грызун на планете.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Длина тела этого удивительного животного достигает 1,3 метра, а вес — шестидесяти килограммов.", "cat": "ELL", "hint": "Пропущено «достигает»: «а вес — шестидесяти килограммов»."}, {"n": 3, "text": "В природе капибары — любители поплавать — обитают в Южной и Центральной Америке возле водоёмов, где они находят себе пищу и укрытие от хищников.", "cat": "APP", "hint": "«Любители поплавать» — приложение к слову «капибары»."}, {"n": 4, "text": "Их рацион состоит из травы, водных растений, фруктов и овощей — всё это капибары находят в своей естественной среде обитания.", "cat": "GEN", "hint": "«Всё это» обобщает названные виды пищи."}, {"n": 6, "text": "У капибары есть интересная особенность — перепончатые лапы, которые помогают ей отлично плавать и нырять.", "cat": "APP", "hint": "После слова «особенность» поясняется, какая именно: «перепончатые лапы»."}], "full": [{"n": 1, "text": "Капибара — самый крупный современный грызун на планете.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Длина тела этого удивительного животного достигает 1,3 метра, а вес — шестидесяти килограммов.", "cat": "ELL", "hint": "Пропущено «достигает»: «а вес — шестидесяти килограммов»."}, {"n": 3, "text": "В природе капибары — любители поплавать — обитают в Южной и Центральной Америке возле водоёмов, где они находят себе пищу и укрытие от хищников.", "cat": "APP", "hint": "«Любители поплавать» — приложение к слову «капибары»."}, {"n": 4, "text": "Их рацион состоит из травы, водных растений, фруктов и овощей — всё это капибары находят в своей естественной среде обитания.", "cat": "GEN", "hint": "«Всё это» обобщает названные виды пищи."}, {"n": 5, "text": "Эти социальные животные живут группами в 10−20 особей, где каждый знает своё место.", "cat": null, "hint": ""}, {"n": 6, "text": "У капибары есть интересная особенность — перепончатые лапы, которые помогают ей отлично плавать и нырять.", "cat": "APP", "hint": "После слова «особенность» поясняется, какая именно: «перепончатые лапы»."}, {"n": 7, "text": "На суше эти грызуны тоже чувствуют себя уверенно, развивая скорость до 35 километров в час.", "cat": null, "hint": ""}, {"n": 8, "text": "Несмотря на внушительные размеры, капибары миролюбивы, они прекрасно уживаются с другими животными.", "cat": null, "hint": ""}]}, {"id": "60227", "answer": [3, 4, 6, 9], "items": [{"n": 1, "text": "Кашалот — морское млекопитающее, которое удивляет своими размерами и особенностями.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Длина самцов может достигать 20 метров, самок — десяти–тринадцати.", "cat": "ELL", "hint": ""}, {"n": 3, "text": "В стаде кашалотов царит строгая иерархия: самки с детёнышами держатся отдельно от взрослых самцов — защитников стаи.", "cat": "APP", "hint": "«Защитников стаи» поясняет слово «самцов»."}, {"n": 4, "text": "В океане эти гиганты чувствуют себя как дома: они свободно плавают на тех глубинах, где попадаются головоногие моллюски — их любимое лакомство.", "cat": "APP", "hint": "«Их любимое лакомство» — приложение к словосочетанию «головоногие моллюски»."}, {"n": 6, "text": "Охота на кальмаров — любимое занятие кашалотов, способных погружаться на большую глубину, — требует от этих животных не только выносливости и силы, но и ловкости.", "cat": "APP", "hint": "«Любимое занятие кашалотов...» — обособленное приложение к слову «охота»."}, {"n": 8, "text": "Кашалоты, как оказалось, обладают сложной системой коммуникации под водой, напоминающей язык, активно используя её при охоте, — это настоящее чудо природы.", "cat": "BSP", "hint": "После тире другая основа: «это (есть) чудо природы»."}, {"n": 9, "text": "Кашалоты — флагманы океана, способствующие поддержанию природного баланса, — играют важную роль в экосистеме планеты.", "cat": "APP", "hint": "«Флагманы океана» — обособленное поясняющее приложение к «кашалоты»."}], "full": [{"n": 1, "text": "Кашалот — морское млекопитающее, которое удивляет своими размерами и особенностями.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Длина самцов может достигать 20 метров, самок — десяти–тринадцати.", "cat": "ELL", "hint": ""}, {"n": 3, "text": "В стаде кашалотов царит строгая иерархия: самки с детёнышами держатся отдельно от взрослых самцов — защитников стаи.", "cat": "APP", "hint": "«Защитников стаи» поясняет слово «самцов»."}, {"n": 4, "text": "В океане эти гиганты чувствуют себя как дома: они свободно плавают на тех глубинах, где попадаются головоногие моллюски — их любимое лакомство.", "cat": "APP", "hint": "«Их любимое лакомство» — приложение к словосочетанию «головоногие моллюски»."}, {"n": 5, "text": "Когда кашалот ныряет, это настоящее зрелище, за которым можно наблюдать часами.", "cat": null, "hint": ""}, {"n": 6, "text": "Охота на кальмаров — любимое занятие кашалотов, способных погружаться на большую глубину, — требует от этих животных не только выносливости и силы, но и ловкости.", "cat": "APP", "hint": "«Любимое занятие кашалотов...» — обособленное приложение к слову «охота»."}, {"n": 7, "text": "Кроме того, учёные выяснили, что голова этого кита содержит природный механизм, позволяющий животному во время охоты издавать особые звуки для эхолокации.", "cat": null, "hint": ""}, {"n": 8, "text": "Кашалоты, как оказалось, обладают сложной системой коммуникации под водой, напоминающей язык, активно используя её при охоте, — это настоящее чудо природы.", "cat": "BSP", "hint": "После тире другая основа: «это (есть) чудо природы»."}, {"n": 9, "text": "Кашалоты — флагманы океана, способствующие поддержанию природного баланса, — играют важную роль в экосистеме планеты.", "cat": "APP", "hint": "«Флагманы океана» — обособленное поясняющее приложение к «кашалоты»."}]}, {"id": "60938", "answer": [4, 8], "items": [{"n": 1, "text": "Москва — город, где каждая улица хранит свою историю.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Тверская — её главная артерия — соединяет прошлое и настоящее.", "cat": "APP", "hint": ""}, {"n": 3, "text": "От Красной площади до метро «Маяковская», где уже берёт начало Первая Тверская-Ямская — не путайте её с Тверской, — улица насыщена архитектурными шедеврами разных эпох.", "cat": "INSERT", "hint": "«Не путайте её с Тверской» — вставное замечание между двумя тире."}, {"n": 4, "text": "Названия других улиц: Арбат, Никольская, Пятницкая — звучат как мелодия старинного романса, напоминая о купеческой Москве и её неповторимом колорите.", "cat": "GEN", "hint": "Перечень «Арбат, Никольская, Пятницкая» обособлен после обобщающего слова «названия»."}, {"n": 6, "text": "На Гоголевском бульваре вас встречает памятник Н. В. Гоголю, на Чистопрудном — А. С. Грибоедову, а на Страстном — А. С. Пушкину и В. С. Высоцкому.", "cat": "ELL", "hint": "Пропущено «встречает памятник»: «на Чистопрудном — А. С. Грибоедову»."}, {"n": 7, "text": "Вот Пречистенка, Остоженка и Поварская — история этих улиц рассказывает о жизни аристократии, о балах и литературных вечерах, о судьбах, переплетённых с историей страны.", "cat": "BSP", "hint": "Части: «Вот Пречистенка...» и «история улиц рассказывает...»."}, {"n": 8, "text": "Возможность заглянуть в уютные дворики, полюбоваться старинными фасадами, вдохнуть аромат истории — всё это ждёт того, кто решится на неспешную прогулку по московским улицам.", "cat": "GEN", "hint": "«Всё это» обобщает однородные инфинитивы «заглянуть, полюбоваться, вдохнуть»."}], "full": [{"n": 1, "text": "Москва — город, где каждая улица хранит свою историю.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Тверская — её главная артерия — соединяет прошлое и настоящее.", "cat": "APP", "hint": ""}, {"n": 3, "text": "От Красной площади до метро «Маяковская», где уже берёт начало Первая Тверская-Ямская — не путайте её с Тверской, — улица насыщена архитектурными шедеврами разных эпох.", "cat": "INSERT", "hint": "«Не путайте её с Тверской» — вставное замечание между двумя тире."}, {"n": 4, "text": "Названия других улиц: Арбат, Никольская, Пятницкая — звучат как мелодия старинного романса, напоминая о купеческой Москве и её неповторимом колорите.", "cat": "GEN", "hint": "Перечень «Арбат, Никольская, Пятницкая» обособлен после обобщающего слова «названия»."}, {"n": 5, "text": "Отдельной главой в летописи Москвы стало Бульварное кольцо.", "cat": null, "hint": ""}, {"n": 6, "text": "На Гоголевском бульваре вас встречает памятник Н. В. Гоголю, на Чистопрудном — А. С. Грибоедову, а на Страстном — А. С. Пушкину и В. С. Высоцкому.", "cat": "ELL", "hint": "Пропущено «встречает памятник»: «на Чистопрудном — А. С. Грибоедову»."}, {"n": 7, "text": "Вот Пречистенка, Остоженка и Поварская — история этих улиц рассказывает о жизни аристократии, о балах и литературных вечерах, о судьбах, переплетённых с историей страны.", "cat": "BSP", "hint": "Части: «Вот Пречистенка...» и «история улиц рассказывает...»."}, {"n": 8, "text": "Возможность заглянуть в уютные дворики, полюбоваться старинными фасадами, вдохнуть аромат истории — всё это ждёт того, кто решится на неспешную прогулку по московским улицам.", "cat": "GEN", "hint": "«Всё это» обобщает однородные инфинитивы «заглянуть, полюбоваться, вдохнуть»."}, {"n": 9, "text": "И каждая такая прогулка станет маленьким открытием.", "cat": null, "hint": ""}]}, {"id": "61534", "answer": [7, 8], "items": [{"n": 1, "text": "Вараны Таиланда — удивительные рептилии.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Они обитают и в дикой природе, и в городских парках, и в каналах (кхлонгах), и даже в ливневой канализации — везде, где есть вода и можно найти себе пропитание.", "cat": "GEN", "hint": "«Везде, где есть вода...» обобщает перечисленные места обитания."}, {"n": 3, "text": "Варан — по преимуществу хищник и падальщик — питается рыбой, лягушками, насекомыми и ракообразными.", "cat": "INSERT", "hint": "«По преимуществу хищник и падальщик» — вставное замечание о варане."}, {"n": 4, "text": "Иногда — если пищи недостаточно — он может охотиться на мелких птиц, грызунов либо посещать городские помойки.", "cat": "INSERT", "hint": "«Если пищи недостаточно» вставлено между двумя тире."}, {"n": 5, "text": "«Опасны ли вараны для человека?» — спрашивают туристы и получают успокаивающий ответ.", "cat": "DIRECT", "hint": ""}, {"n": 6, "text": "Местные жители относятся к варанам по-разному: одни считают их полезными (рептилии уничтожают падаль), другие — вредителями (вараны порой нападают на домашнюю птицу).", "cat": "ELL", "hint": "Пропущено «считают»: «другие — вредителями»."}, {"n": 7, "text": "Если хотите увидеть варанов вблизи, отправляйтесь в бангкокский парк Люмпини — это настоящее королевство варанов!", "cat": "BSP", "hint": "Вторая часть БСП поясняет первую: «это настоящее королевство варанов»."}, {"n": 8, "text": "Тайский варан, несмотря на внушительный вид, не комодский дракон — не бойтесь: вараны неагрессивны и обычно стараются избежать встречи с человеком.", "cat": "BSP", "hint": "После тире побудительная часть «не бойтесь», которая мотивируется первой."}], "full": [{"n": 1, "text": "Вараны Таиланда — удивительные рептилии.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Они обитают и в дикой природе, и в городских парках, и в каналах (кхлонгах), и даже в ливневой канализации — везде, где есть вода и можно найти себе пропитание.", "cat": "GEN", "hint": "«Везде, где есть вода...» обобщает перечисленные места обитания."}, {"n": 3, "text": "Варан — по преимуществу хищник и падальщик — питается рыбой, лягушками, насекомыми и ракообразными.", "cat": "INSERT", "hint": "«По преимуществу хищник и падальщик» — вставное замечание о варане."}, {"n": 4, "text": "Иногда — если пищи недостаточно — он может охотиться на мелких птиц, грызунов либо посещать городские помойки.", "cat": "INSERT", "hint": "«Если пищи недостаточно» вставлено между двумя тире."}, {"n": 5, "text": "«Опасны ли вараны для человека?» — спрашивают туристы и получают успокаивающий ответ.", "cat": "DIRECT", "hint": ""}, {"n": 6, "text": "Местные жители относятся к варанам по-разному: одни считают их полезными (рептилии уничтожают падаль), другие — вредителями (вараны порой нападают на домашнюю птицу).", "cat": "ELL", "hint": "Пропущено «считают»: «другие — вредителями»."}, {"n": 7, "text": "Если хотите увидеть варанов вблизи, отправляйтесь в бангкокский парк Люмпини — это настоящее королевство варанов!", "cat": "BSP", "hint": "Вторая часть БСП поясняет первую: «это настоящее королевство варанов»."}, {"n": 8, "text": "Тайский варан, несмотря на внушительный вид, не комодский дракон — не бойтесь: вараны неагрессивны и обычно стараются избежать встречи с человеком.", "cat": "BSP", "hint": "После тире побудительная часть «не бойтесь», которая мотивируется первой."}]}, {"id": "67131", "answer": [2, 5, 6, 7, 9], "items": [{"n": 2, "text": "Корней Чуковский — автор многих знаменитых сказок и стихотворений.", "cat": "PRED", "hint": ""}, {"n": 3, "text": "«Мойдодыр», «Айболит», «Муха-Цокотуха» — все эти произведения написаны им.", "cat": "GEN", "hint": "«Все эти произведения» обобщает названия трёх сказок."}, {"n": 4, "text": "Они знакомы нам с раннего детства — многие строки мы помним наизусть.", "cat": "BSP", "hint": "Две основы: «они знакомы» и «мы помним»."}, {"n": 5, "text": "Главные герои его произведений — люди, животные и даже самые обычные предметы.", "cat": "PRED", "hint": ""}, {"n": 6, "text": "Произведения Корнея Ивановича — весёлые и поучительные истории для малышей.", "cat": "PRED", "hint": ""}, {"n": 7, "text": "«Мойдодыр» — сказка о важности чистоты и аккуратности.", "cat": "PRED", "hint": ""}, {"n": 8, "text": "Доброте и вниманию к ближним научит доктор Айболит — добрый врач, который всегда готов прийти на помощь животным.", "cat": "APP", "hint": "«Добрый врач...» — приложение, поясняющее имя Айболит."}, {"n": 9, "text": "Корней Чуковский — один из самых популярных детских писателей в стране: наряду книгами с С. Я. Маршака и А. Л. Барто его произведения издавались огромными тиражами, входили в хрестоматии.", "cat": "PRED", "hint": ""}], "full": [{"n": 1, "text": "31 марта Россия отмечает день рождения Корнея Ивановича Чуковского.", "cat": null, "hint": ""}, {"n": 2, "text": "Корней Чуковский — автор многих знаменитых сказок и стихотворений.", "cat": "PRED", "hint": ""}, {"n": 3, "text": "«Мойдодыр», «Айболит», «Муха-Цокотуха» — все эти произведения написаны им.", "cat": "GEN", "hint": "«Все эти произведения» обобщает названия трёх сказок."}, {"n": 4, "text": "Они знакомы нам с раннего детства — многие строки мы помним наизусть.", "cat": "BSP", "hint": "Две основы: «они знакомы» и «мы помним»."}, {"n": 5, "text": "Главные герои его произведений — люди, животные и даже самые обычные предметы.", "cat": "PRED", "hint": ""}, {"n": 6, "text": "Произведения Корнея Ивановича — весёлые и поучительные истории для малышей.", "cat": "PRED", "hint": ""}, {"n": 7, "text": "«Мойдодыр» — сказка о важности чистоты и аккуратности.", "cat": "PRED", "hint": ""}, {"n": 8, "text": "Доброте и вниманию к ближним научит доктор Айболит — добрый врач, который всегда готов прийти на помощь животным.", "cat": "APP", "hint": "«Добрый врач...» — приложение, поясняющее имя Айболит."}, {"n": 9, "text": "Корней Чуковский — один из самых популярных детских писателей в стране: наряду книгами с С. Я. Маршака и А. Л. Барто его произведения издавались огромными тиражами, входили в хрестоматии.", "cat": "PRED", "hint": ""}]}, {"id": "14082", "answer": [3, 6], "items": [{"n": 1, "text": "Чегемское ущелье — одна из настоящих жемчужин Кабардино-Балкарии.", "cat": "PRED", "hint": ""}, {"n": 3, "text": "В месте, где ущелье проходит сквозь Скалистый хребет, находится теснина — наиболее узкая его часть.", "cat": "APP", "hint": "«Наиболее узкая его часть» поясняет слово «теснина»."}, {"n": 6, "text": "За Скалистым хребтом сохранились древние башни, а в самом конце ущелья возвышается, пожалуй, самая живописная гора Главного Кавказского хребта — Тихтенген (4611 м), западнее которой находится перевал Твибер (3780 м).", "cat": "APP", "hint": "«Тихтенген» поясняет название самой живописной горы."}, {"n": 7, "text": "Здесь путешествие обычных туристов заканчивается: дорогу перегораживает мощный ледник — передвижение по нему очень опасно.", "cat": "BSP", "hint": "Две части БСП: «дорогу перегораживает» и «передвижение ... опасно»."}], "full": [{"n": 1, "text": "Чегемское ущелье — одна из настоящих жемчужин Кабардино-Балкарии.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Оно тянется с северо-востока на северо-запад, пронзая Скалистый, Лесистый, Боковой и Пастбищный хребты.", "cat": null, "hint": ""}, {"n": 3, "text": "В месте, где ущелье проходит сквозь Скалистый хребет, находится теснина — наиболее узкая его часть.", "cat": "APP", "hint": "«Наиболее узкая его часть» поясняет слово «теснина»."}, {"n": 4, "text": "Дно ущелья местами сужается до 15–20 м, зажатое по бокам отвесными стенами, которые возвышаются на 100–200 м и нависают над тропой и несущимся рядом Чегемом.", "cat": null, "hint": ""}, {"n": 5, "text": "Река промыла здесь известняковый хребет, поэтому стены теснины окрашены в красивые оттенки: от белого и кремового до оранжевого.", "cat": null, "hint": ""}, {"n": 6, "text": "За Скалистым хребтом сохранились древние башни, а в самом конце ущелья возвышается, пожалуй, самая живописная гора Главного Кавказского хребта — Тихтенген (4611 м), западнее которой находится перевал Твибер (3780 м).", "cat": "APP", "hint": "«Тихтенген» поясняет название самой живописной горы."}, {"n": 7, "text": "Здесь путешествие обычных туристов заканчивается: дорогу перегораживает мощный ледник — передвижение по нему очень опасно.", "cat": "BSP", "hint": "Две части БСП: «дорогу перегораживает» и «передвижение ... опасно»."}]}, {"id": "16875", "answer": [1, 6, 7], "items": [{"n": 1, "text": "Изучение растений и животных в природе — занятие не из лёгких.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "У каждого вида — свой образ жизни, свои особенности, привычки.", "cat": "ELL", "hint": "Пропущено «есть»: «У каждого вида — свой образ жизни»."}, {"n": 6, "text": "Но экология — понятие более широкое.", "cat": "PRED", "hint": ""}, {"n": 7, "text": "Эта наука — перекрёсток, где хватает работы биологу и врачу, космонавту и математику, философу и социологу, химику и инженеру.", "cat": "PRED", "hint": ""}], "full": [{"n": 1, "text": "Изучение растений и животных в природе — занятие не из лёгких.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Если учесть, как сложна даже самая простая среда, то неудивительно, почему экология развивается так постепенно, шаг за шагом отбирая у природы её тайны.", "cat": null, "hint": ""}, {"n": 3, "text": "Любое существо тысячами невидимых нитей связано с живой и неживой природой.", "cat": null, "hint": ""}, {"n": 4, "text": "Добывая пищу, отыскивая укрытия от врагов и непогоды, животные и растения выработали приспособления к самым полярным воздействиям природы.", "cat": null, "hint": ""}, {"n": 5, "text": "У каждого вида — свой образ жизни, свои особенности, привычки.", "cat": "ELL", "hint": "Пропущено «есть»: «У каждого вида — свой образ жизни»."}, {"n": 6, "text": "Но экология — понятие более широкое.", "cat": "PRED", "hint": ""}, {"n": 7, "text": "Эта наука — перекрёсток, где хватает работы биологу и врачу, космонавту и математику, философу и социологу, химику и инженеру.", "cat": "PRED", "hint": ""}, {"n": 8, "text": "Это наука, которая учит человека жить в ладу с природой.", "cat": null, "hint": ""}, {"n": 9, "text": "Ведь тот же самый зверь или какое-нибудь растение не могут существовать сами по себе, в отрыве от остального мира.", "cat": null, "hint": ""}]}, {"id": "17214", "answer": [4, 5], "items": [{"n": 1, "text": "У каждого человека есть место, которое ему бесконечно дорого, — родная земля.", "cat": "APP", "hint": "«Родная земля» уточняет название дорогого места."}, {"n": 3, "text": "Тысячи бурных рек и спокойных прозрачных озёр, необъятный простор степей и цветущие ковры горных лугов, светлые берёзовые рощи и таинственные урочища со следами диких животных — всё это мило и дорого каждому, кто здесь бывал.", "cat": "GEN", "hint": "«Всё это» обобщает ряд названий природы."}, {"n": 4, "text": "Этот край — территория невероятных сокровищ, таящихся в глухих недрах.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "Но Алтайский край знаменит не только первозданной природой, главное его богатство — люди.", "cat": "PRED", "hint": ""}, {"n": 8, "text": "«Добро пожаловать в удивительный Алтайский край!» — призывают к увлекательному путешествию буклеты-путеводители по туристическим маршрутам России.", "cat": "DIRECT", "hint": "Тире отделяет прямую речь в кавычках от слов автора «призывают ... буклеты»."}], "full": [{"n": 1, "text": "У каждого человека есть место, которое ему бесконечно дорого, — родная земля.", "cat": "APP", "hint": "«Родная земля» уточняет название дорогого места."}, {"n": 2, "text": "Алтайский край является одним из самых красивых мест земного шара.", "cat": null, "hint": ""}, {"n": 3, "text": "Тысячи бурных рек и спокойных прозрачных озёр, необъятный простор степей и цветущие ковры горных лугов, светлые берёзовые рощи и таинственные урочища со следами диких животных — всё это мило и дорого каждому, кто здесь бывал.", "cat": "GEN", "hint": "«Всё это» обобщает ряд названий природы."}, {"n": 4, "text": "Этот край — территория невероятных сокровищ, таящихся в глухих недрах.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "Но Алтайский край знаменит не только первозданной природой, главное его богатство — люди.", "cat": "PRED", "hint": ""}, {"n": 6, "text": "Люди спокойные и смелые, уважающие друг друга, любящие жизнь и свою родную землю, уверенно смотрящие в будущее.", "cat": null, "hint": ""}, {"n": 7, "text": "Чтобы познакомиться с Алтайским краем, можно почитать о нём книги, посмотреть фильмы, но, чтобы постичь его душой, а затем полюбить навсегда, надо обязательно приехать на алтайскую землю.", "cat": null, "hint": ""}, {"n": 8, "text": "«Добро пожаловать в удивительный Алтайский край!» — призывают к увлекательному путешествию буклеты-путеводители по туристическим маршрутам России.", "cat": "DIRECT", "hint": "Тире отделяет прямую речь в кавычках от слов автора «призывают ... буклеты»."}]}, {"id": "39828", "answer": [1, 3], "items": [{"n": 1, "text": "Юрий Александрович Бычков — спецкор газеты «Советская культура», общественный деятель в области сохранения культурного наследия.", "cat": "PRED", "hint": ""}, {"n": 3, "text": "Цель командировки — подготовить материал о том, как живут старинные российские города.", "cat": "PRED", "hint": ""}, {"n": 4, "text": "Когда материал был собран, Юрий Александрович решил вернуться в Москву не той дорогой, по которой ехал в Суздаль, а окружным путём — по ярославской трассе.", "cat": "CLARIFY", "hint": "«По ярославской трассе» уточняет «окружным путём»."}, {"n": 5, "text": "Владимир, Суздаль, Ярославль, Переславль-Залесский, Ростов Великий, Сергиев Посад, Кострому и Иваново — эти города посетил во время поездки Бычков.", "cat": "GEN", "hint": "«Эти города» обобщает перечисленные названия городов."}, {"n": 7, "text": "В Москве он увидел, как блестят на солнце купола в Кремле, вспомнил очертания маршрута, по которому проехал, и о том, как блестела рожь вдоль дорог, — так и родилось сочетание «Золотое кольцо».", "cat": "BSP", "hint": "Присоединённая часть БСП «так и родилось ...»."}], "full": [{"n": 1, "text": "Юрий Александрович Бычков — спецкор газеты «Советская культура», общественный деятель в области сохранения культурного наследия.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "В 1967 году он оказался в Суздале.", "cat": null, "hint": ""}, {"n": 3, "text": "Цель командировки — подготовить материал о том, как живут старинные российские города.", "cat": "PRED", "hint": ""}, {"n": 4, "text": "Когда материал был собран, Юрий Александрович решил вернуться в Москву не той дорогой, по которой ехал в Суздаль, а окружным путём — по ярославской трассе.", "cat": "CLARIFY", "hint": "«По ярославской трассе» уточняет «окружным путём»."}, {"n": 5, "text": "Владимир, Суздаль, Ярославль, Переславль-Залесский, Ростов Великий, Сергиев Посад, Кострому и Иваново — эти города посетил во время поездки Бычков.", "cat": "GEN", "hint": "«Эти города» обобщает перечисленные названия городов."}, {"n": 6, "text": "По итогам командировки в газете «Советская культура» журналист Ю. А. Бычков опубликовал не единственную статью о Суздале, как планировалось изначально, а серию очерков под общим названием «Золотое кольцо», где каждому из городов посвятил отдельный материал.", "cat": null, "hint": ""}, {"n": 7, "text": "В Москве он увидел, как блестят на солнце купола в Кремле, вспомнил очертания маршрута, по которому проехал, и о том, как блестела рожь вдоль дорог, — так и родилось сочетание «Золотое кольцо».", "cat": "BSP", "hint": "Присоединённая часть БСП «так и родилось ...»."}]}, {"id": "44219", "answer": [2, 5], "items": [{"n": 1, "text": "Южный Урал — этот самобытный край — называют голубым ожерельем России, так как ни один регион страны не может сравниться с Уралом по количеству озёр: их здесь более трёх тысяч.", "cat": "APP", "hint": "«Этот самобытный край» — приложение к «Южный Урал»."}, {"n": 2, "text": "Одно из самых живописных высокогорных озёр Урала — Зюраткуль, оно находится на высоте более 700 метров над уровнем моря.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "Увильды — самое крупное озеро Южного Урала.", "cat": "PRED", "hint": ""}, {"n": 7, "text": "Наличие многочисленных островов: Берёзового, Ольхового, Букового, Вязового, Елового — является одной из его особенностей.", "cat": "GEN", "hint": "После ряда названий островов продолжается основное предложение."}], "full": [{"n": 1, "text": "Южный Урал — этот самобытный край — называют голубым ожерельем России, так как ни один регион страны не может сравниться с Уралом по количеству озёр: их здесь более трёх тысяч.", "cat": "APP", "hint": "«Этот самобытный край» — приложение к «Южный Урал»."}, {"n": 2, "text": "Одно из самых живописных высокогорных озёр Урала — Зюраткуль, оно находится на высоте более 700 метров над уровнем моря.", "cat": "PRED", "hint": ""}, {"n": 3, "text": "Словно в колыбель, уложила озеро природа среди пяти высоких хребтов.", "cat": null, "hint": ""}, {"n": 4, "text": "Красота озера с древних времён манила к себе человека: здесь, на берегу и окружающих его хребтах, были стоянки первобытных людей.", "cat": null, "hint": ""}, {"n": 5, "text": "Увильды — самое крупное озеро Южного Урала.", "cat": "PRED", "hint": ""}, {"n": 6, "text": "По мнению учёных, озеро имеет тектоническое происхождение: оно образовалось много миллионов лет назад в разломе земной коры.", "cat": null, "hint": ""}, {"n": 7, "text": "Наличие многочисленных островов: Берёзового, Ольхового, Букового, Вязового, Елового — является одной из его особенностей.", "cat": "GEN", "hint": "После ряда названий островов продолжается основное предложение."}]}, {"id": "50140", "answer": [2, 3], "items": [{"n": 2, "text": "Особенно памятны мне встречи с тигроловами — людьми мужественной и романтической профессии, которая встречается только на Дальнем Востоке.", "cat": "APP", "hint": "«Людьми мужественной ... профессии» поясняет слово «тигроловами»."}, {"n": 3, "text": "Довелось и мне принимать участие в ловле тигров — великолепных царственных зверей.", "cat": "APP", "hint": "«Великолепных царственных зверей» поясняет слово «тигров»."}, {"n": 6, "text": "Наш дальневосточный, реликтовый, длинношерстный тигр — редкое, драгоценное животное.", "cat": "PRED", "hint": ""}, {"n": 11, "text": "Не было злобы и трусости — недоумение и гордое сознание своей силы светилось в них.", "cat": "BSP", "hint": "Между основами «не было злобы» и «недоумение ... светилось»."}], "full": [{"n": 1, "text": "Много мне пришлось бродить по лесным тропам Сихотэ-Алиня: то с целью изучения запасов диких животных и их образа жизни, то с задачей расселения новых ценных зверей.", "cat": null, "hint": ""}, {"n": 2, "text": "Особенно памятны мне встречи с тигроловами — людьми мужественной и романтической профессии, которая встречается только на Дальнем Востоке.", "cat": "APP", "hint": "«Людьми мужественной ... профессии» поясняет слово «тигроловами»."}, {"n": 3, "text": "Довелось и мне принимать участие в ловле тигров — великолепных царственных зверей.", "cat": "APP", "hint": "«Великолепных царственных зверей» поясняет слово «тигров»."}, {"n": 4, "text": "В литературу тигр вошел как лютый, кровожадный зверь-людоед.", "cat": null, "hint": ""}, {"n": 5, "text": "Согласиться с такой оценкой животного я не могу.", "cat": null, "hint": ""}, {"n": 6, "text": "Наш дальневосточный, реликтовый, длинношерстный тигр — редкое, драгоценное животное.", "cat": "PRED", "hint": ""}, {"n": 7, "text": "Он не агрессивен и даже полезен в борьбе с волчьей опасностью.", "cat": null, "hint": ""}, {"n": 8, "text": "Являясь живым памятником былого великолепия древних кедрово-широколиственных лесов, он заслуживает охраны и дальнейшего изучения.", "cat": null, "hint": ""}, {"n": 9, "text": "Леса Дальнего Востока потускнели бы, исчезни в них тигр!", "cat": null, "hint": ""}, {"n": 10, "text": "Никакое впечатление, полученное на охоте, не может сравниться с тем, что я испытывал, когда связывал лапы молодой тигрицы, пойманной на Сихотэ-Алине. Большими золотистыми глазами смотрела она на меня.", "cat": null, "hint": ""}, {"n": 11, "text": "Не было злобы и трусости — недоумение и гордое сознание своей силы светилось в них.", "cat": "BSP", "hint": "Между основами «не было злобы» и «недоумение ... светилось»."}]}, {"id": "50629", "answer": [1, 2], "items": [{"n": 1, "text": "Москва — это прекрасные виды, открывающиеся с высоких холмов, знаменитые особняки, дворики с древними церквями.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "И конечно, самая главная достопримечательность столицы — Кремль!", "cat": "PRED", "hint": ""}, {"n": 3, "text": "Нет ни одного русского пейзажиста, который хотя бы раз не написал Кремль — самый знаменитый архитектурный ансамбль столицы.", "cat": "APP", "hint": "«Самый знаменитый архитектурный ансамбль столицы» поясняет слово «Кремль»."}, {"n": 5, "text": "На одной из картин А. М. Васнецова древний Кремль со старыми башнями из белого камня — сегодня все стены и башни Кремля из красного кирпича.", "cat": "BSP", "hint": "В БСП противопоставлены древние белые стены и современные красные."}, {"n": 6, "text": "В пейзаже И. К. Айвазовского «Вид на Москву с Воробьёвых гор» на первом плане — извивающаяся лента Москвы-реки.", "cat": "ELL", "hint": "Пропущено «находится»: «на первом плане — ... лента»."}], "full": [{"n": 1, "text": "Москва — это прекрасные виды, открывающиеся с высоких холмов, знаменитые особняки, дворики с древними церквями.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "И конечно, самая главная достопримечательность столицы — Кремль!", "cat": "PRED", "hint": ""}, {"n": 3, "text": "Нет ни одного русского пейзажиста, который хотя бы раз не написал Кремль — самый знаменитый архитектурный ансамбль столицы.", "cat": "APP", "hint": "«Самый знаменитый архитектурный ансамбль столицы» поясняет слово «Кремль»."}, {"n": 4, "text": "Рассматривая виды Москвы, можно проследить изменения города со временем.", "cat": null, "hint": ""}, {"n": 5, "text": "На одной из картин А. М. Васнецова древний Кремль со старыми башнями из белого камня — сегодня все стены и башни Кремля из красного кирпича.", "cat": "BSP", "hint": "В БСП противопоставлены древние белые стены и современные красные."}, {"n": 6, "text": "В пейзаже И. К. Айвазовского «Вид на Москву с Воробьёвых гор» на первом плане — извивающаяся лента Москвы-реки.", "cat": "ELL", "hint": "Пропущено «находится»: «на первом плане — ... лента»."}, {"n": 7, "text": "По её берегам тянутся луга, рощи, растут сосны.", "cat": null, "hint": ""}, {"n": 8, "text": "А сегодня здесь громадный стадион «Лужники», высотные дома, проспекты.", "cat": null, "hint": ""}]}, {"id": "50683", "answer": [2, 5, 6, 7], "items": [{"n": 2, "text": "В 1830 году усадьбу Борок приобрёл молодой Алексей Петрович Щепочкин — дворянин по происхождению.", "cat": "APP", "hint": "«Дворянина по происхождению» — приложение к имени Щепочкин."}, {"n": 4, "text": "Николай Александрович Морозов — последний хозяин усадьбы.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "В 1923 году усадьба Борок по личному распоряжению В. И. Ленина была передана в пожизненное владение Н. А. Морозову — учёному, поэту и революционеру.", "cat": "APP", "hint": "«Учёному, поэту и революционеру» — приложение к Н. А. Морозову."}, {"n": 6, "text": "Но Николай Александрович подарил её Академии наук СССР для создания здесь научного учреждения — биологической станции.", "cat": "APP", "hint": "«Биологической станции» поясняет выражение «научного учреждения»."}, {"n": 7, "text": "Сегодня Борок — крупный научный центр России — известен во всём мире.", "cat": "APP", "hint": "«Крупный научный центр» — приложение к слову «Борок»."}], "full": [{"n": 1, "text": "В Некоузском районе Ярославской области сохранилась известная дворянская усадьба Борок.", "cat": null, "hint": ""}, {"n": 2, "text": "В 1830 году усадьбу Борок приобрёл молодой Алексей Петрович Щепочкин — дворянин по происхождению.", "cat": "APP", "hint": "«Дворянина по происхождению» — приложение к имени Щепочкин."}, {"n": 3, "text": "Он был рачительным хозяином: закончил строительство барского дома, примерно в версте от усадьбы поставил красивые резные ворота, от которых до самого дома шла густая липовая аллея.", "cat": null, "hint": ""}, {"n": 4, "text": "Николай Александрович Морозов — последний хозяин усадьбы.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "В 1923 году усадьба Борок по личному распоряжению В. И. Ленина была передана в пожизненное владение Н. А. Морозову — учёному, поэту и революционеру.", "cat": "APP", "hint": "«Учёному, поэту и революционеру» — приложение к Н. А. Морозову."}, {"n": 6, "text": "Но Николай Александрович подарил её Академии наук СССР для создания здесь научного учреждения — биологической станции.", "cat": "APP", "hint": "«Биологической станции» поясняет выражение «научного учреждения»."}, {"n": 7, "text": "Сегодня Борок — крупный научный центр России — известен во всём мире.", "cat": "APP", "hint": "«Крупный научный центр» — приложение к слову «Борок»."}]}, {"id": "50684", "answer": [1, 3, 6], "items": [{"n": 1, "text": "Имение Грешнево — место детства поэта Н. А. Некрасова — стояло у дороги, по которой проходил самый разный народ.", "cat": "APP", "hint": "«Место детства поэта» поясняет название имения Грешнево."}, {"n": 2, "text": "«Под наши густые, старинные вязы на отдых тянуло усталых людей», — так спустя много лет напишет в стихотворении «Крестьянские дети» Николай Алексеевич.", "cat": "DIRECT", "hint": ""}, {"n": 3, "text": "Недалеко от усадьбы протекала Волга — великая русская река.", "cat": "APP", "hint": "«Великая русская река» — приложение к слову «Волга»."}, {"n": 4, "text": "Привольно течёт Волга в низких берегах; кругом — неоглядные просторы лугов, полей, вдалеке виднеются поля.", "cat": "ELL", "hint": "Пропущено «находятся»: «кругом — просторы лугов»."}, {"n": 6, "text": "Именно на Волге мальчик встретил измученных бурлаков — людей, тянущих при помощи бечевы речное судно против течения.", "cat": "APP", "hint": "«Людей, тянущих...» поясняет слово «бурлаков»."}], "full": [{"n": 1, "text": "Имение Грешнево — место детства поэта Н. А. Некрасова — стояло у дороги, по которой проходил самый разный народ.", "cat": "APP", "hint": "«Место детства поэта» поясняет название имения Грешнево."}, {"n": 2, "text": "«Под наши густые, старинные вязы на отдых тянуло усталых людей», — так спустя много лет напишет в стихотворении «Крестьянские дети» Николай Алексеевич.", "cat": "DIRECT", "hint": ""}, {"n": 3, "text": "Недалеко от усадьбы протекала Волга — великая русская река.", "cat": "APP", "hint": "«Великая русская река» — приложение к слову «Волга»."}, {"n": 4, "text": "Привольно течёт Волга в низких берегах; кругом — неоглядные просторы лугов, полей, вдалеке виднеются поля.", "cat": "ELL", "hint": "Пропущено «находятся»: «кругом — просторы лугов»."}, {"n": 5, "text": "Но не только чудесные картины природы видел здесь будущий поэт.", "cat": null, "hint": ""}, {"n": 6, "text": "Именно на Волге мальчик встретил измученных бурлаков — людей, тянущих при помощи бечевы речное судно против течения.", "cat": "APP", "hint": "«Людей, тянущих...» поясняет слово «бурлаков»."}, {"n": 7, "text": "Недаром в одном из стихотворений Некрасов назвал Волгу «рекою рабства и тоски».", "cat": null, "hint": ""}]}, {"id": "50703", "answer": [1, 2], "items": [{"n": 1, "text": "За горой Таганай, между сопками, расположен главный город Южного Урала — Златоуст.", "cat": "APP", "hint": "«Златоуст» — приложение к словосочетанию «главный город Южного Урала»."}, {"n": 2, "text": "От поколения к поколению передаётся здесь вековой опыт златоустовских мастеров — создателей уникальной булатной стали.", "cat": "APP", "hint": "«Создателей уникальной булатной стали» — приложение к слову «мастеров»."}, {"n": 3, "text": "Выйдешь на Александровскую сопку и поглядишь вниз — вот что представится тебе.", "cat": "BSP", "hint": "Вторая часть БСП раскрывает, что увидишь: «вот что представится тебе»."}, {"n": 5, "text": "А далее — плотина, мост, музейная доменная печь и сизый дым металлургических заводов.", "cat": "ELL", "hint": "После «А далее» пропущено «расположены/видны»: перечислены плотина, мост..."}], "full": [{"n": 1, "text": "За горой Таганай, между сопками, расположен главный город Южного Урала — Златоуст.", "cat": "APP", "hint": "«Златоуст» — приложение к словосочетанию «главный город Южного Урала»."}, {"n": 2, "text": "От поколения к поколению передаётся здесь вековой опыт златоустовских мастеров — создателей уникальной булатной стали.", "cat": "APP", "hint": "«Создателей уникальной булатной стали» — приложение к слову «мастеров»."}, {"n": 3, "text": "Выйдешь на Александровскую сопку и поглядишь вниз — вот что представится тебе.", "cat": "BSP", "hint": "Вторая часть БСП раскрывает, что увидишь: «вот что представится тебе»."}, {"n": 4, "text": "Речушка, называемая рекой Ай, образует пруд.", "cat": null, "hint": ""}, {"n": 5, "text": "А далее — плотина, мост, музейная доменная печь и сизый дым металлургических заводов.", "cat": "ELL", "hint": "После «А далее» пропущено «расположены/видны»: перечислены плотина, мост..."}, {"n": 6, "text": "Полыхает там густое красное пламя, и долетает оттуда гул адовой работы доменных и мартеновских печей.", "cat": null, "hint": ""}, {"n": 7, "text": "А вокруг, близко к заводам, расположились кровли домов.", "cat": null, "hint": ""}]}, {"id": "50707", "answer": [4, 6], "items": [{"n": 2, "text": "Тем не менее, путешествуя по долине реки, можно без труда уловить общую тенденцию: на юге — холоднее и суше, на севере — теплее и дождливее.", "cat": "ELL", "hint": "Пропущено «бывает»: «на юге — холоднее, на севере — теплее»."}, {"n": 4, "text": "Например, в селе Малый Яломан в устье одноимённой реки растут яблоневые сады — в соседнем посёлке Иня порой гибнет даже картошка.", "cat": "BSP", "hint": "Противопоставление: «растут сады — ... гибнет картошка»."}, {"n": 6, "text": "По речной долине часто гуляют ветры, зимой бывают бураны, переметающие дороги, — в окрестных горных хребтах зимы спокойные и снежные.", "cat": "BSP", "hint": "Противопоставление: «ветры/бураны — зимы спокойные»."}], "full": [{"n": 1, "text": "Устремляясь по Алтаю, река Катунь пересекает территории с различными климатическими условиями.", "cat": null, "hint": ""}, {"n": 2, "text": "Тем не менее, путешествуя по долине реки, можно без труда уловить общую тенденцию: на юге — холоднее и суше, на севере — теплее и дождливее.", "cat": "ELL", "hint": "Пропущено «бывает»: «на юге — холоднее, на севере — теплее»."}, {"n": 3, "text": "Есть на Катуни «оазисы» с особым микроклиматом.", "cat": null, "hint": ""}, {"n": 4, "text": "Например, в селе Малый Яломан в устье одноимённой реки растут яблоневые сады — в соседнем посёлке Иня порой гибнет даже картошка.", "cat": "BSP", "hint": "Противопоставление: «растут сады — ... гибнет картошка»."}, {"n": 5, "text": "Мягкая зима и солнечное лето без изнуряющей жары характерны для окрестностей посёлка Чемал, эти особенности обусловлены частой повторяемостью тёплых и сухих ветров-фенов.", "cat": null, "hint": ""}, {"n": 6, "text": "По речной долине часто гуляют ветры, зимой бывают бураны, переметающие дороги, — в окрестных горных хребтах зимы спокойные и снежные.", "cat": "BSP", "hint": "Противопоставление: «ветры/бураны — зимы спокойные»."}, {"n": 7, "text": "Ярко выражен здесь контраст дневных и ночных температур.", "cat": null, "hint": ""}, {"n": 8, "text": "Солнце скрывается за горами, и температура воздуха резко падает, от реки ощутимо тянет холодом.", "cat": null, "hint": ""}, {"n": 9, "text": "Туристы шутят, что для путешествия по Катуни нужно иметь только две формы одежды: купальник и куртку-пуховик.", "cat": null, "hint": ""}]}, {"id": "50708", "answer": [4, 6], "items": [{"n": 2, "text": "Маршрут был такой: Москва — Сергиев Посад — Переславль-Залесский — Ростов — Ярославль — Кострома — Иваново — Суздаль — Владимир — Москва.", "cat": "ROUTE", "hint": "Тире используются в списке остановок маршрута."}, {"n": 3, "text": "Общая протяжённость маршрута — пятьсот сорок километров.", "cat": "PRED", "hint": ""}, {"n": 4, "text": "Советские люди считали за честь совершить путешествие по страницам истории Древней Руси — по Золотому кольцу.", "cat": "CLARIFY", "hint": "«По Золотому кольцу» уточняет словосочетание «по страницам истории Древней Руси»."}, {"n": 5, "text": "В 90-х годах наблюдался заметный спад внутреннего туризма — на общем фоне снизилась посещаемость и городов Золотого кольца.", "cat": "BSP", "hint": "Часть после тире сообщает следствие / поясняет спад туризма."}, {"n": 6, "text": "Но постепенно ситуация менялась в лучшую сторону, и на сегодняшний день маршрут «Золотое кольцо России» — один из развитых туристических маршрутов — вновь пользуется заслуженной популярностью.", "cat": "CLARIFY", "hint": "«Один из развитых туристических маршрутов» — приложение к «маршрут»."}], "full": [{"n": 1, "text": "В 1974 году вышел первый путеводитель по Золотому кольцу России.", "cat": null, "hint": ""}, {"n": 2, "text": "Маршрут был такой: Москва — Сергиев Посад — Переславль-Залесский — Ростов — Ярославль — Кострома — Иваново — Суздаль — Владимир — Москва.", "cat": "ROUTE", "hint": "Тире используются в списке остановок маршрута."}, {"n": 3, "text": "Общая протяжённость маршрута — пятьсот сорок километров.", "cat": "PRED", "hint": ""}, {"n": 4, "text": "Советские люди считали за честь совершить путешествие по страницам истории Древней Руси — по Золотому кольцу.", "cat": "CLARIFY", "hint": "«По Золотому кольцу» уточняет словосочетание «по страницам истории Древней Руси»."}, {"n": 5, "text": "В 90-х годах наблюдался заметный спад внутреннего туризма — на общем фоне снизилась посещаемость и городов Золотого кольца.", "cat": "BSP", "hint": "Часть после тире сообщает следствие / поясняет спад туризма."}, {"n": 6, "text": "Но постепенно ситуация менялась в лучшую сторону, и на сегодняшний день маршрут «Золотое кольцо России» — один из развитых туристических маршрутов — вновь пользуется заслуженной популярностью.", "cat": "CLARIFY", "hint": "«Один из развитых туристических маршрутов» — приложение к «маршрут»."}]}, {"id": "14083", "answer": [3, 4], "items": [{"n": 3, "text": "Некоторые кактусы густо покрыты желтыми и красноватыми колючками — такие растения напоминают птиц и зверей.", "cat": "BSP", "hint": "Две основы: «кактусы покрыты» и «растения напоминают»."}, {"n": 4, "text": "Иногда можно увидеть кактус с длинными свисающими волосами — он похож на голову старика.", "cat": "BSP", "hint": "Две основы: «можно увидеть кактус» и «он похож»."}, {"n": 5, "text": "Цветок кактуса — один из самых красивых в мире.", "cat": "PRED", "hint": ""}, {"n": 7, "text": "Размером цветок с большую тарелку — до двадцати пяти сантиметров в диаметре.", "cat": "CLARIFY", "hint": "«До двадцати пяти сантиметров» — уточнение размера после паузы."}], "full": [{"n": 1, "text": "На гербах разных стран нередко изображаются растения: на гербе Канады привычным стал кленовый лист, а на государственном гербе Мексики изображён кактус.", "cat": null, "hint": ""}, {"n": 2, "text": "Это неслучайно, ведь на Мексиканском плоскогорье, возвышающемся над уровнем моря до 2500 метров, находится настоящая страна кактусов.", "cat": null, "hint": ""}, {"n": 3, "text": "Некоторые кактусы густо покрыты желтыми и красноватыми колючками — такие растения напоминают птиц и зверей.", "cat": "BSP", "hint": "Две основы: «кактусы покрыты» и «растения напоминают»."}, {"n": 4, "text": "Иногда можно увидеть кактус с длинными свисающими волосами — он похож на голову старика.", "cat": "BSP", "hint": "Две основы: «можно увидеть кактус» и «он похож»."}, {"n": 5, "text": "Цветок кактуса — один из самых красивых в мире.", "cat": "PRED", "hint": ""}, {"n": 6, "text": "Среди ночной темноты раскрывается большая бело-голубая звезда.", "cat": null, "hint": ""}, {"n": 7, "text": "Размером цветок с большую тарелку − до двадцати пяти сантиметров в диаметре.", "cat": "CLARIFY", "hint": "«До двадцати пяти сантиметров» — уточнение размера после паузы."}]}, {"id": "14084", "answer": [2, 5, 7], "items": [{"n": 2, "text": "Для ребёнка дом — это прежде всего мама, папа, бабушка, дедушка.", "cat": "PRED", "hint": ""}, {"n": 4, "text": "« Будьте, как дома», — говорим мы.", "cat": "DIRECT", "hint": ""}, {"n": 5, "text": "А народная мудрость гласит: «Дом вести — не лапти плести».", "cat": "PRED", "hint": "Два неопределённых вида действия: «дом вести — не лапти плести»."}, {"n": 7, "text": "Дом — крепость, защита, обитель семьи, и доступ туда имеет только тот, кому позволяют его обитатели.", "cat": "PRED", "hint": ""}], "full": [{"n": 1, "text": "Для любого человека нет ничего понятнее и ближе, чем слово «дом».", "cat": null, "hint": ""}, {"n": 2, "text": "Для ребёнка дом — это прежде всего мама, папа, бабушка, дедушка.", "cat": "PRED", "hint": ""}, {"n": 3, "text": "Для взрослого домом является его семья.", "cat": null, "hint": ""}, {"n": 4, "text": "« Будьте, как дома», — говорим мы.", "cat": "DIRECT", "hint": ""}, {"n": 5, "text": "А народная мудрость гласит: «Дом вести — не лапти плести».", "cat": "PRED", "hint": "Два неопределённых вида действия: «дом вести — не лапти плести»."}, {"n": 6, "text": "И всегда, произнося слово «дом», мы имеем в виду не фундамент, стены и кровлю, а всё человеческое, что помещается в этих стенах.", "cat": null, "hint": ""}, {"n": 7, "text": "Дом — крепость, защита, обитель семьи, и доступ туда имеет только тот, кому позволяют его обитатели.", "cat": "PRED", "hint": ""}]}, {"id": "14085", "answer": [2, 3], "items": [{"n": 2, "text": "Так вырастает его лицейская лирика — первые опыты растущего гения, как бы расправляющего свои крылья для широкого полёта.", "cat": "APP", "hint": "«Первые опыты растущего гения» поясняют выражение «лицейская лирика»."}, {"n": 3, "text": "Так создаётся ранний раздел его творчества — юношеская поэзия Пушкина, исполненная непередаваемой свежести чувств, увлекательности мысли и животрепещущей взволнованности слова.", "cat": "APP", "hint": "«Юношеская поэзия Пушкина» поясняет «ранний раздел творчества»."}, {"n": 5, "text": "Отдельные листики, рукописные сборники, альбомы, тетради — всё это доносит до нас его первые творческие помыслы.", "cat": "GEN", "hint": "«Всё это» обобщает перечень рукописей и тетрадей."}, {"n": 6, "text": "Эти дружеские антологии, альбомы и тетради «лицейских трубадуров» — широкая картина необычайного роста поэта.", "cat": "PRED", "hint": ""}], "full": [{"n": 1, "text": "С первых месяцев пребывания в лицее Пушкин начинает записывать свои впечатления и замыслы звучными русскими стихами.", "cat": null, "hint": ""}, {"n": 2, "text": "Так вырастает его лицейская лирика — первые опыты растущего гения, как бы расправляющего свои крылья для широкого полёта.", "cat": "APP", "hint": "«Первые опыты растущего гения» поясняют выражение «лицейская лирика»."}, {"n": 3, "text": "Так создаётся ранний раздел его творчества — юношеская поэзия Пушкина, исполненная непередаваемой свежести чувств, увлекательности мысли и животрепещущей взволнованности слова.", "cat": "APP", "hint": "«Юношеская поэзия Пушкина» поясняет «ранний раздел творчества»."}, {"n": 4, "text": "Сохранились пожелтевшие страницы с отроческими стихотворениями Пушкина.", "cat": null, "hint": ""}, {"n": 5, "text": "Отдельные листики, рукописные сборники, альбомы, тетради — всё это доносит до нас его первые творческие помыслы.", "cat": "GEN", "hint": "«Всё это» обобщает перечень рукописей и тетрадей."}, {"n": 6, "text": "Эти дружеские антологии, альбомы и тетради «лицейских трубадуров» − широкая картина необычайного роста поэта.", "cat": "PRED", "hint": ""}, {"n": 7, "text": "За несколько лет он гигантским шагом прошёл все подготовительные фазы поэтического развития и достиг всеобщего признания.", "cat": null, "hint": ""}]}, {"id": "14100", "answer": [1, 5], "items": [{"n": 1, "text": "Белая лошадь с развевающейся гривой, прискакавшая к нам из незапамятных времён, — символ удачи и надежды.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Когда-то древнегреческий герой, победив жестокого царя в гонке на колеснице, в благодарность богам основал Олимпийские игры — традиция эта живёт сотни веков.", "cat": "BSP", "hint": "Вторая часть сообщает следствие / поясняет: «традиция эта живёт...»."}, {"n": 5, "text": "А рождение белого жеребёнка — событие крайней редкости.", "cat": "PRED", "hint": ""}, {"n": 7, "text": "Может, поэтому наивный ребёнок и умудрённый опытом старик, молодая девушка и бесстрашный воин — все замирают при виде белогривой лошади.", "cat": "GEN", "hint": "«Все» — обобщающее слово после перечня людей."}], "full": [{"n": 1, "text": "Белая лошадь с развевающейся гривой, прискакавшая к нам из незапамятных времён, — символ удачи и надежды.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Когда-то древнегреческий герой, победив жестокого царя в гонке на колеснице, в благодарность богам основал Олимпийские игры — традиция эта живёт сотни веков.", "cat": "BSP", "hint": "Вторая часть сообщает следствие / поясняет: «традиция эта живёт...»."}, {"n": 3, "text": "Одним из самых популярных сюжетов русской иконы был всадник на белом коне.", "cat": null, "hint": ""}, {"n": 4, "text": "Говорят, что белых лошадей в природе не существует.", "cat": null, "hint": ""}, {"n": 5, "text": "А рождение белого жеребёнка — событие крайней редкости.", "cat": "PRED", "hint": ""}, {"n": 6, "text": "Может, поэтому люди верят, что встретившаяся им на пути редкая белая лошадь принесёт им редкую удачу.", "cat": null, "hint": ""}, {"n": 7, "text": "Может, поэтому наивный ребёнок и умудрённый опытом старик, молодая девушка и бесстрашный воин — все замирают при виде белогривой лошади.", "cat": "GEN", "hint": "«Все» — обобщающее слово после перечня людей."}]}, {"id": "14101", "answer": [2, 4], "items": [{"n": 1, "text": "«Почему, — спрашивал директор школы Сухомлинский, — дети приходят в школу с огромным желанием учиться, а через несколько ле
