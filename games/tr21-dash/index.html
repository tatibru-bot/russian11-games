т этот огонёк постепенно угасает?»", "cat": "DIRECT", "hint": ""}, {"n": 2, "text": "Сухомлинский начинает титанический труд — он ищет ответ на поставленный вопрос.", "cat": "BSP", "hint": "Две основы: «Сухомлинский начинает труд» и «он ищет»."}, {"n": 4, "text": "Вчера не понимал — сегодня понял, вчера не умел — сегодня научился.", "cat": "BSP", "hint": "Два парных противопоставления, каждая пара — части БСП."}], "full": [{"n": 1, "text": "«Почему, — спрашивал директор школы Сухомлинский, — дети приходят в школу с огромным желанием учиться, а через несколько лет этот огонёк постепенно угасает?»", "cat": "DIRECT", "hint": ""}, {"n": 2, "text": "Сухомлинский начинает титанический труд — он ищет ответ на поставленный вопрос.", "cat": "BSP", "hint": "Две основы: «Сухомлинский начинает труд» и «он ищет»."}, {"n": 3, "text": "Секрет интереса к учёбе оказался прост: должен быть успех, достижение, ощущение роста.", "cat": null, "hint": ""}, {"n": 4, "text": "Вчера не понимал — сегодня понял, вчера не умел — сегодня научился.", "cat": "BSP", "hint": "Два парных противопоставления, каждая пара — части БСП."}, {"n": 5, "text": "Ученик не станок.", "cat": null, "hint": ""}, {"n": 6, "text": "Ученик вечно в развитии, он растёт и развивается, и надо прежде всего заботиться о его развитии.", "cat": null, "hint": ""}]}, {"id": "14112", "answer": [2, 4], "items": [{"n": 1, "text": "Наука о камнях — интересная наука.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Прошло больше пятидесяти лет с тех пор, как я начал увлекаться минералогией — наукой о камнях.", "cat": "APP", "hint": "«Наукой о камнях» — приложение к слову «минералогией»."}, {"n": 4, "text": "Недалеко от дома на каменной горушке мы — весёлая детвора — целые дни ползали по скалам, спускались к медленно текущей речушке.", "cat": "APP", "hint": "«Весёлая детвора» — приложение к местоимению «мы»."}], "full": [{"n": 1, "text": "Наука о камнях — интересная наука.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Прошло больше пятидесяти лет с тех пор, как я начал увлекаться минералогией — наукой о камнях.", "cat": "APP", "hint": "«Наукой о камнях» — приложение к слову «минералогией»."}, {"n": 3, "text": "Мне вспоминаются первые детские переживания, связанные со сбором камней.", "cat": null, "hint": ""}, {"n": 4, "text": "Недалеко от дома на каменной горушке мы – весёлая детвора – целые дни ползали по скалам, спускались к медленно текущей речушке.", "cat": "APP", "hint": "«Весёлая детвора» — приложение к местоимению «мы»."}, {"n": 5, "text": "Однажды нам удалось добыть пирамидки-кристаллики горного хрусталя, прозрачные, как стекло.", "cat": null, "hint": ""}, {"n": 6, "text": "В нашем воображении где-то в глубине, за неведомыми дверями, рисовались подземные пещеры со сверкающими кристаллами самоцветов.", "cat": null, "hint": ""}, {"n": 7, "text": "Мой дядя, учёный-химик, водил нас в лабораторию.", "cat": null, "hint": ""}]}, {"id": "14116", "answer": [1, 7], "items": [{"n": 1, "text": "Бег — самый древний вид лёгкой атлетики.", "cat": "PRED", "hint": ""}, {"n": 3, "text": "На приволье: в поле, в лесу или парке на беговой дорожке стадиона — начинается путь будущих чемпионов и рекордсменов.", "cat": "GEN", "hint": "Тире закрывает перечисление мест: «в поле, в лесу или парке...»."}, {"n": 4, "text": "«Внимание!» — негромко произносит стартер на прямой, как стрела, беговой дорожке.", "cat": "DIRECT", "hint": ""}, {"n": 5, "text": "Вот-вот раздастся выстрел и бегун устремится вперёд — бег надо начать сразу же после выстрела.", "cat": "BSP", "hint": "БСП: выстрел прозвучит — бег надо начать сразу же."}, {"n": 7, "text": "Но это «почти» — десятая доля секунды, от которой зависит победа или рекорд.", "cat": "PRED", "hint": ""}], "full": [{"n": 1, "text": "Бег — самый древний вид лёгкой атлетики.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "На Олимпийском стадионе в древней Элладе первыми выходили на арену бегуны, начинающие легкоатлетические состязания.", "cat": null, "hint": ""}, {"n": 3, "text": "На приволье: в поле, в лесу или парке на беговой дорожке стадиона — начинается путь будущих чемпионов и рекордсменов.", "cat": "GEN", "hint": "Тире закрывает перечисление мест: «в поле, в лесу или парке...»."}, {"n": 4, "text": "«Внимание!» — негромко произносит стартер на прямой, как стрела, беговой дорожке.", "cat": "DIRECT", "hint": ""}, {"n": 5, "text": "Вот-вот раздастся выстрел и бегун устремится вперёд — бег надо начать сразу же после выстрела.", "cat": "BSP", "hint": "БСП: выстрел прозвучит — бег надо начать сразу же."}, {"n": 6, "text": "Некоторые спортсмены могут начать бег почти мгновенно.", "cat": null, "hint": ""}, {"n": 7, "text": "Но это «почти» — десятая доля секунды, от которой зависит победа или рекорд.", "cat": "PRED", "hint": ""}]}, {"id": "14117", "answer": [1, 6], "items": [{"n": 1, "text": "Ростов Великий — самый древний город в Северо-Восточной Руси.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "В XIX в. Ростовская ярмарка была третьей в России по объемам торговли — после Нижегородской и Ирбитской.", "cat": "CLARIFY", "hint": "«После Нижегородской и Ирбитской» — присоединительное уточнение: каких именно ярмарок."}, {"n": 6, "text": "Современный Ростов Великий — это уникальный историко-архитектурный заповедник, удивительный город, существующий уже более одиннадцати столетий.", "cat": "PRED", "hint": ""}], "full": [{"n": 1, "text": "Ростов Великий — самый древний город в Северо-Восточной Руси.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Только два города Древней Руси были удостоены почетного звания «Великий»: Новгород и Ростов Ярославский (Ростов Великий).", "cat": null, "hint": ""}, {"n": 3, "text": "При князе Юрии Долгоруком Ростово-Суздальское княжество прекратило платить дань Киеву, стало одним из сильнейших в Европе, именно тогда Ростов и получил название Великого.", "cat": null, "hint": ""}, {"n": 4, "text": "С XVIII в. Ростов стал крупным торгово-ярмарочным центром.", "cat": null, "hint": ""}, {"n": 5, "text": "В XIX в. Ростовская ярмарка была третьей в России по объемам торговли — после Нижегородской и Ирбитской.", "cat": "CLARIFY", "hint": "«После Нижегородской и Ирбитской» — присоединительное уточнение: каких именно ярмарок."}, {"n": 6, "text": "Современный Ростов Великий — это уникальный историко-архитектурный заповедник, удивительный город, существующий уже более одиннадцати столетий.", "cat": "PRED", "hint": ""}, {"n": 7, "text": "Архитектурные памятники Ростова Великого продолжают свою жизнь в современном городе.", "cat": null, "hint": ""}, {"n": 8, "text": "Они как молчаливые свидетели прошлого и настоящего, и ростовцы бережно и трепетно заботятся об их сохранении.", "cat": null, "hint": ""}]}, {"id": "42235", "answer": [3, 6], "items": [{"n": 1, "text": "Одно из уникальных мест Кабардино-Балкарии — Чегемское ущелье.", "cat": "PRED", "hint": ""}, {"n": 3, "text": "В месте, где ущелье пронзает Скалистый хребет, образовалась теснина — наиболее узкая его часть.", "cat": "APP", "hint": "«Наиболее узкая его часть» объясняет слово «теснина»."}, {"n": 6, "text": "На горе возвышаются башни древнего поселения, а в конце ущелья открывается вид на самую живописную гору Главного Кавказского хребта высотой 4611 м — Тихтенген, западнее которой на уровне 3780 м проходит высокогорный перевал Твибер.", "cat": "APP", "hint": "«Тихтенген» поясняет, о какой горе идёт речь."}, {"n": 7, "text": "Здесь путь туристов-любителей заканчивается: дорогу перекрывает мощный ледник — передвижение по нему разрешено только для альпинистов.", "cat": "BSP", "hint": "Две основы: «ледник перекрывает» и «передвижение разрешено»."}], "full": [{"n": 1, "text": "Одно из уникальных мест Кабардино-Балкарии — Чегемское ущелье.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Оно тянется вдоль реки Чегем, рассекая несколько горных хребтов: Скалистый, Лесистый, Боковой и Пастбищный.", "cat": null, "hint": ""}, {"n": 3, "text": "В месте, где ущелье пронзает Скалистый хребет, образовалась теснина — наиболее узкая его часть.", " сных мест на Дальнем Востоке.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Хребту более 250 миллионов лет, и это самый большой скальный массив на юге Приморья, известный к тому же огромным количеством пещер.", "cat": null, "hint": ""}, {"n": 3, "text": "Самой глубокой является пещера Соляник — государственный памятник природы Приморья.", "cat": "APP", "hint": "«Государственный памятник природы» поясняет наименование пещеры."}, {"n": 4, "text": "Её глубина составляет 125 метров, а протяжённость равняется 425 метрам.", "cat": null, "hint": ""}, {"n": 5, "text": "Помимо подземных полостей, Чандолаз поражает своей необычной флорой; например, осенью произрастающие на склонах дубы с необычно большими листьями окрашиваются в алый цвет.", "cat": null, "hint": ""}, {"n": 6, "text": "Дикий виноград, лимонник, малина — эти и многие другие растения покрывают склоны Чандолаза.", "cat": "GEN", "hint": "«Эти и многие другие растения» обобщает перечисление."}, {"n": 7, "text": "С вершины хребта стремительно бежит Серебряный ключ, славящийся своей целебной водой, — местные жители ходят сюда лечиться.", "cat": "BSP", "hint": "По смыслу после первой части следует сообщение о действиях людей."}, {"n": 8, "text": "Для путешествий хребет удобен тем, что он относительно невысокий и все достопримечательности располагаются компактно.", "cat": null, "hint": ""}, {"n": 9, "text": "Лучшие месяцы для посещения Чандолаза — август и сентябрь.", "cat": "PRED", "hint": ""}]}, {"id": "42237", "answer": [1, 4, 8], "items": [{"n": 1, "text": "Жигулёвские горы — любимое место ценителей природы России.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Хотя эти уникальные места закрыты для посещения, желающих полюбоваться природными красотами не убывает — так притягательна прелесть здешних мест.", "cat": "BSP", "hint": "Вторая часть объясняет, почему желающих не убывает."}, {"n": 4, "text": "Жигулёвские горы — удивительно разнообразное по живописности место: известняковые скалы и утёсы, широкие зелёные долины на севере сменяются каменистой степью на юге.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "Заповедник раскинулся на полуострове, образованном знаменитой излучиной реки Волги — Самарской Лукой.", "cat": "APP", "hint": "«Самарской Лукой» поясняется название излучины реки."}, {"n": 8, "text": "Возраст растущих здесь сосен — двести пятьдесят лет!", "cat": "PRED", "hint": ""}], "full": [{"n": 1, "text": "Жигулёвские горы — любимое место ценителей природы России.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Хотя эти уникальные места закрыты для посещения, желающих полюбоваться природными красотами не убывает — так притягательна прелесть здешних мест.", "cat": "BSP", "hint": "Вторая часть объясняет, почему желающих не убывает."}, {"n": 3, "text": "Особые краски им добавляет осень, расцвечивая деревья всеми оттенками жёлтого, оранжевого, красного.", "cat": null, "hint": ""}, {"n": 4, "text": "Жигулёвские горы — удивительно разнообразное по живописности место: известняковые скалы и утёсы, широкие зелёные долины на севере сменяются каменистой степью на юге.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "Заповедник раскинулся на полуострове, образованном знаменитой излучиной реки Волги — Самарской Лукой.", "cat": "APP", "hint": "«Самарской Лукой» поясняется название излучины реки."}, {"n": 6, "text": "Официально его открыли в 1966 году, но отдельные участки стали заповедными ещё с 1927 года.", "cat": null, "hint": ""}, {"n": 7, "text": "Главной целью создания Жигулёвского заповедника была охрана реликтовых гор и редчайших лесов.", "cat": null, "hint": ""}, {"n": 8, "text": "Возраст растущих здесь сосен — двести пятьдесят лет!", "cat": "PRED", "hint": ""}]}, {"id": "42240", "answer": [2, 4, 8], "items": [{"n": 2, "text": "Предстающий таинственным в седых преданиях старины Фишт-Оштеновский массив — одно из самых впечатляющих мест на Кавказе.", "cat": "PRED", "hint": ""}, {"n": 4, "text": "И действительно, здесь дожди — частые гости.", "cat": "PRED", "hint": ""}, {"n": 6, "text": "Поэтому бывшее морское дно — Фишт-Оштенский горный массив с главными вершинами Оштен, Фишт и Пшехо-Су — часто образно именуют «коралловым островом».", "cat": "APP", "hint": "«Фишт-Оштенский горный массив...» — приложение к словосочетанию «бывшее морское дно»."}, {"n": 8, "text": "А гора Фишт — первая на западе Кавказского хребта, которая имеет на склонах ледники.", "cat": "PRED", "hint": ""}], "full": [{"n": 1, "text": "Адыгею прославила удивительная природа: прекрасные леса, бурные реки, величественные горные ландшафты.", "cat": null, "hint": ""}, {"n": 2, "text": "Предстающий таинственным в седых преданиях старины Фишт-Оштеновский массив — одно из самых впечатляющих мест на Кавказе.", "cat": "PRED", "hint": ""}, {"n": 3, "text": "На адыгейском языке «Оштен» означает «вечный снег», однако это слово можно перевести и как «вершина, собирающая дождь и град».", "cat": null, "hint": ""}, {"n": 4, "text": "И действительно, здесь дожди — частые гости.", "cat": "PRED", "hint": ""}, {"n": 5, "text": "В доисторическую эпоху на этом месте лежало дно моря, а то, что сейчас стало горами, было коралловыми рифами.", "cat": null, "hint": ""}, {"n": 6, "text": "Поэтому бывшее морское дно — Фишт-Оштенский горный массив с главными вершинами Оштен, Фишт и Пшехо-Су — часто образно именуют «коралловым островом».", "cat": "APP", "hint": "«Фишт-Оштенский горный массив...» — приложение к словосочетанию «бывшее морское дно»."}, {"n": 7, "text": "Этот вознесённый почти на 3-километровую высоту морской известняковый риф пронизан коралловыми ветвями.", "cat": null, "hint": ""}, {"n": 8, "text": "А гора Фишт — первая на западе Кавказского хребта, которая имеет на склонах ледники.", "cat": "PRED", "hint": ""}]}, {"id": "42242", "answer": [1, 9], "items": [{"n": 1, "text": "Моя родина — небольшой город Орловской губернии.", "cat": "PRED", "hint": ""}, {"n": 6, "text": "То, что я любил и чтил больше всего в жизни своей: благородную скромность и правду, высшую красоту и благородство целомудрия, — всё это мне было дано в восприятии родины.", "cat": "GEN", "hint": "«Всё это» обобщает ряд однородных членов."}, {"n": 9, "text": "Родина — это не только страна, где «впервые вкусили сладость бытия», родина — это нечто гораздо большее.", "cat": "PRED", "hint": ""}], "full": [{"n": 1, "text": "Моя родина — небольшой город Орловской губернии.", "cat": "PRED", "hint": ""}, {"n": 2, "text": "Мне кажется, я умер бы от изнеможения и блаженства, если бы сейчас увидел его в нагорье реки Сосны.", "cat": null, "hint": ""}, {"n": 3, "text": "Она не блещет никакими красотами.", "cat": null, "hint": ""}, {"n": 4, "text": "Однако она не лишена того, чего не лишена почти всякая земля в нашей средней России: красоты лета и зимы, весны и осени, закатов и восходов, рек и деревьев.", "cat": null, "hint": ""}, {"n": 5, "text": "Но всё это тихо, просто, скромно, незаметно и в неподвижности своей прекрасно.", "cat": null, "hint": ""}, {"n": 6, "text": "То, что я любил и чтил больше всего в жизни своей: благородную скромность и правду, высшую красоту и благородство целомудрия, — всё это мне было дано в восприятии родины.", "cat": "GEN", "hint": "«Всё это» обобщает ряд однородных членов."}, {"n": 7, "text": "Она задушевна, как русская песня, и, как она, исполнена поэзии музыки.", "cat": null, "hint": ""}, {"n": 8, "text": "Только её надо слышать самому, внутренним слухом, потому что она не потрясает, не гремит и не кричит, но тихим шёпотом нашёптывает свои небесные сны.", "cat": null, "hint": ""}, {"n": 9, "text": "Родина — это не только страна, где «впервые вкусили сладость бытия», родина — это нечто гораздо большее.", "cat": "PRED", "hint": ""}]}];
const RULES={"PRED":["Между подлежащим и сказуемым","Тире при пропущенной связке: оба главных члена — существительные, числительные или инфинитивы; возможны сочетания существительного с инфинитивом.","Книга — источник знания."],"APP":["При приложении","Тире отделяет поясняющее наименование предмета или лица: приложение, которое можно понимать как «а именно».","Рядом текла Волга — великая русская река."],"BSP":["В бессоюзном сложном","Тире разделяет части БСП при противопоставлении, условии, времени, следствии, сравнении или быстрой смене событий.","Я звал — он не откликнулся."],"ELL":["В неполном предложении","Тире ставится на месте пропущенного члена предложения, который легко восстановить из контекста.","Ирина приехала из Петербурга, а брат — из Казани."],"GEN":["При обобщающем слове","Тире ставится перед обобщающим словом после однородных членов; также может закрывать перечисление, если перед ним было обобщающее слово.","Сады, поля, луга — всё ожило весной."],"DIRECT":["В прямой речи","Тире отделяет прямую речь от следующих за ней слов автора или выделяет слова автора внутри прямой речи; с тире начинают реплики диалога.","«Ты идёшь?» — спросил он."],"INSERT":["При вставной конструкции","Вставная конструкция содержит попутное замечание; её выделяют двумя тире.","Мы — так показалось мне — опоздали."]};
const REFERENCE=[{"title":"1. Между подлежащим и сказуемым","html":"<p>Тире ставится между главными членами предложения при <strong>нулевой связке</strong> (связка <em>есть, является</em> пропущена). Частые случаи:</p>\n<ul>\n<li>Оба главных члена — существительные в именительном падеже: <em>Книга — источник знания.</em></li>\n<li>Существительное и инфинитив: <em>Цель командировки — подготовить материал.</em></li>\n<li>Оба главных члена — числительные или сочетания с ними: <em>Трижды три — девять.</em></li>\n<li>Перед сказуемым стоят <em>это, вот, значит, это есть</em>: <em>Чтение — это путь к знаниям.</em></li>\n</ul>\n<p><strong>Обычно тире не ставится</strong> при личном местоимении в роли подлежащего (<em>Он студент</em>), частице <em>не</em> перед сказуемым (<em>Бедность не порок</em>), сравнительном союзе (<em>Глаза как звёзды</em>), вводном слове между главными членами (<em>Пётр, вероятно, инженер</em>), сказуемом-прилагательном (<em>Дождь сильный</em>). Возможны исключения при противопоставлении или особом логическом ударении.</p>"},{"title":"2. В неполном предложении","html":"<p>Тире ставится <strong>на месте пропущенного члена предложения</strong> (часто сказуемого), когда его легко восстановить из контекста или структуры высказывания.</p>\n<ul><li><em>Ирина приехала из Петербурга, а брат — из Казани.</em> (Пропущено <em>приехал</em>.)</li><li><em>На полке — книги и журналы.</em> (Пропущенное сказуемое можно восстановить: <em>лежат</em>.)</li></ul>"},{"title":"3. При обобщающем слове и однородных членах","html":"<p>После ряда однородных членов перед <strong>обобщающим словом</strong> ставится тире.</p>\n<ul><li><em>Сады, поля, луга — всё ожило весной.</em></li><li><em>И в городе, и в деревне, и в горах — везде он находил друзей.</em></li></ul>\n<p>Если перед перечнем уже стоит обобщающее слово с двоеточием, тире может <strong>закрывать перечисление</strong>: <em>Всё вокруг: сады, поля, луга — ожило весной.</em></p>"},{"title":"4. При обособленном приложении","html":"<p>Тире выделяет <strong>приложение</strong> — поясняющее название лица или предмета. К нему обычно можно мысленно добавить <em>а именно</em>.</p>\n<ul><li><em>Он обожал один вид спорта — хоккей.</em></li><li><em>Лев Толстой — великий русский писатель — известен во всём мире.</em></li></ul>\n<p>Не путай с тире между подлежащим и сказуемым: <em>Лев Толстой — писатель</em> — это грамматическая основа, а <em>Лев Толстой — великий русский писатель — известен…</em> — обособленное приложение.</p>"},{"title":"5. В бессоюзном сложном предложении (БСП)","html":"<p>Тире разделяет части <strong>бессоюзного сложного предложения</strong>, связанные по смыслу без союза. В задании № 21 различные значения БСП полезно узнавать отдельно, хотя все они относятся к одной большой категории.</p>\n<ul>\n<li><strong>Противопоставление:</strong> <em>Я звал — он не откликнулся.</em></li>\n<li><strong>Условие:</strong> <em>Будет дождь — останемся дома.</em></li>\n<li><strong>Следствие / результат:</strong> <em>Наступила жара — воздух стал тяжёлым.</em></li>\n<li><strong>Быстрая смена событий:</strong> <em>Раздался выстрел — птицы взлетели.</em></li>\n<li><strong>Время:</strong> <em>Только я вошёл — зазвонил телефон.</em></li>\n<li><strong>Сравнение:</strong> <em>Скажет слово — словно музыка зазвучит.</em></li>\n</ul>"},{"title":"6. При прямой речи и диалоге","html":"<p>Тире ставится между прямой речью и <strong>следующими за ней словами автора</strong>, а также при оформлении реплик диалога с новой строки.</p>\n<ul><li><em>«Ты идёшь?» — спросил он.</em></li><li><em>«Конечно!» — ответила она.</em></li></ul>\n<p>Если слова автора разрывают прямую речь, они также выделяются тире: <em>«Я вернусь, — сказал он, — когда закончу работу».</em></p>"},{"title":"7. Для обозначения пределов и маршрутов","html":"<p>Тире обозначает пространственные, временные или количественные <strong>пределы</strong> и может заменять сочетание <em>от… до…</em>; оно также связывает пункты маршрута.</p>\n<ul><li><em>Поезд Москва — Сочи.</em> (Маршрут.)</li><li><em>В 2019–2023 годах проводились исследования.</em> (Временной промежуток: между числами обычно ставят короткое тире без пробелов.)</li></ul>"},{"title":"Дополнительно: при вставной конструкции","html":"<p>Вставная конструкция сообщает попутное замечание. Её выделяют <strong>двумя тире</strong>; если убрать вставку, основная мысль сохраняется.</p>\n<ul><li><em>Мы — так показалось мне — опоздали.</em></li><li><em>Лекция — помню это отчётливо — началась вовремя.</em></li></ul>\n<p>Эта категория есть в нашем режиме «Узнай правило», поэтому она сохранена дополнительно к семи разделам справочника.</p>"}];
const CLASSIFY=[{"text": "Наука о камнях — интересная наука.", "cat": "PRED", "explain": "Нулевая связка между главными членами: «Москва — столица», «Читать — полезно».", "source": "№ 14112"}, {"text": "Но экология — понятие более широкое.", "cat": "PRED", "explain": "Нулевая связка между главными членами: «Москва — столица», «Читать — полезно».", "source": "№ 16875"}, {"text": "Вараны Таиланда — удивительные рептилии.", "cat": "PRED", "explain": "Нулевая связка между главными членами: «Москва — столица», «Читать — полезно».", "source": "№ 61534"}, {"text": "Бег — самый древний вид лёгкой атлетики.", "cat": "PRED", "explain": "Нулевая связка между главными членами: «Москва — столица», «Читать — полезно».", "source": "№ 14116"}, {"text": "Увильды — самое крупное озеро Южного Урала.", "cat": "PRED", "explain": "Нулевая связка между главными членами: «Москва — столица», «Читать — полезно».", "source": "№ 44219"}, {"text": "И действительно, здесь дожди — частые гости.", "cat": "PRED", "explain": "Нулевая связка между главными членами: «Москва — столица», «Читать — полезно».", "source": "№ 42240"}, {"text": "Судно — это сооружение, созданное для плавания.", "cat": "PRED", "explain": "Нулевая связка между главными членами: «Москва — столица», «Читать — полезно».", "source": "№ 59257"}, {"text": "Цветок кактуса — один из самых красивых в мире.", "cat": "PRED", "explain": "Нулевая связка между главными членами: «Москва — столица», «Читать — полезно».", "source": "№ 14083"}, {"text": "Коломна — это неповторимый провинциальный город.", "cat": "PRED", "explain": "Нулевая связка между главными членами: «Москва — столица», «Читать — полезно».", "source": "№ 44673"}, {"text": "Недалеко от усадьбы протекала Волга — великая русская река.", "cat": "APP", "explain": "«Великая русская река» — приложение к слову «Волга».", "source": "№ 50684"}, {"text": "У каждого человека есть место, которое ему бесконечно дорого, — родная земля.", "cat": "APP", "explain": "«Родная земля» уточняет название дорогого места.", "source": "№ 17214"}, {"text": "Довелось и мне принимать участие в ловле тигров — великолепных царственных зверей.", "cat": "APP", "explain": "«Великолепных царственных зверей» поясняет слово «тигров».", "source": "№ 50140"}, {"text": "За горой Таганай, между сопками, расположен главный город Южного Урала — Златоуст.", "cat": "APP", "explain": "«Златоуст» — приложение к словосочетанию «главный город Южного Урала».", "source": "№ 50703"}, {"text": "Самой глубокой является пещера Соляник — государственный памятник природы Приморья.", "cat": "APP", "explain": "«Государственный памятник природы» поясняет наименование пещеры.", "source": "№ 42236"}, {"text": "Севернее города Одинцово раскинулся Подушкинский лесопарк — живописная лесная территория.", "cat": "APP", "explain": "«Живописная лесная территория» раскрывает название «Подушкинский лесопарк».", "source": "№ 17042"}, {"text": "Прошло больше пятидесяти лет с тех пор, как я начал увлекаться минералогией — наукой о камнях.", "cat": "APP", "explain": "«Наукой о камнях» — приложение к слову «минералогией».", "source": "№ 14112"}, {"text": "В месте, где ущелье пронзает Скалистый хребет, образовалась теснина — наиболее узкая его часть.", "cat": "APP", "explain": "«Наиболее узкая его часть» объясняет слово «теснина».", "source": "№ 42235"}, {"text": "В 1830 году усадьбу Борок приобрёл молодой Алексей Петрович Щепочкин — дворянин по происхождению.", "cat": "APP", "explain": "«Дворянина по происхождению» — приложение к имени Щепочкин.", "source": "№ 50683"}, {"text": "Они знакомы нам с раннего детства — многие строки мы помним наизусть.", "cat": "BSP", "explain": "Две основы: «они знакомы» и «мы помним».", "source": "№ 67131"}, {"text": "Крупные виды живут группами или стадами — мелкие чаще встречаются парами.", "cat": "BSP", "explain": "Противопоставление в БСП: крупные виды живут стадами — мелкие парами.", "source": "№ 37095"}, {"text": "А в XIX веке в Подушкино провели железную дорогу — здесь появились дачники.", "cat": "BSP", "explain": "Две основы: «провели дорогу» и «появились дачники».", "source": "№ 17042"}, {"text": "Выйдешь на Александровскую сопку и поглядишь вниз — вот что представится тебе.", "cat": "BSP", "explain": "Вторая часть БСП раскрывает, что увидишь: «вот что представится тебе».", "source": "№ 50703"}, {"text": "Сухомлинский начинает титанический труд — он ищет ответ на поставленный вопрос.", "cat": "BSP", "explain": "Две основы: «Сухомлинский начинает труд» и «он ищет».", "source": "№ 14101"}, {"text": "Не было злобы и трусости — недоумение и гордое сознание своей силы светилось в них.", "cat": "BSP", "explain": "Между основами «не было злобы» и «недоумение ... светилось».", "source": "№ 50140"}, {"text": "Иногда можно увидеть кактус с длинными свисающими волосами — он похож на голову старика.", "cat": "BSP", "explain": "Две основы: «можно увидеть кактус» и «он похож».", "source": "№ 14083"}, {"text": "Суздаль входит в маршрут Золотого кольца России — ежегодно сюда приезжают тысячи туристов.", "cat": "BSP", "explain": "После тире новая грамматическая основа: «туристы приезжают».", "source": "№ 34132"}, {"text": "Вот-вот раздастся выстрел и бегун устремится вперёд — бег надо начать сразу же после выстрела.", "cat": "BSP", "explain": "БСП: выстрел прозвучит — бег надо начать сразу же.", "source": "№ 14116"}, {"text": "У каждого вида — свой образ жизни, свои особенности, привычки.", "cat": "ELL", "explain": "Пропущено «есть»: «У каждого вида — свой образ жизни».", "source": "№ 16875"}, {"text": "Длина самцов может достигать 20 метров, самок — десяти–тринадцати.", "cat": "ELL", "explain": "На месте пропущенного, но понятного слова: «Здесь — лес, там — поле».", "source": "№ 60227"}, {"text": "А далее — плотина, мост, музейная доменная печь и сизый дым металлургических заводов.", "cat": "ELL", "explain": "После «А далее» пропущено «расположены/видны»: перечислены плотина, мост...", "source": "№ 50703"}, {"text": "В современном торговом флоте применяют исключительно термин «судно», в военном — «корабль».", "cat": "ELL", "explain": "Пропущено «применяют термин»: «в военном — „корабль“».", "source": "№ 59257"}, {"text": "Длина тела этого удивительного животного достигает 1,3 метра, а вес — шестидесяти килограммов.", "cat": "ELL", "explain": "Пропущено «достигает»: «а вес — шестидесяти килограммов».", "source": "№ 59885"}, {"text": "Мусикийский работал в московской Оружейной палате, а с 1711 года — в Петербургской Оружейной канцелярии.", "cat": "ELL", "explain": "Опущено «работал»: «а с 1711 года — в ... канцелярии».", "source": "№ 57551"}, {"text": "Привольно течёт Волга в низких берегах; кругом — неоглядные просторы лугов, полей, вдалеке виднеются поля.", "cat": "ELL", "explain": "Пропущено «находятся»: «кругом — просторы лугов».", "source": "№ 50684"}, {"text": "В пейзаже И. К. Айвазовского «Вид на Москву с Воробьёвых гор» на первом плане — извивающаяся лента Москвы-реки.", "cat": "ELL", "explain": "Пропущено «находится»: «на первом плане — ... лента».", "source": "№ 50629"}, {"text": "Большинство их любит равнины, но некоторые встречаются только в горах, другие предпочитают болота, третьи — лес.", "cat": "ELL", "explain": "Пропущено «предпочитают»: «третьи — лес».", "source": "№ 37095"}, {"text": "«Мойдодыр», «Айболит», «Муха-Цокотуха» — все эти произведения написаны им.", "cat": "GEN", "explain": "«Все эти произведения» обобщает названия трёх сказок.", "source": "№ 67131"}, {"text": "Дикий виноград, лимонник, малина — эти и многие другие растения покрывают склоны Чандолаза.", "cat": "GEN", "explain": "«Эти и многие другие растения» обобщает перечисление.", "source": "№ 42236"}, {"text": "Отдельные листики, рукописные сборники, альбомы, тетради — всё это доносит до нас его первые творческие помыслы.", "cat": "GEN", "explain": "«Всё это» обобщает перечень рукописей и тетрадей.", "source": "№ 14085"}, {"text": "На приволье: в поле, в лесу или парке на беговой дорожке стадиона — начинается путь будущих чемпионов и рекордсменов.", "cat": "GEN", "explain": "Тире закрывает перечисление мест: «в поле, в лесу или парке...».", "source": "№ 14116"}, {"text": "Наличие многочисленных островов: Берёзового, Ольхового, Букового, Вязового, Елового — является одной из его особенностей.", "cat": "GEN", "explain": "После ряда названий островов продолжается основное предложение.", "source": "№ 44219"}, {"text": "Их рацион состоит из травы, водных растений, фруктов и овощей — всё это капибары находят в своей естественной среде обитания.", "cat": "GEN", "explain": "«Всё это» обобщает названные виды пищи.", "source": "№ 59885"}, {"text": "Зелёные дятлы, глухари, рябчики, чёрные коршуны и сапсаны — эти редкие птицы также обитают на территории Подушкинского лесопарка.", "cat": "GEN", "explain": "Обобщающее «эти редкие птицы» стоит после названий птиц.", "source": "№ 17042"}, {"text": "Может, поэтому наивный ребёнок и умудрённый опытом старик, молодая девушка и бесстрашный воин — все замирают при виде белогривой лошади.", "cat": "GEN", "explain": "«Все» — обобщающее слово после перечня людей.", "source": "№ 14100"}, {"text": "Владимир, Суздаль, Ярославль, Переславль-Залесский, Ростов Великий, Сергиев Посад, Кострому и Иваново — эти города посетил во время поездки Бычков.", "cat": "GEN", "explain": "«Эти города» обобщает перечисленные названия городов.", "source": "№ 39828"}, {"text": "« Будьте, как дома», — говорим мы.", "cat": "DIRECT", "explain": "Тире отделяет слова автора от реплики, которая стоит перед ними или внутри них.", "source": "№ 14084"}, {"text": "«Внимание!» — негромко произносит стартер на прямой, как стрела, беговой дорожке.", "cat": "DIRECT", "explain": "Тире отделяет слова автора от реплики, которая стоит перед ними или внутри них.", "source": "№ 14116"}, {"text": "«Опасны ли вараны для человека?» — спрашивают туристы и получают успокаивающий ответ.", "cat": "DIRECT", "explain": "Тире отделяет слова автора от реплики, которая стоит перед ними или внутри них.", "source": "№ 61534"}, {"text": "«Добро пожаловать в удивительный Алтайский край!» — призывают к увлекательному путешествию буклеты-путеводители по туристическим маршрутам России.", "cat": "DIRECT", "explain": "Тире отделяет прямую речь в кавычках от слов автора «призывают ... буклеты».", "source": "№ 17214"}, {"text": "«Под наши густые, старинные вязы на отдых тянуло усталых людей», — так спустя много лет напишет в стихотворении «Крестьянские дети» Николай Алексеевич.", "cat": "DIRECT", "explain": "Тире отделяет слова автора от реплики, которая стоит перед ними или внутри них.", "source": "№ 50684"}, {"text": "Здесь, видимо, сделав яхту, он не нашел подходящего материала на паруса, употребив что было — лоскутки алого шелка.", "cat": "APP", "explain": "После слова «что было» идёт поясняющее наименование материала.", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "«Капитан испугался», — подумала она и побежала за уплывающей игрушкой.", "cat": "DIRECT", "explain": "Тире отделяет прямую речь от слов автора «подумала она».", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Сострой теперь Эгль гримасу или закричи что-нибудь — девочка помчалась бы прочь.", "cat": "BSP", "explain": "Вторая часть сообщает результат при условии, выраженном первой (если бы Эгль закричал).", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Много ведь придется увидеть тебе не алых, а грязных парусов; издали — нарядных и белых, вблизи — рваных и наглых.", "cat": "ELL", "explain": "Пропущено сказуемое «парусов [увидишь]»; тире заменяет пропущенные слова.", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Там на длинном столе лежали радужные фазаны и серые утки; там — репа, капуста, орехи, синий изюм.", "cat": "ELL", "explain": "Во второй части пропущено сказуемое «лежали».", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Но улыбнуться — значило спугнуть и смутить девушку.", "cat": "PRED", "explain": "Главные члены выражены инфинитивами: «улыбнуться — значило спугнуть».", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Рассеянность — облачное движение чувств — отражалось в его лице бесчувственной улыбкой лунатика.", "cat": "APP", "explain": "Обособленное приложение поясняет слово «рассеянность».", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "В нем не было смешанных оттенков огня; не было также ни синевы, ни тени — ничего, что вызывает сомнение.", "cat": "GEN", "explain": "После однородных членов «синевы, тени» стоит обобщающее слово «ничего».", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Никто не крикнул, не зашумел — нечто не совсем простое чувствовали матросы.", "cat": "BSP", "explain": "Вторая часть поясняет неожиданную реакцию матросов; бессоюзная связь.", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Пантен облегченно вздохнул и повеселел — его душевная тяжесть растаяла.", "cat": "BSP", "explain": "Вторая часть передаёт причину/объяснение перемены состояния, связь бессоюзная.", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Владеть этим — значит владеть всем.", "cat": "PRED", "explain": "Подлежащее и сказуемое выражены неопределённой формой глагола.", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Иногда — и это продолжалось ряд дней — она даже перерождалась.", "cat": "INSERT", "explain": "Парные тире выделяют вставное авторское сообщение.", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Часть их души была занята предками, другая часть — воображаемое продолжение галереи — начиналась маленьким Грэем.", "cat": "APP", "explain": "«Воображаемое продолжение галереи» — приложение к слову «часть».", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Тишина, только тишина и безлюдье — вот что нужно было ему.", "cat": "GEN", "explain": "После однородного перечисления следует обобщающая конструкция «вот что».", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Ассоль увидела, что стоит в каюте — в комнате, которой лучше уже не может быть.", "cat": "APP", "explain": "«В комнате...» — поясняющее приложение к слову «каюте».", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "«Вот сколько вы забрали с декабря, — сказал торговец, — а вот посмотри, на сколько продано».", "cat": "DIRECT", "explain": "Слова автора расположены внутри прямой речи.", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}, {"text": "Когда Лонгрен узнал подробности, он подумал, что огонь простой лампы — будь они все вместе — был бы для неё отрадой.", "cat": "INSERT", "explain": "Вставная конструкция «будь они все вместе» выделена парными тире.", "source": "А. Грин, «Алые паруса» (по учебной карточке, некоторые фразы сокращены)"}];

let route='menu',queue=[],idx=0,score=0,modeLength=CONFIG.defaultLength,sel=new Set(),answerLocked=false,quizLast=null,quizChoice=null,currentType='',sampleSize=15,details=[],modalScroll=0;
function setStatus(){ $('status').textContent=route==='menu'?'Вариант ЕГЭ · 3 задания':`${CONFIG.topic} · ${route==='exam'?'Варианты ЕГЭ':'Узнай правило'}`; $('score').textContent=route==='menu'?'':`Верно: ${score} / ${idx}`; }
function setProgress(){const d=$('progress');d.style.width=route==='menu'?'0%':`${queue.length?Math.round(idx/queue.length*100):0}%`;}
function show(html){main.innerHTML=html;setStatus();setProgress()}
function home(){route='menu';idx=score=0;queue=[];answerLocked=false;show(`<div class="menu-wrap"><div class="menu-lead"><div class="eyebrow">ЕГЭ №21</div><div class="bigtitle">${CONFIG.title}</div><div class="intro">Три случайных экзаменационных задания с полными текстами и разбором.</div></div><div class="menu-cards"><section class="menu-card"><span class="menu-icon">▦</span><h2>Варианты ЕГЭ · 3 задания</h2><p>Отмечай номера предложений, где знак поставлен по одному правилу.</p><button class="primary" id="goExam">Начать →</button></section></div><div class="menu-footer"><button id="menuHelp">◉ Открыть справочник</button><span>В базе ${DATA.length} заданий · новая случайная тройка при повторе.</span></div></div>`);$('goExam').onclick=startExam;$('menuHelp').onclick=openReference;}
function startExam(){route='exam';queue=shuffle(DATA).slice(0,3);gameAttemptId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('e21_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));attemptTested={};attemptErrors={};gameSaved=false;idx=score=0;sel=new Set();answerLocked=false;renderExam();}
function startClassify(){route='single';queue=shuffle(CLASSIFY).slice(0, sampleSize);idx=score=0;answerLocked=false;renderSingle();}
function splitColumns(items){if(window.innerWidth<800)return [items,[]];
 let total=items.reduce((a,x)=>a+x.text.length+25,0);let acc=0,at=items.length>>1,best=Infinity;
 items.forEach((it,i)=>{acc+=it.text.length+25;const diff=Math.abs(acc-total/2);if(i<items.length-1&&diff<best){best=diff;at=i+1;}});return [items.slice(0,at),items.slice(at)];}
function punctText(s){return esc(s);}
function renderPassage(items){const cols=splitColumns(items);return `<div class="reading-viewport" id="reading"><div class="passage-columns" id="passageColumns">${cols.filter(c=>c.length).map(col=>`<div class="passage-col">${col.map(x=>`<div class="passage-item ${sel.has(x.n)?'picked':''}" data-item="${x.n}"><button class="sentence-number ${sel.has(x.n)?'on':''}" aria-label="Отметить предложение ${x.n}" aria-pressed="${sel.has(x.n)}" data-n="${x.n}">${x.n}</button><span class="passage-text">${punctText(x.text)}</span></div>`).join('')}</div>`).join('')}</div></div>`;}
function examButtons(){return `<div class="footer-info"><span class="eyebrow">Выбрано: <b id="selectedN">${numbers([...sel])}</b></span><span class="hint-info">Нажимай на номера прямо в тексте</span></div><button id="check" class="primary">Проверить ответ</button>`}
function renderExam(){if(idx>=queue.length){finish();return}answerLocked=false;const t=queue[idx];sel=new Set();show(`<div class="exercise">
 <div class="exercise-top"><div><span class="eyebrow">ЭКЗАМЕНАЦИОННЫЙ РЕЖИМ</span><h2>Задание ${idx+1} из ${queue.length} <span class="subhead">· база № ${esc(t.id)}</span></h2></div><button class="ghost" id="helpNow">? Справка</button></div>
 <div class="task-instruction">Найди предложения, в которых <strong>${CONFIG.topic.toLowerCase()}</strong> ставится <strong>по одному правилу</strong>. Отметь их номера.</div>
 ${renderPassage(t.full)}<div class="bottom">${examButtons()}</div></div>`);
 $('helpNow').onclick=openReference;main.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.n);sel.has(n)?sel.delete(n):sel.add(n);main.querySelectorAll(`[data-item="${n}"]`).forEach(e=>e.classList.toggle('picked',sel.has(n)));b.classList.toggle('on',sel.has(n));b.setAttribute('aria-pressed',sel.has(n));$('selectedN').textContent=numbers([...sel]);});$('check').onclick=checkExam;
 requestAnimationFrame(fitPassage);
}
function fitPassage(){const wrap=$('reading'),cols=$('passageColumns');if(!wrap||!cols)return;let size=window.innerWidth>=1600?36:window.innerWidth>=1200?30:window.innerWidth>=800?26:window.innerWidth>=530?20:16;
 const min=window.innerWidth>=800?11:10.5;
 cols.style.fontSize=size+'px';
 let attempts=0;while(size>min&&attempts++<100){const sub=[...cols.querySelectorAll('.passage-col')]; if(sub.every(c=>c.scrollHeight<=cols.clientHeight+1)&&cols.scrollWidth<=wrap.clientWidth+2)break;size=Math.max(min,Math.round((size-.35)*100)/100);cols.style.fontSize=size+'px'}
 // At short screen sizes, keep text available through the reading pane only.
 wrap.classList.toggle('allow-reading-scroll',[...cols.querySelectorAll('.passage-col')].some(c=>c.scrollHeight>cols.clientHeight+1));
}
function checkExam(){
 if(answerLocked)return;
 answerLocked=true;
 const t=queue[idx], correct=sel.size===t.answer.length&&t.answer.every(n=>sel.has(n));
 if(correct)score++;
 const group=t.full.find(x=>t.answer.includes(x.n))?.cat;
 const rule=('Тире · '+String(ALLRULES[group]?.[0]||'единое пунктуационное правило')).slice(0,115);
 attemptTested[rule]=(attemptTested[rule]||0)+1;
 if(!correct)attemptErrors[rule]=(attemptErrors[rule]||0)+1;
 idx++;setStatus();setProgress();
 const explanations=t.full.map(x=>({n:x.n,text:x.text,cat:x.cat,hint:x.hint,correct:t.answer.includes(x.n),chosen:sel.has(x.n)}));
 const wholeText=`<details class="review-original"><summary>Посмотреть исходный текст целиком</summary><p class="review-original-legend">Бирюзовая полоса — номер, который ты выбрал до проверки.</p><div class="review-original-body">${explanations.map(x=>`<div class="review-original-sentence ${x.chosen?'orig-chosen':''}"><span class="orig-num">(${x.n})</span> ${esc(x.text)}</div>`).join('')}</div></details>`;
 const cards=explanations.map(x=>{
   const status=x.correct?(x.chosen?'✓ Верно отмечено':'! Нужно было отметить'):(x.chosen?'✕ Лишний номер':'✓ Верно пропущено');
   const statusClass=(x.correct===x.chosen)?'good':'bad';
   return `<article class="review-line"><b class="r-num">${x.n}</b><div class="review-detail">
     <div class="review-sentence">${esc(x.text)}</div>
     <div class="review-rule"><b>${esc(ALLRULES[x.cat]?.[0] || 'Нет целевого знака')}</b><span class="review-indicator ${statusClass}">${status}</span></div>
     <p class="review-hint">${esc(x.hint||ALLRULES[x.cat]?.[1]||'В этом предложении нет целевого знака, поэтому его номер не выбираем.')}</p>
   </div></article>`;
 }).join('');
 openReview(`<div class="resultbanner ${correct?'ok':'bad'}"><strong>${correct?'✓ Отлично!':'✕ Есть ошибки'}</strong><span>${correct?'Все номера найдены правильно.':'Сравни выбранные номера с правильным ответом и прочитай предложения рядом с пояснениями.'}</span></div>
 <div class="comparison"><div>Твой ответ <b>${numbers([...sel])}</b></div><div>Правильный <b>${numbers(t.answer)}</b></div></div>
 ${wholeText}<h3>Разбор пунктуации</h3><p class="review-intro">Каждое предложение приведено полностью: под ним — правило и пояснение. Можно разбирать номера по очереди прямо с экрана.</p><div class="review-list">${cards}</div>`, `Результат · задание № ${t.id}`,'Продолжить →',()=>renderExam());
}
function renderSingle(){if(idx>=queue.length){finish();return;}answerLocked=false;let it=queue[idx];show(`<div class="single-shell"><div class="exercise-top"><div><span class="eyebrow">ПОПРОБУЙ УЗНАТЬ ПРАВИЛО</span><h2>Пример ${idx+1} из ${queue.length}</h2></div><button class="ghost" id="helpNow">? Справка</button></div>
 <div class="single-instruction">Почему здесь стоит ${CONFIG.topic.toLowerCase()}? Выбери одно правило.</div><div class="single-content"><section class="single-question"><div class="single-sentence" id="singleSentence">${esc(it.text)}</div></section><section class="rule-grid">${Object.entries(RULES).map(([key,v])=>`<button class="rule-option" data-key="${key}">${esc(v[0])}</button>`).join('')}</section></div><div class="single-foot"><div class="helper">Один ответ · пояснение после каждого выбора</div><button class="ghost" id="skip">Пропустить →</button></div></div>`);
 $('helpNow').onclick=openReference;$('skip').onclick=()=>{idx++;renderSingle()};main.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>checkSingle(b.dataset.key));requestAnimationFrame(fitSingle);
}
function fitSingle(){const el=$('singleSentence');if(!el)return;let s=window.innerWidth>=900?52:window.innerWidth>=520?32:25;el.style.fontSize=s+'px';let tries=0;while(tries++<35&&s>16&&(el.scrollHeight>el.clientHeight+2||el.scrollWidth>el.clientWidth+3)){s-=1;el.style.fontSize=s+'px';}}
function checkSingle(chosen){if(answerLocked)return;answerLocked=true;const it=queue[idx], correct=it.cat===chosen;if(correct)score++;idx++;setStatus();setProgress();openReview(`<div class="resultbanner ${correct?'ok':'bad'}"><strong>${correct?'✓ Верно!':'✕ Не тот случай'}</strong><span>${correct?'Ты узнал пунктуационное правило.':'Вот как определить правило в этом предложении.'}</span></div><div class="comparison"><div>Выбрано <b>${esc(RULES[chosen][0])}</b></div><div>Нужно <b>${esc(RULES[it.cat][0])}</b></div></div><p class="original-example">${esc(it.text)}</p><div class="explanation"><strong>Почему:</strong> ${esc(it.explain)}</div><div class="source-note">Источник: ${esc(it.source||'учебная подборка')}</div>`,'Разбор ответа','Следующий пример →',()=>renderSingle());}
function openReference(){const body=`<div class="reference-intro">Семь основных разделов и дополнительно — вставная конструкция, которая встречается в нашей игре. Правила можно открыть в любой момент: ответы не сбрасываются.</div><div class="reference-grid">${REFERENCE.map(v=>`<article class="rule-reference"><h3>${esc(v.title)}</h3><div class="ref-rich">${v.html}</div></article>`).join('')}</div>`;openReview(body,`${CONFIG.topic} · справочник`,'Вернуться к игре',()=>{},true);}
function openReview(content,title,btn,cb,ref=false){const back=$('dialogBack');back.classList.add('visible');back.setAttribute('aria-hidden','false');$('dialogTitle').textContent=title;$('dialogContent').innerHTML=content;$('dialogButton').textContent=btn;const onClose=()=>{back.classList.remove('visible');back.setAttribute('aria-hidden','true');$('dialogButton').onclick=null;cb?.();};$('dialogButton').onclick=onClose;$('dialogClose').onclick=onClose;back.onclick=e=>{if(e.target===back&&ref)onClose()};$('dialogContent').scrollTop=0;}
function sendGame21(){
 if(gameSaved)return;const st=$('saveStatus21');
 if(!tg||!tg.platform||tg.platform==='unknown'||typeof tg.sendData!=='function'){st.textContent='Открой через кнопку «🎮 Тренажёры» в Telegram для записи результата.';return;}
 const total=Object.values(attemptTested).reduce((n,v)=>n+v,0);if(total!==3){st.textContent='Нужно завершить три задания.';return;}
 const data={v:1,type:'game_result',gameId:'TR21_DASH',attemptId:gameAttemptId,correct:score,total,errors:attemptErrors,tested:attemptTested};
 try{$('saveResult21').disabled=true;tg.sendData(JSON.stringify(data));gameSaved=true;st.textContent='Результат отправлен.';}catch(e){$('saveResult21').disabled=false;st.textContent=String(e.message||e);}
}
function finish(){route='finish';setStatus();setProgress();show(`<div class="finish"><span class="eyebrow">ТРЕНИРОВКА ЗАВЕРШЕНА</span><div class="finish-icon">${CONFIG.sign}</div><h1>Результат: ${score} из ${queue.length}</h1><p>${score===queue.length?'Безупречная работа!':'Каждое выполненное задание приближает к уверенному решению ЕГЭ.'}</p><div class="finish-actions"><button id="saveResult21" class="primary">💾 Сохранить результат</button><button id="again" class="ghost">Сыграть ещё раз</button><button id="finishHome" class="ghost">В меню</button></div><p id="saveStatus21" style="font-size:13px;color:var(--muted);margin-top:10px"></p></div>`);$('again').onclick=()=>startExam();$('finishHome').onclick=home;$('saveResult21').onclick=sendGame21;}
$('home').onclick=()=>home();$('topHelp').onclick=openReference;
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(route==='exam')fitPassage();if(route==='single')fitSingle()},100)});
// Remember active mode for a replay.
const _oldStartExam=startExam;startExam=()=>{currentType='exam';_oldStartExam()};const _oldStartClassify=startClassify;startClassify=()=>{currentType='single';_oldStartClassify()};
home();
</script></body></html>
