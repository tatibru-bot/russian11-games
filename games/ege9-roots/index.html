ание корней ЛАГ/ЛОЖ: перед буквой Г пишется А, а перед Ж – О (исключения: «по́лОг», «слОговой»))","words":[{"mask":"р..внобедренный","full":"равнобедренный","letter":"а","raw":"р..внобедренный (треугольник)","explain":"рАвнобедренный (треугольник) (чередование корней РАВН/РОВН: буква А пишется в значении «равный, одинаковый», а также в контекстах, связанных со спортивным и военным построением людей («рАвняться (в шеренге)», «рАвнение (налево)», «подрАвняться (в строю)», «рАвняйсь»), буква О – в значении «ровный, прямой, гладкий, без неровностей» (исключения: «вырОвняться (в строю)», «порОвну», «рОвесник», «урОвень», «не рОвён час», «рАвнина», «рАвнинный»))","rule":"meaning","occurrence":"164246:4:1","sourceId":"164246"},{"mask":"об..яние","full":"обаяние","letter":"а","raw":"об..яние","explain":"обАяние (словарное слово; запомнить; этимологически связано со словом «бАять (заговаривать)»; не путать со словом «обОняние (способность распознавать запахи)»)","rule":null,"occurrence":"164246:4:2","sourceId":"164246"},{"mask":"прил..гать","full":"прилагать","letter":"а","raw":"прил..гать (усилия)","explain":"прилАгать (усилия) (чередование корней ЛАГ/ЛОЖ: перед буквой Г пишется А, а перед Ж – О (исключения: «по́лОг», «слОговой»))","rule":"cons","occurrence":"164246:4:3","sourceId":"164246"}]},{"n":5,"raw":"г..потеза, пал..садник, инт..нсивный","explain":"гИпотеза (словарное слово; запомнить), палИсадник (словарное слово; запомнить), интЕнсивный (словарное слово; запомнить)","words":[{"mask":"г..потеза","full":"гипотеза","letter":"и","raw":"г..потеза","explain":"гИпотеза (словарное слово; запомнить)","rule":null,"occurrence":"164246:5:1","sourceId":"164246"},{"mask":"пал..садник","full":"палисадник","letter":"и","raw":"пал..садник","explain":"палИсадник (словарное слово; запомнить)","rule":null,"occurrence":"164246:5:2","sourceId":"164246"},{"mask":"инт..нсивный","full":"интенсивный","letter":"е","raw":"инт..нсивный","explain":"интЕнсивный (словарное слово; запомнить)","rul const RULES={"checked":["Проверяемые гласные","Подбери однокоренное слово или форму этого же слова, где сомнительная гласная находится под ударением."],"suffix":["Чередование — суффикс -А-","Написание зависит от суффикса -А- после корня: -бер-/-бир-, -тер-/-тир-, -стел-/-стил-, -блест-/-блист-, -кос-/-кас-, -чет-/-чит- и другие ряды с чередованием. Учитывай исключения, встречающиеся в исходной базе."],"meaning":["Чередование — значение","В корнях -мак-/-мок- значение определяет выбор буквы; в -равн-/-ровн- обычно различают «равный» и «ровный». Проверяй значение в контексте, учитывая исключения."],"stress":["Чередование — ударение","В безударной позиции выбор буквы зависит от ряда: -гар-/-гор- (О), -зар-/-зор- (А), -клан-/-клон- (О), -твар-/-твор- (О). В ударной позиции и в исключениях действуют особые случаи."],"cons":["Чередование — согласная после гласной","Написание зависит от соседних согласных: -лаг-/-лож-, -раст-/-ращ-/-рос-, -скак-/-скоч-. У этих рядов есть исключения."],"special":["Чередование — ПЛАВ/ПЛОВ, ИМ/ИН","Написания -плав-/-плов-/-плыв- и исключения из общих правил удобно запоминать отдельно, сверяя с исходными пояснениями."],"hissing":["После шипящих в корне","Под ударением О/Ё после шипящих в корне выбирают по правилу и исключениям; отдельно учитывают У/Ю после шипящих (жюри, брошюра, парашют — исключения из общего правила У)."],"ci":["И / Ы после Ц","В корнях после Ц обычно пишется И. Слова-исключения и написания с Ы необходимо запоминать по правилу."],"uncheck":["Непроверяемые гласные","Написание запоминают по словарю. Эти слова есть в экзаменационных заданиях, но не входят в тренировку конкретных правил."]};
const RULE_GUIDES={"checked":"<p class=\"lead\">Если безударная гласная в корне <b>проверяемая</b>, измени форму слова или подбери однокоренное так, чтобы эта же гласная оказалась <b>под ударением</b>. Проверочное слово должно совпадать по смыслу с проверяемым.</p>\n<div class=\"theory-block\"><h4>Алгоритм</h4><ol><li>Пойми значение слова и выдели корень.</li><li>Подбери родственное слово с ударением на сомнительной гласной: <b>пос..деть от старости → сЕд</b>; <b>пос..деть на стуле → сИдя</b>.</li><li>Проверь, что перед тобой не чередующийся корень и не словарное слово.</li></ol></div>\n<div class=\"theory-block\"><h4>Смысловые пары: не перепутай проверочные слова</h4><ul class=\"dense\"><li><b>умалять</b> значение — малый; <b>умолять</b> о помощи — молит</li><li><b>посвятить</b> стихи — свято; <b>просветить</b> человека — свет</li><li><b>примерять</b> платье — мерка; <b>примирять</b> друзей — мир</li><li><b>честолюбие</b> — честь; <b>чистоплотность</b> — чисто</li><li><b>частота</b> колебаний — часто; <b>чистота</b> комнаты — чисто</li><li><b>полоскать</b> бельё — полощет; <b>поласкать</b> ребёнка — ласка</li><li><b>проживать</b> по адресу — жить; <b>прожевать</b> хлеб — жёваный</li><li><b>старожил</b> села — старый; <b>сторожил</b> — сторож</li><li><b>спишите</b> текст — пишет; <b>спешите</b> домой — спешка</li><li><b>отварить</b> картофель — варка; <b>отворить</b> дверь — створка</li><li><b>запевать</b> в хоре — петь; <b>запивать</b> водой — пить</li><li><b>привидение</b> — видеть; <b>приведение</b> к общему виду — привёл</li><li><b>слепить</b> снеговика — лепка; <b>слепить</b> глаза — ослеп; <b>слипаться</b> — слипся</li><li><b>скрипеть</b> — скрип; <b>скреплять</b> — скрепы</li><li><b>разредить</b> всходы — редкий; <b>разрядить</b> обстановку — разряд</li><li><b>развевать</b> флаги — веять; <b>развивать</b> способности — развитие; <b>извиваться</b> — вить</li><li><b>полинять</b> — линька; <b>лениться</b> — лень</li></ul></div>\n<p class=\"theory-tip\">Важно: проверка по ударению не заменяет правила чередования. Например, написание в <i>загореть</i> нельзя проверять словом <i>загар</i>.</p>","suffix":"<p class=\"lead\"><b>Десять групп корней.</b> В девяти группах без ударения обычно пишем <b>И</b>, если <b>после корня есть суффикс -А-</b>; без него — <b>Е</b>. Для КАС/КОС выбор <b>А/О</b> определяется тем же условием.</p>\n<div class=\"theory-block\"><h4>Все девять чередований Е / И</h4><div class=\"two-col\"><ul class=\"dense\"><li><b>БЕР / БИР</b>: собирать — соберу</li><li><b>ПЕР / ПИР</b>: запирать — запереть</li><li><b>ДЕР / ДИР</b>: задирать — задеру</li><li><b>ТЕР / ТИР</b>: стирать — стереть</li><li><b>МЕР / МИР</b>: замирать — замереть</li></ul><ul class=\"dense\"><li><b>БЛЕСТ / БЛИСТ</b>: блистать — блестеть</li><li><b>СТЕЛ / СТИЛ</b>: расстилать — расстелить</li><li><b>ЖЕГ / ЖИГ</b>: сжигать — сжечь</li><li><b>ЧЕТ / ЧИТ</b>: вычитать — вычет</li></ul></div>\n<p><b>Алгоритм:</b> смотри не на приставку, а на букву <b>после корня</b>: соб<b>ИР-А</b>ть, но соб<b>ЕР</b>у; выч<b>ИТ-А</b>ть, но выч<b>ЕТ</b>.</p></div>\n<div class=\"theory-block\"><h4>Десятая группа: КАС / КОС(Н)</h4><p><b>КАС</b> перед суффиксом <b>-А-</b>: к<b>А</b>саться, прик<b>А</b>саться. <b>КОС</b>, если -А- после корня нет (часто за корнем следует Н): к<b>О</b>снуться, прик<b>О</b>сновение.</p></div>\n<div class=\"theory-block exceptions\"><h4>Исключения</h4><p><b>Сочетать, сочетание, бракосочетание</b>: пишем <b>Е</b> при внешнем сходстве с чередованием ЧЕТ/ЧИТ. Эти слова нужно запомнить.</p></div>\n<div class=\"theory-block\"><h4>Ловушки: здесь чередования нет</h4><p>Не смешивай с этим правилом <b>беречь, пировать, держать, тиран, примерять</b> одежду, <b>измерение, примирить, усмирить, мировой, читать</b> книгу, <b>читательский, стилистический, косой, косоглазый, косить, коса</b> (причёска, песчаная коса).</p></div>","meaning":"<p class=\"lead\">Выбирай А или О по <b>значению слова в конкретном предложении</b>. Здесь два основных чередования: <b>МАК/МОК</b> и <b>РАВН/РОВН</b>.</p>\n<div class=\"theory-block\"><h4>МАК / МОК</h4><p><b>МАК</b> — «погружать что-либо в жидкость»: <i>макать сухарь в чай, обмакнуть кисть в краску</i>.</p><p><b>МОК</b> — «становиться мокрым, впитывать или пропускать влагу»: <i>промокнуть под дождём, непромокаемый плащ, промокательная бумага</i>.</p><p><b>Проверка смысла:</b> предмет <i>опускают</i> в жидкость — А; предмет <i>намокает/пропускает воду</i> — О.</p></div>\n<div class=\"theory-block\"><h4>РАВН / РОВН: как определить букву</h4><p><b>РАВН</b> — <b>равный, одинаковый; сравнение, равенство</b>: <i>сравнить числа, уравнять в правах, уравнение, равнозначный</i>. Задай вопрос: «Делаем <b>одинаковыми</b>?» — А.</p><p><b>РОВН</b> — <b>прямой, гладкий, без неровностей</b>, а также ровный, устойчивый ход чего-либо: <i>ровнять землю, заровнять яму, подровнять край, выровнять дыхание</i>. Вопрос: «Делаем <b>гладким, прямым, ровным</b>?» — О.</p><div class=\"example-split\"><div><b>РАВН — А</b><small>срАвнять счёт (сделать одинаковым)</small></div><div><b>РОВН — О</b><small>срОвнять с землёй (сделать плоским)</small></div></div></div>\n<div class=\"theory-block exceptions\"><h4>Исключения и особые значения</h4><ul class=\"dense\"><li><b>рАвнина, рАвнинный</b> — поверхность ровная, но пишется А</li><li><b>пОровну</b> — поровну, в равных долях, но О</li><li><b>рОвесник</b> — равный по возрасту, но О</li><li><b>урОвень; не рОвён час</b> — запомнить О</li><li><b>рАвняться, подрАвняться в шеренге; рАвнение, «РАвняйсь!»</b> — при построении людей пишется А</li><li><b>вырОвнять(ся)</b> — словарно закреплённое написание О, в том числе в отдельных значениях «сделать/стать одинаковым»; для неоднозначных употреблений сверяйся со словарём</li></ul></div>\n<p class=\"theory-tip\">Слово <b>выровнять</b> и команды при построении — не повод механически применять пару «равный/ровный»: в нормативных словарях оговорены особые значения. Поэтому сначала учитывай контекст, затем исключения.</p>","stress":"<p class=\"lead\">В этих <b>четырёх</b> группах безударную гласную нельзя проверять случайным однокоренным словом: действует правило чередования.</p>\n<div class=\"theory-block\"><h4>Все четыре группы</h4><ul class=\"dense\"><li><b>ГАР / ГОР:</b> без ударения <b>О</b> — загореть, пригорать; под ударением <b>А</b> — загар, нагар</li><li><b>ЗАР / ЗОР:</b> без ударения <b>А</b> — заря, зарница, озарение; под ударением по произношению — зОри, зОрька, зАрево</li><li><b>КЛАН / КЛОН:</b> без ударения <b>О</b> — поклониться, наклоняться; под ударением — клАняться, поклОн</li><li><b>ТВАР / ТВОР:</b> без ударения <b>О</b> — творить, сотворение; под ударением — твАрь, твОрческий</li></ul></div>\n<div class=\"theory-block exceptions\"><h4>Исключения и традиционные написания</h4><p><b>ГАР/ГОР:</b> пригарь, изгарь, выгарки; также словарные выгар, выгарь, гаревой. <b>ТВАР/ТВОР:</b> утварь. <b>ЗАР/ЗОР:</b> в современном правиле безударных исключений нет (правильно <b>заревать</b>, не устаревшее «зоревать»).</p></div>\n<div class=\"theory-block\"><h4>Похожие, но НЕ чередующиеся корни</h4><p><b>гора, подгорный, гористый</b> — горы; <b>горевать</b> — горе; <b>огорчить, горчица</b> — горький; <b>гордиться</b> — гордый; <b>горизонт</b> — словарное; <b>зоркий</b> — ударная О; <b>притворить дверь</b> — створка; <b>отварить овощи</b> — варка; <b>клонировать</b> — другое слово.</p></div>","cons":"<p class=\"lead\">В этих <b>трёх</b> группах чередующихся корней выбор А/О обычно зависит от <b>согласных после гласной</b>.</p>\n<div class=\"theory-block\"><h4>ЛАГ / ЛОЖ</h4><p>Перед <b>Г</b> — <b>А</b>: полагать, прилагательное; перед <b>Ж</b> — <b>О</b>: положить, предложение, расположение.</p><p class=\"exception-line\"><b>Исключение:</b> полог.</p></div>\n<div class=\"theory-block\"><h4>РАСТ / РАЩ / РОС</h4><p>Перед <b>СТ</b> и <b>Щ</b> — <b>А</b>: растение, выращенный, наращение. Перед <b>С</b> без Т — <b>О</b>: росли, заросли, водоросли. В ударных корнях типа <i>рост, нарост, подросток</i> — О.</p><div class=\"exceptions\"><b>Исключения и слова для запоминания:</b> отрасль (отраслевой), росток, Ростов, Ростислав, ростовщик, ростовой, вырост, выростной, выросток, заросток, прорость, подростковый, «на вырост» и производные от этих слов.</div></div>\n<div class=\"theory-block\"><h4>СКАК / СКОЧ (и варианты СКАЧ / СКОК)</h4><p>Перед <b>К</b> в безударном корне — <b>А</b>: скакать, прискакать. Перед <b>Ч</b> в глаголах на <b>-скочить</b> — <b>О</b>: подскочить, выскочка. Под ударением в варианте <b>СКОК</b>: наскок, отскок.</p><p class=\"exception-line\"><b>Исключения перед Ч:</b> скачок, скачу, скачи и другие формы от «скакать» — пишется А.</p></div>","special":"<p class=\"lead\">Здесь две самостоятельные системы, которые важно не потерять среди основных чередований: <b>ПЛАВ/ПЛОВ/ПЛЫВ</b> и <b>А(Я)/ИМ(ИН)</b>.</p>\n<div class=\"theory-block\"><h4>ПЛАВ / ПЛОВ / ПЛЫВ</h4><p>В обычных словах, связанных с плаванием, пишется <b>А</b>: плавать, плавучий, поплавок, плавник.</p><p class=\"exception-line\"><b>Запомни:</b> пловец, пловчиха — <b>О</b>; плывун (подвижный грунт), плывуны — <b>Ы</b>. Не путай с «плавун» (название растения или животного).</p></div>\n<div class=\"theory-block\"><h4>А(Я) / ИМ(ИН)</h4><p>В родственных глагольных формах сочетание <b>ИМ/ИН</b> появляется перед суффиксом <b>-А-</b>: сжать → сжимать; понять → понимать; начать → начинать; поднять → поднимать; отнять → отнимать; обнять → обнимать; внять → внимать; зачать → зачинать.</p><p>Производные тоже участвуют в чередовании: <b>напоминать, внимательный, занимательный, заклинать, приминать</b>. Смотри на морфемный состав и связь с исходным глаголом.</p></div>\n<div class=\"theory-block exceptions\"><h4>Что запомнить</h4><p>Нельзя относить все слова с буквосочетаниями «им» и «ин» к этой группе. Например, <i>мировой, примирение</i> относятся к другой основе; в <i>измерении</i> проверяемая Е, а не чередование МЕР/МИР.</p></div>","hissing":"<p class=\"lead\">После <b>Ж, Ш, Ч, Щ</b> действуют разные правила для сочетаний <b>ЖИ/ШИ, ЧА/ЩА, ЧУ/ЩУ</b> и для ударных <b>О/Ё</b> в корне.</p>\n<div class=\"theory-block\"><h4>И, А, У после шипящих</h4><p><b>ЖИ/ШИ</b> — И: жизнь, шина, шипы. <b>ЧА/ЩА</b> — А: чай, чаща, щавель. <b>ЧУ/ЩУ</b> — У: чудо, щука, щупальца.</p><p class=\"exception-line\"><b>Исключения с Ю:</b> жюри, брошюра, парашют и производные от них; в отдельных иноязычных именах собственных — Жюль, Сент-Жюст, Чюрлёнис. Сочетания с Я возможны в собственных именах типа Мкртчян, Шяуляй.</p></div>\n<div class=\"theory-block\"><h4>О или Ё под ударением в корне</h4><p>Если можно подобрать родственное слово с <b>Е</b> — пиши <b>Ё</b>: жёлтый — желтеть, чёрный — чернеть, шёпот — шепчет, шёрстка — шерсть, печёнка — печень.</p><p>Если такой пары с Е нет, часто пишется <b>О</b>: шорох, шоры, шорник, шоркать, трущоба, крыжовник, чокаться, чопорный, чохом.</p></div>\n<div class=\"theory-block\"><h4>Жечь: различай часть речи</h4><p><b>Глагол, причастие:</b> ожёг руку, поджёг сарай, сожжённое сено — <b>Ё</b>. <b>Существительное:</b> ожог руки, поджог сарая, изжога — <b>О</b>.</p></div>\n<div class=\"theory-block exceptions\"><h4>Словарные написания и имена собственные</h4><p><b>О:</b> шок, шоу, шоссе, шоколад, Шотландия, шорты, капюшон, артишок, анчоус, пижон, мажор, мажордом, шомпол, шовинист, креп-жоржет, боржом, джонка, шероховатый, трещотка, крыжовник, трущоба, шорох, шоры, шорник, шоркать, чокаться, чопорный, чохом.</p><p><b>Ё:</b> шофёр, жонглёр, крюшон, ещё. <b>Имена собственные:</b> Шолохов, Щорс, Печора, Печорин, Ижора; Лихачёв, Пугачёв, Сычёвка; Ромашов, Балашов, Межовск.</p><p>Здесь перечислены слова из теоретического файла; в некоторых заимствованиях выбор О/Ё нельзя вывести только заменой на Е — нужно запоминать написание.</p></div>","ci":"<p class=\"lead\">В <b>корне</b> слова после <b>Ц</b> обычно пишется <b>И</b>: цирк, цифра, цитата, цитрус, циклон, цилиндр, панцирь, Сицилия.</p>\n<div class=\"theory-block exceptions\"><h4>Исключения: Ы</h4><p><b>Цыган, цыплёнок, цыц, на цыпочках</b> и однокоренные: цыганка, цыганить, цыкнуть, цыплячий и др.</p><p class=\"theory-tip\">Запоминалка: «Цыган цыганке цыкнул: „Цыц, цыплёнок, на цыпочки!“»</p></div>\n<div class=\"theory-block\"><h4>Не путай корень с другими частями слова</h4><p>В окончаниях после Ц возможна <b>Ы</b>: молодцы, птицы. В суффиксах существительных на <b>-ЦИЯ</b> и <b>-ЦИЙ</b> — И: декларация, кальций. Это не исключения из правила написания гласной <b>в корне</b>.</p><p>Некоторые собственные имена и фамилии сохраняют традиционное написание с Ы: Цыйша, Цыба, Цыбулько, Цыцык.</p></div>","uncheck":"<p class=\"lead\">Если для гласной в корне <b>нет проверочного слова и нет правила чередования</b>, написание запоминают по орфографическому словарю. В задании № 9 такие слова встречаются наряду с проверяемыми и чередующимися корнями.</p>\n<div class=\"theory-block\"><h4>Примеры из исходных заданий</h4><p>галактика, винегрет, президент, привилегия, компетентный, демократ, тротуар, вестибюль, палисадник, лаборатория, менталитет, корифей, фестиваль, апелляция, панорама.</p><p>Здесь нельзя выдавать случайно похожее слово за проверочное: историческое родство и современное орфографическое правило не одно и то же.</p></div>\n<div class=\"theory-block\"><h4>В этой игре</h4><p>Словарные гласные встречаются <b>в настоящих заданиях ЕГЭ</b> и в разборе ошибки, но в тематические тренировки чередований не добавляются. Для них у нас есть отдельный словарный тренажёр.</p></div>"};
const RULE_ORDER=['checked','suffix','meaning','stress','cons','special','hissing','ci'];
const tg=window.Telegram?.WebApp||null;try{tg?.ready();tg?.expand()}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=s=>String(s||'').replace(/\s+/g,' ').trim();
const norm=s=>String(s||'').trim().toLocaleLowerCase('ru-RU').normalize('NFC').replace(/ё/g,'е');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const idFor=w=>norm(w.full)+'|'+norm(w.mask)+'|'+norm(w.raw).replace(/[()]/g,'');
const pools={};for(const k of RULE_ORDER)pools[k]=[];
const seenPools={};for(const k of RULE_ORDER)seenPools[k]=new Set();
for(const t of TASKS)for(const row of t.rows)for(const w of row.words){const r=w.rule;if(!pools[r])continue;const id=norm(w.full)+'|'+norm(w.mask);if(seenPools[r].has(id))continue;seenPools[r].add(id);pools[r].push(w)}
const store='russian11:ege9-roots:v1:'+String(tg?.initDataUnsafe?.user?.id||'browser');
function load(){try{const x=JSON.parse(localStorage.getItem(store)||'{}');return {total:Number(x.total)||0,correct:Number(x.correct)||0,seen:Array.isArray(x.seen)?x.seen:[],errors:x.errors&&typeof x.errors==='object'?x.errors:{}}}catch{return {total:0,correct:0,seen:[],errors:{}}}}
let progress=load();let state={view:'menu',session:null,selected:new Set(),fillPos:0,fillReview:null,ruleMode:null,ruleList:[],rulePos:0,ruleScore:0,ruleFeedback:null,errorList:[],errorPos:0,errorFeedback:null,sendStatus:''};
function persist(){try{localStorage.setItem(store,JSON.stringify(progress))}catch(e){}}
function updateStats(){$('score-total').textContent=progress.total;$('score-correct').textContent=progress.correct;$('error-count').textContent=Object.keys(progress.errors).length}

function menu(){state.view='menu';const e=Object.keys(progress.errors).length;content(`<div class="section"><div class="panel hero"><div><div class="micro">В корнях сила</div><h2>Главное — держаться корней.</h2><p>Пять настоящих заданий ЕГЭ → ошибочные строки → вставь буквы → разбери правила. Никаких случайно придуманных слов.</p></div><div class="rootglyph" aria-hidden="true">🌿</div></div><div class="menu"><button class="menu-btn" id="start-exam"><span class="menu-ic">📝</span><span><b>Задания ЕГЭ</b><span>Пять заданий · результаты для бота</span></span></button><button class="menu-btn" id="start-errors"><span class="menu-ic">🎯</span><span><b>Отработка моих ошибок</b><span>${e?e+' слов для повторения':'Ошибок пока нет'}</span></span></button><button class="menu-btn" id="open-rules"><span class="menu-ic">📖</span><span><b>Правила (справочник)</b><span>Все корни, условия и исключения</span></span></button><button class="menu-btn" id="open-training"><span class="menu-ic">🌱</span><span><b>Тренировка правил</b><span>По 10 слов из банка на одно правило</span></span></button></div><p class="note" style="margin:12px 3px">В игре ${TASKS.length} проверенных исходных заданий. Только раздел «Задания ЕГЭ» формирует отчёт в Telegram; остальные режимы предназначены для самостоятельной работы.</p></div>`);$('start-exam').onclick=startExam;$('start-errors').onclick=startErrors;$('open-rules').onclick=renderRules;$('open-training').onclick=renderCategories}
function startExam(){let ids=new Set(progress.seen);let available=TASKS.filter(t=>!ids.has(t.id));if(available.length<5){progress.seen=[];available=TASKS;}const items=shuffle(available).slice(0,5);state.session={items,pos:0,answers:[],wrongRows:[],correct:0,failed:[],finished:false,attemptId:String(Date.now())+'-'+Math.floor(Math.random()*1e6),sent:false};state.selected=new Set();state.view='exam';renderExam()}
function renderExam(){state.view='exam';const s=state.session,t=s.items[s.pos];const dots=Array.from({length:5},(_,i)=>`<div class="dot ${i<s.pos?'done':i===s.pos?'current':''}"></div>`).join('');content(`<div class="panel section">${panel('Задания ЕГЭ','Во всех словах выбранной строки должна быть пропущена одна и та же буква.',`№ ${t.id}`)}<div class="progress">${dots}</div><div class="question">Задание ${s.pos+1} из 5. Выбери все подходящие строки.</div><div class="content"><div class="options">${t.rows.map(r=>`<button class="opt ${state.selected.has(r.n)?'sel':''}" data-row="${r.n}"><span class="num">${r.n}</span><span class="words">${esc(r.raw)}</span><span class="check">${state.selected.has(r.n)?'✓':''}</span></button>`).join('')}</div></div><div class="foot"><span class="note">Источник: ${esc(t.source)}. Авторский текст без изменений.</span><button id="commit-exam" class="btn primary">${s.pos===4?'Закончить 5 заданий':'Засчитать и дальше'} →</button></div></div>`);document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{const v=Number(b.dataset.row);if(state.selected.has(v))state.selected.delete(v);else state.selected.add(v);renderExam()});$('commit-exam').onclick=commitExam}
function commitExam(){const s=state.session,t=s.items[s.pos];const answer=[...state.selected].sort().join('');const ok=answer===t.answer;s.answers.push({id:t.id,selected:answer,correct:t.answer,ok});if(ok)s.correct++;for(const r of t.rows){const expected=t.answer.includes(String(r.n)),selected=state.selected.has(r.n);if(expected!==selected)s.wrongRows.push({taskId:t.id,source:t.source,row:r,selected,expected})}if(s.pos<4){s.pos++;state.selected=new Set();renderExam();return} s.finished=true;progress.total+=5;progress.correct+=s.correct;progress.seen.push(...s.items.map(t=>t.id));persist();s.fillPos=0;if(s.wrongRows.length){state.fillPos=0;state.fillReview=null;renderFill()}else renderSummary()}
function renderFill(){state.view='fill';const s=state.session;const item=s.wrongRows[state.fillPos];if(!item){renderSummary();return}const dots=`${state.fillPos+1} из ${s.wrongRows.length}`;const review=state.fillReview;content(`<div class="panel section">${panel('Разберём ошибочную строку','Впиши пропущенную букву в каждое слово. Пропуски взяты без изменений из задания.',dots)}<div class="content"><div class="linecard"><div class="labelbox">Задание № ${esc(item.taskId)} · строка ${item.row.n}</div><p>${esc(item.row.raw)}</p><p class="note">В ЕГЭ ты ${item.selected?'отметил(а)':'не отметил(а)'} эту строку. Нужно было ${item.expected?'отметить':'не отмечать'}.</p></div><div class="maskrow">${item.row.words.map((w,i)=>`<div class="wordcard ${review?(review.results[i].ok?'good':'bad'):''}"><div class="masked">${esc(w.mask)}</div><div class="side">${esc(w.raw!==w.mask?w.raw:'Вставь пропущенную букву')}</div>${review?`<p><span class="${review.results[i].ok?'goodtext':'badtext'}">${review.results[i].ok?'✓':'✕'} ${esc(w.full)} · ${esc(w.letter.toUpperCase())}</span></p>`:`<input class="fill-input" data-n="${i}" maxlength="1" placeholder="Буква" inputmode="text" autocapitalize="none" spellcheck="false" autocomplete="off" aria-label="Буква для ${esc(w.mask)}">`}</div>`).join('')}</div>${review?`<div class="feedback ${review.results.every(x=>x.ok)?'good':'bad'}">${review.results.every(x=>x.ok)?'Все три буквы верны.':'Правильные написания показаны выше.'} <div style="font-size:13px;margin-top:5px">${esc(item.row.explain)}</div></div>`:`<p class="mini-legend">Это проверка именно букв в пропусках, не написания слова целиком. Е и Ё принимаются как одна буква, регистр не важен.</p>`}</div><div class="foot"><span class="note">Этап 2 из 3 · восстановление ошибочных строк</span><button id="fill-next" class="btn primary">${review?'Следующая строка →':'Проверить буквы ✓'}</button></div></div>`);if(!review){document.querySelectorAll('.fill-input').forEach((x,i,a)=>{x.oninput=()=>{if(x.value&&i<a.length-1)a[i+1].focus()};x.onkeydown=e=>{if(e.key==='Enter')$('fill-next').click()}});$('fill-next').onclick=checkFill;document.querySelector('.fill-input')?.focus({preventScroll:true})}else $('fill-next').onclick=()=>{state.fillPos++;state.fillReview=null;renderFill()}}
function checkFill(){const s=state.session;const item=s.wrongRows[state.fillPos];const typed=[...document.querySelectorAll('.fill-input')].map(x=>norm(x.value));const results=item.row.words.map((w,i)=>{const ok=typed[i]===norm(w.letter);const id=idFor(w);if(!ok){progress.errors[id]=w;s.failed.push({word:w,taskId:item.taskId,row:item.row.n})}else if(progress.errors[id])delete progress.errors[id];return {ok,typed:typed[i]}});persist();state.fillReview={results};renderFill()}
function summaryErrRows(s){return s.wrongRows.map(x=>`<details><summary>№ ${esc(x.taskId)} · строка ${x.row.n} · ${esc(x.row.raw)}</summary><p><strong>Правильные написания:</strong> ${esc(x.row.words.map(w=>w.full).join(', '))}</p><p>${esc(x.row.explain)}</p></details>`).join('')}
function renderSummary(){state.view='summary';const s=state.session;const cat=[...new Set(s.wrongRows.flatMap(x=>x.row.words.map(w=>w.rule)).filter(k=>RULE_ORDER.includes(k)))];const failed=s.failed;const counted=new Map();for(const x of failed) counted.set(idFor(x.word),x);content(`<div class="panel section summary-screen">${panel('Результат пяти заданий','Теперь можно разобрать правила и сохранить результат ЕГЭ в боте.','Этап 3 из 3')}<div class="summary-workspace"><div class="summary-details"><div class="summary-grid"><div class="score-card"><strong>${s.correct}/5</strong><small>верно в заданиях ЕГЭ</small></div><div class="score-card"><strong>${s.wrongRows.length}</strong><small>ошибочных строк</small></div></div><div class="separator"></div><h3 style="margin:0 0 9px">Все 5 ответов</h3><div class="rules">${s.answers.map(a=>`<div class="linecard" style="margin:0"><strong>№ ${esc(a.id)} · <span class="${a.ok?'goodtext':'badtext'}">${a.ok?'Верно':'Есть ошибки'}</span></strong><p>Твой ответ: <b>${esc(a.selected||'—')}</b> · Правильный: <b>${esc(a.correct)}</b></p></div>`).join('')}</div><div class="separator"></div><h3 style="margin:0 0 9px">Разбор слов и объяснений</h3>${s.wrongRows.length?summaryErrRows(s):'<div class="feedback good">Все пять экзаменационных заданий решены верно — ошибок в строках нет.</div>'}${counted.size?`<h3>Слова, в которых ошибся при вставке букв</h3><div class="rules">${[...counted.values()].map(x=>`<div class="linecard"><strong class="badtext">${esc(x.word.full)} (пропуск ${esc(x.word.mask)})</strong><p>${esc(x.word.explain || x.word.full)}</p></div>`).join('')}</div>`:'<p class="note">В самостоятельной вставке букв новых ошибок не обнаружено.</p>'}</div><aside class="summary-practice" aria-label="Тренировки по правилам из ошибочных строк"><h3>🌱 Тренировки по правилам</h3>${cat.length?`<p class="note">Из твоих ошибок · по 10 слов из базы</p><div class="rulebuttons">${cat.map(k=>`<button class="rulebut" data-rule="${k}">${esc(RULES[k][0])}<small>${pools[k]?.length||0} слов в банке</small></button>`).join('')}</div>`:'<p class="empty-rules">Все пять заданий решены верно. Тренировки по отдельным правилам доступны в главном меню.</p>'}</aside></div><div class="foot" style="align-items:stretch"><span class="note" id="send-status">${esc(state.sendStatus||'Отправка доступна при запуске игры через Telegram-бота.')}</span><button id="send-result" class="btn gold" ${s.sent?'disabled':''}>${s.sent?'Отправлено':'Отправить результат ЕГЭ боту'}</button><button id="next-round" class="btn primary">Новые 5 заданий</button></div></div>`);document.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>startRule(b.dataset.rule));$('next-round').onclick=startExam;$('send-result').onclick=sendExam}
function sendExam(){const s=state.session;if(!s||!s.finished||s.sent)return;const missed=5-s.correct;const data={v:1,type:'game_result',gameId:'ege9-roots',attemptId:s.attemptId,correct:s.correct,total:5,errors:missed?{'Корни · задание 9':missed}:{},tested:{'Корни · задание 9':5},wrongRows:s.wrongRows.length};if(!tg||!tg.platform||tg.platform==='unknown'||typeof tg.sendData!=='function'){state.sendStatus='Открой игру через кнопку Telegram-бота. В браузере статистика в бот не отправляется.';renderSummary();return}try{tg.sendData(JSON.stringify(data));s.sent=true;state.sendStatus='Отправлено в Telegram. Приём результата зависит от настройки бота.';renderSummary()}catch(e){state.sendStatus='Ошибка отправки: '+String(e.message||e);renderSummary()}}
function renderCategories(){state.view='categories';content(`<div class="panel section">${panel('Тренировка правил','Выбери одно правило. В каждом подходе ровно 10 исходных слов; статистика в бот не отправляется.')}<div class="content"><div class="rules">${RULE_ORDER.map(k=>`<button class="rulebut" style="width:100%" data-cat="${k}">${esc(RULES[k][0])}<small>${pools[k].length} уникальных слов из проверенных заданий</small></button>`).join('')}</div></div><div class="foot"><button class="btn ghost" id="back-home">← Меню</button></div></div>`);document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>startRule(b.dataset.cat));$('back-home').onclick=menu}
function startRule(k){const list=shuffle(pools[k]||[]).slice(0,10);if(!list.length)return;state.ruleMode=k;state.ruleList=list;state.rulePos=0;state.ruleScore=0;state.ruleFeedback=null;renderWordPractice()}
function startErrors(){const list=shuffle(Object.values(progress.errors));if(!list.length){state.view='errors-empty';content(`<div class="panel section">${panel('Отработка моих ошибок','Здесь появятся слова, в которых ты неверно вставил(а) букву.')}<div class="empty">Пока нет слов для отработки. Начни с пяти экзаменационных заданий или тренировки правил.</div><div class="foot"><button class="btn primary" id="back">К меню</button></div></div>`);$('back').onclick=menu;return}state.errorList=list;state.errorPos=0;state.errorFeedback=null;renderErrorPractice()}
function renderErrorPractice(){state.view='errors';const w=state.errorList[state.errorPos];if(!w){startErrors();return}renderOneWord(w,'Отработка моих ошибок',`Слово ${state.errorPos+1} из ${state.errorList.length}`,state.errorFeedback,'error')}
function renderWordPractice(){state.view='practice';const w=state.ruleList[state.rulePos];if(!w){renderPracticeDone();return}renderOneWord(w,RULES[state.ruleMode][0],`Слово ${state.rulePos+1} из ${state.ruleList.length}`,state.ruleFeedback,'rule')}
function renderOneWord(w,title,sub,feedback,mode){content(`<div class="panel section">${panel(title,sub,'Вставь букву')}<div class="content" style="display:flex;flex-direction:column;justify-content:center"><div class="linecard" style="padding:24px;text-align:center"><div class="micro" style="margin-bottom:10px">Исходное слово из банка ЕГЭ</div><div style="font-size:clamp(31px,5.3vw,65px);font-weight:910;overflow-wrap:anywhere">${esc(w.mask)}</div>${w.raw!==w.mask?`<p style="font-size:clamp(14px,1.4vw,20px)">${esc(w.raw)}</p>`:''}<p class="note">Вставь только пропущенную букву.</p>${feedback?`<div class="feedback ${feedback.ok?'good':'bad'}">${feedback.ok?'✓ Верно!':'✕ Ошибка.'} <strong>${esc(w.full)}</strong> — ${esc(w.letter.toUpperCase())}<div class="note" style="margin-top:6px">${esc(w.explain||'Объяснение в оригинальном задании отсутствует.')}</div></div>`:`<div style="max-width:220px;margin:20px auto 0"><input id="letter" maxlength="1" spellcheck="false" autocorrect="off" autocapitalize="none" autocomplete="off" style="width:100%;padding:12px;background:#09221b;border:2px solid #5c9c76;border-radius:13px;color:#fff;font-size:31px;font-weight:900;text-align:center" placeholder="Буква" aria-label="Пропущенная буква"></div>`}</div></div><div class="foot"><span class="note">${mode==='rule'?'Учебная тренировка: без отправки в бот.':'Правильный ответ убирает слово из очереди ошибок.'}</span><button class="btn primary" id="check-word">${feedback?'Следующее слово →':'Проверить букву ✓'}</button></div></div>`);if(!feedback){$('letter').onkeydown=e=>{if(e.key==='Enter')$('check-word').click()};$('letter').focus({preventScroll:true})} $('check-word').onclick=()=>feedback?advanceWord(mode):checkWord(mode)}
function checkWord(mode){const w=mode==='rule'?state.ruleList[state.rulePos]:state.errorList[state.errorPos];const v=norm($('letter').value);const ok=v===norm(w.letter);const key=idFor(w);if(ok)delete progress.errors[key];else progress.errors[key]=w;persist();if(mode==='rule'){state.ruleFeedback={ok};if(ok)state.ruleScore++;renderWordPractice()}else{state.errorFeedback={ok};renderErrorPractice()}}
function advanceWord(mode){if(mode==='rule'){state.rulePos++;state.ruleFeedback=null;renderWordPractice()}else{state.errorPos++;state.errorFeedback=null;renderErrorPractice()}}
function renderPracticeDone(){state.view='practice-done';content(`<div class="panel section">${panel('Тренировка завершена',RULES[state.ruleMode][0])}<div class="score-card"><strong>${state.ruleScore}/10</strong><small>верных букв</small></div><div class="feedback">Результат этой тренировки не отправляется в Telegram. Слова с ошибками добавлены в раздел «Отработка моих ошибок».</div><div class="foot"><button class="btn ghost" id="new-cat">Другие правила</button><button class="btn primary" id="again">Повторить 10 слов</button></div></div>`);$('new-cat').onclick=renderCategories;$('again').onclick=()=>startRule(state.ruleMode)}
function renderRules(){
 state.view='rules';
 const training=RULE_ORDER.map(k=>`<button class="rulebut" data-ref-rule="${k}" title="Открыть тренировку из 10 слов">${esc(RULES[k][0])}<small>${pools[k].length} слов · 10 за подход</small></button>`).join('');
 const notes=Object.entries(RULES).map(([k,v])=>`<article class="rule guide-card" id="rule-${k}"><h3>${esc(v[0])}</h3><div class="rule-explain">${RULE_GUIDES[k]}</div>${pools[k]?.length?`<p class="ex">Из наших заданий: ${esc(pools[k].slice(0,4).map(w=>w.full).join(' · '))}</p>`:''}</article>`).join('');
 content(`<div class="panel section rules-screen">${panel('Правила: подробный справочник','Все корни с чередованием, условия выбора букв и исключения. Тренировки всегда справа или сверху.')}
 <div class="rules-workspace"><div class="rules-reader" tabindex="0" aria-label="Справочник по корням"><p class="theory-origin">По теории № 9 из прикреплённого файла (стр. 2–7); отдельные сложные случаи сверены с «Грамотой.ру» и академическими правилами.</p><div class="rules">${notes}</div></div>
 <aside class="rules-quicknav" aria-label="Всегда доступные тренировки"><h3>🌱 Тренировки по правилам</h3><p class="note">Выбери группу — 10 слов из базы. На телефоне листай список вправо →</p><div class="rulebuttons">${training}</div></aside></div>
 <div class="foot rules-bottom"><span class="note">Справочник прокручивается отдельно от панели тренировок.</span><button class="btn ghost" id="back">← К меню</button></div></div>`);
 document.querySelectorAll('[data-ref-rule]').forEach(b=>b.onclick=()=>startRule(b.dataset.refRule));
 $('back').onclick=menu;
}
$('home').onclick=menu;$('help').onclick=()=>{const text=`Как играть?\n\n1. «Задания ЕГЭ»: реши 5 настоящих заданий № 9, отмечая номера подходящих строк.\n2. После пятого задания вставь буквы в строки, где был неверный выбор.\n3. Посмотри авторские объяснения и пройди отдельные тесты по правилам.\n4. «Отработка моих ошибок»: по одному слову, до верного ответа.\n5. «Тренировка правил»: 10 слов из источников на выбранное правило.\n\nТолько результат пяти экзаменационных заданий можно отправить Telegram-боту кнопкой в конце. Браузерный результат остаётся на устройстве; для серверной записи бот должен поддерживать gameId ege9-roots.\n\nВсе тексты и исходные пропуски взяты из пяти файлов преподавателя; задания с неполными решениями в игру не включены.`;alert(text)};
menu();
</script></body></html>
