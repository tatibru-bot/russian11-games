</style><script src="https://telegram.org/js/telegram-web-app.js"></script><style>.menu-cards{grid-template-columns:1fr!important;max-width:730px;margin:0 auto;width:100%}.menu-card{min-height:0}</style></head><body><div id="app"><header class="header"><div class="logo"><span class="symbol">,</span><div><div class="brand">Запятые без ошибок</div><div class="brand-short" style="display:none">Запятые</div><div class="subtitle" id="status">Два режима работы</div></div></div><div class="header-right"><span class="score" id="score"></span><button class="ghost" id="topHelp">? Справка</button><button class="ghost" id="home">⌂ Меню</button></div></header><div class="progress"><div id="progress"></div></div><main id="main"></main></div><div class="overlay" id="dialogBack" aria-hidden="true"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle">Разбор</h2><button class="dialog-close" id="dialogClose" aria-label="Закрыть">×</button></div><div class="dialog-body" id="dialogContent"></div><div class="dialog-foot"><button class="primary" id="dialogButton">Продолжить →</button></div></div></div><script>const APP_DATA={"CONFIG":{"topic":"Запятые","title":"Запятые без ошибок","counts":[10,20,40,94],"defaultLength":10},"DATA":[{"id":"14968","answers":[[2,8]],"full":[{"n":1,"text":"Чудско-Псковское озеро, будучи третьим по величине на территории Европы, представляет собой озёрный комплекс."},{"n":2,"text":"Этот комплекс, расположенный на границе Ленинградской и Псковской областей и Эстонии, состоит из трёх частей."},{"n":3,"text":"Их иногда называют отдельными озёрами: Псковское, Чудское, Среднее."},{"n":4,"text":"Общая длина комплекса составляет 150 километров, ширина — 50 километров, общая площадь поверхности — 3550 квадратных километров."},{"n":5,"text":"Общая глубина озера составляет 6 метров — оно мелководно."},{"n":6,"text":"География озера обширна: в него впадает более 30 рек, а вытекает только одна — Нарва."},{"n":7,"text":"Для него характерны болотистые низменные берега; местами можно встретить поросшие соснами холмы и дюны."},{"n":8,"text":"Самый крупный город, построенный на российском побережье Чудско-Псковского озера, — Гдов."},{"n":9,"text":"На Чудско-Псковском озере располагаются 29 островов (обитаем только один из них), 22 из которых находятся на территории Чудского озера."}],"cat":"DET","originalAnswers":[[2,8]]},{"id":"18113","answers":[[3,4,5,6,7,9]],"full":[{"n":1,"text":"Холм на берегу реки Чепца является одним из красивейших мест Удмуртии, с него открывается великолепный вид на окрестности: далеко внизу петляет река, к горизонту мягкими волнами поднимаются холмы, поросшие елями."},{"n":2,"text":"До наших дней дошло множество легенд о происхождении названия этой горы, и, по преданиям, у горы Байгурезь было два названия."},{"n":3,"text":"Первое — Байгурезь, которое в переводе с удмуртского значит «богатая гора»."},{"n":4,"text":"Второе название горы — Бакгурезь, что означает «немая гора»."},{"n":5,"text":"Легенда гласит, будто давным-давно у подножия горы жил богатый мельник, у которого была одна дочь."},{"n":6,"text":"Когда пришла пора выдавать девушку замуж, мельник заявил, что дочь свою отдаст только за того человека, который поднимется на гору по самому крутояру."},{"n":7,"text":"Никто из претендентов не смог покорить гордую гору, поскольку не знал о том, что у духа горы нужно попросить благословения."},{"n":8,"text":"А в одной из окрестных деревень жил юноша: ловкий, красивый, умный, но глухонемой."},{"n":9,"text":"Когда он попросил руки дочери мельника, тот указал ему на гору — юноша попросил благословения и, быстро забравшись на вершину, чудесным образом якобы обрёл дар речи."}],"cat":"SPP","originalAnswers":[[3,4,5,6,7,9]]},{"id":"18192","answers":[[4,5,6,7]],"full":[{"n":1,"text":"Гора Спящий лев, или Омулёвка, представляет собой высокий утёс, расположенный на правом берегу реки Селенги в 45 км к юго-западу от города Улан-Удэ."},{"n":2,"text":"Исконное бурятское название горы — Хабсагай хада — означает «скала» или «утёс»."},{"n":3,"text":"Современные же русскоязычные названия, напротив, имеют свою историю."},{"n":4,"text":"Омулевой её назвали потому, что в недавнем прошлом в Селенгу в нерестовый период заходил омуль, проходя вверх по течению у этих скал."},{"n":5,"text":"Рыбаки наблюдали с этой горы, где в реке идут «бурления», и ставили туда неводы."},{"n":6,"text":"Второе название гора приобрела из-за своего внешнего вида: её очертания очень похожи на льва, который смотрит в сторону села Тарбагатай."},{"n":7,"text":"Если вглядеться в скалу, можно увидеть, что гриву льва составляют каменные выступы, тело создаёт плавный склон с редкими растениями, а хвост имитирует дорога у подножия горы."}],"cat":"SPP","originalAnswers":[[4,5,6,7]]},{"id":"18220","answers":[[5,6]],"full":[{"n":1,"text":"Кроноцкий заповедник, расположенный на территории Камчатского края, для туристов является почти синонимом Долины гейзеров."},{"n":2,"text":"При этом, отметим, открытие самой Долины произошло много позже основания заповедника."},{"n":3,"text":"Честь открытия выпала геологу Т. И. Устиновой: в 1941 году она и Анисифор Крупенин, камчатский абориген, во время исследования территории заповедника наткнулись на один из гейзеров."},{"n":4,"text":"Сейчас Долина гейзеров на Камчатке, являясь самой концентрированной территорией термальных источников, известна по всему миру."},{"n":5,"text":"Здесь сосредоточено больше сорока гейзеров, здесь же сформирована одна из самых изучаемых экологических систем полуострова."},{"n":6,"text":"Долина не раз меняла свой первоначальный облик в связи с природными катастрофами, одна из них произошла в июне 2007 года."},{"n":7,"text":"В результате этой катастрофы основная часть гейзеров была затоплена, однако спустя несколько лет гейзерные источники ожили."}],"cat":"BSP","originalAnswers":[[5,6]]},{"id":"18956","answers":[[1,2,8]],"full":[{"n":1,"text":"Ключевская сопка — типичный стратовулкан, он имеет конусообразную форму."},{"n":2,"text":"Высота этого камчатского вулкана меняется от 4750 до 4850 м и больше над уровнем моря, это самый высокий из действующих вулканов Азии и Европы."},{"n":3,"text":"По активности Ключевской вулкан уступает только Карымскому, но во много раз превосходит его силой извержений."},{"n":4,"text":"Наиболее сильные из них происходят через вершинный кратер, который имеет воронкообразную форму и полностью заполняется лавой и шлаками, а в центре его начинает расти новый внутрикратерный конус, иногда перекрывающий кромки основной воронки и увеличивающий высоту вулкана."},{"n":5,"text":"Наиболее сильные извержения вершинного кратера Ключевского вулкана наблюдались с 1978 по 1993 год."},{"n":6,"text":"Однако они продолжаются и в настоящее время."},{"n":7,"text":"Раз в 5 — 6 лет, накопив запас энергии, вулкан вступает в очередную активную фазу своей деятельности."},{"n":8,"text":"Непрерывно следуют друг за другом мощные взрывы, тысячами вылетают раскалённые вулканические бомбы, текут по склонам светящиеся потоки лавы, пепловые тучи поднимаются на многие километры."}],"cat":"BSP","originalAnswers":[[1,2,8]]},{"id":"19041","answers":[[1,2,4,6,8]],"full":[{"n":1,"text":"Двуглавая гора Эльбрус, расположенная на самой границе республик Кабардино-Балкария и Карачаево-Черкесия, — самая высокая точка России."},{"n":2,"text":"Эльбрус представляет собой конус потухшего вулкана, извергавшегося последний раз в начале нашей эры."},{"n":3,"text":"По легенде, именно сюда привели аргонавтов поиски золотого руна и именно здесь был цепями прикован титан Прометей за то, что посмел принести огонь людям."},{"n":4,"text":"Склоны горы, сформировавшейся около миллиона лет назад, в большинстве своём имеют пологий характер, но начиная с высоты 4000 метров средний угол наклона достигает 35 градусов."},{"n":5,"text":"Легендарная гора всегда притягивала людей своей таинственной красотой, сверкающие ледники южной стороны Приэльбрусья давно облюбовали горнолыжники и альпинисты."},{"n":6,"text":"Первая географическая карта Эльбруса была составлена в 1890 году русским военным топографом Андреем Пастуховым, совершившим первое восхождение без проводников."},{"n":7,"text":"Вулкан Эльбрус не напоминал о себе почти две тысячи лет, однако считается не потухшим, а спящим."},{"n":8,"text":"В его глубинах до сих пор находятся горячие массы, нагревающие местные «горячие нарзаны» — источники, насыщенные минеральными солями и углекислым газом."}],"cat":"DET","originalAnswers":[[1,2,4,6,8]]},{"id":"28367","answers":[[2,4]],"full":[{"n":1,"text":"Лосиный Остров — один из первых национальных парков в России, он образован 24 августа 1983 года."},{"n":2,"text":"Национальный парк — это категория особо охраняемых природных территорий, нацеленная на сохранение природных и культурных ландшафтов, редких видов и эталонных экосистем с их использованием в рекреационных и просветительских целях."},{"n":3,"text":"Лосиный Остров, являясь мозаикой природных и преобразованных человеком экосистем, позволяет существовать на этой, по сути дела, замкнутой территории видам с очень разными жизненными потребностями."},{"n":4,"text":"В историческом плане национальный парк — это удивительное сочетание культурных ландшафтов, сохранивших черты разных эпох."},{"n":5,"text":"В окрестностях Лосиного Острова люди селились издавна и охотно, однако сам Лосиный Остров начал обживаться сравнительно поздно: места здесь были болотистые и неудобные для жизни."},{"n":6,"text":"С XIV в., когда набеги Орды согнали население Руси на север, когда Русь начала собираться вокруг Москвы, в Лосином Острове начали селиться плотно; пик заселения пришёлся на XV–XVI вв."},{"n":7,"text":"В XVI–XVII вв. здесь находились царские охотничьи угодья."}],"cat":"DET","originalAnswers":[[2,4]]},{"id":"29826","answers":[[2,3,6]],"full":[{"n":1,"text":"Столбы выветривания — одно из семи чудес России – находятся в Троицко-Печорском районе республики Коми — в междуречье рек Печора и Ичетляга."},{"n":2,"text":"Это красивое и загадочное место Северного Урала имеет несколько названий: Маньпупунёр, Мань-Пупыг-Нёр, Болвано-Из, мансийские болваны, а туристы обычно называют их кратко — «Пупы»."},{"n":3,"text":"Всего каменных столбов семь: шесть из них выстроились на ровном плато в ряд, а один стоит чуть в стороне."},{"n":4,"text":"Высота столбов, имеющих причудливые очертания, составляет от 30 до 42 метров."},{"n":5,"text":"Девственная красота этого места сохранилась благодаря его отдалённости и труднодоступности, поскольку в радиусе сотни километров нет никаких населённых пунктов."},{"n":6,"text":"Поход на Маньпупунёр для неподготовленных людей возможен только при заброске и выброске на вертолёте, а в случае пешего похода добраться до столбов удастся лишь хорошо подготовленным туристам."}],"cat":"SSP","originalAnswers":[[2,3,6]]},{"id":"29853","answers":[[2,3]],"full":[{"n":1,"text":"Эгикал — один из крупнейших средневековых башенных комплексов горной Ингушетии, расположен он на южном склоне горы Цей-Лоам в двух километрах от реки Ассы."},{"n":2,"text":"До депортации ингушей в 1944 году в селении Эгикал жили люди, а сегодня Эгикал — необитаемый башенный комплекс, музей под открытым небом, законсервированный древний город."},{"n":3,"text":"Когда-то селение славилось потомственными ремесленниками: оружейниками, кузнецами, гончарами, ювелирами, а также отважными воинами и знатоками народной медицины."},{"n":4,"text":"Из Эгикала вышли десятки известных в Ингушетии фамилий и талантливых людей, прославивших его; один из них — классик ингушской литературы Идрис Муртузович Базоркин, похороненный здесь же на родовом кладбище."},{"n":5,"text":"Всего на территории горной Ингушетии насчитывается около 500 памятников традиционной архитектуры."},{"n":6,"text":"Они охраняются государством и относятся к Джейрахо-Ассинскому историко архитектурному и природному музею-заповеднику."},{"n":7,"text":"Как правило, около каждого башенного комплекса установлены информационные стенды с названием и датировкой."}],"cat":"HOM","originalAnswers":[[2,3]],"notes":{"2":"Запятые разделяют однородные наименования: «комплекс, музей ..., ... город». Кроме того, запятая перед «а» связывает части ССП.","3":"Перечисляются однородные дополнения: «оружейниками, кузнецами, гончарами, ювелирами...»."}},{"id":"33937","answers":[[3,5,7]],"full":[{"n":1,"text":"Завидовский государственный заповедник расположен на территории Московской и Тверской областей, занимая площадь около 125 000 га."},{"n":2,"text":"По оценкам ЮНЕСКО, это одно из самых экологически чистых мест на земле."},{"n":3,"text":"Животный мир заповедника необыкновенно богат: здесь обитают бурый медведь, пятнистые олени, маралы, бобры, еноты, горностаи."},{"n":4,"text":"Осенью на завидовских полях перед перелётом в Африку собираются серые журавли, а весной здесь останавливается до 5000 гусей и лебедей, возвращающихся с зимовки в тёплых краях."},{"n":5,"text":"На территории заповедника преобладают смешанные леса; в них скрыто множество болот, озёр и небольших рек."},{"n":6,"text":"Неоднородно и ландшафтное окружение национального парка: с юга и севера он окружён густонаселёнными сельскохозяйственными территориями, с востока и запада его леса имеют плавные переходы в сопредельные лесничества."},{"n":7,"text":"Территория заповедника подразделяется на три категории: никем не охраняемую, просто охраняемую и особо охраняемую."},{"n":8,"text":"На особо охраняемой территории находится государственная резиденция «Русь» и комплекс отдыха, который принадлежит Главному управлению дипломатического корпуса МИД России."}],"cat":"HOM","originalAnswers":[[3,5,7]]},{"id":"34100","answers":[[2,4,5,7,8]],"full":[{"n":1,"text":"Остров Врангеля — российский остров в Северном Ледовитом океане между Восточно-Сибирским и Чукотским морями, назван он в честь российского мореплавателя и государственного деятеля XIX века Фердинанда Петровича Врангеля."},{"n":2,"text":"Этот остров входит в состав одноимённого заповедника, который является объектом всемирного наследия ЮНЕСКО."},{"n":3,"text":"Постоянно обитают на острове белый медведь, песец, росомаха, волк, сибирский лемминг, лемминг Виноградова, северный олень, овцебык; временами заходит красная лисица."},{"n":4,"text":"Археологические находки в районе стоянки Чёртов овраг свидетельствуют о том, что первые люди (палеоэскимосы) охотились на острове ещё за 1750 лет до н. э."},{"n":5,"text":"В это время здесь ещё могли встречаться последние мамонты — представители особой карликовой разновидности, хотя прямые доказательства их взаимодействия с древнейшим населением острова пока не обнаружены."},{"n":6,"text":"По предположениям учёных, ко времени открытия острова европейцами он был необитаем."},{"n":7,"text":"Тем не менее существуют серьёзные основания полагать, что как минимум до начала XIX века остров служил перевалочным пунктом, обеспечивавшим связь между эскимосами Аляски и арктического побережья Чукотки, и что на нём могли существовать устойчивые поселения с этнически неоднородными обитателями."},{"n":8,"text":"Из ряда источников известен следующий факт: на западном побережье острова в 30-х годах ХХ века были обнаружены остатки нескольких жилищ — свидетельство проживания осёдлых племён коренных жителей Чукотки, которые оставили следы своего пребывания в виде жилищ и предметов: изделий из дерева и кости."}],"cat":"SPP","originalAnswers":[[2,4,5,7,8]]},{"id":"34165","answers":[[2,3,5,7]],"full":[{"n":1,"text":"Великий Устюг, с 1999 года ставший именоваться родиной российского Деда Мороза, является местом очень древним и самобытным, он имеет богатую историю и обладает уникальной архитектурой."},{"n":2,"text":"Основан Устюг был в XIII веке в устье реки Юг, от которой и получил своё название."},{"n":3,"text":"А слово «Великий» добавилось во времена Ивана Грозного, когда город вошёл в список опричных — то есть регионов-доноров, которые подпитывали государственный бюджет."},{"n":4,"text":"Со временем торговые пути сместились к Балтийскому морю, и Устюг утратил своё значение в масштабах империи."},{"n":5,"text":"После того как в Великом Устюге открылся дом Деда Мороза и в город ежегодно начали приезжать сотни тысяч туристов за особой новогодней атмосферой, появилась развитая инфраструктура для отдыха и веселья."},{"n":6,"text":"Там можно отдохнуть, покатавшись на санях, ватрушках, аттракционах, или посетить зоопарк Дедушки Мороза."},{"n":7,"text":"Кроме того, можно пройтись по музеям и историческим местам, которых в городе насчитывается более 20."}],"cat":"SPP","originalAnswers":[[2,3,5,7]]},{"id":"35458","answers":[[2,3,5,6]],"full":[{"n":1,"text":"Ординская пещера является самой длинной гипсовой пещерой России, она широко известна своими подводными красотами."},{"n":2,"text":"Расположена пещера на левом берегу реки Кунгур, а своё название она получила по близлежащему селу Орда."},{"n":3,"text":"Местным жителям пещера известна давно, однако первые серьёзные исследования пещеры относятся лишь к началу 1990-х годов, когда была изучена и закартирована сухая часть пещеры."},{"n":4,"text":"Первые подводные исследования проведены в марте 1994 года."},{"n":5,"text":"В декабре 1997 года была организована первая всероссийская спелеоподводная экспедиция, и в итоге обследованная длина пещеры достигла 1250 метров."},{"n":6,"text":"По последним данным, длина Ординской пещеры достигает 5100 метров, а протяжённость сухой части при этом составляет лишь 300 метров."},{"n":7,"text":"По длине Ординская пещера находится на четвёртом месте в Пермском крае после Дивьей (10,1 км), Кизеловской (7,6 км) и Кунгурской ледяной (5,7 км)."},{"n":8,"text":"В пещере есть несколько озёр, соединяющихся с подводной частью пещеры."}],"cat":"SSP","originalAnswers":[[2,3,5,6]]},{"id":"35512","answers":[[1,3]],"full":[{"n":1,"text":"Эльто́н — бессточное солёное озеро в Палласовском районе Волгоградской области, это самое большое по площади минеральное озеро Европы и одно из самых минерализованных в мире."},{"n":2,"text":"Название озера, возможно, произошло от монгольского «Алтын-Нор» — «золотое дно»."},{"n":3,"text":"Озеро представляет собой впадину между крупными соляными куполами на крайнем севере Прикаспийской низменности, оно округлой формы, а вода его имеет золотисто-розовый оттенок."},{"n":4,"text":"Минерализация озера Эльтон очень высокая: солёность в полтора раза превышает концентрацию солей на Мёртвом море."},{"n":5,"text":"Вокруг Эльтона сохранились большие по площади участки опустыненных степей Северного Прикаспия, которые словно тянутся до горизонта."},{"n":6,"text":"В долинах рек, в верхнем и среднем течении, среди тростниковых зарослей находят убежища водные и околоводные животные."},{"n":7,"text":"В устьях в весенний и осенний период можно увидеть тысячи мигрирующих птиц, принадлежащих к разным видам куликов и семейства утиных."},{"n":8,"text":"Несмотря на огромное природоохранное значение, Приэльтонье на данный момент характеризуется комплексом экологических и социально-экономических проблем."}],"cat":"BSP","originalAnswers":[[1,3]]},{"id":"36122","answers":[[5,6,8]],"full":[{"n":1,"text":"Биография Гавриила Абрамовича Илизарова, известного хирурга-ортопеда, тесно связана с Зауральем."},{"n":2,"text":"Получив диплом врача, Илизаров прошёл путь от сельского врача до директора Курганского научно-исследовательского института экспериментальной и клинической ортопедии и травматологии."},{"n":3,"text":"Он был высококвалифицированным доктором и талантливым учёным, разработавшим принципиально новые методы лечения травматологических и ортопедических заболеваний."},{"n":4,"text":"В 1951 году он сконструировал свой первый аппарат, с помощью которого можно было бескровно лечить все закрытые и открытые переломы длинных трубчатых костей."},{"n":5,"text":"Кроме того, с помощью этого аппарата стало возможным возмещать большие дефекты мягких тканей и кости при свежих переломах без пересадки костных тканей, ликвидировать большие укорочения, устранять деформации различных костей и суставов."},{"n":6,"text":"Метод Илизарова используется не только в нашей стране, но и за рубежом."},{"n":7,"text":"Г. А. Илизаров — автор более 600 научных работ."},{"n":8,"text":"Об Илизарове написаны статьи, художественные очерки, романы и повести, он стал героем или прототипом многих художественных фильмов, театральных постановок."}],"cat":"HOM","originalAnswers":[[5,6,8]]},{"id":"36170","answers":[[4,5,9]],"full":[{"n":1,"text":"Горная гряда Сихотэ-Алинь растянулась вдоль побережья Японского моря в Приморском и Хабаровском краях, хребты и отроги горного комплекса формировались в эпоху мезозоя в результате повышенной тектонической активности."},{"n":2,"text":"Огнедышащие вулканы со временем преобразовались в пологие холмы, а прежнее вулканическое поле послужило основой хребта из песчано-сланцевых отложений с вкраплениями магмы."},{"n":3,"text":"В горах Сихотэ-Алиня расположено несколько крупных природоохранных зон."},{"n":4,"text":"В их числе — Национальный парк «Анюйский», Ботчинский государственный природный заповедник, Лазовский государственный природный заповедник им. Л. Г. Капланова, Сихотэ-Алинский государственный биосферный заповедник."},{"n":5,"text":"На заповедной территории уживаются южные и северные млекопитающие: амурский тигр и рысь, гималайский и бурый медведи."},{"n":6,"text":"Хотя в настоящее время горные районы Сихотэ-Алиня остаются почти не заселёнными человеком, на одном из плато обнаружены остатки поселений эпохи Бохайского царства, датируемые VI−IX веками."},{"n":7,"text":"В начале XX века Владимир Арсеньев, путешественник и этнограф, трижды пересек Сихотэ-Алинь."},{"n":8,"text":"Он первый описал особенности флоры и подчеркнул редкое многообразие природных систем горных лесов."},{"n":9,"text":"Кроме того, благодаря серии книг Арсеньева удалось привлечь интерес к изучению и посещению гор Сихотэ-Алиня, сделать их достопримечательностью Дальнего Востока."}],"cat":"HOM","originalAnswers":[[4,5,9]]},{"id":"37068","answers":[[3,5,6]],"full":[{"n":1,"text":"Водопад Кивач, расположенный на реке Суне в центральной части Карелии, — второй по величине равнинный водопад Европы, вокруг него находится одноимённый природный заповедник."},{"n":2,"text":"Кивач невероятно красив и величественен: сжатые базальтовыми скалами воды реки Суны с восьмиметровой высоты тяжёлым литым потоком обрушиваются вниз, образуют мощный водоворот и создают впечатляющий шум."},{"n":3,"text":"Карельская легенда о возникновении водопада Кивач рассказывает о двух реках-сёстрах, Суне и Шуе, которые никак не хотели расстаться друг с другом и всё время текли рядом."},{"n":4,"text":"Однажды уставшая Суна уступила сестре более удобное русло и прилегла отдохнуть."},{"n":5,"text":"Проснувшись, она с удивлением обнаружила, что Шуя унеслась далеко-далеко вперёд, и бросилась догонять её, сметая всё на своём пути."},{"n":6,"text":"Там, где Суна пробила скалы и раздробила каменные глыбы, возник водопад Кивач."}],"cat":"SPP","originalAnswers":[[3,5,6]]},{"id":"37953","answers":[[1,3,4]],"full":[{"n":1,"text":"Башкирские шиханы (особого рода холмы) находятся в Башкирском Предуралье, недалеко от трёх городов: Стерлитамака, Салавата и Ишимбая."},{"n":2,"text":"Холмы эти образовались более 260 миллионов лет назад: в палеозойскую эру современные Шиханы были рифами, поскольку тогда в этой местности было тёплое море."},{"n":3,"text":"Учёные обнаруживают в скалистых частях Шихан фрагменты древних животных и моллюсков, кораллов и водорослей."},{"n":4,"text":"Ещё в первой половине XX века Шиханы состояли из четырёх гор: Торатау, Шахтау, Юрактау и Куштау."},{"n":5,"text":"Но в 1950-х годах на месте Шахтау стали добывать известняк, и гора практически исчезла."},{"n":6,"text":"Пожалуй, самая знаменитая гора Башкирских шихан — Торатау, в переводе с башкирского это означает «крепость-гора»."},{"n":7,"text":"Издревле её прозвали Землёй Юрматы по одноимённому названию племени, проживав- шего здесь."},{"n":8,"text":"Гора считалась священной: здесь проводили культовые обряды, восхваляя божество тюркских народов — бога неба Кук-Тарахэ."}],"cat":"HOM","originalAnswers":[[1,3,4]]},{"id":"37980","answers":[[1,5,6]],"full":[{"n":1,"text":"Соловецкий архипелаг, состоящий из шести крупных островов и более ста малых островков, расположен между Карельским Поморьем и Летним берегом Белого моря на входе в Онежскую губу."},{"n":2,"text":"Важную роль в формировании рельефа архипелага сыграл ледник, а благодаря географическому расположению на архипелаге сформировался собственный микро- климат."},{"n":3,"text":"Бо́льшая часть Соловецкого архипелага покрыта лесами, в этих местах можно полюбоваться на рощи «танцующих» берёз."},{"n":4,"text":"Дело в том, что тонкие северные деревья принимают причудливые формы под воздействием постоянных ветров и снега."},{"n":5,"text":"История архипелага насчитывает около 7 тысяч лет; здесь находится более тысячи памятников археологии и более 250 историко-архитектурных памятников, связанных с историей Соловецкого монастыря."},{"n":6,"text":"Самые загадочные среди них — святилища III−II тысячелетий до нашей эры со знаменитыми лабиринтами, находящимися в центре языческих капищ."},{"n":7,"text":"На данный момент территория архипелага, а также прилегающая акватория признаны заповедником."},{"n":8,"text":"В 1994 году памятники Соловков и музея-заповедника были признаны особо ценными объектами природного и исторического наследия России — их включили в «Список Всемирного наследия» ЮНЕСКО."}],"cat":"DET","originalAnswers":[[1,5,6]]},{"id":"39757","answers":[[2,3,4,6,7,8]],"full":[{"n":1,"text":"В центре пустыни Каракумы, расположенной на территории Туркмении, находятся «Врата Ада»."},{"n":2,"text":"Именно так местные жители прозвали газовый кратер Дарвазу, диаметр которого составляет около 60 метров и глубина — около 20 метров."},{"n":3,"text":"Кратер образовался в 1971 году, когда геологи занимались исследованиями этой местности."},{"n":4,"text":"Во время бурения разведочной скважины земля внезапно просела (под поверхностью оказалась пустота), и образовался большой провал, из которого наружу стал просачиваться газ."},{"n":5,"text":"К счастью, при обвале никто из исследователей не пострадал."},{"n":6,"text":"А для того чтобы вредный газ не отравлял людей и живущих поблизости животных, было решено выжечь его."},{"n":7,"text":"После того как кратер подожгли, ожидалось, что выходящий газ иссякнет через несколько дней; однако горение Дарвазы не прекращается и сегодня."},{"n":8,"text":"В ноябре 2013 года известный путешественник и исследователь Джордж Коронис из Канады спустился на дно раскалённого кратера для проведения исследований и сбора образцов, в результате чего ему удалось найти там живые бактерии."},{"n":9,"text":"Эти бактерии на данный момент больше нигде на поверхности Земли не обнаружены."}],"cat":"SPP","originalAnswers":[[2,3,4,6,7,8]]},{"id":"39793","answers":[[2,4,5,6,7]],"full":[{"n":1,"text":"В 1987 году на юге Челябинской области во время строительства водохранилища был обнаружен относящийся к эпохе бронзы уникальный памятник прекрасной сохранности — укреплённое поселение раннегородского типа Аркаим."},{"n":2,"text":"Своё имя Аркаим получил от горы, что находится неподалёку."},{"n":3,"text":"В ходе изучения выяснилось следующее: памятник представлял собой посёлок, созданный по заранее продуманному плану, с чёткой градостроительной идеей, сложной архитектурой."},{"n":4,"text":"В течение нескольких последующих лет было обнаружено ещё 20 таких поселений, и это позволило вести речь об открытии интереснейшей древней культуры, которая получила условное название «Страна городов»."},{"n":5,"text":"Открытие Аркаима стало значимым событием для науки, поскольку благодаря ему историки скорректировали свои представления о путях миграции индо-европейцев."},{"n":6,"text":"Кроме того, это позволило доказать, что 4 тысячи лет назад в южно-уральских степях существовала достаточно высокоразвитая культура."},{"n":7,"text":"Аркаимцы, основу хозяйства которых составляло скотоводство, занимались также металлургией и металлообработкой."}],"cat":"SPP","originalAnswers":[[2,4,5,6,7]]},{"id":"43713","answers":[[1,2,3,4,5,7]],"full":[{"n":1,"text":"Казань — столица Республики Татарстан — древний город с многовековой историей, расположенный на левом берегу реки Волги."},{"n":2,"text":"Существует несколько легенд, связанных с названием города."},{"n":3,"text":"По самой распространённой из них Казань происходит от татарского слова «казан» — котёл; легенда гласит, что город был заложен на том месте, где без огня закипела вода в котле, врытом в землю."},{"n":4,"text":"Символом города, изображённым на гербе, является мифическое драконоподобное существо Зилант."},{"n":5,"text":"Казань была основана как форпост на северных границах Волжской Булгарии более 1000 лет назад — возраст города был определён во время раскопок на территории Казанского Кремля: тогда была найдена чешская монета, датированная 929−930 годами, и остатки каменной кладки и деревянной городской ограды."},{"n":6,"text":"Этническое и религиозное разнообразие в столице Татарстана сохраняется не один век: в городе действуют 136 культовых объектов, из них 70 мечетей, 45 православных храмов, 5 старообрядческих культовых объектов, 13 церквей других христианских направлений, 1 синагога, молельные дома Бахаи и Кришны."},{"n":7,"text":"Кроме того, Казань имеет уникальный культурный код: в городе насчитывается более 1000 объектов, формирующих культурное многообразие столицы."}],"cat":"DET","originalAnswers":[[1,2,3,4,5,7]]},{"id":"43740","answers":[[5,6,7]],"full":[{"n":1,"text":"Пик Креницына (1324 м) — действующий вулкан, главная вершина необитаемого курильского острова Онекотан."},{"n":2,"text":"Этот вулкан считается одним из самых красивых вулканов в мире и входит в список «Ста чудес России», а назван он в честь Петра Кузьмича Креницына — мореплавателя и исследователя дальневосточных земель."},{"n":3,"text":"Молодой конус правильной формы поднимается из озера, занимающего котловину древнего разрушенного вулкана Тао Русыр."},{"n":4,"text":"Несмотря на свои небольшие размеры, озеро вокруг Пика Креницына является самым глубоким на Курилах."},{"n":5,"text":"Такой статус оно имело даже тогда, когда считалось, что его глубина равна 264 м."},{"n":6,"text":"В 2015 году геологи выяснили, что в юго-восточной части водоёма дно уходит ещё на 100 метров ниже."},{"n":7,"text":"Теперь Кольцевое озеро входит в пятёрку самых глубоких в России, хотя по площади на фоне других озёр оно смотрится совсем крошечным."}],"cat":"SPP","originalAnswers":[[5,6,7]]},{"id":"46274","answers":[[1,2,6,7]],"full":[{"n":1,"text":"Росто́кинский акведу́к — гидротехническое сооружение Мытищинского водопровода, на данный момент упразднённого; это единственный сохранившийся акведук из пяти акведуков системы, по которому водопровод пересекал реку Яузу."},{"n":2,"text":"Разработать проект строительства системы водопровода, который снабжал бы город чистой питьевой водой, поручила императрица Екатерина II в 1771 году, когда перед Москвой остро стояла задача улучшения санитарных условий в городе после эпидемии чумы."},{"n":3,"text":"В 1779 году архитектор и инженер-гидротехник Фридрих Бауэр представил императрице готовый проект, и в тот же год началось строительство."},{"n":4,"text":"Длина Ростокинского акведука составляет 356 метров, высота достигает 15 метров — в то время это было поистине огромное сооружение, его строительство обошлось городу в круглую сумму."},{"n":5,"text":"Вероятно, из-за слухов о потраченных на строительство деньгах он получил неофициальное название «Миллионный мост»."},{"n":6,"text":"Конструкция оказалась очень надёжной: в XIX веке акведук не подвергался перестройкам, хотя Мытищинский водопровод модернизировали несколько раз."},{"n":7,"text":"Акведук использовался по прямому назначению до 1902 года, после чего он 60 лет служил опорой для водопроводной магистрали."},{"n":8,"text":"Затем, с 1962-го по 2004-й, стал опорным сооружением для теплотрассы."},{"n":9,"text":"В 2006−2008 годах специалисты акведук отреставрировали, переоборудовали в пешеходный мост и создали вокруг зону отдыха."}],"cat":"SPP","originalAnswers":[[1,2,6,7]]},{"id":"46303","answers":[[4,7]],"full":[{"n":1,"text":"Впервые о селе Дубровицы было упомянуто в исторических документах, датируемых 1627 годом, — на тот момент земля принадлежала боярину Морозову."},{"n":2,"text":"Усадьба не раз меняла хозяев: здесь жили Голицыны, Дмитриевы-Мамоновы, Потёмкины."},{"n":3,"text":"В 20-е годы XX века здесь располагался музей дворянского быта, но позже все ценности были вывезены, а усадьбу передали в пользование детскому дому."},{"n":4,"text":"Затем в Дубровицах находился сельскохозяйственный техникум, в 1961 году сюда переехал институт животноводства."},{"n":5,"text":"Главной достопримечательностью усадьбы можно назвать один из самых красивых храмов России — церковь Знамения Пресвятой Богородицы."},{"n":6,"text":"Знаменская церковь считается одной из самых необычных, так как её строили по нетипичному для православных храмов проекту."},{"n":7,"text":"Детали здания очень необычны: храм венчает корона, вместо фресок здесь огромное количество скульптур на библейские темы."},{"n":8,"text":"Кстати, именно по этой причине церковь иногда даже называют «музеем скульптуры»."},{"n":9,"text":"Усадебный дворец, строение в стиле барокко, также достоин внимания: особой красотой отличается гербовый зал здания."}],"cat":"BSP","originalAnswers":[[4,7]]},{"id":"48141","answers":[[4,6]],"full":[{"n":1,"text":"Истоки современной науки о древнерусском искусстве восходят к учёному, чья жизнь пала на XIX век."},{"n":2,"text":"Блестящий филолог и человек широкого кругозора, Фёдор Иванович Буслаев одним из первых по достоинству оценил красоту древнерусской литературы и живописи, показав их органическую связь с византийской культурой."},{"n":3,"text":"По его мнению, в русской иконописи «отразилась твёрдая самостоятельность и своеобразность русской народности»."},{"n":4,"text":"Не меньших поклонников древнерусское искусство обрело в лице великих художников: В. М. Васнецова, М. В. Нестерова и М. А. Врубеля."},{"n":5,"text":"Этот интерес к древнерусской живописи, ещё не дождавшейся своего часа, стимулировался широко распространённым в старообрядческих кругах коллекционированием икон."},{"n":6,"text":"Старообрядцы собирали иконы либо как святыню, либо как редкость и драгоценность."},{"n":7,"text":"Их опыт лёг в основу известного труда Д. А. Ровинского «Обозрение иконописания в России до конца XVII века»."},{"n":8,"text":"Среди русских учёных XIX века одним из самых серьёзных специалистов по вопросам иконописи был Г. Д. Филимонов."},{"n":9,"text":"Его исследование о знаменитом московском иконописце Симоне Ушакове и по сей день остаётся образцом строгого научного метода."}],"cat":"HOM","originalAnswers":[[4,6]]},{"id":"48169","answers":[[1,6,9]],"full":[{"n":1,"text":"Развернув «Санкт-Петербургские ведомости» 7 декабря 1747 года, читатели увидели сенсационное сообщение, в котором говорилось, что в палатах императорской библиотеки и Кунсткамеры произошёл пожар и пострадали астрономические инструменты."},{"n":2,"text":"Главные утраты состояли ещё «в некоторых китайских вещах, платье, идолах и подобных куриозностях»."},{"n":3,"text":"Свидетелем пожара был М. В. Ломоносов."},{"n":4,"text":"«Разные были о сём пожаре рассуждения, — писал он в записке «История академической канцелярии», — но следствия не произведено никакого»."},{"n":5,"text":"По словам Ломоносова, истинные потери скрывались."},{"n":6,"text":"Казалось, что после пожара последующие поколения никогда не смогут восстановить, какие именно вещи собирались в начале XVIII века в первом русском музее и как эти вещи выглядели."},{"n":7,"text":"Но в ленинградском отделении Архива Академии наук СССР сохранилось пять больших коробок из прочного картона, по своему внешнему виду напоминавших фолианты прошлых веков."},{"n":8,"text":"Крышки коробок были обтянуты кожей с золотым тиснением, а за массивными крышками скрывались превосходные акварельные рисунки экспонатов Кунсткамеры."},{"n":9,"text":"Рисунки говорили о том, что Кунсткамера для своего времени была действительно «чудес палата»."}],"cat":"SPP","originalAnswers":[[1,6,9]]},{"id":"49146","answers":[[4,5,7,8]],"full":[{"n":1,"text":"Зарайский кремль, памятник русского оборонного зодчества первой трети XVI века, расположен на территории Зарайской верхнепалеолитической стоянки."},{"n":2,"text":"Эти места были обжиты первобытными охотниками во временнóм промежутке от 23 тыс. до 16 тыс. лет назад, а каменный кремль был возведён на правом берегу реки Осётр по указу великого князя Московского Василия III в 1528−1531 гг."},{"n":3,"text":"Кремль стал одним из опорных пунктов для защиты южных рубежей Московского государства, подвергавшихся частым разорительным набегам крымских татар."},{"n":4,"text":"За те полтора века, в течение которых была задействована его боевая мощь, Кремль ни разу не покорился врагам."},{"n":5,"text":"Во время Смуты, в 1610 году, воеводой Зарайска был назначен князь Дмитрий Пожарский, который обеспечил «Зарайского города крепкое стоятельство» против сторонников Лжедмитрия II."},{"n":6,"text":"Зарайский кремль — одна из немногих русских регулярных крепостей XVI века — имеет в плане форму прямоугольника со сторонами 125 и 185 метров, он возведён по канонам итальянской замковой архитектуры и приспособлен для ведения кругового боя с применением артиллерии."},{"n":7,"text":"Это самый маленький по площади (2,3 гектара) из всех русских кремлей, которые дошли до нашего времени."},{"n":8,"text":"Архитектурный ансамбль крепости включает в себя Никольский собор XVII века, собор Усекновения главы Иоанна Предтечи начала XX века, а также здание бывших Присутственных мест (духовного училища), где располагаются экспозиции музея."}],"cat":"SPP","originalAnswers":[[4,5,7,8]]},{"id":"49173","answers":[[4,5,7]],"full":[{"n":1,"text":"Национальный парк, образованный в 1994 году, находится на территории Саратовской области."},{"n":2,"text":"Целью создания этого, без сомнения, весьма масштабного парка — его площадь составляет около 25,5 тыс. га — стало сохранение уникальных природных комплексов края."},{"n":3,"text":"Парк расположен в северо-восточной части Саратовского Правобережья в Хвалынском районе, примерно в 200 км от областного центра."},{"n":4,"text":"Рельеф здесь достаточно холмист: есть много оврагов, балок и долов."},{"n":5,"text":"В парке насчитывается около 300 родников с отличной пресной водой — прозрачной, чистой, с незначительной минерализацией."},{"n":6,"text":"На территории в общей сложности растёт более 900 видов растений, и стоит отметить, что из них более 100 — это редкие и охраняемые виды."},{"n":7,"text":"Богата и фауна парка: достоверно обнаружено 53 вида млекопитающих, зарегистрировано 168 видов птиц, 15 видов амфибий и рептилий, насекомые представлены 339 видами."},{"n":8,"text":"В Красную книгу Российской Федерации входит множество живых обитателей парка — от дыбок степных (разновидность кузнечика) до русской выхухоли."}],"cat":"HOM","originalAnswers":[[4,5,7]]},{"id":"49974","answers":[[4,5,7]],"full":[{"n":1,"text":"Вулкан Тятя на северо-востоке острова Кунашир — место почти необитаемое: после извержения 1973 года люди здесь больше не живут."},{"n":2,"text":"Извержение было необыкновенно сильным: вулканический пепел достиг побережья острова Шикотан, расположенного в 60 километрах от Кунашира."},{"n":3,"text":"Айны, коренные жители, прозвали вулкан Чача-Напури (дословно «отец-гора»), а японцы назвали гору Тятя-Дакэ."},{"n":4,"text":"Древний исполин кажется отцом всех окрестных гор и превосходит их по величине: высота вулкана составляет 1819 метров, приблизительный возраст — 12 тысяч лет."},{"n":5,"text":"Сейчас активность вулкана слабая, в ближайшие сто лет катастрофических извержений учёные не ожидают."},{"n":6,"text":"Особенностью этого творения природы является его строение — это «вулкан в вулкане»; стоя на краю главного кратера, можно ощутить исходящее от вулкана тепло."},{"n":7,"text":"Сегодня главный кратер вулкана часто «курится» в холодную погоду, из бокового кратера периодически выбрасываются ядовитые газы."},{"n":8,"text":"Это ещё одна из причин, почему в этой части острова так мало жителей."}],"cat":"BSP","originalAnswers":[[4,5,7]]},{"id":"50003","answers":[[1,8,9]],"full":[{"n":1,"text":"Чарские пески — пустыня на севере Забайкальского края, окружённая горами и тайгой."},{"n":2,"text":"Несмотря на то что размер этой пустыни невелик — всего 50 квадратных километров, Чарские пески вполне достойны называться пустыней."},{"n":3,"text":"Барханы достигают высоты 25 и более метров, растительный мир по занимаемой площади соответствует пустынному, здесь бывают песчаные бури."},{"n":4,"text":"Окружает Чарские пески тайга с реками и болотами, и такое природное своеобразие кажется чем-то фантастичным."},{"n":5,"text":"Над Чарскими песками стеной возвышаются Кодарский, Удоканский и Каларский хребты."},{"n":6,"text":"Пески особенно красивы во время своего «цветения»: весной, в мае, распускаются забайкальские подснежники — сон-трава."},{"n":7,"text":"В северной и восточной частях массива, спустившись на границу с лесом, круглый год можно наблюдать интересное природное явление: здесь из-под толщи песков сочится вода."},{"n":8,"text":"В Чарской долине глубже мерзлотного слоя находится крупное месторождение подземных вод, вырывающихся из-под ледяного панциря на поверхность через проталины в мерзлоте."},{"n":9,"text":"Кроме того, в юго-восточной части песков археологи обнаружили керамические предметы и каменные изделия, свидетельствующие о пребывании здесь древних людей."}],"cat":"DET","originalAnswers":[[1,8,9]]},{"id":"50223","answers":[[1,5,8,9]],"full":[{"n":1,"text":"В городе Мирный, расположенном в Якутии, находится один из крупнейших в мире алмазных карьеров — кимберлитовая трубка «Мир»."},{"n":2,"text":"За десятилетия карьер приобрёл внушительные габариты: в ширину он разросся до 1200 метров, а под землю ушёл больше чем на полкилометра."},{"n":3,"text":"Вдоль стен карьера проложена дорога: она в виде спирали огибает всю шахту Мирного, а протяжённость этой дороги составляет 8 километров."},{"n":4,"text":"Руду со дна карьера вывозили на самосвалах, всё больше и больше углубляясь в недра земли."},{"n":5,"text":"Название шахты восходит к зашифрованной телеграмме, переданной геологами."},{"n":6,"text":"Они сообщили в Москву, что «закурили трубку мира» и «табак отличный»."},{"n":7,"text":"«Табак» и правда был прекрасным: каждый год на руднике добывали в среднем 1,5 млн каратов камней."},{"n":8,"text":"Вскоре после открытия шахты рядом построили посёлок Мирный, ставший позже городом и алмазной столицей России."},{"n":9,"text":"К слову сказать, кимберлитовая трубка в Мирном стала не первым найденным учёными месторождением в регионе: в нескольких сотнях километров есть также «Зарница», открытая годом ранее."}],"cat":"DET","originalAnswers":[[1,5,8,9]]},{"id":"50283","answers":[[1,3,6]],"full":[{"n":1,"text":"Романцевские горы в Тульской области — уникальная природная локация, которая из-за своего рельефа и цвета напоминает поверхность Марса."},{"n":2,"text":"Это удивительное место изначально было обыкновенным карьером, там добывали бурый уголь."},{"n":3,"text":"Десятки лет понадобилось природе, чтобы сделать его таким, каким он выглядит сейчас."},{"n":4,"text":"Местность имеет несколько названий: Кондуки, Ушаковские карьеры, Романцевские горы."},{"n":5,"text":"В 60-е годы здесь, неподалёку от города Богородицка, началась добыча бурого угля открытым способом."},{"n":6,"text":"Его залежи находились близко к поверхности, так что способ добычи был не слишком трудозатратным и при этом весьма прибыльным."},{"n":7,"text":"Однако через 20 лет сырьё утратило своё качество, и в результате интерес к карьеру угас — в 90-е годы его полностью забросили."},{"n":8,"text":"Дожди и таяние снега стали причиной появления размывов и трещин в глинистой породе, хаотично выброшенной по сторонам от карьера."},{"n":9,"text":"Вода начала постепенно скапливаться в самых глубоких точках, образовав здесь спустя годы водоём."}],"cat":"SPP","originalAnswers":[[1,3,6]]},{"id":"50310","answers":[[2,3,7]],"full":[{"n":1,"text":"Осенний период свадеб и гуляний молодёжи завершали Кузьминки – день бессребреников Косьмы и Дамиана, называемый «Курячьими именинами»."},{"n":2,"text":"Образ Косьмы и Дамиана, святых врачей и чудотворцев, в русской традиции превратился в культ ремесленников Кузьмы и Демьяна, божьих кузнецов, которые работали не за вознаграждение и в народном сознании сливались в одно лицо."},{"n":3,"text":"День Кузьмы и Демьяна стал праздником кузнецов (по созвучию Кузьма — кузнец) и считался началом предзимья, когда, по народному поверью, божьи кузнецы сковывали «зимними цепями» земли и реки."},{"n":4,"text":"Кузьма и Демьян не только ковали зимние латы для рек и водоёмов, но и были «свадебными кузнецами» — выковывали свадебные венцы и брачные узы."},{"n":5,"text":"В этот день в Москве, в Толмачёвском переулке, женщины собирались вокруг церкви Космы и Дамиана с курами и после обедни служили молебны."},{"n":6,"text":"В сёлах крестьяне приходили на боярский двор и с челобитьем подносили кур своей боярыне «на красное житьё»."},{"n":7,"text":"Девушки в продолжение трёх вечеров устраивали кузьминскую вечеринку — посиделки, обязательными обрядовыми блюдами на которых были куриная лапша и пиво."},{"n":8,"text":"Часто они продавали угощение парням за несколько копеек, а хозяйка вечерницы делила вырученные деньги между присутствующими."}],"cat":"SPP","originalAnswers":[[2,3,7]]},{"id":"50337","answers":[[3,6,7]],"full":[{"n":1,"text":"Александр Агеевич Абаза происходил из известного молдавского боярского рода, перешедшего на русскую службу ещё при императрице Анне Иоанновне."},{"n":2,"text":"Красавец и хитрец, он начал свою карьеру как храбрый лейб-гусар."},{"n":3,"text":"Участвовал во многих сражениях на Кавказе и в 1847 году, в двадцать шесть лет, вышел майором в отставку «из-за болезни ран», однако ему было разрешено носить мундир."},{"n":4,"text":"Женившись на дочери богатейшего откупщика Александре Бенардаки, Абаза стал служить при дворе великой княгини Елены Павловны."},{"n":5,"text":"Он совмещал придворную службу с членством в ряде акционерных обществ, считался оборотистым дельцом и знатоком экономики."},{"n":6,"text":"В 1871 году стал государственным контролёром, а в 1880-м император назначил Александра Агеевича министром финансов."},{"n":7,"text":"В 1881 году пришедший к власти Александр III уволил его с министерской должности, зато Абаза занял важное место в департаменте государственной экономии."},{"n":8,"text":"Впрочем, и на этой должности он не задержался."},{"n":9,"text":"Несмотря на то что газета «Московские ведомости» и журнал «Гражданин» критиковали его за чрезмерное стремление к либеральным реформам, Александр Агеевич Абаза был избран почётным членом Императорской Санкт-Петербургской Академии Наук и позднее удостоен ордена Св. апостола Андрея Первозванного."}],"cat":"SSP","originalAnswers":[[3,6,7]]},{"id":"51842","answers":[[2,3,6,7,8,9]],"full":[{"n":1,"text":"Успенский Далматовский мужской монастырь основан в 1644 г. на берегу реки Исети в месте, которое называлось «Белое городище», старцем Невьянского Богоявленского монастыря иноком Далматом."},{"n":2,"text":"В 1644 г. старец Далмат выкопал себе пещеру в овраге на левом берегу реки Исети при впадении реки Течи, тогда же была принесена им чудотворная Далматская икона Успения Божией Матери, впоследствии чудесным образом сохранившаяся на пепелище во время одного из набегов кочевников, неоднократно разорявших обитель."},{"n":3,"text":"Ещё при жизни старца Далмата настоятелем монастыря стал его сын архимандрит Исаак, его трудами в 1705−1719 гг. был возведён каменный Успенский собор с придельной Димитриевской церковью и колокольней."},{"n":4,"text":"В 1713−1763 гг. вместо прежней деревянной была построена каменная монастырская стена с башнями, и это укрепило монастырь — он был в состоянии выдержать осаду восставших крестьян и штурм отрядов Е. Пугачёва."},{"n":5,"text":"Обладая значительными земельными владениями с жившими на них монастырскими крестьянами, многочисленными хозяйственными заимками, к середине ХVIII в. по ряду экономических показателей монастырь занимал первое место среди обителей восточной части Российской Империи."},{"n":6,"text":"Далматовский монастырь был также центром духовного просвещения и образования в Сибири: в 1714 г. в монастыре открыто первое в Зауралье училище для детей церковнослужителей, в 1735 г. учреждается славяно-греко-российская школа, в 1761 г. — семинария, в 1816 г. — уездное духовное училище, в 1846 г. — училище для служительских и поселянских детей, в 1884 г. – церковно-приходская школа с тремя отделениями, в 1899 г. — «второклассная» церковно-приходская школа; в монастыре имелась богатая библиотека («книгохранилище»)."},{"n":7,"text":"После революции монастырь был превращён в музей; в 1930 г. его закрыли, главная святыня — чудотворная Далматская икона Божией Матери — исчезла (в настоящее время её местонахождение неизвестно)."},{"n":8,"text":"В годы советской власти на территории монастыря располагались различные учреждения (в том числе театр); главные разрушения приходятся на послевоенные годы (с 1945 г.): главный храм обители был обезглавлен и переоборудован под цех, колокольня снесена."},{"n":9,"text":"В 1992 г. решением Священного Синода Русской Православной Церкви монастырь был возрождён, возобновилась монашеская жизнь."}],"cat":"BSP","originalAnswers":[[2,3,6,7,8,9]]},{"id":"52537","answers":[[4,5]],"full":[{"n":1,"text":"В пылу происходившей схватки между символистами и акмеистами центр тяжести был в противопоставлении «тумана и фантазий символистов» положительному и оптимистическому отношению акмеистов к искусству."},{"n":2,"text":"Акмеисты, предводимые Н. С. Гумилёвым и С. М. Городецким, выступали против «заоблачной мистики» символистов и призывали вернуться к ясности и конкретности земных форм."},{"n":3,"text":"Этот известный, но не решённый до сей поры спор заинтересовал меня в связи со словами Городецкого об Иннокентии Анненском."},{"n":4,"text":"Как это странно, что никто из тогдашних корифеев символизма не заметил поэзии Анненского, который являлся одним из самых подлинных представителей этого движения!"},{"n":5,"text":"Нужен был бурный натиск акмеистической молодёжи, для того чтобы обратить внимание на этого большого поэта."},{"n":6,"text":"Невнимание символистов к поэзии Анненского просто необъяснимо: так, много лет спустя после его смерти Зинаида Гиппиус не хотела признавать его: «Анненский?.. Что вы в нём находите?..»"},{"n":7,"text":"В эмиграции Иннокентий Анненский до сих пор остаётся «поэтом для немногих», несмотря на ряд прекрасных статей о нём Г. В. Адамовича и В. Ф. Ходасевича."},{"n":8,"text":"Иннокентий Анненский, эллинист и знаток французской поэзии, по культуре стиха и по остроте ощущений природы слова был ближе к вершинам французского символизма."},{"n":9,"text":"Символизм же Валерия Брюсова многим кажется доморощенным и провинциальным, и даже Вячеслав Иванов в каком-то смысле представляется «варваром»."}],"cat":"SPP","originalAnswers":[[4,5]]},{"id":"52969","answers":[[1,2,8]],"full":[{"n":1,"text":"Термин «иероглифы» к письменности майя был применён исследователями XVIII и XIX столетия, которые, не понимая знаков, находили их похожими на египетскую иероглифику."},{"n":2,"text":"Словосочетание «иероглифика майя» придаёт тому, кто его произносит, некоторую таинственность, указывает на загадочную связь с глубинами древности."},{"n":3,"text":"Исследователь цивилизаций Герман Гессе писал: «У всех народов слово и письменность представляют собой нечто священное и магическое; наименование первоначально было магическим обладанием природой посредством духа, и дар письма почитался божественным откровением»."},{"n":4,"text":"Что-то от этого трепетного отношения наших предков к письму сохранилось и в нашем восприятии древней иероглифики."},{"n":5,"text":"Правда, нередко это восприятие совмещается с неверием и скепсисом."},{"n":6,"text":"Современный человек живёт в мире знаков, они выражаются самыми разными способами."},{"n":7,"text":"Можно легко выделить единственное сопоставление: знаки привычные (все знают латинский алфавит) и знаки непривычные — таковыми становятся знаки любого неизвестного письма."},{"n":8,"text":"Если же разобраться, то употреблявшаяся во II тысячелетии до н. э. запись клинописью окажется для нашего восприятия куда проще текста из сегодняшней китайской газеты."}],"cat":"SPP","originalAnswers":[[1,2,8]]},{"id":"53315","answers":[[2,5,6,7]],"full":[{"n":1,"text":"«Есть документы парадные, и они врут, как люди», — писал в 1930 году Ю. Н. Тынянов."},{"n":2,"text":"Вот тут-то и приходит на помощь анекдот: он исправляет, принципиально уточняет «лживые» документы."},{"n":3,"text":"Главное достоинство исторического анекдота отнюдь не в психологической достоверности."},{"n":4,"text":"Он даёт ключ к образу и характеру той или иной исторической личности и, надо сказать, делает это через неожиданный поступок или острое слово."},{"n":5,"text":"Исторический анекдот, центральный жанр неофициальной истории, вполне может быть скандальным, однако при этом не имеет права на домыслы, ибо в первую очередь он строго фактичен и откровенен, что является его высшим достоинством."},{"n":6,"text":"Исторический анекдот — это предельно живой и сочный штрих, но никоим образом не карикатура."},{"n":7,"text":"Его нельзя относить к сатирическим жанрам, он не ниспровергает историческую личность, а показывает её в новом и неожиданном свете."},{"n":8,"text":"Недаром Антуан де Варийас в теоретическом введении к своим «Флорентийским анекдотам» подчеркнул особо: «Анекдоты — зеркала, лишённые лести»."}],"cat":"HOM","originalAnswers":[[2,5,6,7]],"notes":{"7":"В конце предложения однородные сказуемые «не ниспровергает, а показывает» разделяются запятой; другая запятая — между частями БСП."}},{"id":"54188","answers":[[7,8,9]],"full":[{"n":1,"text":"В городах-республиках средневековой Руси, в Пскове и Новгороде, первые купеческие ассоциации возникли уже в XIII веке."},{"n":2,"text":"А в 1665 году псковский воевода А. М. Ордин-Нащокин создал для поддержания «маломочных» купцов небольшой банк, назывался он «Земская изба»."},{"n":3,"text":"Банк этот просуществовал недолго и был закрыт, поскольку воеводу отозвали в Москву."},{"n":4,"text":"К сожалению, серьёзным препятствием для развития банков стала острая нехватка благородных металлов."},{"n":5,"text":"В 1654 году правительство уравняло стоимость медных и серебряных денег, однако это решение спровоцировало инфляцию."},{"n":6,"text":"После Медного бунта (1662 г.) правительство изъяло медные деньги из обращения."},{"n":7,"text":"В начале XVIII века Пётр I начал реформу российских финансов: стали выпускаться крупные серебряные монеты — рубли, а также полтинники (50 коп.)."},{"n":8,"text":"Для упорядочения финансовой системы царь создал Камерколлегию по управлению доходами страны, Штатс контор-коллегию по управлению расходами и Ревизион-коллегию, контролировавшую всех."},{"n":9,"text":"Пётр I поощрял развитие предпринимательства, но препятствовал возникновению независимых банков."}],"cat":"HOM","originalAnswers":[[7,8,9]]},{"id":"54229","answers":[[1,4,5,6]],"full":[{"n":1,"text":"Человек с самого начала своей истории пользовался дарами природы и, естественно, вырабатывал определённые правила этого пользования: оставлял на диких растениях часть плодов на семена для будущего урожая, следил за поголовьем диких животных, стремился восстанавливать плодородие почвы на полях."},{"n":2,"text":"Однако нередко правила природопользования и технологии, закреплённые традициями, не соответствовали новым условиям и вели к экологическим кризисам и даже катастрофам."},{"n":3,"text":"Рост населения приводил к тому, что природных ресурсов не хватало для обеспечения жизни людей."},{"n":4,"text":"В античности растительность гор Греции была буквально съедена козами, цивилизация майя в доколумбовой Америке, по всей вероятности, пришла в упадок вследствие экстенсивного подсечно-огневого земледелия."},{"n":5,"text":"Как правило, человечество извлекало уроки из случившегося и искало пути выхода из сложившейся ситуации, совершенствуя имеющиеся и создавая новые правила природопользования."},{"n":6,"text":"Так, в античности ухудшение условий для ведения сельского хозяйства в Средиземноморье способствовало бурному расцвету мореходства."},{"n":7,"text":"Невозможность обеспечить себя всем необходимым на месте побуждала наиболее активную часть общества, «бунтарей», уходить за пределы старого расселения."},{"n":8,"text":"Экологические кризисы в Юго-Восточной Азии привели к заселению островов Тихого и Индийского океанов, а изменение климата в Северной Азии — к переселениям в Америку."}],"cat":"INTRO","originalAnswers":[[1,4,5,6]],"notes":{"5":"«Как правило» — вводное сочетание; деепричастие «совершенствуя» выделяется по другому правилу."}},{"id":"56098","answers":[[5,9]],"full":[{"n":1,"text":"Природа одарила китообразных прекрасной лужёной глоткой."},{"n":2,"text":"Наука определила, что дыхало китообразных имеет особое, весьма сложное строение."},{"n":3,"text":"Устройство это недвусмысленно ориентировано на производство звуков."},{"n":4,"text":"Наилучшей голосистостью отличается белуха, вид зубатых китов из семейства нарваловых, и у неё же учёные обнаружили наиболее совершенное устройство глотки."},{"n":5,"text":"Недаром англичане зовут белуху «морской канарейкой», жители Русского Севера используют выражение «реветь белухой»."},{"n":6,"text":"Ещё в 1820-х годах полярный исследователь Парри писал о резких и звонких криках белух, слышимых сквозь дно шлюпки через толщу воды в несколько футов."},{"n":7,"text":"У белухи, по утверждению советского учёного Владыкова, выполняют функции голосовых связок нижние края вдающихся в просветы гортани черпаловидных хрящей."},{"n":8,"text":"Перепонка, выстилая заднюю стенку гортани белух, образует множество продольных складок."},{"n":9,"text":"По обеим сторонам надгортанного хряща есть своеобразные карманы, они разделены на ряд мешочков и соответствуют по своему положению желудочкам гортани других млекопитающих."}],"cat":"BSP","originalAnswers":[[5,9]]},{"id":"56125","answers":[[5,9]],"full":[{"n":1,"text":"Дорога была суха и оттого тепла, но иногда опускалась в низинки, становилась влажно-мягкой и потому холодила ногу."},{"n":2,"text":"Она незаметно вошла в лес."},{"n":3,"text":"Так же вот, думается, входит по вечерам в свой дом женщина-хозяйка, называемая у нас большухой."},{"n":4,"text":"Июльский сумеречно-тёплый лес неторопливо готовился отойти ко сну."},{"n":5,"text":"Одна за одной смолкали непоседливые лесные птицы, замирали набухающие темнотой ёлки."},{"n":6,"text":"Лес засыпал, врачуя своим покоем наши смятенные души."},{"n":7,"text":"Он был с нами добр, и от него веяло родиной и покоем, как веет покоем от твоей старой и мудрой матери..."},{"n":8,"text":"Ах, тишина!"},{"n":9,"text":"Как отрадна и нетревожна бывает она порой, как хорошо тогда жить!"}],"cat":"BSP","originalAnswers":[[5,9]]},{"id":"56515","answers":[[2,7]],"full":[{"n":1,"text":"Правление Жана Бесстрашного, герцога Бургундского, во Фландрии являет собой разительный контраст как с правлением его отца, так и с правлением Филиппа Доброго."},{"n":2,"text":"За 14 лет, которые Жан Бесстрашный был графом Фландрии, его отношения с подданными значительно улучшились благодаря тому, что он шёл навстречу интересам фламандцев."},{"n":3,"text":"За это время не только не произошло ни одного крупного восстания, но даже и относительно небольших конфликтов городов с Жаном Бесстрашным было немного."},{"n":4,"text":"Ему в большинстве случаев удавалось поддерживать хорошие отношения с муниципалитетами и с влиятельным комитетом из Брюгге."},{"n":5,"text":"Он умело лавировал, используя внутренние конфликты, существовавшие между городами и в самих городах, добиваясь выгодного ему политического режима во Фландрии."},{"n":6,"text":"Кроме того, герцогу удалось успешно использовать восстание в расположенном недалеко от Фландрии Льежском епископстве."},{"n":7,"text":"Несмотря на то что фламандцы продолжали выдвигать требования своему правителю, они всё-таки были в достаточной степени удовлетворены его мирным правлением."},{"n":8,"text":"Для них Жан Бесстрашный «стал настоящим фламандцем», именно его правление не омрачено восстаниями и кровавыми битвами фламандцев со своими графами."}],"cat":"SPP","originalAnswers":[[2,7]]},{"id":"56542","answers":[[3,4,6]],"full":[{"n":1,"text":"Не так давно это было: по улицам Москвы, ещё влажным и блестящим от поливки, в самый ранний час неторопливо проезжает маленький голубой «Москвич»."},{"n":2,"text":"За его рулём сидит старый шофёр в очках, шляпа сдвинута на затылок и открывает высокий лоб и крутые завитки седых волос."},{"n":3,"text":"Глаза смотрят и весело, и сосредоточенно, и как-то по-двойному: и на прохожих, и внутрь себя."},{"n":4,"text":"Рядом, справа от шофёра, сидит молодая, но тоже седая охотничья собака — серый длинношёрстный сеттер Жалька."},{"n":5,"text":"Подражая хозяину, она внимательно смотрит перед собой в ветровое стекло."},{"n":6,"text":"Писатель Михаил Михайлович Пришвин был старейшим шофёром Москвы, и до восьмидесяти с лишним лет он сам водил машину, сам её ремонтировал и обращался в этом деле за помощью только в крайних случаях."},{"n":7,"text":"Михаил Михайлович относился к своей машине почти как к живому существу и называл её ласково: «Маша»."},{"n":8,"text":"Машина ему нужна была исключительно для его писательской работы, поскольку с ростом городов нетронутая природа всё отдалялась и вышагивать по многу километров для свидания с ней, как в молодости, он — старый охотник и ходок — уже был не в силах."},{"n":9,"text":"Вот почему Михаил Михайлович называл свой ключ от машины «ключом счастья и свободы»."}],"cat":"HOM","originalAnswers":[[3,4,6]]},{"id":"57086","answers":[[5,6,7,9]],"full":[{"n":1,"text":"Кажется, летом 1966 года мне позвонил из Ленинграда Фёдор Абрамов и сказал: «Найди журнал «Север» и прочти повесть Белова «Привычное дело»."},{"n":2,"text":"Большой писатель идёт на Русь»."},{"n":3,"text":"Я разыскал журнал и просто проглотил повесть в одночасье."},{"n":4,"text":"Ничего более жалостливого, нежного, ласкового по отношению к гибнущей русской деревне я не читал."},{"n":5,"text":"У меня несколько раз принималось болеть сердце, как болит оно, когда беда входит в твой дом."},{"n":6,"text":"А это был именно мой дом, хотя я человек городской, но потом судьба забросила меня в деревню, и страдания крестьянства стали для меня не чужими страданиями."},{"n":7,"text":"Я думаю, что не одно городское сердце дрогнуло при чтении «Привычного дела»."},{"n":8,"text":"Да и город-то наш тогда, в шестидесятые, был на две трети деревней, покинувшей отчий кров и приютившейся под железными крышами."},{"n":9,"text":"Кто сегодня захочет вернуться к той поре, тот вряд ли обойдёт это полное горечи и вместе с тем высокое поэтическое творение Василия Белова."}],"cat":"SPP","originalAnswers":[[5,6,7,9]],"notes":{"6":"Запятые у «хотя я человек городской» выделяют придаточную часть уступки. Запятая перед «и» относится также к сочинительной связи."}},{"id":"57523","answers":[[2,5,6,9]],"full":[{"n":1,"text":"Уже пошёл декабрь, но долгая поздняя осень, словно грязная злая старуха, бродила по хуторам."},{"n":2,"text":"Низкие набухшие тучи, морося, ползли и ползли, а то и висели над хутором, цепляясь сизым провисшим брюхом за маковки старых груш."},{"n":3,"text":"По лету хутор тонул в садах."},{"n":4,"text":"Теперь же через голые ветви всё насквозь было видать: от далекого Заольховского кута, который упирался в лесистое займище, до самого озера."},{"n":5,"text":"Весь хутор словно на ладони: серые нахохленные дома, сараи, базы, высокие сенники, просторные огороды."},{"n":6,"text":"И тихо на хуторе: не видно ни людей, ни машин."},{"n":7,"text":"Одно дело — зябкая слякотная осень; другое — работы нет."},{"n":8,"text":"Катерина смотрела в окно: всё было серо вокруг."},{"n":9,"text":"Поля казались похожими на небритые щёки старика с пепельной, редко торчащей щетиной."}],"cat":"HOM","originalAnswers":[[2,5,6,9]],"notes":{"9":"«Пепельной, редко торчащей» — однородные определения к существительному «щетиной»."}},{"id":"58100","answers":[[5,8,9]],"full":[{"n":1,"text":"Что скажет раненый и какой приговор изречёт он?"},{"n":2,"text":"Я верил: он скажет «по человечеству»."},{"n":3,"text":"На его месте следовало простить, он выздоравливал."},{"n":4,"text":"Он был лицом типичный моряк, а «моряк» и «рыцарь» для меня тогда звучало неразделимо."},{"n":5,"text":"Его руки до плеч были татуированы фигурами тигров, змей, флагов, именами, лентами, цветами и ящерицами."},{"n":6,"text":"От него несло океаном — родиной сильных душ."},{"n":7,"text":"Мы затаив дыхание ждали, как будто решалась наша судьба."},{"n":8,"text":"Но раненый молчал, боролся, возможно, с желанием простить и с каким-то ядовитым воспоминанием."},{"n":9,"text":"Он вздохнул, поморщился, взглянул в глаза доктору и нехотя, сдавленно произнёс: «Пусть... уж... по закону»."}],"cat":"HOM","originalAnswers":[[5,8,9]]},{"id":"59284","answers":[[1,8]],"full":[{"n":1,"text":"В Средние века достаточно интенсивно развивалось изучение анатомии, вследствие чего стало очевидно: человек и животные анатомически похожи."},{"n":2,"text":"Основное различие между ними, по мнению философов того времени, заключалось в наличии у человека души."},{"n":3,"text":"Однако отсутствие души у животных не мешало привлекать их, как и людей, к суду."},{"n":4,"text":"Суды над животными были распространены в Европе вплоть до XVIII века, и ответственность при этом несли и домашние, и дикие животные."},{"n":5,"text":"Домашних судили в уголовных судах, дикие подлежали церковной юрисдикции."},{"n":6,"text":"В 1519 году в Глурнсе, одном из самых древних городов Тироля, начался процесс против полевых мышей."},{"n":7,"text":"Мыши дело проиграли."},{"n":8,"text":"Суд постановил, что вредные животные, называемые полевыми мышами, обязаны в течение 14 суток покинуть пахотные земли и луга, переселившись в другое место."}],"cat":"SPP","originalAnswers":[[1,8]]},{"id":"59916","answers":[[1,2,3,7]],"full":[{"n":1,"text":"Первое кругосветное путешествие капитана Джеймса Кука началось в 1768 году на барке «Индевор» и преследовало две важные цели: Кук собирался произвести наблюдения за прохождением Венеры через Солнце, а также исследовать неизведанные земли Тихого океана."},{"n":2,"text":"Обогнув мыс Горн и достигнув берегов Таити, исследователь вместе с астрономом Ч. Грином провёл необходимые наблюдения, а после этого занялся изучением архипелага."},{"n":3,"text":"Капитан открыл острова Товарищества и направился к восточным берегам Новой Зеландии, где выяснил, что это не один, а два крупных острова, разделённых проливом, получившим позже его имя."},{"n":4,"text":"При изучении восточного побережья Австралии Кук нанёс на карту около 6 тысяч километров прилегающего к материку пространства."},{"n":5,"text":"13 июля 1771 года мореплаватель вернулся в Англию."},{"n":6,"text":"Для этого он прошёл другим путём, через пролив Торреса, и обогнул мыс Доброй Надежды."},{"n":7,"text":"В плавании Кук потерял 31 человека из-за тропической лихорадки, однако благодаря разработанной им диете уберёг бóльшую часть команды от цинги."}],"cat":"HOM","originalAnswers":[[1,2,3,7]]},{"id":"60254","answers":[[2,4,5]],"full":[{"n":1,"text":"Уважаемые посетители, здесь, между улицами Красная Пресня, Большая Грузинская и Зоологическая, находится главный вход в Московский зоопарк."},{"n":2,"text":"Этот зоопарк, будучи основанным в 1864 году, является, как и зоопарки в Вене и Париже, одним из старейших в Европе."},{"n":3,"text":"В его коллекции представлено более тысячи видов животных, численность которых составляет более 5000 особей."},{"n":4,"text":"Посетители, гуляя по территории, могут увидеть животных со всего мира."},{"n":5,"text":"Несмотря на большое количество обитателей, зоопарк сохраняет для них естественные условия содержания."},{"n":6,"text":"Зоопарк, как головной в России, активно участвует в международных проектах."},{"n":7,"text":"Его посещают более 3 миллионов человек в год, и каждый находит что-то интересное для себя."},{"n":8,"text":"Приглашаем вас познакомиться с удивительными обитателями зоопарка!"}],"cat":"GER","originalAnswers":[[2,4,5]],"notes":{"2":"«Будучи основанным в 1864 году» — обособленное обстоятельство, выраженное оборотом с деепричастием «будучи».","5":"«Несмотря на большое количество обитателей» — обособленное обстоятельство уступки; оно выражено оборотом с производным предлогом, а не деепричастием."}},{"id":"60965","answers":[[1,4,8,9]],"full":[{"n":1,"text":"К суровой Арктике, загадочному краю вечных льдов, интерес исследователей не ослабевал на протяжении столетий, серьёзные же попытки её освоения начались лишь в XIX веке."},{"n":2,"text":"Участники первых ледовых экспедиций понимали, что им предстоит столкнуться с невероятными трудностями: экстремальными морозами, полярными ночами, непроходимыми ледяными полями."},{"n":3,"text":"Вопрос о первенстве при покорении Северного полюса упирается в недостаток фактической аргументации, поэтому на него до сих пор нет однозначного ответа."},{"n":4,"text":"О своём приоритете в этой области заявляли участники нескольких разных экспедиций (при этом не приводя доказательств), однако первый задокументированный факт пересечения Северного полюса — это пролёт над са́мой северной точкой планеты дирижабля с экипажем во главе с Руалем Амундсеном."},{"n":5,"text":"Особую роль в покорении Арктики сыграли советские полярники."},{"n":6,"text":"Они организовали дрейфующие станции, проявив невероятную стойкость, и, несмотря на постоянные угрозы со стороны суровой природы региона, сумели собрать ценные данные о климате и океанографии этих мест."},{"n":7,"text":"Оказалось, Арктику посещают тёплые воздушные течения."},{"n":8,"text":"Одни из них проникают в регион из Тихого океана, а другие — из Атлантики."},{"n":9,"text":"Современные технологии, включающие спутниковое наблюдение и автоматизированные метеостанции, значительно упростили изучение Арктики, но экологические проблемы, связанные с таянием льдов, ставят новые вызовы перед исследователями."}],"cat":"SSP","originalAnswers":[[1,4,8,9]],"notes":{"1":"Третья запятая разделяет части ССП. «Же» после слова «попытки» здесь выражает противопоставление, подобно союзу «а». Две первые запятые выделяют приложение.","3":"Запятая стоит на границе частей БСП: «поэтому» в классификации ФИПИ — наречие, не сочинительный союз.","4":"Запятая перед союзом «однако» соединяет части ССП.","8":"Части ССП соединены противительным союзом «а»; во второй части пропущено сказуемое.","9":"Запятая перед «но» соединяет части ССП. Запятые при причастных оборотах здесь относятся к другому правилу."}},{"id":"65187","answers":[[4,6]],"full":[{"n":1,"text":"Приезжайте в подмосковный город Чехов, он вас обязательно удивит."},{"n":2,"text":"Например, спустившись к реке, вы увидите красивую церковь."},{"n":3,"text":"Именно там находится удивительный историко-культурный объект — усадьба «Лопасня-Зачатьевское»."},{"n":4,"text":"Вы осмо́трите уцелевший дом XVIII века в стиле елизаветинского барокко и храм, а также каскад прудов, один из которых со святым источником."},{"n":5,"text":"Тем временем экскурсовод расскажет о Наталье Гончаровой, часто гостившей здесь с детьми после гибели Пушкина."},{"n":6,"text":"При желании вы сможете посетить музей, где представлены предметы быта той эпохи."}],"cat":"SPP","originalAnswers":[[4,6]]},{"id":"67295","answers":[[4,5,7,8,9]],"full":[{"n":1,"text":"Во всякой книге предисловие есть первая и вместе с тем последняя вещь."},{"n":2,"text":"Оно служит или объяснением цели сочинения, или оправданием и ответом на критику."},{"n":3,"text":"Но обыкновенно читателям дела нет до нравственной цели и до журнальных нападок, и потому они не читают предисловий."},{"n":4,"text":"А жаль, что это так."},{"n":5,"text":"Наша публика так ещё молода и простодушна, что не понимает басни, если в конце её не находит нравоучения."},{"n":6,"text":"Она дурно воспитана, поэтому она не угадывает шутки и не чувствует иронии."},{"n":7,"text":"Наша публика похожа на провинциала, который, подслушав разговор двух дипломатов, принадлежащих к враждебным дворам, остался бы уверен, что каждый из них обманывает своё правительство в пользу взаимной нежнейшей дружбы."},{"n":8,"text":"Иные читатели ужасно обиделись, что им ставят в пример такого безнравственного человека, как Герой Нашего Времени."},{"n":9,"text":"Но, видно, Русь так уж сотворена, что всё в ней обновляется, кроме подобных нелепостей."}],"cat":"SPP","originalAnswers":[[4,5,7,8,9]]},{"id":"67322","answers":[[1,2]],"full":[{"n":1,"text":"Однажды вечером, кончив дневной сбор винограда, партия молдаван, с которой я работал, ушла на берег моря."},{"n":2,"text":"А я и старуха Изергиль остались под густой тенью виноградных лоз, лежали на земле и смотрели на тающие в голубой мгле ночи силуэты тех людей, что пошли к морю."},{"n":3,"text":"Ветер тёк ровной волной, но иногда он точно прыгал через что-то невидимое и развевал волосы женщин в фантастические гривы, вздымавшиеся вокруг их голов."},{"n":4,"text":"Это делало женщин странными и сказочными."},{"n":5,"text":"Они уходили всё дальше от нас, девушка пела мягким контральто, слышался смех..."},{"n":6,"text":"Казалось, воздух был пропитан острым запахом моря и жирными испарениями земли."},{"n":7,"text":"Ещё и теперь по небу бродили мягкие, как клубы дыма, обрывки туч."}],"cat":"SPP","originalAnswers":[[1,2]]},{"id":"24314","answers":[[4,7]],"full":[{"n":1,"text":"Климат степного Алтая умеренно континентальный, с выраженным контрастом между холодными и тёплыми сезонами."},{"n":2,"text":"Средняя температура января составляет минус 18 °C."},{"n":3,"text":"Холодный период продолжительный: снег ложится в конце октября и тает в конце марта."},{"n":4,"text":"Зимы малоснежные, местами покров — не более 8 сантиметров; температура воздуха может опускаться ниже –35 °C, оправдывая представления о суровой сибирской зиме."},{"n":5,"text":"Морозы сопровождаются ветрами — жизнь в степи на несколько дней замирает."},{"n":6,"text":"Безморозный период на равнинах длится 90–130 дней, а лето — около трёх месяцев."},{"n":7,"text":"Кулундинскую степь зовут любимицей солнца: лето здесь сухое и жаркое, воздух прогревается до +40 °C."},{"n":8,"text":"Летний сезон полностью опровергает расхожее мнение, будто «в Сибири тепло не бывает»."},{"n":9,"text":"Лето в алтайских степях — это обилие яркого солнца и жарких дней."}],"cat":"BSP","originalAnswers":[[4,7]]},{"id":"24503","answers":[[1,2,3,6]],"full":[{"n":1,"text":"К северо-востоку от Петербурга, на старинном Архангельском тракте, проложенном в достопамятные времена вдоль левого берега реки Свири, раскинулся небольшой городок с названием Лодейное Поле."},{"n":2,"text":"Когда-то, задолго до Петровской эпохи, эти земли принадлежали Великому Новгороду и входили в состав Обонежской пятины."},{"n":3,"text":"Здесь, по берегу Свири, проходил оживлённый торговый путь, а близ маленького селения Канома была устроена пристань."},{"n":4,"text":"Река, невзирая на её строптивый характер и опасные для судоходства пороги, использовалась как транспортная артерия."},{"n":5,"text":"Возле упомянутой пристани появилось некое подобие верфи: там строились лёгкие и вместительные суда."},{"n":6,"text":"Именно здесь, на берегу Свири, 1 сентября 1702 года побывал Пётр I."},{"n":7,"text":"Он распорядился, чтобы местные судостроители и привезённые сюда мастера «корабельного дела» начали возведение кораблей для создававшегося Балтийского флота."}],"cat":"PREC","originalAnswers":[[1,2,3,6]]},{"id":"37273","answers":[[1,5]],"full":[{"n":1,"text":"Впадина Карагие, расположенная близ восточного побережья Каспийского моря, является одной из самых глубоких впадин в Азии."},{"n":2,"text":"Её глубина — 132 м, длина — 85 км, ширина — до 25 км."},{"n":3,"text":"Есть две официальные версии перевода названия глубинной долины: «чёрный склон» и «чёрная пасть»."},{"n":4,"text":"Оба варианта очень точно описывают саму впадину: её склоны имеют вкрапления чёрной породы, а овальные очертания действительно напоминают пасть огромного зверя."},{"n":5,"text":"Местные жители называют впадину Батыр (в переводе с тюркского — «воин») в честь реликтового озера, находящегося на дне впадины."},{"n":6,"text":"Когда озеро пересыхает, дно впадины покрывается солончаком — почвой с высоким содержанием соли."},{"n":7,"text":"По мнению геологов, процесс формирования впадины ещё не завершился."},{"n":8,"text":"Доказательством тому служат овраги и широкие балки на дне впадины."}],"cat":"DET","originalAnswers":[[1,5]]},{"id":"38479","answers":[[2,3]],"full":[{"n":1,"text":"На репродукции изображён донской пейзаж."},{"n":2,"text":"На переднем плане расстилается река Дон, раскрашивает небо вечерняя заря."},{"n":3,"text":"Безветрие, за изгибом реки у Белой горы мелькает рябь, она серебрит тихие воды Дона."},{"n":4,"text":"В прибрежных водах видны силуэты приближающейся к берегу лодки и рыбаков, приунывших оттого, что темнеет и им пора возвращаться."},{"n":5,"text":"На бесконечном небе — острый серп месяца."},{"n":6,"text":"Смотрю на картину и вижу опускающийся на землю нежный, спокойный закат."},{"n":7,"text":"Любуясь этим пейзажем, понимаешь мастерски переданную художником великую красоту природы."}],"cat":"BSP","originalAnswers":[[2,3]]},{"id":"50458","answers":[[4,7]],"full":[{"n":1,"text":"Деревня Завилихино стоит километрах в двадцати от бойкого тракта."},{"n":2,"text":"Средняя деревенька с причудливой пестротой крыш: одни крыты шифером, другие — дранкой."},{"n":3,"text":"Жизнь в Завилихине тихая и новостями не обременённая."},{"n":4,"text":"Мне же после городской жизни всё было здесь приятно: и сонный вид улицы, и тихие вечера."},{"n":5,"text":"Но пришла пора уезжать, а ехать было не на чем."},{"n":6,"text":"Бригадир сказал: «Так есть тут у нас один шофёр…»"},{"n":7,"text":"И верно, около часа шофёр заявился — и вот мы трясёмся с ним в раскалённой кабине по дорогам просёлка: то по растёртому песочку, то по глубоким колеям."},{"n":8,"text":"Иногда нас укроет тенью лесок, пряча от палящего солнца."},{"n":9,"text":"Но больше дорога идёт по полям и лужкам."}],"cat":"HOM","originalAnswers":[[4,7]]},{"id":"50590","answers":[[2,5]],"full":[{"n":1,"text":"Поразительная красота георгина никого не оставляет равнодушным."},{"n":2,"text":"Их лепестки, широкие и плоские или с завёрнутыми внутрь краями и свёрнутые в узенькие иглы-трубочки, могут быть разных цветов."},{"n":3,"text":"В отличие от розы, ириса или нарцисса георгины даже в Европе начали выращиваться сравнительно недавно."},{"n":4,"text":"В России первые сорта георгинов появились в 30––40-х годах прошлого века и сразу же завоевали всеобщую любовь."},{"n":5,"text":"Георгины соответствовали представлениям русского человека о красивом цветке, большом и ярком."},{"n":6,"text":"Сегодня в Подмосковье трудно отыскать сад, в котором не красуются яркие тяжёлые соцветия георгинов."},{"n":7,"text":"Своей формой и потрясающей цветовой гаммой георгины удовлетворяют самым разнообразным вкусам людей!"}],"cat":"DET","originalAnswers":[[2,5]]},{"id":"50627","answers":[[1,8]],"full":[{"n":1,"text":"Телецкое озеро — одно из главных украшений Горного Алтая, его достопримечательность и загадка."},{"n":2,"text":"Его называют Алтын-колем («Золотым озером»), его древнее название — Ячаварай («Алмазный жезл»)."},{"n":3,"text":"Вы были на Алтае и не видели Телецкого озера — значит, вы на Алтае не были."},{"n":4,"text":"Телецкое озеро и его окрестности — это старейший туристический район Алтая."},{"n":5,"text":"Интерес к уникальным местам не угасает и сегодня."},{"n":6,"text":"На Телецком озере начинаются и заканчиваются «нитки» активных маршрутов; берега озера и реки Бии привлекают множество людей, желающих отдохнуть в живописных уголках природы."},{"n":7,"text":"Львиная доля туристического потока проходит через доступную для любого автомобильного транспорта северную оконе
