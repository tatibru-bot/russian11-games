чность озера."},{"n":8,"text":"Здесь же расположены турбазы, кемпинги (организованные места отдыха), а также «дикие» стоянки."},{"n":9,"text":"Далее по озеру можно передвигаться водным транспортом."}],"cat":"HOM","originalAnswers":[[1,8]],"notes":{"1":"Запятая разделяет однородные именные части сказуемого: «украшений, ... достопримечательность и загадка».","8":"Запятые разделяют однородные подлежащие: «турбазы, кемпинги, ... стоянки»."}},{"id":"50628","answers":[[3,5]],"full":[{"n":1,"text":"К северо-востоку от Москвы находится «Лосиный остров», или «Лосиноостровский заповедник»."},{"n":2,"text":"Это название появилось в ту пору, когда леса между селениями и полями именовались островами."},{"n":3,"text":"На этом острове издавна водилось много лосей, отсюда и пошло название «лосиный»."},{"n":4,"text":"Кроме лосей, здесь можно повстречать новосёлов Подмосковья — оленей."},{"n":5,"text":"Жарким летним полднем приятно укрыться от зноя в еловой чаще и собрать букет голубых колокольчиков, золотой осенью хорошо любоваться листопадом и ощущать в руках холодок свежесрезанного боровика."},{"n":6,"text":"В солнечный морозный денёк хочется лететь на лыжах с крутого склона оврага."},{"n":7,"text":"Здесь любил гулять П. И. Чайковский."},{"n":8,"text":"«Что за восхитительная прогулка в лесу!» — вспоминал композитор."},{"n":9,"text":"Заповедный «Лосиный остров» — кладезь чистоты и здоровья, жемчужина в зелёном уборе столицы."}],"cat":"BSP","originalAnswers":[[3,5]]},{"id":"50630","answers":[[2,6,7]],"full":[{"n":1,"text":"Озеро Колыванское — одно из излюбленных мест отдыха жителей и гостей Алтая."},{"n":2,"text":"С юга к нему примыкает сложенная из серых и розовых гранитов гора Большуха, её вершины увенчаны двумя башнями-утёсами."},{"n":3,"text":"В Колыванском озере сохранился в большом количестве реликтовый водяной орех чилим — осколок флоры доледникового периода, ранее широко распространённый в водоёмах Алтая."},{"n":4,"text":"Сегодня чилим встречается ещё в Манжерокском озере, в некоторых небольших озёрах возле города Бийска."},{"n":5,"text":"Он, будучи богатым белком и крахмалом, ещё в прошлом веке употреблялся в пищу."},{"n":6,"text":"Похожие на рогатых чёртиков оболочки ореха — великолепные сувениры, их можно найти на берегах и плавающими по акватории озера."},{"n":7,"text":"Незрелый орех не пригоден ни для каких целей, рвать его категорически запрещено."},{"n":8,"text":"Чилим занесён в Красную книгу России и находится под угрозой полного исчезновения."}],"cat":"BSP","originalAnswers":[[2,6,7]]},{"id":"50696","answers":[[2,6]],"full":[{"n":1,"text":"Касли — небольшой городок в Челябинской области, известный каслинским чугунным литьём."},{"n":2,"text":"Еду по дороге к Каслям, окрестности поражают красотой."},{"n":3,"text":"Прежде всего поражает необыкновенно резкий переход от широкой чернозёмной равнины к крутым лесистым горам."},{"n":4,"text":"Главная масса озёр идёт всё время с правой стороны от дороги, но, подъезжая к озеру Большие Касли, вы видите озеро и слева — это заросший осокой Кисегач."},{"n":5,"text":"Здесь настоящая уральская Швейцария — можно только удивляться: как на сравнительно небольшом пространстве собрана такая масса всяческой благодати?"},{"n":6,"text":"На глазах у нас выплыло несколько утиных выводков, тут же по мокрому песку берегового прибоя хлопотливо бегали белые чайки."},{"n":7,"text":"К Каслям дорога идёт вёрст десять всё время по берегу озера."},{"n":8,"text":"Красиво белеют церкви, разные постройки."},{"n":9,"text":"Этот вид не теряет своего очарования вблизи, хотя такое иногда случается с красивыми ландшафтами."}],"cat":"BSP","originalAnswers":[[2,6]]},{"id":"50697","answers":[[4,7]],"full":[{"n":1,"text":"Юго-восточную часть Западно-Сибирской низменности занимает Алтайский край."},{"n":2,"text":"У северо-западных границ Алтайского края лежит самая низкая часть Алтая — Кулундинская впадина."},{"n":3,"text":"Ни холмов, ни оврагов — никаких неровностей рельефа здесь нет — только сотни километров плоской, как стол, земли с разбросанными повсюду озёрами."},{"n":4,"text":"На запад степь тянется до долины реки Иртыша; на востоке, повышаясь, переходит в террасы Приобского плато, прорезанные ложбинами древнего стока."},{"n":5,"text":"Степной пейзаж сменяется более разнообразным лесостепным: на плоских террасах-водоразделах степные участки чередуются с колками — небольшими берёзовыми рощами."},{"n":6,"text":"А по прорезающим плато ложбинам вытянулись тёмно-зелёные полосы уникальных ленточных боров."},{"n":7,"text":"Приобское плато, на востоке ограниченное долиной Оби, на юге переходит в Предалтайскую равнину."}],"cat":"DET","originalAnswers":[[4,7]]},{"id":"50705","answers":[[1,5]],"full":[{"n":1,"text":"Маршрут «Золотое кольцо России» постоянно развивался с момента своего появления в 70-х годах XX века: появлялись новые точки на маршрутной карте, совершенствовался сервис."},{"n":2,"text":"Изначально маршрут состоял из восьми городов: Сергиева Посада (тогда — Загорска), Переславля-Залесского, Ростова Великого, Ярославля, Костромы, Иванова, Суздаля, Владимира."},{"n":3,"text":"Недавно к ним присоединился Углич — старинный русский город, расположенный на берегу Волги."},{"n":4,"text":"Сейчас формируется список населённых пунктов, которые смогут войти в «Золотое кольцо» России: среди них, например, Рязань."},{"n":5,"text":"На сегодняшний день можно говорить о серьёзных качественных изменениях: пополнилась инфраструктура новыми пунктами размещения и питания, улучшились дороги и средства связи, повысился уровень обслуживания и безопасности туристов."},{"n":6,"text":"На маршруте активно развиваются разные виды туризма."}],"cat":"BSP","originalAnswers":[[1,5]]},{"id":"50706","answers":[[2,5,6]],"full":[{"n":1,"text":"Село Карабиха стоит чуть в стороне от большой дороги."},{"n":2,"text":"Рядом горка, которая носит это же звучное название."},{"n":3,"text":"В горку упирается конец гряды, тянущейся от берегов Волги."},{"n":4,"text":"Дальше начинается крутой спуск к бескрайней равнине."},{"n":5,"text":"Усадьба Некрасова, как и село, возле которого она расположена, носит название Карабиха."},{"n":6,"text":"Досталась она поэту после долгих поисков места, где жилось бы вольно среди родной русской природы."},{"n":7,"text":"Газеты того времени пестрели объявлениями о продаже земель, экипажей, всякого инвентаря, оранжерей, конных заводов, псарен."},{"n":8,"text":"Купив Карабиху, Некрасов не стремился к доходам."},{"n":9,"text":"Карабиха стала только летним местом пребывания поэта."}],"cat":"SPP","originalAnswers":[[2,5,6]]},{"id":"51265","answers":[[2,4]],"full":[{"n":1,"text":"Наша страна необъятна по своим размерам."},{"n":2,"text":"Она омывается водами Северного Ледовитого океана, Тихого океана."},{"n":3,"text":"На Северном полюсе обитают белые медведи, называемые полярными."},{"n":4,"text":"А на юге так тепло, что можно выращивать чай, гранаты, мандарины."},{"n":5,"text":"На севере очень холодно, там всегда мороз и льды."},{"n":6,"text":"На юге растут сосны и пальмы, а в Чёрном море живут дельфины."},{"n":7,"text":"Такому климатическому разнообразию, пожалуй, может позавидовать любая другая страна."}],"cat":"HOM","originalAnswers":[[2,4]]},{"id":"51527","answers":[[1,7]],"full":[{"n":1,"text":"За горой Таганай, между сопками, расположен главный город Южного Урала —Златоуст."},{"n":2,"text":"От поколения к поколению передаётся здесь вековой опыт златоустовских мастеров — создателей уникальной булатной стали."},{"n":3,"text":"Выйдешь на Александровскую сопку и поглядишь вниз — вот что представится тебе."},{"n":4,"text":"Речушка, называемая рекой Ай, образует пруд."},{"n":5,"text":"А далее — плотина, мост, музейная доменная печь и сизый дым металлургических заводов."},{"n":6,"text":"Полыхает там густое красное пламя, и долетает оттуда гул адовой работы доменных и мартеновских печей."},{"n":7,"text":"А вокруг, близко к заводам, расположились кровли домов."}],"cat":"PREC","originalAnswers":[[1,7]]},{"id":"51605","answers":[[1,3,4,9]],"full":[{"n":1,"text":"Все слышали о Мертвом море в Израиле, настолько соленом, что плотность воды позволяет спокойно лежать на ее поверхности и читать газету."},{"n":2,"text":"В России тоже есть свое «мертвое море»: это белоснежное соленое озеро Баскунча́к на левом берегу Волги в Астраханской области, на территории Ахтубинского района."},{"n":3,"text":"Водоем питает периодически пересыхающая маловодная речка Горькая, а воду озеру поставляют 25 родников, которые не дают ему полностью испариться."},{"n":4,"text":"Поскольку поток на своем пути размывает красные глины, вода окрашивается в красный цвет."},{"n":5,"text":"Так образовался фантастический ландшафт: зеленая трава, белые пятна соли, красная вода и голубое небо."},{"n":6,"text":"Где еще такое увидишь?"},{"n":7,"text":"Содержание соли в воде достигает 300 граммов на литр — на вкус она очень горькая."},{"n":8,"text":"Для сравнения: вода Черного моря в одном литре содержит всего 18 граммов соли."},{"n":9,"text":"Аномальное содержание NaCl вызвано тем, что под водой находится пласт соли мощностью от 18 метров до шести километров!"}],"cat":"SPP","originalAnswers":[[1,3,4,9]]},{"id":"51607","answers":[[1,4,5]],"full":[{"n":1,"text":"Те, кто хотя бы раз побывал в Петербурге, не могли не обратить внимания на чугунные ограды дворцов и парков этого удивительного города."},{"n":2,"text":"По воле замечательных русских умельцев, занимавшихся литьем и ковкой металла, в самый сильный мороз здесь словно распускаются цветы на решетке Михайловского сада, порывы осеннего ветра как бы прижимают твердые листья лавра к копьям на воротах Русского музея и заставляют звенеть колокольчики на ограде Шереметьевского дворца."},{"n":3,"text":"А как музыкальна ограда Смольного собора!"},{"n":4,"text":"Волны металлических линий то поднимаются, то опускаются, то приближаются, то уходят вдаль, будто в такт вальсу изгибаются скрипичные ключи."},{"n":5,"text":"Любуясь игрой причудливых узоров, невольно удивляешься искусству мастеров, которые сумели из тяжелого и хрупкого чугуна отлить тончайшие прожилки листьев на перилах Певческого или Демидова моста."},{"n":6,"text":"Петербург будто бы специально создан для романтиков и влюбленных."}],"cat":"SPP","originalAnswers":[[1,4,5]],"notes":{"4":"«Будто в такт вальсу изгибаются скрипичные ключи» — придаточная сравнительная часть с грамматической основой «ключи изгибаются»."}},{"id":"54106","answers":[[3,5]],"full":[{"n":1,"text":"Падение метеорита, произошедшее 5 февраля 2013 года, заставило говорить о Челябинске весь мир."},{"n":2,"text":"Жители Челябинска и некоторых отдалённых районов наблюдали в небе стремительный полёт ярко светящегося неопознанного объекта, позади которого тянулся хорошо заметный след."},{"n":3,"text":"По оценкам экспертов, челябинский метеорит весил 10 тонн, в диаметре составлял не менее 17 метров."},{"n":4,"text":"Полёт метеорита длился не более 40 секунд, однако яркий свет был виден на дальних расстояниях."},{"n":5,"text":"Его наблюдали в Курганской, Свердловской, Тюменских областях, Башкортостане и даже в Самарской области — в 750 километрах от Челябинска."},{"n":6,"text":"Учёные установили: возраст Челябинского метеорита — не менее четырёх миллиардов лет."}],"cat":"HOM","originalAnswers":[[3,5]]},{"id":"54412","answers":[[4,7]],"full":[{"n":1,"text":"Целое утро мы провели в поле, затравили двух волков и множество зайцев и вернулись домой в восхитительно приятном расположении духа."},{"n":2,"text":"Смеркалось."},{"n":3,"text":"Ветер разыгрывался в темных полях, шумно раскачивая обнаженные вершины берез и лип."},{"n":4,"text":"На крыльце я остановился и оглянулся: по серому небу тяжко ползли длинные тучи, темно-бурый кустарник крутился на ветре и жалобно шумел, желтая трава бессильно и печально пригибалась к земле, стаи дроздов перелетывали по рябинам."},{"n":5,"text":"На круглом столе горело восемь свечей в серебряных подсвечниках."},{"n":6,"text":"Одетый по-английски благообразный дворецкий стоял в почтительной неподвижности перед другим столом, на котором уже красовалась большая суповая чаша, обвитая легким и пахучим паром."},{"n":7,"text":"Обед был чрезвычайно приятный, мы хохотали и с восторгом упоминали о двух знаменитых «угонках»."},{"n":8,"text":"После долгого обсуждения мы вдруг все замолчали."},{"n":9,"text":"В это время, говорят, пролетел тихий ангел."}],"cat":"BSP","originalAnswers":[[4,7]]},{"id":"55156","answers":[[2,5,9]],"full":[{"n":1,"text":"Как происходит зарождение погоды в Мировом океане?"},{"n":2,"text":"Чтобы найти ответ, учёные используют современную технику — крупные научно-исследовательские суда и специальные буи."},{"n":3,"text":"Собранные данные позволяют прогнозировать погоду на несколько лет вперёд."},{"n":4,"text":"Долгосрочные прогнозы вполне реальны, залогом этого служит не только мощь современных компьютеров."},{"n":5,"text":"Метеорологи приступили к самому грандиозному исследованию Мирового океана, которое когда-либо затевалось."},{"n":6,"text":"Участники проекта — учёные из 30 стран — уже более 10 лет исследуют Океан."},{"n":7,"text":"Никогда прежде наука не уделяла столько внимания водной среде."},{"n":8,"text":"По некоторым данным, всего за какое-то десятилетие количество собранной информации об Океане увеличилось в десятки раз."},{"n":9,"text":"«Когда мы приступали к работе, то думали создать нечто вроде моментальной фотографии Океана», — вспоминает один из руководителей проекта."}],"cat":"SPP","originalAnswers":[[2,5,9]],"notes":{"9":"Внутри прямой речи «Когда мы приступали к работе, то думали…» выделяется придаточная часть времени. Пунктуация оформления прямой речи — другое правило."}},{"id":"58375","answers":[[3,8]],"full":[{"n":1,"text":"Курильские острова — это вершины наиболее высоких гор вулканической гряды, уходящих на многие километры в глубину океана."},{"n":2,"text":"Острова заселены очень неравномерно: на Парамушире, Итурупе, Кунашире и Шикотане постоянно проживает несколько тысяч человек — на остальные люди приезжают временно."},{"n":3,"text":"На островах более 150 вулканов, из которых 39 действующие."},{"n":4,"text":"Самый высокий вулкан — Алаид — находится на острове Атласова."},{"n":5,"text":"На островах множество горячих источников с высоким содержанием минералов."},{"n":6,"text":"Поэтому пить воду из этих источников нельзя."},{"n":7,"text":"Впрочем, и купаться во многих не получится: вода кипит."},{"n":8,"text":"На острове Кунашир даже есть озеро, которое называется Понто — Кипящее."}],"cat":"SPP","originalAnswers":[[3,8]]},{"id":"59315","answers":[[2,3,7]],"full":[{"n":1,"text":"В конце октября, когда дни ещё по-осеннему ласковы, Балаклава начинает жить своеобразной жизнью."},{"n":2,"text":"Уезжают обременённые чемоданами и баулами последние курортники, и сразу становится просторно и по-домашнему деловито, точно после отъезда непрошеных гостей."},{"n":3,"text":"Поперёк набережной расстилаются рыбачьи сети, на полированных булыжниках мостовой они кажутся нежными и тонкими, словно паутина."},{"n":4,"text":"Рыбаки, эти труженики моря, ползают по разостланным сетям, правят их разорванную воздушную пелену."},{"n":5,"text":"Опускаясь за море, садится солнце."},{"n":6,"text":"Звёздная ночь обволакивает землю, погружённую в глубокий сон."},{"n":7,"text":"Нигде, по-моему, не услышишь такой совершенной и такой идеальной тишины, как в Балаклаве."},{"n":8,"text":"Ночь и молчание слились в одном чёрном объятии."}],"cat":"COMP","originalAnswers":[[2,3,7]],"notes":{"7":"В ответ предложение входит благодаря сравнительному обороту «как в Балаклаве». «По-моему» — другое правило (вводное слово)."}},{"id":"59514","answers":[[1,5,8]],"full":[{"n":1,"text":"Настоящей жемчужиной Южного Урала можно назвать озеро Тургояк, которое содержит чистейшую воду, по качеству близкую к байкальской."},{"n":2,"text":"Это одно из самых прозрачных озёр планеты."},{"n":3,"text":"Водоём расположен в глубокой межгорной котловине на высоте более 300 метров над уровнем моря."},{"n":4,"text":"Тургояк называют маленьким Байкалом: его площадь составляет более 25 квадратных километров."},{"n":5,"text":"Уровень озера подвержен существенным колебаниям, причина которых до конца не установлена."},{"n":6,"text":"В зависимости от уровня на озере можно насчитать 10–12 островов, среди них наиболее крупными являются остров Веры (Пинаевский), Большой Инышевский, Малый Инышевский, остров Чайки, остров Змеиный."},{"n":7,"text":"В малую воду некоторые большие острова становятся полуостровами."},{"n":8,"text":"По духовным источникам, Тургояк — одно из трёх озёр, которые считаются священными."},{"n":9,"text":"Такая слава, помимо Тургояка, ещё у Байкала и Иссык-Куля."}],"cat":"SPP","originalAnswers":[[1,5,8]]},{"id":"14086","answers":[[1,4]],"full":[{"n":1,"text":"Чтобы почувствовать духовные богатства древней русской литературы, необходимо взглянуть на неё глазами её современников."},{"n":2,"text":"Перенесёмся мысленно в начальные века русской истории, в эпоху нераздельного существования восточных славян."},{"n":3,"text":"Русская земля огромна, поселения в ней редки."},{"n":4,"text":"Чтобы проехать из конца в конец Русскую землю, надо много дней провести на коне или в ладье."},{"n":5,"text":"В огромных просторах люди с особенной остротой ощущали и ценили своё единство — и в первую очередь единство языка."},{"n":6,"text":"Роль литературы также становится особенно значимой."},{"n":7,"text":"Она служит той же цели объединения и выражает народное самосознание единства."}],"cat":"SPP","originalAnswers":[[1,4]]},{"id":"14094","answers":[[1,4]],"full":[{"n":1,"text":"Среди великих изобретений былых времён, окончательно выделивших род из приниженного состояния, наибольшую роль сыграла письменность."},{"n":2,"text":"Именно по книгам, как по ступенькам, поднимался человек на свою нынешнюю высоту."},{"n":3,"text":"Книга — это многовековой опыт."},{"n":4,"text":"Накопленные знания обретают могущество лавины, преодолевающей с тысячелетнего разгона любое препятствие на столбовой дороге человеческого прогресса, только благодаря книге."},{"n":5,"text":"Недаром грозные завоеватели древности и наиболее выдающиеся подлецы недавнего прошлого начали свою разбойничью деятельность уничтожением библиотек, кострами из книг…"},{"n":6,"text":"Нет ничего дороже книги у мыслящего человека!"},{"n":7,"text":"Поэтому любите книгу и храните её выше всякого другого достоинства."}],"cat":"DET","originalAnswers":[[1,4]]},{"id":"14096","answers":[[1,5]],"full":[{"n":1,"text":"Зелень, одаривая съедобными травами и небывалыми ароматами, в июле уже вовсю цветет."},{"n":2,"text":"Небосклон голубой и чистый, время от времени проплывают по нему пушистые облака."},{"n":3,"text":"И вдруг неожиданно жаркое летнее солнце сменяют надвигающиеся тучи."},{"n":4,"text":"Только что было солнце — теперь его поглотила грозная тьма."},{"n":5,"text":"Сильные порывы ветра, с каждым разом усиливаясь, готовы сорвать ветви с макушек деревьев на своем пути."},{"n":6,"text":"Гроза стихает так же неожиданно, как и началась."},{"n":7,"text":"Впереди еще долгие жаркие, знойные и просто теплые приятные деньки."}],"cat":"GER","originalAnswers":[[1,5]]},{"id":"14097","answers":[[3,6]],"full":[{"n":1,"text":"Впереди, в голубоватой светящейся мгле, медленно вырастали очертания жёлтых гор."},{"n":2,"text":"Это был Крым, но я не сразу узнал его."},{"n":3,"text":"Он показался мне огромным островом, тонущим в утренней синеве."},{"n":4,"text":"Впервые я увидел из морской дали весь Крым, весь торжественный разворот его берегов от мыса Фиолента до Карадага."},{"n":5,"text":"Так, очевидно, представляли себе обетованную землю наши пращуры."},{"n":6,"text":"Мы подходили к берегам, расцвеченным сухими и резкими красками крымской зимы."},{"n":7,"text":"Уже пылали ржавчиной виноградники, уже видны были покрытые снегом вершины Чатырдага и Ай-Петри…"}],"cat":"DET","originalAnswers":[[3,6]]},{"id":"14098","answers":[[1,3]],"full":[{"n":1,"text":"Поэт лежал в кабинете, на диване, окружённый книгами своей библиотеки."},{"n":2,"text":"Он окинул их угасающим взглядом."},{"n":3,"text":"Для него каждая стоявшая на полках книга была живым организмом, жившим своей особой жизнью."},{"n":4,"text":"Томик Байрона с короткой дружеской надписью: «Байрона Пушкину дарит почитатель обоих А. Мицкевич» - рождал в душе воспоминания тех лет, когда он от английского поэта «с ума сходил»..."},{"n":5,"text":"Друзья и книги были неизменными спутниками его короткой бурной жизни."},{"n":6,"text":"И в своём творчестве часто обращался к ним."},{"n":7,"text":"Друзья и книги…"},{"n":8,"text":"Обернувшись к ним, Пушкин тихо промолвил: — Прощайте, друзья!"}],"cat":"DET","originalAnswers":[[1,3]],"notes":{"1":"«Окружённый книгами своей библиотеки» — обособленное определение к слову «поэт». «На диване» — уточнение, другое правило."}},{"id":"14108","answers":[[1,6]],"full":[{"n":1,"text":"Подъехавши к трактиру, Чичиков велел остановиться по двум причинам."},{"n":2,"text":"С одной стороны, чтоб дать отдохнуть лошадям, а с другой стороны, чтоб и самому несколько закусить и подкрепиться."},{"n":3,"text":"Деревянный потемневший трактир принял Чичикова под свой узенький гостеприимный навес на деревянных выточенных столбиках, похожих на старинные церковные подсвечники."},{"n":4,"text":"Трактир был чем-то вроде русской избы, но отличался бо́льшими размерами."},{"n":5,"text":"Резные узорочные карнизы из свежего дерева вокруг окон и под крышей резко и живо пестрили темные его стены; на ставнях были нарисованы кувшины с цветами."},{"n":6,"text":"Взобравшись узенькою деревянною лестницею наверх, в широкие сени, он встретил отворявшуюся со скрипом дверь и толстую старуху в пестрых ситцах…"},{"n":7,"text":"— Поросенок есть? — с таким вопросом обратился Чичиков к стоявшей бабе."}],"cat":"GER","originalAnswers":[[1,6]]},{"id":"14110","answers":[[1,2]],"full":[{"n":1,"text":"Ясные дни миновали, и Марусе стало опять хуже."},{"n":2,"text":"На все наши ухищрения с целью занять её она смотрела равнодушно своими большими глазами, и мы давно не слышали её смеха."},{"n":3,"text":"Тогда я решился обратиться к своей сестре Соне."},{"n":4,"text":"У Сони была большая кукла с ярко раскрашенным лицом, роскошными льняными волосами, подарок покойной матери."},{"n":5,"text":"На эту куклу я возлагал большие надежды и потому, отозвав сестру в боковую аллею, попросил дать мне её на время."},{"n":6,"text":"Соня, которая сначала прижимала куклу к себе, отдала мне её и обещала в течение двух-трёх дней играть другими игрушками."},{"n":7,"text":"Маленькая кукла сделала почти чудо: Маруся, казалось, вдруг ожила."}],"cat":"SSP","originalAnswers":[[1,2]],"notes":{"1":"«Ясные дни миновали» и «Марусе стало хуже» — две части ССП, соединённые союзом «и».","2":"Две самостоятельные основы соединены союзом «и»: «она смотрела» и «мы не слышали»."}},{"id":"14111","answers":[[3,6]],"full":[{"n":1,"text":"Давным-давно, почти четыреста лет назад, первые землепроходцы – енисейские казаки – вышли на берега громадного пресноводного озера Байкал."},{"n":2,"text":"Очень интересно это озеро и загадочно его происхождение."},{"n":3,"text":"Оно занимает гигантскую тектоническую впадину, расположенную на высоте 453 метров над уровнем моря."},{"n":4,"text":"Очевидно, здесь когда-то в юности нашей Земли произошла колоссальная передвижка земной коры."},{"n":5,"text":"В результате в одних местах появились скалистые горные складки, а в другом месте образовалась глубокая впадина."},{"n":6,"text":"Это самое большое озеро из всех пресных озёр, имеющихся на континенте Азии и Европы."},{"n":7,"text":"Питается Байкал водами впадающих в него рек и речушек."},{"n":8,"text":"Рек в Байкал впадает много – вытекает только красавица Ангара."}],"cat":"DET","originalAnswers":[[3,6]]},{"id":"14114","answers":[[1,6]],"full":[{"n":1,"text":"Щепкин познал, как он сам выражался, русскую жизнь от лакейской до дворца."},{"n":2,"text":"Внук и сын крепостного, он томился в неволе у помещика Волькенштейна."},{"n":3,"text":"Жизненный путь ставшего знаменитым артиста Щепкина продолжался семьдесят пять лет, а из этих семидесяти пяти лет только сорок два года он был свободным человеком."},{"n":4,"text":"Первые годы службы на московской сцене, о которых свидетельствовали многие современники артиста, принесли ему много разочарований и горести."},{"n":5,"text":"Но мастерство год от года росло."},{"n":6,"text":"Игра Щепкина, говорил Герцен, вся от доски до доски была проникнута теплотой, правдивостью."},{"n":7,"text":"Не зря его называли «не театралом на театре»."}],"cat":"INTRO","originalAnswers":[[1,6]],"notes":{"1":"«Как он сам выражался» — вводное предложение с указанием на источник формулировки, а не обычное придаточное предложение."}},{"id":"14115","answers":[[4,5]],"full":[{"n":1,"text":"В тихий летний день, когда я впервые увидел озеро Сайму, оно имело вид светлого зеркала, по которому были раскиданы островки и скалы."},{"n":2,"text":"На этих островках нет земли, один гранит."},{"n":3,"text":"Из гигантского сплетения озёр течёт прозрачная и широкая Вуокса в лесной глуши."},{"n":4,"text":"Беспрестанно заграждают ей путь пороги, и вдруг гранитные скалы заставили реку течь по сильно наклоненной щели, стиснув её светлые воды."},{"n":5,"text":"Река, вся белая от пены, с бешеным ревом прыгает, как дикий зверь, высоко подбрасывая гребни волн."},{"n":6,"text":"Каких только звуков не услышишь в этой дикой музыке: тут и гром, и вой, и плач, и шум леса, и стоны."},{"n":7,"text":"Это водопад Иматра."}],"cat":"GER","originalAnswers":[[4,5]]},{"id":"14118","answers":[[2,5]],"full":[{"n":1,"text":"Слово «заря» — одно из прекраснейших слов русского языка."},{"n":2,"text":"Оно сродни той устоявшейся тишине ночи, когда над зарослями деревенского сада занимается чистая и слабая синева."},{"n":3,"text":"Заря бывает не только утренняя, но и вечерняя."},{"n":4,"text":"Мы часто путаем два понятия: закат солнца и вечернюю зарю."},{"n":5,"text":"Вечерняя заря начинается, когда солнце уже зайдёт за край земли."},{"n":6,"text":"Тогда она овладевает меркнущим небом, разливая по нему множество чистых красок и медленно переходя в поздние сумерки и в ночь."},{"n":7,"text":"Кричат в кустах коростели, бьют перепела, гудит выпь, горят первые звёзды, заря еще долго дотлевает над далями и туманами."}],"cat":"SPP","originalAnswers":[[2,5]]},{"id":"14119","answers":[[1,4]],"full":[{"n":1,"text":"Сама Софья Васильевна Ковалевская рассказывает в своих воспоминаниях, что большое влияние на пробуждение у неё интереса к математике оказал дядя своими рассказами о квадратуре круга и других увлекательных математических вопросах."},{"n":2,"text":"Эти рассказы действовали на фантазию девочки и создавали в ней представление о математике как о науке с множеством загадок."},{"n":3,"text":"Софья Васильевна рассказывает ещё о другом случае, укрепившем в ней интерес к математике."},{"n":4,"text":"Детская комната за нехваткою обоев была оклеена листами лекций по высшей математике, которые слушал в молодости её отец."},{"n":5,"text":"Таинственные формулы, загадочные слова и фигуры от частого обозрения их врезались в память девочки."},{"n":6,"text":"В возрасте пятнадцати лет она стала брать уроки высшей математики – теперь сообщаемые ей учителем новые понятия казались старыми знакомыми и она усваивала их, к удивлению учителя, очень легко."}],"cat":"SPP","originalAnswers":[[1,4]]},{"id":"14211","answers":[[2,9]],"full":[{"n":1,"text":"Количество видимых на небе простым глазом звёзд кажется неисчислимым."},{"n":2,"text":"По мнению учёных, одновременно в нашем поле зрения бывает не более трёх тысяч звёзд."},{"n":3,"text":"Звёзды — это те же солнца."},{"n":4,"text":"Они кажутся нам блестящими точками — так далеко удалены они от Земли на необозримые расстояния."},{"n":5,"text":"Ещё в древности люди заметили, что некоторые группы ярких звёзд образуют разные фигуры."},{"n":6,"text":"Разделив всё небо на созвездия, учёные составили звёздные карты."},{"n":7,"text":"Все звёзды, даже самые маленькие, были причислены к тому или иному созвездию."},{"n":8,"text":"И расположение звёзд в созвездиях, и расстояние их друг от друга кажутся неизменными."},{"n":9,"text":"По расчётам учёных, заметить движение звёзд можно будет лишь через десятки тысяч лет."}],"cat":"INTRO","originalAnswers":[[2,9]]},{"id":"14212","answers":[[2,3]],"full":[{"n":1,"text":"Солнце уже пряталось, и на цветущей ржи растянулись вечерние тени."},{"n":2,"text":"Два ряда тесно посаженных елей стояли, образуя красивую аллею."},{"n":3,"text":"Я перелез через изгородь и пошёл по ней, скользя по еловым иглам."},{"n":4,"text":"Было тихо и темно, только на вершинах кое-где дрожал яркий золотой свет и переливался в сетях паука."},{"n":5,"text":"Направо, в старом фруктовом саду, нехотя пела иволга, должно быть, тоже старая."},{"n":6,"text":"Передо мной неожиданно открылся чудесный вид: широкий пруд, деревня на том берегу, высокая узкая колокольня."},{"n":7,"text":"На ней горел крест."}],"cat":"GER","originalAnswers":[[2,3]]},{"id":"14213","answers":[[6,7]],"full":[{"n":1,"text":"К зрелости мысли Левитана всё чаще останавливались на осени."},{"n":2,"text":"Правда, он написал несколько превосходных весенних вещей, но почти всегда это была похожая на осень весна."},{"n":3,"text":"Левитан, так же как Пушкин, ждал осени как самого дорогого и мимолётного времени года."},{"n":4,"text":"Она снимала со всей природы: с лесов, лугов, с полей – густые цвета, смывая дождями зелень."},{"n":5,"text":"Осень на картинах Левитана очень разнообразна."},{"n":6,"text":"На них изображены знакомые с детства стога сена, почерневшие от сырости, и одинокие золотые берёзы, ещё не обитые ветром."},{"n":7,"text":"Но во всех его пейзажах лучше всего передана печаль прощальных дней и предзимнего солнца, едва заметно прогревающего землю."}],"cat":"DET","originalAnswers":[[6,7]]},{"id":"42238","answers":[[5,6]],"full":[{"n":1,"text":"Под Владимиром, в посёлке Муромцево, стоит необычный замок в неоготическом стиле."},{"n":2,"text":"Ныне замок заброшен, но даже развалины восхищают красотой и вызывают уважение к мастерству талантливого архитектора-стилизатора П. С. Бойцова."},{"n":3,"text":"Этот замок был построен когда-то в вотчине полковника Владимира Семёновича Храповицкого, который в 1884 году получил усадьбу в наследство и с душой и любовью приступил к её обустройству."},{"n":4,"text":"За пять лет были построены два усадебных дома, летний театр, купальня, дом управляющего, изящный конный двор и необычный охотничий дворик."},{"n":5,"text":"На территории усадьбы разбит дендрарий, на птичьем дворе собрано невиданное разнообразие редких птиц и животных."},{"n":6,"text":"Необычные для русской архитектуры сооружения в неоготическом стиле окружали сказочные ухоженные сады, в искусственных прудах плавали белые лебеди, многочисленные фонтаны били ввысь струями сверкающих брызг, с насыпного пригорка низвергался бурлящий водопад."}],"cat":"BSP","originalAnswers":[[5,6]]}],"CLASSIFY":[{"text":"Новый сосед внимательно приглядывался к жителям коммунальной квартиры, записывал всё в особую тетрадку.","cats":["HOM"],"explain":"«Приглядывался, записывал» — однородные сказуемые без союза.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Родион Раскольников, несомненно, обрёк себя на одиночество.","cats":["INTRO"],"explain":"«Несомненно» — вводное слово, выражающее уверенность.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Не кричите, господа!","cats":["ADDR"],"explain":"«Господа» — обращение к адресатам речи.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Ах, какой это хороший был день!","cats":["INTERJ"],"explain":"«Ах» — междометие.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Бывает только неправильный путь, но не бывает безвыходных положений.","cats":["SSP"],"explain":"Две части сложносочинённого предложения соединены союзом «но».","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"По прибытии на вокзал леди Бойнтон встретила свою подругу Сару Эджертон, с которой не виделась в течение последних трёх лет.","cats":["SPP"],"explain":"«С которой не виделась…» — придаточная определительная часть.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Слева разливается заря, справа над горами висит запоздалый месяц.","cats":["BSP"],"explain":"Две самостоятельные грамматические основы; союз отсутствует.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Мой отец, капитан пограничных войск, служил на Дальнем Востоке.","cats":["APP"],"explain":"«Капитан пограничных войск» поясняет существительное «отец» и является приложением.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"А вдали, у края голубого неба, лёгким облаком маячили заснеженные горы.","cats":["PREC"],"explain":"«У края голубого неба» уточняет место («вдали»).","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Я учился в университете с ребятами, серьёзно увлекавшимися театром.","cats":["DET"],"explain":"«Серьёзно увлекавшимися театром» — причастный оборот после определяемого слова.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Анализируя текст рукописи, учёный сделал несколько неожиданных выводов.","cats":["GER"],"explain":"«Анализируя текст рукописи» — деепричастный оборот.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Все участники экспедиции, кроме Валерия, понимали, что важно сохранить остатки запасов, чтобы использовать их в конце пути.","cats":["EXTRA","SPP"],"explain":"«Кроме Валерия» — обособленное дополнение; «что важно…» и «чтобы использовать…» — придаточные части.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Только остров на озере был чёрен и густ, как бархат.","cats":["COMP"],"explain":"«Как бархат» — сравнительный оборот.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"В этом отношении случилось одно важное для них обоих событие, а именно встреча Кити с Вронским.","cats":["EXPL"],"explain":"«А именно встреча…» — пояснительная конструкция с союзом «а именно».","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Пятнадцатого января, в среду, пройдёт научная конференция.","cats":["PREC"],"explain":"«В среду» уточняет обстоятельство времени «пятнадцатого января».","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Клюев перевёл взгляд на открывшуюся дверь и увидел своего соседа, дьячка.","cats":["APP"],"explain":"«Дьячка» — приложение к существительному «соседа».","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Неисправимый формалист, он предпочитал цитировать устав даже тогда, когда реальность давно шла другим путём.","cats":["APP","SPP"],"explain":"«Неисправимый формалист» — приложение к местоимению «он»; «когда…» — придаточная часть.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Ремонтный дрон, по прозвищу Скат, получил такое имя из-за того, что формой корпуса напоминал морского хищника.","cats":["APP","SPP"],"explain":"«По прозвищу Скат» — приложение; «что … напоминал» входит в составной союз «из-за того что» и придаточную часть.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Капитан, как опытный разведчик, просчитывал даже те маршруты, о которых штаб ещё не знал.","cats":["APP","SPP"],"explain":"Здесь «как опытный разведчик» имеет значение «будучи разведчиком» (приложение), а «о которых…» — придаточная часть.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"В Москве темнеет быстро, по-зимнему.","cats":["PREC"],"explain":"«По-зимнему» конкретизирует способ действия «быстро».","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Тогда Андрей испытывал радость, свойственную всем детям его возраста.","cats":["DET"],"explain":"Обособленное согласованное определение с зависимыми словами.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Трава, сочная и свежая, пестрела крупными золотисто-жёлтыми цветами.","cats":["DET"],"explain":"Два однородных обособленных определения.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Рассказывая, мальчик внимательно рассматривал слушателей.","cats":["GER"],"explain":"Обособляется одиночное деепричастие «рассказывая».","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Людмила Алексеевна, согласно представлениям окружающих о ней, обладала сильным характером.","cats":["GER"],"explain":"Обстоятельственный оборот с производным предлогом «согласно» (пример из твоей теоретической справки).","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Восходящие тучи закрыли солнце, и над селом пошёл дождь.","cats":["SSP"],"explain":"Две грамматические основы соединены сочинительным союзом «и».","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Небо потемнело, поэтому птицы умолкли.","cats":["BSP"],"explain":"По трактовке из навигатора ФИПИ сочетания частей с наречием «поэтому» относятся к БСП.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Он задумался, потом посмотрел в окно.","cats":["HOM"],"explain":"Однородные сказуемые «задумался, посмотрел».","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Маша, закрой окно!","cats":["ADDR"],"explain":"«Маша» — обращение к адресату просьбы.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Ой, я уронил тетрадь!","cats":["INTERJ"],"explain":"«Ой» — междометие.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"По-моему, это прекрасная идея.","cats":["INTRO"],"explain":"«По-моему» — вводное слово.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Сады, поля, луга — всё ожило весной.","cats":["HOM"],"explain":"Запятые перечисляют однородные подлежащие; тире здесь относится к обобщающему слову.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Вечером, после заката, мы вышли на берег и увидели лодку.","cats":["PREC"],"explain":"«После заката» уточняет обстоятельство времени «вечером».","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Пришёл новый сторож, пожилой человек из соседней деревни.","cats":["APP"],"explain":"«Пожилой человек…» — приложение к слову «сторож».","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Мальчик, уставший после долгого пути, быстро уснул.","cats":["DET"],"explain":"Обособленный причастный оборот после определяемого слова.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Не прекращая работы, учёный отвечал на вопросы.","cats":["GER"],"explain":"Деепричастный оборот.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Всё, кроме последней страницы, было написано аккуратно.","cats":["EXTRA"],"explain":"«Кроме последней страницы» — обособленное дополнение со значением исключения.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Лес стоял неподвижно, словно нарисованный.","cats":["COMP"],"explain":"«Словно нарисованный» — сравнительный оборот.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Два предмета, то есть два старинных письма, сохранились в архиве.","cats":["EXPL"],"explain":"«То есть два старинных письма» — пояснительный оборот.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Мой брат, известный художник, приехал вечером, когда весь город уже спал.","cats":["APP","SPP"],"explain":"«Известный художник» — приложение; «когда весь город…» — придаточное времени.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Прочитав письмо, она, к счастью, улыбнулась.","cats":["GER","INTRO"],"explain":"«Прочитав письмо» — деепричастный оборот; «к счастью» — вводное сочетание.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Я открыл дверь, и, когда послышался звонок, в комнату вошёл гость.","cats":["SSP","SPP"],"explain":"«И» соединяет части ССП; «когда послышался звонок» — придаточная часть внутри второй.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Господа, по-моему, вы забыли документы.","cats":["ADDR","INTRO"],"explain":"«Господа» — обращение; «по-моему» — вводное слово.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Вспыхнула молния, за ней раскатился гром.","cats":["BSP"],"explain":"Между самостоятельными частями нет союза — БСП.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Ах, ребята, как прекрасен этот день!","cats":["INTERJ","ADDR"],"explain":"«Ах» — междометие, «ребята» — обращение.","source":"Теоретическая подборка и дополнительные учебные примеры"},{"text":"Его любимым временем года была осень, или пора тихих дождей.","cats":["EXPL"],"explain":"«Или» в значении «то есть» вводит пояснительное наименование.","source":"Теоретическая подборка и дополнительные учебные примеры"}],"RULES":{"HOM":["При однородных членах","Запятые разделяют однородные члены (в том числе при повторяющихся и противительных союзах)."],"INTRO":["Вводные конструкции","Вводное слово или предложение не является членом предложения и обособляется."],"ADDR":["Обращение","Обращение называет адресата речи и выделяется запятыми."],"INTERJ":["Междометие","Междометие выражает чувство или побуждение и отделяется запятой."],"SSP":["В ССП","Части сложносочинённого предложения связаны сочинительным союзом: и, но, а, однако и др."],"SPP":["В СПП","Запятая отделяет придаточную часть сложноподчинённого предложения от главной или разделяет придаточные."],"BSP":["В БСП","Части бессоюзного сложного предложения соединены без сочинительного или подчинительного союза."],"APP":["При приложении","Обособляется определение, выраженное существительным (отвечает на вопрос «кто/что именно?»)."],"PREC":["При уточняющем обстоятельстве","Более точное обозначение места, времени или способа действия обособляется."],"DET":["При обособленном определении","Обособляется причастный оборот, распространённое согласованное определение или однородные обособленные определения."],"GER":["При обособленном обстоятельстве","Обособляется деепричастие, деепричастный оборот или соответствующий обстоятельственный оборот."],"EXTRA":["При обособленном дополнении","Обособляется дополнение со значением включения, исключения или замещения («кроме», «помимо» и др.)."],"COMP":["При сравнительном обороте","Обособляется сравнительный оборот со словами «как», «словно», «будто» и т. п."],"EXPL":["При пояснительной конструкции","Пояснение присоединяется союзами «то есть», «или» (= то есть), «а именно»."]},"REFERENCE":[["1. Запятая при однородных членах","Запятые разделяют однородные члены без союзов, при повторяющихся союзах и некоторых противительных союзах.","Новый сосед приглядывался к жильцам, записывал всё в тетрадку."],["2. Вводные конструкции","Вводные слова и предложения выражают отношение говорящего, порядок мысли, источник сообщения. Не являются членами предложения.","Родион Раскольников, несомненно, обрёк себя на одиночество."],["3. Обращение","Обращение называет адресата речи, не входит в грамматическую основу.","Не кричите, господа!"],["4. Междометие","Междометия выражают чувства, переживания или побуждения.","Ах, какой это хороший был день!"],["5. ССП","Части сложносочинённого предложения имеют собственные грамматические основы и соединяются сочинительными союзами (и, а, но, однако). Не путать с однородными сказуемыми!","Серёга сдал экзамен, и этим он порадовал учителя."],["6. СПП","В сложноподчинённом предложении есть главная часть и придаточная, вводимая союзом или союзным словом («что», «который», «когда», «потому что» и др.).","Я знаю, когда она вернётся."],["7. БСП","Части бессоюзного сложного предложения связаны без сочинительных/подчинительных союзов. В принятой для ЕГЭ классификации сочетания с наречиями «поэтому», «потому», «оттого» относятся к БСП.","Слева разливается заря, справа висит месяц."],["8. Обособленное приложение","Это определение, выраженное существительным. Поясняет другое существительное или местоимение: кто/что именно? Сравнение с «как» в значении «будучи» тоже может выражать приложение.","Мой отец, капитан пограничных войск, служил на Дальнем Востоке."],["9. Уточняющее обстоятельство","Уточняет более общее обозначение места, времени или способа действия.","А вдали, у края голубого неба, маячили горы."],["10. Обособленное согласованное определение","Одна категория для причастных оборотов, распространённых прилагательных с зависимыми словами и обособленных однородных определений.","Трава, сочная и свежая, пестрела цветами."],["11. Обособленное обстоятельство","Деепричастный оборот или одиночное деепричастие, а также ряд обстоятельственных оборотов с производными предлогами.","Анализируя рукопись, учёный сделал выводы."],["12. Обособленное дополнение","Обороты с предлогами «кроме», «помимо», «за исключением», «включая», «вместо» и т. д. В задании № 21 встречаются редко.","Все, кроме Валерия, поняли условие."],["13. Сравнительный оборот","Сравнение со словами «как», «словно», «будто», «как будто» и другими. Не всякий оборот с «как» сравнительный.","Остров был чёрен и густ, как бархат."],["14. Пояснительная конструкция","Присоединяется союзами «то есть», «или» (= «то есть»), «а именно». В отличие от приложения связь здесь выражена пояснительным союзом. По твоей справке ФИПИ не предполагает этот тип в числе правильных ответов.","Произошло событие, а именно встреча Кити с Вронским."]],"WARNINGS":["Одно предложение может содержать несколько видов запятых. Если оно входит в ключ, ищите запятую именно по указанному общему правилу.","ССП, СПП и БСП — разные категории, даже если в предложениях есть запятые. «Поэтому», «потому» и «оттого» в навигаторе ФИПИ считаются наречиями при бессоюзной связи.","Не путай обособленное приложение и пояснительную конструкцию с союзами «то есть», «или» (= «то есть»), «а именно».","Обособленное согласованное определение может быть причастным оборотом, распространённым прилагательным или однородными обособленными определениями.","В экзаменационном режиме разбираем общую группу исходного ключа. В одном невыбранном предложении может встретиться и другое правило: не каждая его запятая относится к группе ответа."]};
const CONFIG=APP_DATA.CONFIG,DATA=APP_DATA.DATA,CLASSIFY=APP_DATA.CLASSIFY;
const RULES=APP_DATA.RULES,REFERENCE=APP_DATA.REFERENCE,WARNINGS=APP_DATA.WARNINGS;
const $=id=>document.getElementById(id),main=$('main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=arr=>{let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a};
const numbers=arr=>arr?.length?[...arr].sort((a,b)=>a-b).join(''):'—';
let gameAttemptId='',attemptTested={},attemptErrors={},gameSaved=false;
const tg=(window.Telegram&&window.Telegram.WebApp)||null;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
let route='menu',queue=[],idx=0,score=0,examSize=10,singleSize=10,selected=new Set(),locked=false,showing='exam',fontOffset=0;
const labelOf=code=>RULES[code]?.[0]??'Другое правило';
const SHORT={HOM:'Однородные члены',INTRO:'Вводные слова',ADDR:'Обращение',INTERJ:'Междометие',SSP:'ССП',SPP:'СПП',BSP:'БСП',APP:'Приложение',PREC:'Уточняющее обстоятельство',DET:'Обособленное определение',GER:'Обособленное обстоятельство',EXTRA:'Обособленное дополнение',COMP:'Сравнительный оборот',EXPL:'Пояснительная конструкция'};
function status(){ $('status').textContent=route==='menu'?'Вариант ЕГЭ · 3 задания':route==='finish'?'Тренировка завершена':(showing==='exam'?'Варианты ЕГЭ':'Узнай правило');$('score').textContent=route==='menu'?'':`Верно: ${score} / ${idx}`;$('progress').style.width=route==='menu'?'0%':(100*(idx/(queue.length||1)))+'%';}
function show(html){main.innerHTML=html;status();}
function home(){route='menu';queue=[];idx=score=0;locked=false;show(`<div class="menu-wrap"><div class="menu-lead"><div class="eyebrow">МАСТЕРСКАЯ ПУНКТУАЦИИ · ЕГЭ №21</div><h1 class="bigtitle">Запятые без ошибок<span class="comma-gold">,</span></h1><p class="intro">Только формат ЕГЭ: три случайных задания с полными текстами и подробным разбором.</p></div><div class="menu-cards"><section class="menu-card"><span class="menu-icon">▦</span><h2>Варианты ЕГЭ · 3 задания</h2><p>Отмечай номера предложений, где запятые поставлены по одному правилу.</p><button class="primary" id="goExam">Начать →</button></section></div><div class="menu-footer"><button id="startHelp">◉ Открыть справочник</button><span>В базе ${DATA.length} заданий · новая случайная тройка при повторе.</span></div></div>`);$('goExam').onclick=startExam;$('startHelp').onclick=openReference;}
function startExam(){route='exam';showing='exam';queue=shuffle(DATA).slice(0,3);gameAttemptId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('e21_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));attemptTested={};attemptErrors={};gameSaved=false;idx=score=0;selected=new Set();fontOffset=0;renderExam();}
function startSingle(){route='single';showing='single';queue=shuffle(CLASSIFY).slice(0,singleSize);idx=score=0;selected=new Set();renderSingle();}
function splitColumns(items){if(window.innerWidth<800)return [items];let total=items.reduce((n,x)=>n+x.text.length+22,0),acc=0,at=1,best=Infinity;items.forEach((x,i)=>{acc+=x.text.length+22;let delta=Math.abs(acc-total/2);if(i<items.length-1 && delta<best){best=delta;at=i+1;}});return [items.slice(0,at),items.slice(at)].filter(x=>x.length)}
function renderPassage(items,readonly=false){let cols=splitColumns(items);return `<div class="reading-viewport" id="reading"><div class="passage-columns" id="passageColumns">${cols.map(col=>`<div class="passage-col">${col.map(x=>`<div class="passage-item ${selected.has(x.n)?'picked':''}" data-item="${x.n}"><button class="sentence-number ${selected.has(x.n)?'on':''}" data-num="${x.n}" aria-label="Предложение ${x.n}" aria-pressed="${selected.has(x.n)}" ${readonly?'disabled':''}>${x.n}</button><span class="passage-text">${esc(x.text)}</span></div>`).join('')}</div>`).join('')}</div></div>`;}
function renderExam(){if(idx>=queue.length){finish();return}locked=false;selected=new Set();fontOffset=0;let t=queue[idx];show(`<div class="exercise"><div class="exercise-top"><div><span class="eyebrow">ПОЛНЫЙ ТЕКСТ · ЭКЗАМЕНАЦИОННЫЙ РЕЖИМ</span><h2>Задание ${idx+1} из ${queue.length} <span class="subhead">· № ${esc(t.id)}</span></h2></div><button class="ghost" id="helpNow">? Справка</button></div><div class="task-instruction">Выбери номера предложений, где <strong>запятые поставлены по одному правилу</strong>.</div>${renderPassage(t.full)}<div class="bottom"><div class="footer-info"><span class="eyebrow">Ответ: <b id="chosen">—</b></span><button class="zoom" id="zoom" title="Увеличить шрифт текста (при необходимости появится прокрутка только текста)">А+</button></div><button id="check" class="primary">Проверить ответ</button></div></div>`);
 $('helpNow').onclick=openReference;$('zoom').onclick=()=>{fontOffset=(fontOffset+2)%10;requestAnimationFrame(fitPassage)};
 main.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{let n=Number(b.dataset.num);selected.has(n)?selected.delete(n):selected.add(n);b.classList.toggle('on',selected.has(n));b.setAttribute('aria-pressed',selected.has(n));main.querySelector(`[data-item="${n}"]`)?.classList.toggle('picked',selected.has(n));$('chosen').textContent=numbers([...selected]);});
 $('check').onclick=checkExam;requestAnimationFrame(fitPassage);
}
function fitPassage(){let w=$('reading'),c=$('passageColumns');if(!w||!c)return;
 let size=window.innerWidth>=1700?41:window.innerWidth>=1200?33:window.innerWidth>=800?28:window.innerWidth>=530?21:17.5;
 let lower=window.innerWidth>=800?11.5:11.2;
 c.style.fontSize=size+'px';let i=0;while(size>lower&&i++<180){let cols=[...c.querySelectorAll('.passage-col')];if(cols.every(n=>n.scrollHeight<=c.clientHeight+1)&&c.scrollWidth<=w.clientWidth+1)break;size=Math.max(lower,size-.28);c.style.fontSize=size+'px';}
 c.style.fontSize=(size+fontOffset)+'px';let overs=[...c.querySelectorAll('.passage-col')].some(x=>x.scrollHeight>c.clientHeight+1);
 const scrollable=overs||fontOffset>0;
 w.classList.toggle('allow-reading-scroll',scrollable);
 c.querySelectorAll('.passage-col').forEach(p=>{p.style.overflow=scrollable?'visible':'hidden';p.style.height=scrollable?'auto':'100%';});
}
function checkExam(){if(locked)return;locked=true;let t=queue[idx];let actual=[...selected].sort((a,b)=>a-b);let correct=t.answers.some(key=>key.length===actual.length&&key.every(n=>selected.has(n)));if(correct)score++;
 const rule=('Запятая · '+String(RULES[t.cat]?.[0]||'единое пунктуационное правило')).slice(0,115);
 attemptTested[rule]=(attemptTested[rule]||0)+1;
 if(!correct)attemptErrors[rule]=(attemptErrors[rule]||0)+1;idx++;status();let expected=t.answers.map(numbers).join(' или '),rname=labelOf(t.cat);
 let whole=`<details class="review-original"><summary>Посмотреть весь текст с твоими отметками</summary><div class="review-original-body">${t.full.map(x=>`<p class="review-original-sentence ${selected.has(x.n)?'orig-chosen':''}"><span class="orig-num">(${x.n})</span> ${esc(x.text)}</p>`).join('')}</div></details>`;
 let list=t.full.map(x=>{let isAnswer=t.answers.some(a=>a.includes(x.n)),pick=selected.has(x.n),style=(isAnswer===pick)?'good':'bad';let mark=isAnswer?(pick?'✓ Верно отмечено':'! Нужно отметить'):(pick?'✕ Лишний номер':'✓ Верно пропущено');let hint=t.notes?.[x.n]??(isAnswer?`${RULES[t.cat][1]} Именно по этому правилу предложение включено в группу ответа. Здесь могут быть и другие виды запятых.`:(x.text.includes(',')?'Этот номер не входит в исходный ключ. Найди, какое правило действует именно у запятых, а не только знакомый знак: в одном предложении могут сочетаться разные конструкции.':'В этом предложении нет запятой для сопоставления.'));return `<article class="review-line"><b class="r-num">${x.n}</b><div class="review-detail"><div class="review-sentence">${esc(x.text)}</div><div class="review-rule"><span class="review-indicator ${style}">${mark}</span>${isAnswer?`<b>${esc(rname)}</b>`:''}</div><p class="review-hint">${esc(hint)}</p></div></article>`}).join('');
 let warning=t.warning?`<div class="note-warning"><b>Уточнение источника:</b> ${esc(t.warning)}</div>`:'';
 openModal(`<div class="resultbanner ${correct?'ok':'bad'}"><strong>${correct?'✓ Всё верно!':'✕ Есть ошибки'}</strong><span>${correct?'Отлично определены одинаковые правила.':'Ниже предложения сразу рядом с объяснениями — не нужно вспоминать исходный текст.'}</span></div><div class="comparison"><div>Твой ответ: <b>${numbers(actual)}</b></div><div>Правильный: <b>${expected}</b></div></div><div class="group-explanation"><b>Общее правило правильной группы:</b> ${esc(rname)}. ${esc(RULES[t.cat][1])}</div>${warning}${whole}<h3>Разбор предложений</h3><div class="review-list">${list}</div>`,`Результат · задание № ${t.id}`,'Продолжить →',renderExam);
}
function renderSingle(){if(idx>=queue.length){finish();return}locked=false;selected=new Set();let v=queue[idx];show(`<div class="single-shell"><div class="exercise-top"><div><span class="eyebrow">ЗАКРЕПЛЯЕМ ТЕОРИЮ</span><h2>Предложение ${idx+1} из ${queue.length}</h2></div><button class="ghost" id="helpNow">? Справка</button></div><div class="single-instruction">Выбери <b>все правила</b>, по которым в предложении стоят запятые. Иногда их несколько.</div><div class="single-content"><section class="single-question"><div class="single-sentence" id="singleSentence">${esc(v.text)}</div></section><section class="comma-rule-grid">${Object.entries(RULES).map(([key,rule])=>`<button class="rule-option" aria-pressed="false" data-rule="${key}" title="${esc(rule[0])}">${esc(SHORT[key])}</button>`).join('')}</section></div><div class="single-foot"><span class="helper">Отмечено: <strong id="singleChosen">0</strong></span><button class="primary" id="checkSingle">Проверить →</button></div></div>`);
 main.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>{let c=b.dataset.rule;selected.has(c)?selected.delete(c):selected.add(c);b.classList.toggle('selected',selected.has(c));b.setAttribute('aria-pressed',selected.has(c));$('singleChosen').textContent=selected.size;});
 $('checkSingle').onclick=checkSingle;$('helpNow').onclick=openReference;requestAnimationFrame(fitSingle);
}
function fitSingle(){const el=$('singleSentence');if(!el)return;let size=window.innerWidth>=1200?55:window.innerWidth>=850?44:window.innerWidth>=520?33:26;el.style.fontSize=size+'px';let it=0;while(it++<100&&size>16&&(el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+2)){size-=.5;el.style.fontSize=size+'px';}}
function checkSingle(){if(locked)return;locked=true;let v=queue[idx],keys=[...selected];let right=v.cats;let okay=keys.length===right.length&&right.every(k=>selected.has(k));if(okay)score++;idx++;status();let names=a=>a.map(k=>labelOf(k)).join('; ')||'ничего';let taglist=right.map(k=>`<span class="cat-tag">${esc(labelOf(k))}</span>`).join('');openModal(`<div class="resultbanner ${okay?'ok':'bad'}"><strong>${okay?'✓ Верно!':'✕ Ошибка'}</strong><span>${right.length>1?'Здесь сочетаются несколько правил.':'Здесь одно основное правило из нашей классификации.'}</span></div><p class="original-example">${esc(v.text)}</p><div class="comparison"><div>Выбрано: <b>${esc(names(keys))}</b></div><div>Правильно: <b>${esc(names(right))}</b></div></div><div class="cat-tags">${taglist}</div><div class="explanation">${esc(v.explain)}</div>`,'Разбор ответа','Следующее предложение →',renderSingle);
}
function openReference(){let ref=REFERENCE.map(([name,desc,example])=>`<article class="rule-reference"><h3>${esc(name)}</h3><p>${esc(desc)}</p><div class="ref-example">${esc(example)}</div></article>`).join('');let warning=WARNINGS.map(w=>`<p class="warning-line">${esc(w)}</p>`).join('');openModal(`<div class="reference-intro">14 категорий — по твоей теоретической справке. Примеры и важные различия можно посмотреть, не выходя из задания.</div><div class="reference-warnings">${warning}</div><div class="reference-grid">${ref}</div>`,'Запятые · справочник','Вернуться к игре',()=>{},true);}
function openModal(content,title,button,callback,isReference=false){let d=$('dialogBack');d.classList.add('visible');d.setAttribute('aria-hidden','false');$('dialogTitle').textContent=title;$('dialogContent').innerHTML=content;$('dialogButton').textContent=button;$('dialogContent').scrollTop=0;
 let close=()=>{d.classList.remove('visible');d.setAttribute('aria-hidden','true');$('dialogButton').onclick=null;callback?.();};$('dialogButton').onclick=close;$('dialogClose').onclick=close;d.onclick=e=>{if(e.target===d&&isReference)close();};}
function sendGame21(){
 if(gameSaved)return;const st=$('saveStatus21');
 if(!tg||!tg.platform||tg.platform==='unknown'||typeof tg.sendData!=='function'){st.textContent='Открой через кнопку «🎮 Тренажёры» в Telegram для записи результата.';return;}
 const total=Object.values(attemptTested).reduce((n,v)=>n+v,0);if(total!==3){st.textContent='Нужно завершить три задания.';return;}
 const data={v:1,type:'game_result',gameId:'TR21_COMMA',attemptId:gameAttemptId,correct:score,total,errors:attemptErrors,tested:attemptTested};
 try{$('saveResult21').disabled=true;tg.sendData(JSON.stringify(data));gameSaved=true;st.textContent='Результат отправлен.';}catch(e){$('saveResult21').disabled=false;st.textContent=String(e.message||e);}
}
function finish(){route='finish';show(`<section class="finish"><span class="eyebrow">ТРЕНИРОВКА ЗАВЕРШЕНА</span><div class="finish-icon">,</div><h1>${score} из ${queue.length}</h1><p>Верных ответов: ${score}. ${score===queue.length?'Отличная работа!':'Справочник поможет закрепить сложные правила.'}</p><div class="finish-actions"><button class="primary" id="saveResult21">💾 Сохранить результат</button><button class="ghost" id="again">Повторить тренировку</button><button class="ghost" id="finishMenu">В меню</button></div><p id="saveStatus21" style="font-size:13px;color:var(--muted);margin-top:10px"></p></section>`);$('again').onclick=()=>startExam();$('finishMenu').onclick=home;$('saveResult21').onclick=sendGame21;}
$('home').onclick=home;$('topHelp').onclick=openReference;let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(route==='exam')fitPassage();if(route==='single')fitSingle();},120)});
home();
</script></body></html>
