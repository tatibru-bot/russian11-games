<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f7fc">
<title>ЕГЭ № 8 — тренажёр</title>
<style>
:root{color-scheme:light;--ink:#24314a;--muted:#62728d;--line:#dce4f1;--blue:#5265c9;--soft:#edf2ff;--good:#147d59;--bad:#a63c44}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{height:100%;height:100dvh;overflow:hidden;margin:0;background:#f5f7fc;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button{font:inherit;cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid #b1bfff;outline-offset:2px}
button:disabled{opacity:.48;cursor:default}
[hidden]{display:none!important}
.app{height:100%;height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;gap:9px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(8px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0}
.title strong{font-size:17px}.title span{display:block;font-size:11px;color:var(--muted)}
.progress{flex-shrink:0;padding:7px 10px;border-radius:12px;background:var(--soft);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:9px;background:#dde4f7;overflow:hidden;flex-shrink:0}
.bar>div{height:100%;background:var(--blue);width:6.67%;transition:width .15s}
.play{min-height:0;display:grid;flex:1;grid-template-rows:minmax(88px,1fr) auto auto;gap:8px}
.question{min-height:0;background:white;border:1px solid var(--line);border-radius:16px;padding:11px 12px;display:flex;flex-direction:column;gap:5px;box-shadow:0 4px 18px #24314a0b}
.question .hint{font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:var(--muted)}
.question .sentence{min-height:0;flex:1;overflow:hidden;font-size:clamp(14px,3.9vw,19px);line-height:1.43;letter-spacing:.01em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:9;line-clamp:9}
.question .expand{font-size:12px;color:var(--blue);background:transparent;border:0;align-self:flex-start;padding:2px 0;text-align:left;font-weight:700;min-height:24px}
.choicearea{min-height:0}
.choicearea .label{font-size:11px;color:var(--muted);font-weight:700;margin:0 0 6px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(50px,auto);gap:7px}
.choice{min-height:52px;border:1.5px solid #d2dced;background:#fff;color:var(--ink);padding:7px 9px;text-align:left;font-size:clamp(12.5px,3.4vw,15px);font-weight:700;line-height:1.22;display:flex;align-items:center;gap:7px;word-break:normal;hyphens:auto}
.choice .num{font-size:11px;color:var(--blue);background:var(--soft);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;flex-shrink:0}
.choice.selected{border:2px solid var(--blue);background:#eef1ff}
.choice.selected .num{color:white;background:var(--blue)}
.choice:last-child:nth-child(odd){grid-column:1/-1}
.controls{display:flex;gap:8px;min-height:47px}
.controls button{min-height:47px;padding:9px 13px;border:1px solid #d6deed;background:white;font-weight:750}
.controls .prev{flex:0 0 95px}
.controls .next{flex:1;background:var(--blue);color:white;border-color:var(--blue)}
.finish{display:flex;flex-direction:column;flex:1;min-height:0;gap:9px}
.score{background:white;border:1px solid var(--line);padding:13px 15px;border-radius:16px;flex-shrink:0}
.score h2{margin:3px 0 0;font-size:23px}.score p{margin:4px 0;color:var(--muted)}
.review{overflow:auto;min-height:0;flex:1;overscroll-behavior:contain}
.review details{background:white;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;line-height:1.43}
.review summary{cursor:pointer;font-weight:750;color:var(--bad)}
.review .rule{color:#4a5a74;font-size:13px}
.review p{margin:8px 0}
.finishbuttons{flex-shrink:0;display:flex;flex-direction:column;gap:6px;background:#f5f7fc}
.finishbuttons button{min-height:44px;border:1px solid var(--line);font-weight:750;padding:8px}
.finishbuttons .save{background:var(--blue);color:white;border-color:var(--blue)}
.notice{font-size:12px;line-height:1.3;color:var(--muted);margin:0;text-align:center}
.overlay{position:fixed;inset:0;z-index:20;background:#f5f7fc;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.overlay .fulltext{flex:1;min-height:0;overflow:auto;background:white;padding:15px;border:1px solid var(--line);border-radius:15px;font-size:18px;line-height:1.5;overscroll-behavior:contain}
.overlay button{min-height:47px;background:var(--blue);color:white;border:0}
@media(max-height:700px){.app{gap:6px;padding-top:calc(5px + env(safe-area-inset-top,0px));padding-bottom:calc(5px + env(safe-area-inset-bottom,0px))}.question{padding:8px 10px}.choices{gap:5px;grid-auto-rows:minmax(46px,auto)}.choice{min-height:46px;padding:6px 7px}.choicearea .label{margin-bottom:4px}.top .title strong{font-size:15px}.top .title span{font-size:10px}.progress{padding:5px 8px}.controls button{min-height:42px}.controls{min-height:42px}}
@media(max-height:590px){.question .sentence{-webkit-line-clamp:6;line-clamp:6;font-size:clamp(13px,3.6vw,16px)}.choices{grid-auto-rows:minmax(42px,auto)}.choice{min-height:42px;font-size:12.7px}.choice .num{width:19px;height:19px}.controls button{min-height:42px;padding:6px 10px}}
@media(min-width:650px){.app{padding-left:20px;padding-right:20px}.choices{grid-auto-rows:minmax(58px,auto)}.choice{min-height:58px}}
</style>

<script>
const CFG={"id":"TR8_02","part":2,"groups":["a","r","t","c","n"],"names":{"a":"Нарушение в построении предложения с несогласованным приложением","r":"Неправильное построение предложения с косвенной речью","t":"Нарушение видо-временной соотнесённости глагольных форм","c":"Ошибка в построении сложного предложения","n":"Ошибка в употреблении числительного"},"rules":{"a":"Если перед названием в кавычках есть родовое слово («роман», «в журнале», «на картине»), само название обычно остаётся в именительном падеже.","r":"В косвенной речи нельзя без изменения включать прямую речь с формами «я», «мы», «вы», обращением или повелительным наклонением. Нужно согласовать лицо и форму глагола или оформить прямую речь.","t":"Действия в одном временном плане должны быть выражены согласованными видовременными формами; немотивированное переключение между настоящим, прошедшим и будущим нарушает норму.","c":"В сложном предложении нельзя дублировать союзы и союзные слова без основания, нарушать соотнесённость указательных слов и придаточной части или присоединять придаточную часть к неподходящему слову.","n":"Собирательные числительные «двое», «трое» не сочетаются с названиями лиц женского пола. С существительными «сутки» они допустимы."},"data":{"a":[{"source":"1.8","text":"Комментарии Ю.М. Лотмана к роману «Евгению Онегину» помогают читателю лучше понять эпоху А.С. Пушкина.","wrong":"к роману «Евгению Онегину»","right":"к роману «Евгений Онегин»","corrected":"Комментарии Ю.М. Лотмана к роману «Евгений Онегин» помогают читателю лучше понять эпоху А.С. Пушкина."},{"source":"2.3","text":"Мечта живописца Н.М. Ромадина о покое и гармонии воплощена в пейзаже «Сне Андерсена».","wrong":"в пейзаже «Сне Андерсена»","right":"в пейзаже «Сон Андерсена»","corrected":"Мечта живописца Н.М. Ромадина о покое и гармонии воплощена в пейзаже «Сон Андерсена»."},{"source":"5.4","text":"Лингвист А.А. Шахматов известен в науке как редактор книги «Словаря современного русского языка».","wrong":"книги «Словаря современного русского языка»","right":"книги «Словарь современного русского языка»","corrected":"Лингвист А.А. Шахматов известен в науке как редактор книги «Словарь современного русского языка»."},{"source":"6.6","text":"В комедии Д.И. Фонвизина «Недоросле» есть целый ряд персонажей, чьи фамилии стали нарицательными.","wrong":"В комедии Д.И. Фонвизина «Недоросле»","right":"В комедии Д.И. Фонвизина «Недоросль»","corrected":"В комедии Д.И. Фонвизина «Недоросль» есть целый ряд персонажей, чьи фамилии стали нарицательными."},{"source":"10.4","text":"В книге В.А. Рождественского «Страницах жизни» есть очерк о Фёдоре Ивановиче Шаляпине – великом русском оперном певце.","wrong":"В книге В.А. Рождественского «Страницах жизни»","right":"В книге В.А. Рождественского «Страницы жизни»","corrected":"В книге В.А. Рождественского «Страницы жизни» есть очерк о Фёдоре Ивановиче Шаляпине – великом русском оперном певце."},{"source":"11.3","text":"Литературный дебют А.П. Чехова состоялся в 1880 году, когда в юмористическом журнале «Стрекозе» были опубликованы его первые рассказы.","wrong":"в юмористическом журнале «Стрекозе»","right":"в юмористическом журнале «Стрекоза»","corrected":"Литературный дебют А.П. Чехова состоялся в 1880 году, когда в юмористическом журнале «Стрекоза» были опубликованы его первые рассказы."},{"source":"13.4","text":"В редакции газеты «Комсомольской правды» работают люди с разными взглядами, но всех их объединяет творческий подход к делу.","wrong":"газеты «Комсомольской правды»","right":"газеты «Комсомольская правда»","corrected":"В редакции газеты «Комсомольская правда» работают люди с разными взглядами, но всех их объединяет творческий подход к делу."},{"source":"18.7","text":"О том, как сложилась научная судьба известного лингвиста А.А. Потебни, вы можете узнать из книги В.Ю. Франчук «А.А. Потебня», вышедшей в серии «Людей науки».","wrong":"в серии «Людей науки»","right":"в серии «Люди науки»","corrected":"О том, как сложилась научная судьба известного лингвиста А.А. Потебни, вы можете узнать из книги В.Ю. Франчук «А.А. Потебня», вышедшей в серии «Люди науки»."},{"source":"19.4","text":"О высоком мастерстве В.Д. Поленова как колориста можно судить по полотну «Заросшему пруду».","wrong":"по полотну «Заросшему пруду»","right":"по полотну «Заросший пруд»","corrected":"О высоком мастерстве В.Д. Поленова как колориста можно судить по полотну «Заросший пруд»."},{"source":"22.6","text":"Этот случай произошёл с командой китобойного российского судна «Пингвина».","wrong":"судна «Пингвина»","right":"судна «Пингвин»","corrected":"Этот случай произошёл с командой китобойного российского судна «Пингвин»."},{"source":"27.3","text":"В основе произведения «Повести о настоящем человеке» лежат реальные события, произошедшие с Алексеем Маресьевым.","wrong":"произведения «Повести о настоящем человеке»","right":"произведения «Повесть о настоящем человеке»","corrected":"В основе произведения «Повесть о настоящем человеке» лежат реальные события, произошедшие с Алексеем Маресьевым."},{"source":"29.7","text":"Смысл названия пьесы «Вишнёвого сада» до сих пор вызывает споры среди литературоведов.","wrong":"пьесы «Вишнёвого сада»","right":"пьесы «Вишнёвый сад»","corrected":"Смысл названия пьесы «Вишнёвый сад» до сих пор вызывает споры среди литературоведов."},{"source":"30.5","text":"Режиссёра Сергея Урсуляка в шолоховской эпопее «Тихом Доне» заинтересовала прежде всего современность содержания.","wrong":"в шолоховской эпопее «Тихом Доне»","right":"в шолоховской эпопее «Тихий Дон»","corrected":"Режиссёра Сергея Урсуляка в шолоховской эпопее «Тихий Дон» заинтересовала прежде всего современность содержания."},{"source":"32.7","text":"С 1986 года в музейное объединение «Государственную Третьяковскую галерею» в качестве подразделения входит Дом-музей В.М. Васнецова, открытый ещё в 1953 году.","wrong":"в музейное объединение «Государственную Третьяковскую галерею»","right":"в музейное объединение «Государственная Третьяковская галерея»","corrected":"С 1986 года в музейное объединение «Государственная Третьяковская галерея» в качестве подразделения входит Дом-музей В.М. Васнецова, открытый ещё в 1953 году."},{"source":"33.9","text":"В.М. Васнецов дебютировал на передвижных выставках в 1874 году с полотном «Чаепитием в трактире».","wrong":"с полотном «Чаепитием в трактире»","right":"с полотном «Чаепитие в трактире»","corrected":"В.М. Васнецов дебютировал на передвижных выставках в 1874 году с полотном «Чаепитие в трактире»."},{"source":"36.6","text":"Даниэль Дефо – английский писатель, автор известного романа «Робинзона Крузо».","wrong":"романа «Робинзона Крузо»","right":"романа «Робинзон Крузо»","corrected":"Даниэль Дефо – английский писатель, автор известного романа «Робинзон Крузо»."},{"source":"37.3","text":"По словам И.Н. Крамского, несмотря на то что у многих пейзажистов изображены на картинах деревья, вода и даже воздух, душа есть только в картине «Грачах» А.К. Саврасова.","wrong":"в картине «Грачах»","right":"в картине «Грачи»","corrected":"По словам И.Н. Крамского, несмотря на то что у многих пейзажистов изображены на картинах деревья, вода и даже воздух, душа есть только в картине «Грачи» А.К. Саврасова."},{"source":"38.4","text":"Открытое письмо деятелей культуры Правительству РФ опубликовано в газете «Московском комсомольце».","wrong":"в газете «Московском комсомольце»","right":"в газете «Московский комсомолец»","corrected":"Открытое письмо деятелей культуры Правительству РФ опубликовано в газете «Московский комсомолец»."},{"source":"41.1","text":"На картине И.И. Фирсова «Юном живописце» изображена домашняя мастерская художника.","wrong":"На картине И.И. Фирсова «Юном живописце»","right":"На картине И.И. Фирсова «Юный живописец»","corrected":"На картине И.И. Фирсова «Юный живописец» изображена домашняя мастерская художника."},{"source":"42.3","text":"Многие читатели знают писателя Л.Н. Толстого по его роману «Войне и миру».","wrong":"по его роману «Войне и миру»","right":"по его роману «Война и мир»","corrected":"Многие читатели знают писателя Л.Н. Толстого по его роману «Война и мир»."},{"source":"44.3","text":"Сила языка, сила точного образа в рассказе И.А. Бунина «Тёмных аллеях» таковы, что рождают грусть и волнение.","wrong":"в рассказе И.А. Бунина «Тёмных аллеях»","right":"в рассказе И.А. Бунина «Тёмные аллеи»","corrected":"Сила языка, сила точного образа в рассказе И.А. Бунина «Тёмные аллеи» таковы, что рождают грусть и волнение."},{"source":"45.4","text":"Научные интересы А.М. Пешковского воплощены в его книгах «Нашем языке», «Синтаксисе в школе», «Школьной и научной грамматике».","wrong":"в его книгах «Нашем языке», «Синтаксисе в школе», «Школьной и научной грамматике»","right":"в его книгах «Наш язык», «Синтаксис в школе», «Школьная и научная грамматика»","corrected":"Научные интересы А.М. Пешковского воплощены в его книгах «Наш язык», «Синтаксис в школе», «Школьная и научная грамматика»."},{"source":"51.5","text":"В рассказе И.С. Тургенева «Бежином луге» повествуется об интересном случае на охоте, произошедшем с самим автором.","wrong":"В рассказе И.С. Тургенева «Бежином луге»","right":"В рассказе И.С. Тургенева «Бежин луг»","corrected":"В рассказе И.С. Тургенева «Бежин луг» повествуется об интересном случае на охоте, произошедшем с самим автором."},{"source":"56.8","text":"Те, кто читал роман-эпопею Л.Н. Толстого «Войну и мир», помнят описание Бородинского сражения.","wrong":"роман-эпопею Л.Н. Толстого «Войну и мир»","right":"роман-эпопею Л.Н. Толстого «Война и мир»","corrected":"Те, кто читал роман-эпопею Л.Н. Толстого «Война и мир», помнят описание Бородинского сражения."},{"source":"57.9","text":"В журнале «Юности» была опубликована интересная рецензия на вышедшие сборники стихотворений.","wrong":"В журнале «Юности»","right":"В журнале «Юность»","corrected":"В журнале «Юность» была опубликована интересная рецензия на вышедшие сборники стихотворений."},{"source":"59.8","text":"Летом я прочитал увлекательную статью в журнале «Природе».","wrong":"в журнале «Природе»","right":"в журнале «Природа»","corrected":"Летом я прочитал увлекательную статью в журнале «Природа»."},{"source":"62.3","text":"Внутренняя сила и мужество солдата воспеты в поэме А.Т. Твардовского «Василии Тёркине».","wrong":"в поэме А.Т. Твардовского «Василии Тёркине»","right":"в поэме А.Т. Твардовского «Василий Тёркин»","corrected":"Внутренняя сила и мужество солдата воспеты в поэме А.Т. Твардовского «Василий Тёркин»."},{"source":"63.5","text":"В энциклопедии «Средней полосе России» много интересных статей.","wrong":"В энциклопедии «Средней полосе России»","right":"В энциклопедии «Средняя полоса России»","corrected":"В энциклопедии «Средняя полоса России» много интересных статей."},{"source":"64.2","text":"Картину «Корабельную рощу» И.И. Шишкина считают одной из самых величественных по замыслу и признают наиболее совершенной.","wrong":"Картину «Корабельную рощу»","right":"Картину «Корабельная роща»","corrected":"Картину «Корабельная роща» И.И. Шишкина считают одной из самых величественных по замыслу и признают наиболее совершенной."},{"source":"60.4","text":"Об известном народном промысле рассказывается в очерке «Хохломе».","wrong":"в очерке «Хохломе»","right":"в очерке «Хохлома»","corrected":"Об известном народном промысле рассказывается в очерке «Хохлома»."}],"r":[{"source":"3.8","text":"Р. Декарт утверждал, что «я мыслю, следовательно, я существую».","wrong":"утверждал, что «я мыслю, следовательно, я существую»","right":"утверждал: «Я мыслю, следовательно, я существую»","corrected":"Р. Декарт утверждал: «Я мыслю, следовательно, я существую»."},{"source":"6.3","text":"Обращаясь к молодёжи, академик Д.С. Лихачёв говорил, что «учитесь всегда».","wrong":"говорил, что «учитесь всегда»","right":"говорил молодёжи: «Учитесь всегда»","corrected":"Обращаясь к молодёжи, академик Д.С. Лихачёв говорил молодёжи: «Учитесь всегда»."},{"source":"8.8","text":"А.П. Чехов вспоминал, что «мои сёстры знали не только французский, но и немецкий и английский языки».","wrong":"вспоминал, что «мои сёстры знали не только французский, но и немецкий и английский языки»","right":"вспоминал, что его сёстры знали не только французский, но и немецкий и английский языки","corrected":"А.П. Чехов вспоминал, что его сёстры знали не только французский, но и немецкий и английский языки."},{"source":"16.5","text":"Через неделю после венчания А.С. Пушкин сообщает другу П.А. Плетнёву, что «я женат и счастлив».","wrong":"сообщает другу П.А. Плетнёву, что «я женат и счастлив»","right":"сообщает другу П.А. Плетнёву, что он женат и счастлив","corrected":"Через неделю после венчания А.С. Пушкин сообщает другу П.А. Плетнёву, что он женат и счастлив."},{"source":"20.1","text":"Перед открытием турнира ведущий сказал, что «сначала я представлю членов жюри».","wrong":"сказал, что «сначала я представлю членов жюри»","right":"сказал, что сначала он представит членов жюри","corrected":"Перед открытием турнира ведущий сказал, что сначала он представит членов жюри."},{"source":"21.1","text":"В.М. Васнецов объяснял В.В. Стасову, что, «как я стал из жанриста историком, ответить не сумею».","wrong":"объяснял В.В. Стасову, что, «как я стал из жанриста историком, ответить не сумею»","right":"объяснял В.В. Стасову, что не сумеет ответить, как он стал из жанриста историком","corrected":"В.М. Васнецов объяснял В.В. Стасову, что не сумеет ответить, как он стал из жанриста историком."},{"source":"22.7","text":"Когда черепаху уже собрались отправить в зоопарк, один матрос закричал, что «смотрите, черепаха плачет».","wrong":"закричал, что «смотрите, черепаха плачет»","right":"закричал: «Смотрите, черепаха плачет!»","corrected":"Когда черепаху уже собрались отправить в зоопарк, один матрос закричал: «Смотрите, черепаха плачет!»."},{"source":"25.4","text":"Вспомните знаменитое признание М.Ю. Лермонтова в том, что «люблю Отчизну я, но странною любовью».","wrong":"признание М.Ю. Лермонтова в том, что «люблю Отчизну я, но странною любовью»","right":"признание М.Ю. Лермонтова: «Люблю Отчизну я, но странною любовью»","corrected":"Вспомните знаменитое признание М.Ю. Лермонтова: «Люблю Отчизну я, но странною любовью»."},{"source":"26.4","text":"Старцев, поддавшись общему настроению, поинтересовался у пианистки, где вы учились музыке.","wrong":"где вы учились музыке","right":"где она училась музыке","corrected":"Старцев, поддавшись общему настроению, поинтересовался у пианистки, где она училась музыке."},{"source":"28.7","text":"Когда черепаху уже собрались отправить на кухню, один матрос закричал, что «смотрите, черепаха плачет».","wrong":"закричал, что «смотрите, черепаха плачет»","right":"закричал: «Смотрите, черепаха плачет!»","corrected":"Когда черепаху уже собрались отправить на кухню, один матрос закричал: «Смотрите, черепаха плачет!»."},{"source":"33.3","text":"Художник В.М. Васнецов признавался, что «„Богатыриˮ были моим творческим долгом, обязательством перед родным народом».","wrong":"признавался, что «„Богатыриˮ были моим творческим долгом, обязательством перед родным народом»","right":"признавался, что «Богатыри» были его творческим долгом, обязательством перед родным народом","corrected":"Художник В.М. Васнецов признавался, что «Богатыри» были его творческим долгом, обязательством перед родным народом."},{"source":"34.6","text":"Николай Ростов обвинил поручика Телянина в краже, сказав, что «это деньги Денисова, вы их взяли».","wrong":"сказав, что «это деньги Денисова, вы их взяли»","right":"сказав поручику, что тот взял деньги Денисова","corrected":"Николай Ростов обвинил поручика Телянина в краже, сказав поручику, что тот взял деньги Денисова."},{"source":"35.2","text":"Сидевший за столом чиновник спросил посетителя, какое у вас ко мне дело.","wrong":"какое у вас ко мне дело","right":"какое у того к нему дело","corrected":"Сидевший за столом чиновник спросил посетителя, какое у того к нему дело."},{"source":"43.4","text":"М. Горький утверждал, что «всем хорошим во мне я обязан книгам».","wrong":"утверждал, что «всем хорошим во мне я обязан книгам»","right":"утверждал, что всем хорошим в себе он обязан книгам","corrected":"М. Горький утверждал, что всем хорошим в себе он обязан книгам."},{"source":"48.8","text":"Р. Декарт писал, что «я мыслю, следовательно, я существую».","wrong":"писал, что «я мыслю, следовательно, я существую»","right":"писал: «Я мыслю, следовательно, я существую»","corrected":"Р. Декарт писал: «Я мыслю, следовательно, я существую»."},{"source":"57.1","text":"Печорин признавался, что «я смеюсь над всем на свете, особенно над чувствами».","wrong":"признавался, что «я смеюсь над всем на свете, особенно над чувствами»","right":"признавался, что он смеётся над всем на свете, особенно над чувствами","corrected":"Печорин признавался, что он смеётся над всем на свете, особенно над чувствами."}],"t":[{"source":"3.5","text":"Вечерняя заря догорала, и в воздухе чувствуется дыхание сырости.","wrong":"догорала, и в воздухе чувствуется","right":"догорала, и в воздухе чувствовалось","corrected":"Вечерняя заря догорала, и в воздухе чувствовалось дыхание сырости."},{"source":"5.3","text":"Когда комья снега временами срывались с высоких сосен, они нарушат тишину.","wrong":"они нарушат тишину","right":"они нарушали тишину","corrected":"Когда комья снега временами срывались с высоких сосен, они нарушали тишину."},{"source":"6.2","text":"Герой романа, как только знакомится с известным режиссёром, получил роль в его новом спектакле.","wrong":"как только знакомится с известным режиссёром, получил","right":"как только познакомился с известным режиссёром, получил","corrected":"Герой романа, как только познакомился с известным режиссёром, получил роль в его новом спектакле."},{"source":"10.3","text":"Во время путешествия турист делает путевые заметки и благодаря им поделился своими впечатлениями от увиденного.","wrong":"делает путевые заметки и благодаря им поделился","right":"делает путевые заметки и благодаря им делится","corrected":"Во время путешествия турист делает путевые заметки и благодаря им делится своими впечатлениями от увиденного."},{"source":"17.5","text":"Вечерняя заря догорит, и в воздухе чувствовалось дыхание сырости.","wrong":"догорит, и в воздухе чувствовалось","right":"догорела, и в воздухе чувствовалось","corrected":"Вечерняя заря догорела, и в воздухе чувствовалось дыхание сырости."},{"source":"18.6","text":"Когда в сознании поэта только рождается рифма, он почувствовал творческий подъём.","wrong":"он почувствовал творческий подъём","right":"он чувствует творческий подъём","corrected":"Когда в сознании поэта только рождается рифма, он чувствует творческий подъём."},{"source":"19.3","text":"После окончания школы Фролов поступит работать на завод, где за короткое время приобрёл квалификацию токаря.","wrong":"поступит работать на завод, где за короткое время приобрёл","right":"поступит работать на завод, где за короткое время приобретёт","corrected":"После окончания школы Фролов поступит работать на завод, где за короткое время приобретёт квалификацию токаря."},{"source":"22.2","text":"Значение патриотического воспитания огромно: в человеке развивается и сформировалась любовь к Родине.","wrong":"развивается и сформировалась любовь","right":"развивается и формируется любовь","corrected":"Значение патриотического воспитания огромно: в человеке развивается и формируется любовь к Родине."},{"source":"23.2","text":"После того как актёр успешно участвует в конкурсном отборе, он получил роль в новом спектакле.","wrong":"успешно участвует в конкурсном отборе, он получил","right":"успешно поучаствовал в конкурсном отборе, он получил","corrected":"После того как актёр успешно поучаствовал в конкурсном отборе, он получил роль в новом спектакле."},{"source":"31.6","text":"Когда я прихожу домой, пёс встретил меня дружеским лаем.","wrong":"прихожу домой, пёс встретил","right":"прихожу домой, пёс встречает","corrected":"Когда я прихожу домой, пёс встречает меня дружеским лаем."},{"source":"37.5","text":"Когда после окончания школы мой друг поступит на завод, он за короткое время приобретал квалификацию токаря.","wrong":"поступит на завод, он за короткое время приобретал","right":"поступит на завод, он за короткое время приобретёт","corrected":"Когда после окончания школы мой друг поступит на завод, он за короткое время приобретёт квалификацию токаря."},{"source":"43.6","text":"Когда молодой актёр знакомится с режиссёром, он получил роль в его новом спектакле.","wrong":"знакомится с режиссёром, он получил","right":"познакомился с режиссёром, он получил","corrected":"Когда молодой актёр познакомился с режиссёром, он получил роль в его новом спектакле."},{"source":"52.1","text":"Когда Фролов начинает работать на заводе, он вскоре приобрёл квалификацию токаря.","wrong":"начинает работать на заводе, он вскоре приобрёл","right":"начал работать на заводе, он вскоре приобрёл","corrected":"Когда Фролов начал работать на заводе, он вскоре приобрёл квалификацию токаря."},{"source":"64.1","text":"Вчера дождь лил не переставая и неожиданно заканчивается.","wrong":"лил не переставая и неожиданно заканчивается","right":"лил не переставая и неожиданно закончился","corrected":"Вчера дождь лил не переставая и неожиданно закончился."}],"c":[{"source":"4.2","text":"Критик увидел в этом произведении то, что автор изменил стиль письма.","wrong":"увидел в этом произведении то, что автор изменил стиль письма","right":"увидел в этом произведении изменение авторского стиля письма","corrected":"Критик увидел в этом произведении изменение авторского стиля письма."},{"source":"14.2","text":"Степан чувствовал то, как всё тело не слушается его и от усталости слипаются глаза.","wrong":"чувствовал то, как","right":"чувствовал, как","corrected":"Степан чувствовал, как всё тело не слушается его и от усталости слипаются глаза."},{"source":"29.2","text":"Учёный Владимир Лодочников считал то, что все физические свойства материи, находящейся в глубине Земли, должны изменяться.","wrong":"считал то, что","right":"считал, что","corrected":"Учёный Владимир Лодочников считал, что все физические свойства материи, находящейся в глубине Земли, должны изменяться."},{"source":"30.2","text":"Первый короткометражный немой фильм по роману Льва Толстого был снят в 1913 году, в котором роль князя Болконского сыграл актёр Иван Мозжухин.","wrong":"Первый короткометражный немой фильм по роману Льва Толстого был снят в 1913 году, в котором роль князя Болконского сыграл актёр Иван Мозжухин","right":"В первом короткометражном немом фильме по роману Льва Толстого, снятом в 1913 году, роль князя Болконского сыграл актёр Иван Мозжухин","corrected":"В первом короткометражном немом фильме по роману Льва Толстого, снятом в 1913 году, роль князя Болконского сыграл актёр Иван Мозжухин."},{"source":"34.5","text":"Я не могу понять, что почему не работает компьютер.","wrong":"что почему","right":"почему","corrected":"Я не могу понять, почему не работает компьютер."},{"source":"35.1","text":"В результате раскопок учёные установили то, что ещё в глубокой древности янтарь использовали как украшение.","wrong":"установили то, что","right":"установили, что","corrected":"В результате раскопок учёные установили, что ещё в глубокой древности янтарь использовали как украшение."},{"source":"36.4","text":"Туманные полосы начали понемногу алеть и расходиться, в которых тонули луга и пашни.","wrong":"Туманные полосы начали понемногу алеть и расходиться, в которых тонули луга и пашни","right":"Туманные полосы, в которых тонули луга и пашни, начали понемногу алеть и расходиться","corrected":"Туманные полосы, в которых тонули луга и пашни, начали понемногу алеть и расходиться."},{"source":"47.2","text":"Первый короткометражный немой фильм по роману Л.Н. Толстого был снят в 1913 году, в котором роль князя Андрея Болконского сыграл актёр И.И. Мозжухин.","wrong":"Первый короткометражный немой фильм по роману Л.Н. Толстого был снят в 1913 году, в котором роль князя Андрея Болконского сыграл актёр И.И. Мозжухин","right":"В первом короткометражном немом фильме по роману Л.Н. Толстого, снятом в 1913 году, роль князя Андрея Болконского сыграл актёр И.И. Мозжухин","corrected":"В первом короткометражном немом фильме по роману Л.Н. Толстого, снятом в 1913 году, роль князя Андрея Болконского сыграл актёр И.И. Мозжухин."},{"source":"49.1","text":"Мы не знали, что вправе ли рассчитывать на помощь со стороны предпринимателей.","wrong":"что вправе ли","right":"вправе ли мы","corrected":"Мы не знали, вправе ли мы рассчитывать на помощь со стороны предпринимателей."},{"source":"58.3","text":"Учёные задаются вопросом о том, что почему некоторые формулы и теоремы запоминаются школьниками не в полном объёме.","wrong":"о том, что почему","right":"о том, почему","corrected":"Учёные задаются вопросом о том, почему некоторые формулы и теоремы запоминаются школьниками не в полном объёме."},{"source":"59.3","text":"Д.С. Лихачёв интересовался тем, что обращал ли кто-нибудь внимание на то, какие преданные своему делу люди встречаются среди реставраторов и музейных работников.","wrong":"тем, что обращал ли кто-нибудь","right":"тем, обращал ли кто-нибудь","corrected":"Д.С. Лихачёв интересовался тем, обращал ли кто-нибудь внимание на то, какие преданные своему делу люди встречаются среди реставраторов и музейных работников."},{"source":"63.1","text":"Мне захотелось узнать то, как разводить в домашних условиях первоцветы и ухаживать за ними.","wrong":"узнать то, как","right":"узнать, как","corrected":"Мне захотелось узнать, как разводить в домашних условиях первоцветы и ухаживать за ними."}],"n":[{"source":"7.7","text":"Рассмотрение вопроса о нарушении правил дорожного движения двоими ученицами было перенесено на другой день.","wrong":"двоими ученицами","right":"двумя ученицами","corrected":"Рассмотрение вопроса о нарушении правил дорожного движения двумя ученицами было перенесено на другой день."},{"source":"12.1","text":"На всю жизнь бабушка сохранила в памяти имена двоих школьных подруг.","wrong":"двоих школьных подруг","right":"двух школьных подруг","corrected":"На всю жизнь бабушка сохранила в памяти имена двух школьных подруг."},{"source":"45.5","text":"Тренер объявил, что интенсивные тренировки будут проходить в течение троих дней.","wrong":"троих дней","right":"трёх дней","corrected":"Тренер объявил, что интенсивные тренировки будут проходить в течение трёх дней."},{"source":"48.5","text":"Трое баскетболисток уверенно двигались по площадке, отдавая пасы и атакуя.","wrong":"Трое баскетболисток","right":"Три баскетболистки","corrected":"Три баскетболистки уверенно двигались по площадке, отдавая пасы и атакуя."}]},"short":{"a":"Несогласованное приложение","r":"Косвенная речь","t":"Вид и время глаголов","c":"Сложное предложение","n":"Числительные"}};
(function(){
"use strict";
const tg=(window.Telegram&&window.Telegram.WebApp)||null;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const el=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=x=>String(x).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const key="russian11:ege8:round-v2:"+CFG.id+":"+String(tg?.initDataUnsafe?.user?.id||"browser");
function readMemory(){try{const x=JSON.parse(localStorage.getItem(key)||"{}");return x&&typeof x==="object"?x:{}}catch(e){return {}}}
function saveMemory(m){try{localStorage.setItem(key,JSON.stringify(m))}catch(e){}}
function pick(){
 const current=readMemory(),remaining={},selected=[];
 CFG.groups.forEach(k=>{
  const bank=CFG.data[k],all=Array.from({length:bank.length},(_,i)=>i);
  const old=Array.isArray(current[k])?current[k].filter(x=>Number.isInteger(x)&&x>=0&&x<bank.length):[];
  let queue=old.length?old.slice():shuffle(all);
  const chosen=[];
  while(chosen.length<3){
   if(!queue.length)queue=shuffle(all.filter(i=>!chosen.includes(i)));
   const id=queue.shift();
   if(!chosen.includes(id))chosen.push(id);
  }
  remaining[k]=queue;
  chosen.forEach(i=>selected.push({...bank[i],kind:k,id:k+"-"+i}));
 });
 return {cards:shuffle(selected),remaining};
}
let cards=[],answers=[],pos=0,proposed={},attemptId="",finished=false;
function newGame(){
 const picked=pick();cards=picked.cards;proposed=picked.remaining;pos=0;answers=Array(15).fill(null);
 attemptId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():"ege8_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2);
 finished=false;el("finish").hidden=true;el("play").hidden=false;el("save").disabled=false;
 el("saveStatus").textContent="Результат отправится боту после нажатия кнопки.";
 render();
}
function render(){
 const card=cards[pos],answer=answers[pos];
 el("progress").textContent=(pos+1)+" / 15";
 el("bar").style.width=((pos+1)/15*100).toFixed(1)+"%";
 el("sentence").textContent=card.text;
 el("expand").hidden=false;
 const buttons=CFG.groups.map((k,i)=>'<button type="button" class="choice'+(answer===k?' selected':'')+'" data-kind="'+k+'" aria-pressed="'+(answer===k)+'" title="'+esc(CFG.names[k])+'"><span class="num">'+(i+1)+'</span><span>'+esc(CFG.short[k])+'</span></button>').join("");
 el("choices").innerHTML=buttons;
 el("choices").querySelectorAll("button").forEach(btn=>btn.addEventListener("click",()=>{answers[pos]=btn.dataset.kind;render()}));
 el("prev").disabled=pos===0;
 const next=el("next");
 next.disabled=!answer;
 next.textContent=pos===14?"Проверить раунд ✓":"Далее →";
}
function showFinish(){
 if(finished)return;
 finished=true;
 // Отмечаем просмотренные предложения только после полного прохождения раунда.
 saveMemory(proposed);
 const wrong=cards.map((c,i)=>({card:c,answer:answers[i],i})).filter(x=>x.card.kind!==x.answer);
 const correct=15-wrong.length;
 el("scoreTitle").textContent=correct+" из 15 · "+Math.round(100*correct/15)+"%";
 el("scoreSub").textContent=wrong.length?("Ошибок: "+wrong.length+". Ниже — разбор по правилам."):"Все типы ошибок определены верно!";
 const review=el("review");
 review.innerHTML=wrong.length?wrong.map(x=>'<details><summary>Предложение '+(x.i+1)+' · '+esc(CFG.names[x.card.kind])+'</summary><p>'+esc(x.card.text)+'</p><p>Твой ответ: <b>'+esc(CFG.names[x.answer])+'</b></p><p>Правильный ответ: <b>'+esc(CFG.names[x.card.kind])+'</b></p><p>Исправление: '+esc(x.card.corrected)+'</p><p class="rule">'+esc(CFG.rules[x.card.kind])+'</p></details>').join(""):'<div class="score"><b>Отлично!</b> Можно сохранить результат и открыть новый раунд.</div>';
 el("play").hidden=true;el("finish").hidden=false;
 el("save").onclick=()=>{
  const errors={};wrong.forEach(x=>{const name=CFG.names[x.card.kind];errors[name]=(errors[name]||0)+1});
  const data={v:1,type:"game_result",gameId:CFG.id,attemptId,correct,total:15,errors};
  if(!tg||!tg.platform||tg.platform==="unknown"||typeof tg.sendData!=="function"){
   el("saveStatus").textContent="Для записи результата открой игру кнопкой «🎮 Тренажёры» внутри Telegram.";
   return;
  }
  try{
   el("save").disabled=true;
   tg.sendData(JSON.stringify(data));
   el("saveStatus").textContent="Результат отправлен боту.";
  }catch(err){
   el("save").disabled=false;
   el("saveStatus").textContent="Ошибка отправки: "+String(err.message||err);
  }
 };
}
el("prev").onclick=()=>{if(pos>0){pos--;render()}};
el("next").onclick=()=>{if(!answers[pos])return;if(pos<14){pos++;render()}else showFinish()};
el("again").onclick=()=>{newGame()};
el("expand").onclick=()=>{el("fulltext").textContent=cards[pos].text;el("overlay").hidden=false};
el("closeOverlay").onclick=()=>{el("overlay").hidden=true};
el("gameTitle").textContent="ЕГЭ № 8 · часть "+CFG.part;
newGame();
})();
</script>
