const DATA=[{"id": "52564", "answer": [4, 5, 7, 9], "items": [{"n": 3, "text": "Сейчас без карт нет дорог и путей, карта применяется всюду: в промышленности, сельском хозяйстве, строительстве, геологических разведках, на транспорте, в учёбе, культурной жизни.", "cat": "LIST", "hint": "После слова «всюду» перечисляются сферы использования карты."}, {"n": 4, "text": "В Публичной библиотеке собрано одно из крупнейших, наиболее разнообразных и полных картографических собраний: здесь бережно хранятся географические карты, планы, картограммы, астрономические карты, атласы на русском и иностранных языках.", "cat": "BSP", "hint": "Вторая часть конкретизирует, в чём состоит собрание библиотеки."}, {"n": 5, "text": "Почти исчерпывающе в нём представлено собрание русских карт и атласов: русская картография имеет давнюю историю.", "cat": "BSP", "hint": "Вторая часть называет причину важности собрания: у картографии давняя история."}, {"n": 7, "text": "XVIII век внёс принципиально новое в русскую картографию: карты начали создавать на основе инструментальных съёмок.", "cat": "BSP", "hint": "Во второй части раскрывается, что именно изменилось в картографии."}, {"n": 9, "text": "Планомерные съёмочные работы начались в 1721 году: по указу Петра I первые геодезисты, как называли в то время топографов, были посланы в шесть губерний России.", "cat": "BSP", "hint": "Вторая часть поясняет, какое событие произошло в 1721 году."}], "full": [{"n": 1, "text": "«Пойдёшь направо — конь падёт, налево — сгинешь сам!» — такие предостерегающие слова встречал на распутье богатырь, отправлявшийся в дальний путь.", "cat": null, "hint": ""}, {"n": 2, "text": "Давно уже человечество избавлено от таких указателей, так как получило в свои руки географическую карту.", "cat": null, "hint": ""}, {"n": 3, "text": "Сейчас без карт нет дорог и путей, карта применяется всюду: в промышленности, сельском хозяйстве, строительстве, геологических разведках, на транспорте, в учёбе, культурной жизни.", "cat": "LIST", "hint": "После слова «всюду» перечисляются сферы использования карты."}, {"n": 4, "text": "В Публичной библиотеке собрано одно из крупнейших, наиболее разнообразных и полных картографических собраний: здесь бережно хранятся географические карты, планы, картограммы, астрономические карты, атласы на русском и иностранных языках.", "cat": "BSP", "hint": "Вторая часть конкретизирует, в чём состоит собрание библиотеки."}, {"n": 5, "text": "Почти исчерпывающе в нём представлено собрание русских карт и атласов: русская картография имеет давнюю историю.", "cat": "BSP", "hint": "Вторая часть называет причину важности собрания: у картографии давняя история."}, {"n": 6, "text": "Одним из дошедших до нас ранних памятников русской картографии является «Чертёжная книга Сибири», составленная в 1696−1700 годах замечательным русским географом и картографом С. У. Ремезовым и его сыновьями.", "cat": null, "hint": ""}, {"n": 7, "text": "XVIII век внёс принципиально новое в русскую картографию: карты начали создавать на основе инструментальных съёмок.", "cat": "BSP", "hint": "Во второй части раскрывается, что именно изменилось в картографии."}, {"n": 8, "text": "Пётр I открыл в Москве математико-навигационную школу, а в Петербурге— Морскую академию, которые готовили топографов и картографов.", "cat": null, "hint": ""}, {"n": 9, "text": "Планомерные съёмочные работы начались в 1721 году: по указу Петра I первые геодезисты, как называли в то время топографов, были посланы в шесть губерний России.", "cat": "BSP", "hint": "Вторая часть поясняет, какое событие произошло в 1721 году."}]}, {"id": "52996", "answer": [2, 8], "items": [{"n": 2, "text": "Молодой империи нужна была прежде всего своя Античность: легендарные правители, эпос и мифологический пантеон.", "cat": "LIST", "hint": "После обобщающего сочетания «своя Античность» названы её составляющие."}, {"n": 3, "text": "Славянское язычество не успело развиться до уровня античного: не было ни сонма богов, ни устойчивых мифов об их иерархии, о деяниях и родственных отношениях.", "cat": "BSP", "hint": "Во второй части поясняется, в чём состояла неразвитость язычества."}, {"n": 5, "text": "Поэт, прозаик и переводчик Григорий Глинка писал в 1804 году в предисловии к своему мифологическому словарю: «И не лучше ли Фидасова Венера с подделанными во вкусе сего знаменитаго древняго мастера руками и ногами, нежели когда б осталось одно только ея туловище, и то, может быть, местами ещё выбитое?»", "cat": "SPEECH", "hint": "После слов автора «писал ...» идёт прямая цитата."}, {"n": 8, "text": "Все они представляют собой словари, где в алфавитном порядке собраны сведения о языческих божествах, которые удалось почерпнуть из источников: трудов Татищева и Ломоносова, латинских хронистов и византийских географов, нескольких летописей, а также живого фольклора.", "cat": "LIST", "hint": "Слово «источников» обобщает последующее перечисление."}], "full": [{"n": 1, "text": "В XVIII веке, когда российские историки и литераторы почувствовали себя равноправными участниками европейской истории, им захотелось переписать историю России по европейскому образцу.", "cat": null, "hint": ""}, {"n": 2, "text": "Молодой империи нужна была прежде всего своя Античность: легендарные правители, эпос и мифологический пантеон.", "cat": "LIST", "hint": "После обобщающего сочетания «своя Античность» названы её составляющие."}, {"n": 3, "text": "Славянское язычество не успело развиться до уровня античного: не было ни сонма богов, ни устойчивых мифов об их иерархии, о деяниях и родственных отношениях.", "cat": "BSP", "hint": "Во второй части поясняется, в чём состояла неразвитость язычества."}, {"n": 4, "text": "Но историкам XVIII века казалось, что можно и важно доказать, что всё это было, и они по крупицам собирали сведения, и там, где оставались белые пятна, не стеснялись додумывать.", "cat": null, "hint": ""}, {"n": 5, "text": "Поэт, прозаик и переводчик Григорий Глинка писал в 1804 году в предисловии к своему мифологическому словарю: «И не лучше ли Фидасова Венера с подделанными во вкусе сего знаменитаго древняго мастера руками и ногами, нежели когда б осталось одно только ея туловище, и то, может быть, местами ещё выбитое?»", "cat": "SPEECH", "hint": "После слов автора «писал ...» идёт прямая цитата."}, {"n": 6, "text": "Первые книги, посвящённые российскому и славянскому язычеству, составляли писатели и историки-публицисты.", "cat": null, "hint": ""}, {"n": 7, "text": "В 1767 году выходит «Краткий мифологический лексикон» Михаила Чулкова, в 1768-м — «Описание древнего славянского языческого баснословия, собранного из разных писателей, и снабденного примечаниями» Михаила Попова.", "cat": null, "hint": ""}, {"n": 8, "text": "Все они представляют собой словари, где в алфавитном порядке собраны сведения о языческих божествах, которые удалось почерпнуть из источников: трудов Татищева и Ломоносова, латинских хронистов и византийских географов, нескольких летописей, а также живого фольклора.", "cat": "LIST", "hint": "Слово «источников» обобщает последующее перечисление."}]}, {"id": "57119", "answer": [2, 4, 6, 9], "items": [{"n": 2, "text": "Если бы я составлял этот справочник, то написал бы так: Андроников Ираклий Луарсабович — колдун, чародей, чудотворец, кудесник.", "cat": "BSP", "hint": "После «написал бы так» поясняется, как именно автор охарактеризовал бы Андроникова."}, {"n": 4, "text": "Дело в том, что, едва только он войдёт в вашу комнату, вместе с ним шумной и пёстрой гурьбой войдут знаменитые люди: Маршак и Фадеев, Симонов и Тынянов, Пастернак и Тарле появятся во всём своеобразии их индивидуальных особенностей, художественно воссозданных чудотворцем Андрониковым.", "cat": "LIST", "hint": "После обобщающего словосочетания «знаменитые люди» перечислены их имена."}, {"n": 6, "text": "Точнее было бы сказать: это преображение.", "cat": "BSP", "hint": "Вторая часть раскрывает смысл слов «точнее было бы сказать»."}, {"n": 7, "text": "Преображаясь в того или иного из достопамятных и достославных современников наших, Андроников не только воскрешает его внешние признаки: жесты, походку, голос, но и воссоздаёт его внутренний мир, психику, методы мышления.", "cat": "LIST", "hint": "После обобщающего сочетания «внешние признаки» перечислены признаки."}, {"n": 8, "text": "Восхищаясь магическим искусством Андроникова, я всякий раз убеждался, что он⁠-⁠то и есть главный химик в той волшебной мастерской «человечьих воскрешений», о которой писал Маяковский в поэме «Про это»: Рассиявшись, высится веками мастерская человечьих воскрешений.", "cat": "SPEECH", "hint": "Двоеточие вводит далее цитируемые стихотворные строки."}, {"n": 9, "text": "Все ушедшие от нас, незабвенные, навеки умолкнувшие поэты, музыканты, актеры, учёные магией творчества вновь встают из могил и дышат и беседуют с нами, живые, обаятельно милые, во всём своеобразии мельчайших духовных примет, и я, знавший их, могу засвидетельствовать перед нашим потомством, не испытавшим моего великого счастья: воскрешённые Ираклием Андрониковым — в точности такие, какими они были в жизни.", "cat": "BSP", "hint": "Во второй части разъясняется, что именно автор может засвидетельствовать."}], "full": [{"n": 1, "text": "В справочнике Союза писателей кратко сказано, что Андроников Ираклий Луарсабович — прозаик, литературовед, и только.", "cat": null, "hint": ""}, {"n": 2, "text": "Если бы я составлял этот справочник, то написал бы так: Андроников Ираклий Луарсабович — колдун, чародей, чудотворец, кудесник.", "cat": "BSP", "hint": "После «написал бы так» поясняется, как именно автор охарактеризовал бы Андроникова."}, {"n": 3, "text": "И здесь была бы самая трезвая, самая точная оценка этого феноменально талантливого человека.", "cat": null, "hint": ""}, {"n": 4, "text": "Дело в том, что, едва только он войдёт в вашу комнату, вместе с ним шумной и пёстрой гурьбой войдут знаменитые люди: Маршак и Фадеев, Симонов и Тынянов, Пастернак и Тарле появятся во всём своеобразии их индивидуальных особенностей, художественно воссозданных чудотворцем Андрониковым.", "cat": "LIST", "hint": "После обобщающего словосочетания «знаменитые люди» перечислены их имена."}, {"n": 5, "text": "Те, кто далёк от искусства, называют его мастерство имитаторством, но это неверное, поверхностное слово!", "cat": null, "hint": ""}, {"n": 6, "text": "Точнее было бы сказать: это преображение.", "cat": "BSP", "hint": "Вторая часть раскрывает смысл слов «точнее было бы сказать»."}, {"n": 7, "text": "Преображаясь в того или иного из достопамятных и достославных современников наших, Андроников не только воскрешает его внешние признаки: жесты, походку, голос, но и воссоздаёт его внутренний мир, психику, методы мышления.", "cat": "LIST", "hint": "После обобщающего сочетания «внешние признаки» перечислены признаки."}, {"n": 8, "text": "Восхищаясь магическим искусством Андроникова, я всякий раз убеждался, что он-то и есть главный химик в той волшебной мастерской «человечьих воскрешений», о которой писал Маяковский в поэме «Про это»: Рассиявшись, высится веками мастерская человечьих воскрешений.", "cat": "SPEECH", "hint": "Двоеточие вводит далее цитируемые стихотворные строки."}, {"n": 9, "text": "Все ушедшие от нас, незабвенные, навеки умолкнувшие поэты, музыканты, актеры, учёные магией творчества вновь встают из могил и дышат и беседуют с нами, живые, обаятельно милые, во всём своеобразии мельчайших духовных примет, и я, знавший их, могу засвидетельствовать перед нашим потомством, не испытавшим моего великого счастья: воскрешённые Ираклием Андрониковым — в точности такие, какими они были в жизни.", "cat": "BSP", "hint": "Во второй части разъясняется, что именно автор может засвидетельствовать."}]}, {"id": "61506", "answer": [2, 3, 5, 7, 8], "items": [{"n": 1, "text": "Фауна Шри-Ланки включает в себя не только ряд тропических животных и птиц: медлительных двухметровых варанов, горластых павлинов в пышном оперении, индийских слонов, три вида обезьян — но и самых крупных обитателей нашей планеты — китов.", "cat": "LIST", "hint": "Перечисляются представители тропических животных и птиц."}, {"n": 2, "text": "Многие туристы мечтают увидеть на Шри-Ланке именно китов: это незабываемое зрелище оставляет глубокий след в душе́.", "cat": "BSP", "hint": "Вторая часть объясняет, почему увидеть китов — мечта туристов."}, {"n": 3, "text": "Фото- и видеосъёмки из этих мест свидетельствуют, что около побережья острова можно встретить разные виды китов: вот огромный синий, здесь горбатый, на этом кадре — кашалот.", "cat": "BSP", "hint": "Во второй части приводятся примеры китов, попавших на кадры."}, {"n": 5, "text": "Экскурсии к китам обычно начинаются рано утром: море в это время спокойнее, а шансы увидеть морских гигантов выше.", "cat": "BSP", "hint": "Вторая часть поясняет причину раннего начала экскурсий."}, {"n": 6, "text": "Капитан нашего катера сразу предупреждает группу: «Сохраняйте тишину и не делайте резких движений, ведь киты очень чувствительны к шуму».", "cat": "SPEECH", "hint": "После слов автора «предупреждает группу» следует прямая речь."}, {"n": 7, "text": "Туристы с нетерпением смотрят вокруг, и вскоре их любопытство вознаграждается: в двадцати метрах от борта — фонтан воды, а за ним — огромный спинной плавник.", "cat": "BSP", "hint": "Вторая часть раскрывает, в чём состояло вознаграждение любопытства."}, {"n": 8, "text": "Все участники экскурсии испытывают одни и те же чувства: это удивление и восхищение мощью и грацией морских обитателей.", "cat": "LIST", "hint": "После сочетания «одни и те же чувства» называются эти чувства."}], "full": [{"n": 1, "text": "Фауна Шри-Ланки включает в себя не только ряд тропических животных и птиц: медлительных двухметровых варанов, горластых павлинов в пышном оперении, индийских слонов, три вида обезьян — но и самых крупных обитателей нашей планеты — китов.", "cat": "LIST", "hint": "Перечисляются представители тропических животных и птиц."}, {"n": 2, "text": "Многие туристы мечтают увидеть на Шри-Ланке именно китов: это незабываемое зрелище оставляет глубокий след в душе́.", "cat": "BSP", "hint": "Вторая часть объясняет, почему увидеть китов — мечта туристов."}, {"n": 3, "text": "Фото- и видеосъёмки из этих мест свидетельствуют, что около побережья острова можно встретить разные виды китов: вот огромный синий, здесь горбатый, на этом кадре — кашалот.", "cat": "BSP", "hint": "Во второй части приводятся примеры китов, попавших на кадры."}, {"n": 4, "text": "Местные гиды рассказывают, что лучшее время для наблюдения за китами — с декабря по апрель, когда они подходят близко к берегу.", "cat": null, "hint": ""}, {"n": 5, "text": "Экскурсии к китам обычно начинаются рано утром: море в это время спокойнее, а шансы увидеть морских гигантов выше.", "cat": "BSP", "hint": "Вторая часть поясняет причину раннего начала экскурсий."}, {"n": 6, "text": "Капитан нашего катера сразу предупреждает группу: «Сохраняйте тишину и не делайте резких движений, ведь киты очень чувствительны к шуму».", "cat": "SPEECH", "hint": "После слов автора «предупреждает группу» следует прямая речь."}, {"n": 7, "text": "Туристы с нетерпением смотрят вокруг, и вскоре их любопытство вознаграждается: в двадцати метрах от борта — фонтан воды, а за ним — огромный спинной плавник.", "cat": "BSP", "hint": "Вторая часть раскрывает, в чём состояло вознаграждение любопытства."}, {"n": 8, "text": "Все участники экскурсии испытывают одни и те же чувства: это удивление и восхищение мощью и грацией морских обитателей.", "cat": "LIST", "hint": "После сочетания «одни и те же чувства» называются эти чувства."}]}, {"id": "67158", "answer": [1, 2, 3, 5, 6, 7], "items": [{"n": 1, "text": "В горах Алтая можно встретить множество диких животных: вот осторожный марал, здесь горный козёл, а на этом кадре бурый медведь.", "cat": "LIST", "hint": "После общего указания «множество диких животных» названы представители фауны."}, {"n": 2, "text": "Местные проводники рассказывают: лучшее время для наблюдения за животными — раннее утро, когда они выходят из своих укрытий в поисках пищи.", "cat": "BSP", "hint": "Во второй части раскрывается, что именно рассказывают проводники."}, {"n": 3, "text": "Поэтому чаще всего экскурсии по горным маршрутам начинаются на рассвете: воздух в это время прохладнее, а шансы увидеть представителей алтайской фауны гораздо выше.", "cat": "BSP", "hint": "Вторая часть объясняет, почему экскурсии начинают на рассвете."}, {"n": 4, "text": "Наш проводник сразу предупреждает группу: «Соблюдайте тишину и не отходите далеко от тропы, ведь поведение животных трудно предсказать».", "cat": "SPEECH", "hint": "После слов «предупреждает группу» приведены слова проводника."}, {"n": 5, "text": "Туристы с нетерпением всматриваются в склоны гор, и вскоре их любопытство вознаграждается: на высокой скале неподвижная фигура горного козла, а немного ниже ещё несколько животных.", "cat": "BSP", "hint": "Во второй части поясняется, что именно увидели туристы."}, {"n": 6, "text": "Опытные путешественники знают: фауна Алтая включает в себя не только широко распространённых в России лесных животных (бурых медведей, лосей, косуль), но и редких снежных барсов.", "cat": "BSP", "hint": "Вторая часть раскрывает содержание того, что знают путешественники."}, {"n": 7, "text": "Многие туристы мечтают увидеть на Алтае именно это удивительное животное: наблюдение за снежным барсом способно произвести неизгладимое впечатление.", "cat": "BSP", "hint": "Во второй части сказано, почему туристы хотят увидеть снежного барса."}, {"n": 8, "text": "Если участникам путешествия повезёт и долгожданная встреча состоится, то все они испытают одни и те же чувства: удивление и восхищение красотой и величием дикой природы России.", "cat": "LIST", "hint": "После обобщающего слова «чувства» указано, какие именно чувства испытают туристы."}], "full": [{"n": 1, "text": "В горах Алтая можно встретить множество диких животных: вот осторожный марал, здесь горный козёл, а на этом кадре бурый медведь.", "cat": "LIST", "hint": "После общего указания «множество диких животных» назв n": 2, "text": "Он окружён невиданными природными красотами: озёрами, реками Волгой и Келнотью, костромскими разливами.", "cat": "LIST", "hint": "После общего сочетания «природными красотами» перечислены природные объекты."}, {"n": 3, "text": "Холмистая местность Заболотья, покрытая лесом, привлекала внимание знаменитых охотников: М. М. Пришвина, А. С. Новикова-Прибоя.", "cat": "LIST", "hint": "После обобщающего слова «охотников» перечислены имена."}, {"n": 5, "text": "Его имя здесь свято чтут: местные старожилы рассказывают о поэте, поют песни на его слова.", "cat": "BSP", "hint": "Вторая часть поясняет, как местные жители чтут имя Некрасова."}, {"n": 7, "text": "Пригласят поиграть в народные игры: лапту, городки, горелки, ручеёк, чижика и другие.", "cat": "LIST", "hint": "После обобщающего сочетания «народные игры» перечислены игры."}, {"n": 8, "text": "Приезжайте в Заболотье, вживую услышьте строки произведения русского поэта: «Дети, я вам расскажу про Мазая…»", "cat": "SPEECH", "hint": "Двоеточие вводит цитату после слов «строки произведения»."}], "full": [{"n": 1, "text": "В Некрасовском районе Ярославской области есть удивительный уголок — Заболотский край.", "cat": null, "hint": ""}, {"n": 2, "text": "Он окружён невиданными природными красотами: озёрами, реками Волгой и Келнотью, костромскими разливами.", "cat": "LIST", "hint": "После общего сочетания «природными красотами» перечислены природные объекты."}, {"n": 3, "text": "Холмистая местность Заболотья, покрытая лесом, привлекала внимание знаменитых охотников: М. М. Пришвина, А. С. Новикова-Прибоя.", "cat": "LIST", "hint": "После обобщающего слова «охотников» перечислены имена."}, {"n": 4, "text": "Любил охотиться в этих местах и Николай Алексеевич Некрасов.", "cat": null, "hint": ""}, {"n": 5, "text": "Его имя здесь свято чтут: местные старожилы рассказывают о поэте, поют песни на его слова.", "cat": "BSP", "hint": "Вторая часть поясняет, как местные жители чтут имя Некрасова."}, {"n": 6, "text": "Радушно встретят вас в местной Заболотской школе.", "cat": null, "hint": ""}, {"n": 7, "text": "Пригласят поиграть в народные игры: лапту, городки, горелки, ручеёк, чижика и другие.", "cat": "LIST", "hint": "После обобщающего сочетания «народные игры» перечислены игры."}, {"n": 8, "text": "Приезжайте в Заболотье, вживую услышьте строки произведения русского поэта: «Дети, я вам расскажу про Мазая…»", "cat": "SPEECH", "hint": "Двоеточие вводит цитату после слов «строки произведения»."}]}, {"id": "50698", "answer": [3, 5, 8], "items": [{"n": 3, "text": "Заселён район очень неравномерно: в верховьях Бии плотность населения составляет около одного человека на км2, а в низовьях — более десяти человек на км2.", "cat": "BSP", "hint": "Во второй части поясняется, в чём проявляется неравномерность заселения."}, {"n": 5, "text": "Общаясь с местными жителями, можно заметить: в горной части рядом живут русские, алтайцы, кумандинцы и другие коренные народности; берега Бии в среднем и нижнем течении заселены в основном русскими.", "cat": "BSP", "hint": "Во второй части раскрывается содержание того, что можно заметить."}, {"n": 6, "text": "Население занимается привычной для данного края деятельностью: пчеловодством, молочным скотоводством, сбором лекарственно-технического сырья и папоротника.", "cat": "LIST", "hint": "После обобщающего слова «деятельностью» названы её виды."}, {"n": 8, "text": "В период «перестройки» возникла серьёзная опасность повсеместного уничтожения кедровников: в тайге хозяйничали «чёрные лесорубы».", "cat": "BSP", "hint": "Вторая часть раскрывает, почему возникла опасность уничтожения кедровников."}], "full": [{"n": 1, "text": "Телецкое озеро — одно из главных украшений Горного Алтая, его называют Алтын-колем, Золотым озером.", "cat": null, "hint": ""}, {"n": 2, "text": "Из Телецкого озера рождается Бия (Бий) — вторая по величине река края, которая бежит в северном направлении среди невысоких хребтов; здесь обычны обрывистые берега, скальные выходы.", "cat": null, "hint": ""}, {"n": 3, "text": "Заселён район очень неравномерно: в верховьях Бии плотность населения составляет около одного человека на км2, а в низовьях — более десяти человек на км2.", "cat": "BSP", "hint": "Во второй части поясняется, в чём проявляется неравномерность заселения."}, {"n": 4, "text": "По берегам Телецкого озера всего четыре небольших посёлка и нетронутые горные пространства вокруг.", "cat": null, "hint": ""}, {"n": 5, "text": "Общаясь с местными жителями, можно заметить: в горной части рядом живут русские, алтайцы, кумандинцы и другие коренные народности; берега Бии в среднем и нижнем течении заселены в основном русскими.", "cat": "BSP", "hint": "Во второй части раскрывается содержание того, что можно заметить."}, {"n": 6, "text": "Население занимается привычной для данного края деятельностью: пчеловодством, молочным скотоводством, сбором лекарственно-технического сырья и папоротника.", "cat": "LIST", "hint": "После обобщающего слова «деятельностью» названы её виды."}, {"n": 7, "text": "Главное промышленное богатство горных территорий района — ценная древесина кедровых лесов, заготавливаемая леспромхозами.", "cat": null, "hint": ""}, {"n": 8, "text": "В период «перестройки» возникла серьёзная опасность повсеместного уничтожения кедровников: в тайге хозяйничали «чёрные лесорубы».", "cat": "BSP", "hint": "Вторая часть раскрывает, почему возникла опасность уничтожения кедровников."}]}, {"id": "50699", "answer": [2, 4, 7], "items": [{"n": 2, "text": "Дерновинные злаки: ковыль-волосатик, ковыль Лессинга, типчак, мятлик узколистный — господствуют в Кулундинской степи.", "cat": "LIST", "hint": "После обобщающего сочетания «дерновинные злаки» следует перечень растений."}, {"n": 3, "text": "Ещё в XVII веке в отчётах первой соляной экспедиции было отмечено: «А земля — песок, а трава сочна...»", "cat": "SPEECH", "hint": "После слов «было отмечено» начинается прямая цитата."}, {"n": 4, "text": "Более богатое и яркое разнотравье: вика, люцерна, подморенник, тысячелистник — покрывает лесостепную зону.", "cat": "LIST", "hint": "После обобщающего слова «разнотравье» перечисляются растения."}, {"n": 6, "text": "Особенно красива степь весной: среди зелени распускаются цветы.", "cat": "BSP", "hint": "Вторая часть поясняет, почему весенняя степь особенно красива."}, {"n": 7, "text": "Несмотря на то что Кулундинская степь почти полностью освоена человеком, нарушившим естественные растительные сообщества, здесь насчитывается 30 видов редких и исчезающих растений: адонис весенний, башмачок пятнистый, любка и другие.", "cat": "LIST", "hint": "После обобщающего сочетания «видов ... растений» дан перечень видов."}], "full": [{"n": 1, "text": "Равнинный Алтай укрыт травяным ковром, который чередуется с возделанными полями.", "cat": null, "hint": ""}, {"n": 2, "text": "Дерновинные злаки: ковыль-волосатик, ковыль Лессинга, типчак, мятлик узколистный — господствуют в Кулундинской степи.", "cat": "LIST", "hint": "После обобщающего сочетания «дерновинные злаки» следует перечень растений."}, {"n": 3, "text": "Ещё в XVII веке в отчётах первой соляной экспедиции было отмечено: «А земля — песок, а трава сочна...»", "cat": "SPEECH", "hint": "После слов «было отмечено» начинается прямая цитата."}, {"n": 4, "text": "Более богатое и яркое разнотравье: вика, люцерна, подморенник, тысячелистник — покрывает лесостепную зону.", "cat": "LIST", "hint": "После обобщающего слова «разнотравье» перечисляются растения."}, {"n": 5, "text": "Древесная растительность представлена берёзовыми колками — небольшими лесами и сосновыми борами, под их пологом растут ягодные кустарники и лесные травы.", "cat": null, "hint": ""}, {"n": 6, "text": "Особенно красива степь весной: среди зелени распускаются цветы.", "cat": "BSP", "hint": "Вторая часть поясняет, почему весенняя степь особенно красива."}, {"n": 7, "text": "Несмотря на то что Кулундинская степь почти полностью освоена человеком, нарушившим естественные растительные сообщества, здесь насчитывается 30 видов редких и исчезающих растений: адонис весенний, башмачок пятнистый, любка и другие.", "cat": "LIST", "hint": "После обобщающего сочетания «видов ... растений» дан перечень видов."}]}, {"id": "50700", "answer": [3, 4, 6], "items": [{"n": 3, "text": "Фаворский относился к иллюстрациям как учёный: он учитывал историю и культуру эпохи.", "cat": "BSP", "hint": "Вторая часть раскрывает, в чём проявлялся научный подход Фаворского."}, {"n": 4, "text": "Так, оформление «Слова о полку Игореве» навеяно древнерусскими книгами: художником использованы буквицы и орнамент из древнерусских рукописных текстов.", "cat": "BSP", "hint": "Во второй части объясняется, что именно использовал художник в оформлении."}, {"n": 5, "text": "А в рисунках к «Маленьким трагедиям» Пушкина герои застывают в театральных позах и олицетворяют собой главные чувства: страх, гнев, скорбь.", "cat": "LIST", "hint": "После обобщающего слова «чувства» перечислены сами чувства."}, {"n": 6, "text": "Фаворский деятельно участвовал в судьбе Родины: с 1914 по 1917 год художник сражался на фронтах Первой мировой войны, за храбрость был произведён в офицеры и награждён Георгиевским крестом, высшим военным орденом.", "cat": "BSP", "hint": "Вторая часть поясняет, как Фаворский участвовал в судьбе Родины."}], "full": [{"n": 1, "text": "Владимир Андреевич Фаворский — талантливый книжный иллюстратор.", "cat": null, "hint": ""}, {"n": 2, "text": "Художник проиллюстрировал много литературных произведений, среди которых сочинения Пушкина, Шекспира, Данте, Гоголя.", "cat": null, "hint": ""}, {"n": 3, "text": "Фаворский относился к иллюстрациям как учёный: он учитывал историю и культуру эпохи.", "cat": "BSP", "hint": "Вторая часть раскрывает, в чём проявлялся научный подход Фаворского."}, {"n": 4, "text": "Так, оформление «Слова о полку Игореве» навеяно древнерусскими книгами: художником использованы буквицы и орнамент из древнерусских рукописных текстов.", "cat": "BSP", "hint": "Во второй части объясняется, что именно использовал художник в оформлении."}, {"n": 5, "text": "А в рисунках к «Маленьким трагедиям» Пушкина герои застывают в театральных позах и олицетворяют собой главные чувства: страх, гнев, скорбь.", "cat": "LIST", "hint": "После обобщающего слова «чувства» перечислены сами чувства."}, {"n": 6, "text": "Фаворский деятельно участвовал в судьбе Родины: с 1914 по 1917 год художник сражался на фронтах Первой мировой войны, за храбрость был произведён в офицеры и награждён Георгиевским крестом, высшим военным орденом.", "cat": "BSP", "hint": "Вторая часть поясняет, как Фаворский участвовал в судьбе Родины."}, {"n": 7, "text": "Художник вёл преподавательскую работу, читая лекции студентам и проводя консультации.", "cat": null, "hint": ""}]}, {"id": "50704", "answer": [2, 3, 4], "items": [{"n": 2, "text": "Парк объединяет все виды зональной растительности Центральной Камчатки: альпийскую тундру, луга, лиственные и хвойные леса, лесотундру.", "cat": "LIST", "hint": "После обобщающего сочетания «виды ... растительности» идёт перечисление."}, {"n": 3, "text": "Здесь обитает много животных: соболь, лисица, медведь, волк, росомаха, выдра, горностай, заяц-беляк, песец, белка.", "cat": "LIST", "hint": "После обобщающего слова «животных» перечислены животные."}, {"n": 4, "text": "С наступлением весны парк ещё больше оживляется, сюда прилетают различные птицы: утки, гуси, лебеди, чайки, кулики.", "cat": "LIST", "hint": "После обобщающего слова «птицы» перечисляются названия птиц."}, {"n": 6, "text": "Территория природного парка является местом исторически компактного проживания эвенов: в границах парка ведут хозяйственную деятельность до 60 традиционных эвенских хозяйств, относящихся к древней ительменской культуре.", "cat": "BSP", "hint": "Вторая часть конкретизирует, в чём проявляется проживание эвенов в парке."}], "full": [{"n": 1, "text": "Природный парк «Бы́стринский» находится в центральной части Камчатки в долине реки Быстрой, разделяющей Срединный и Козыревский хребты Камчатки, а также включает бассейны рек Анавга́й, Тиги́ль и И́ча.", "cat": null, "hint": ""}, {"n": 2, "text": "Парк объединяет все виды зональной растительности Центральной Камчатки: альпийскую тундру, луга, лиственные и хвойные леса, лесотундру.", "cat": "LIST", "hint": "После обобщающего сочетания «виды ... растительности» идёт перечисление."}, {"n": 3, "text": "Здесь обитает много животных: соболь, лисица, медведь, волк, росомаха, выдра, горностай, заяц-беляк, песец, белка.", "cat": "LIST", "hint": "После обобщающего слова «животных» перечислены животные."}, {"n": 4, "text": "С наступлением весны парк ещё больше оживляется, сюда прилетают различные птицы: утки, гуси, лебеди, чайки, кулики.", "cat": "LIST", "hint": "После обобщающего слова «птицы» перечисляются названия птиц."}, {"n": 5, "text": "В «Быстринском» встречается 137 видов птиц, в том числе краснокнижные сапсан и беркут.", "cat": null, "hint": ""}, {"n": 6, "text": "Территория природного парка является местом исторически компактного проживания эвенов: в границах парка ведут хозяйственную деятельность до 60 традиционных эвенских хозяйств, относящихся к древней ительменской культуре.", "cat": "BSP", "hint": "Вторая часть конкретизирует, в чём проявляется проживание эвенов в парке."}]}, {"id": "50709", "answer": [1, 2, 4, 6], "items": [{"n": 1, "text": "О связях Александра Николаевича Островского с Рыбинским театром говорит известный факт: в 1880 году запретили пьесу великого драматурга «Василиса Мелентьева».", "cat": "BSP", "hint": "Во второй части раскрывается, какой именно факт имеется в виду."}, {"n": 2, "text": "Цензура посчитала так: это произведение якобы подрывает «авторитет царской власти».", "cat": "BSP", "hint": "После слов «посчитала так» сообщается, что именно решила цензура."}, {"n": 4, "text": "Эта просьба заключалось в следующем: во что бы то ни стало надо выхлопотать разрешение на постановку этой пьесы в Рыбинске.", "cat": "BSP", "hint": "После «заключалась в следующем» раскрыто содержание просьбы."}, {"n": 5, "text": "Драматург не замедлил с ответом: «Разрешение на «Василису Мелентьеву» я готов дать с большим удовольствием».", "cat": "SPEECH", "hint": "После слов автора о данном ответе начинается прямая речь."}, {"n": 6, "text": "Островский сдержал данное обещание: разрешение было получено.", "cat": "BSP", "hint": "Вторая часть поясняет, как Островский сдержал обещание."}], "full": [{"n": 1, "text": "О связях Александра Николаевича Островского с Рыбинским театром говорит известный факт: в 1880 году запретили пьесу великого драматурга «Василиса Мелентьева».", "cat": "BSP", "hint": "Во второй части раскрывается, какой именно факт имеется в виду."}, {"n": 2, "text": "Цензура посчитала так: это произведение якобы подрывает «авторитет царской власти».", "cat": "BSP", "hint": "После слов «посчитала так» сообщается, что именно решила цензура."}, {"n": 3, "text": "Антрепренёр Рыбинского театра, некто Алексеев, обратился к Островскому с просьбой.", "cat": null, "hint": ""}, {"n": 4, "text": "Эта просьба заключалось в следующем: во что бы то ни стало надо выхлопотать разрешение на постановку этой пьесы в Рыбинске.", "cat": "BSP", "hint": "После «заключалась в следующем» раскрыто содержание просьбы."}, {"n": 5, "text": "Драматург не замедлил с ответом: «Разрешение на «Василису Мелентьеву» я готов дать с большим удовольствием».", "cat": "SPEECH", "hint": "После слов автора о данном ответе начинается прямая речь."}, {"n": 6, "text": "Островский сдержал данное обещание: разрешение было получено.", "cat": "BSP", "hint": "Вторая часть поясняет, как Островский сдержал обещание."}, {"n": 7, "text": "Рыбинские артисты с большим успехом поставили замечательную пьесу!", "cat": null, "hint": ""}]}, {"id": "51264", "answer": [2, 3, 5], "items": [{"n": 1, "text": "Флаг Ростова-на-Дону представляет собой прямоугольное полотнище «золотого свечения», состоящее из цветов герба города: синего и красного.", "cat": "LIST", "hint": "После обобщающего слова «цветов» названы два цвета герба."}, {"n": 2, "text": "На флаге в центре воспроизведён малый герб города в контурном изображении: щит рассечён, на синем поле башня, на красном военные доспехи.", "cat": "BSP", "hint": "Вторая часть раскрывает, как именно изображён герб."}, {"n": 3, "text": "Цвета флага и гербовые фигуры на оборотной стороне располагаются в следующей последовательности от древка флага: на синем фоне сторожевая башня, на красном военные трофеи.", "cat": "BSP", "hint": "Во второй части уточняется, в какой последовательности расположены фигуры."}, {"n": 4, "text": "Исследователи отмечают: «Гербовые фигуры воспроизведены схематически, без излишней детализации, белым цветом».", "cat": "SPEECH", "hint": "Двоеточие вводит прямую речь после слов «исследователи отмечают»."}, {"n": 5, "text": "В этом много символического: в гербовых фигурах читается чистота помыслов, свобода и доброта ростовчан, мирное сосуществование граждан разных национальностей в городском сообществе, открытость города для своих друзей, готовность горожан к сотрудничеству.", "cat": "BSP", "hint": "Во второй части поясняется, в чём состоит символическое значение герба."}], "full": [{"n": 1, "text": "Флаг Ростова-на-Дону представляет собой прямоугольное полотнище «золотого свечения», состоящее из цветов герба города: синего и красного.", "cat": "LIST", "hint": "После обобщающего слова «цветов» названы два цвета герба."}, {"n": 2, "text": "На флаге в центре воспроизведён малый герб города в контурном изображении: щит рассечён, на синем поле башня, на красном военные доспехи.", "cat": "BSP", "hint": "Вторая часть раскрывает, как именно изображён герб."}, {"n": 3, "text": "Цвета флага и гербовые фигуры на оборотной стороне располагаются в следующей последовательности от древка флага: на синем фоне сторожевая башня, на красном военные трофеи.", "cat": "BSP", "hint": "Во второй части уточняется, в какой последовательности расположены фигуры."}, {"n": 4, "text": "Исследователи отмечают: «Гербовые фигуры воспроизведены схематически, без изл ляют учёные — они заставляют многоводные реки течь вспять.", "cat": null, "hint": ""}, {"n": 6, "text": "В исследовательских институтах создаются проекты комплексного использования великих рек Сибири, решаются проблемы бурных весенних паводков.", "cat": null, "hint": ""}, {"n": 7, "text": "Но всё же нужно почаще задаваться вопросом: «А есть ли у вас право нарушать естественный природный баланс?»", "cat": "SPEECH", "hint": "После слов «задаваться вопросом» следует вопрос в виде прямой цитаты."}]}, {"id": "42233", "answer": [3, 5, 9], "items": [{"n": 2, "text": "Про него уральцы говорят: «Тургояк — младший брат Байкала».", "cat": "SPEECH", "hint": "После слов автора «уральцы говорят» приведена прямая речь."}, {"n": 3, "text": "И неслучайно: вода Тургояка по чистоте и прозрачности близка байкальской, а голубизной напоминает небесный аквамарин.", "cat": "BSP", "hint": "Вторая часть поясняет, почему сравнение с Байкалом не случайно."}, {"n": 5, "text": "Размеры озера тоже сравнимы с величиной «старшего брата»: при протяжённости 12,5 км и ширине 11 км площадь составляет 2638 га.", "cat": "BSP", "hint": "Вторая часть подтверждает сравнение конкретными размерами озера."}, {"n": 6, "text": "Близ озера раскинулся национальный парк «Таганай» — уникальнейший природный комплекс Южного Урала, включающий несколько горных массивов: Таганай, Юрма, Ицыл.", "cat": "LIST", "hint": "После слова «массивов» названы конкретные горные массивы."}, {"n": 9, "text": "Многие истории были когда-то мифами: о загадочном народе, проживавшем здесь, повествует древнеславянская и финно-угорская мифология.", "cat": "BSP", "hint": "Вторая часть раскрывает, какие мифологические сюжеты имеются в виду."}], "full": [{"n": 1, "text": "Среди трёх тысяч озёр Южного Урала одно из самых живописных — озеро Тургояк.", "cat": null, "hint": ""}, {"n": 2, "text": "Про него уральцы говорят: «Тургояк — младший брат Байкала».", "cat": "SPEECH", "hint": "После слов автора «уральцы говорят» приведена прямая речь."}, {"n": 3, "text": "И неслучайно: вода Тургояка по чистоте и прозрачности близка байкальской, а голубизной напоминает небесный аквамарин.", "cat": "BSP", "hint": "Вторая часть поясняет, почему сравнение с Байкалом не случайно."}, {"n": 4, "text": "Прозрачность воды позволяет видеть дно, растения, рыб на глубине до 18 метров!", "cat": null, "hint": ""}, {"n": 5, "text": "Размеры озера тоже сравнимы с величиной «старшего брата»: при протяжённости 12,5 км и ширине 11 км площадь составляет 2638 га.", "cat": "BSP", "hint": "Вторая часть подтверждает сравнение конкретными размерами озера."}, {"n": 6, "text": "Близ озера раскинулся национальный парк «Таганай» — уникальнейший природный комплекс Южного Урала, включающий несколько горных массивов: Таганай, Юрма, Ицыл.", "cat": "LIST", "hint": "После слова «массивов» названы конкретные горные массивы."}, {"n": 7, "text": "Эти места за дивную красоту называют русской Швейцарией, сравнивая со знаменитыми европейскими Альпами.", "cat": null, "hint": ""}, {"n": 8, "text": "Мрачные ущелья и горные кручи породили легенды о тайнах Таганая, которые и ныне передают старожилы.", "cat": null, "hint": ""}, {"n": 9, "text": "Многие истории были когда-то мифами: о загадочном народе, проживавшем здесь, повествует древнеславянская и финно-угорская мифология.", "cat": "BSP", "hint": "Вторая часть раскрывает, какие мифологические сюжеты имеются в виду."}]}, {"id": "42234", "answer": [3, 4, 6], "items": [{"n": 1, "text": "Россия всегда была богата талантливыми людьми самых разных профессий: композиторами и кузнецами, архитекторами и плотниками, врачами и художниками.", "cat": "LIST", "hint": "После обобщающего слова «профессий» дан их перечень."}, {"n": 3, "text": "Это мнение сложилось из-за того, что люди забыли важный факт: почти все идеи, ставшие научной основой телевидеотехники, создали русские учёные.", "cat": "BSP", "hint": "После слов «важный факт» раскрывается содержание факта."}, {"n": 4, "text": "Вот несколько ярких примеров: идея последовательной передачи элементов изображения впервые пришла в XIX веке П. И. Бахметьеву, радиоволны в 1895 году открыл и научился ими управлять А. С. Попов, творцом телевидения является В. К. Зворыкин.", "cat": "LIST", "hint": "После обобщающего сочетания «ярких примеров» приводятся сами примеры."}, {"n": 6, "text": "И они были изобретены отечественными учёными: осенью 1996 года успешно провели испытания жидкокристаллического плоского экрана на основе полимеров, синтезированных А. В. Ванниковым.", "cat": "BSP", "hint": "Вторая часть уточняет, когда и как появились изобретённые экраны."}], "full": [{"n": 1, "text": "Россия всегда была богата талантливыми людьми самых разных профессий: композиторами и кузнецами, архитекторами и плотниками, врачами и художниками.", "cat": "LIST", "hint": "После обобщающего слова «профессий» дан их перечень."}, {"n": 2, "text": "То сегодня считается, что страна проигрывает на мировом рынке в области электроники.", "cat": null, "hint": ""}, {"n": 3, "text": "Это мнение сложилось из-за того, что люди забыли важный факт: почти все идеи, ставшие научной основой телевидеотехники, создали русские учёные.", "cat": "BSP", "hint": "После слов «важный факт» раскрывается содержание факта."}, {"n": 4, "text": "Вот несколько ярких примеров: идея последовательной передачи элементов изображения впервые пришла в XIX веке П. И. Бахметьеву, радиоволны в 1895 году открыл и научился ими управлять А. С. Попов, творцом телевидения является В. К. Зворыкин.", "cat": "LIST", "hint": "После обобщающего сочетания «ярких примеров» приводятся сами примеры."}, {"n": 5, "text": "Будущее телевизоров, как становится ясно всем, — за плоскими экранами.", "cat": null, "hint": ""}, {"n": 6, "text": "И они были изобретены отечественными учёными: осенью 1996 года успешно провели испытания жидкокристаллического плоского экрана на основе полимеров, синтезированных А. В. Ванниковым.", "cat": "BSP", "hint": "Вторая часть уточняет, когда и как появились изобретённые экраны."}, {"n": 7, "text": "И таких примеров множество!", "cat": null, "hint": ""}]}, {"id": "42239", "answer": [2, 3, 4, 7], "items": [{"n": 2, "text": "Подобные народные песни относятся к бурлацким, так как создавали их бурлаки и пели во время тяжёлых артельных работ, как то: снятие баржи с мели, вбивание свай, перемещение тяжестей и т. д.", "cat": "LIST", "hint": "После вводящего перечень оборота «как то» названы виды работ."}, {"n": 3, "text": "Волга протекает по территории 15 регионов России: Тверской области, Московской области, Ярославской области, Костромской области, Ивановской области, Нижегородской области, Чувашской Республики, Республики Марий Эл, Республики Татарстан, Ульяновской области, Самарской области, Саратовской области, Волгоградской области, Астраханской области, Республики Калмыкии.", "cat": "LIST", "hint": "После слов «15 регионов России» перечислены регионы."}, {"n": 4, "text": "В реке водится около 80 видов рыб: белорыбица, белуга, ёрш, лещ, налим, осётр, сазан, сом, щука и многие другие.", "cat": "LIST", "hint": "После сочетания «около 80 видов рыб» перечислены рыбы."}, {"n": 6, "text": "В нём живут разнообразные представители флоры и фауны: встречаются диковинные растения, вольготно чувствуют себя редкие животные.", "cat": "BSP", "hint": "Во второй части раскрывается, какие именно животные и растения живут в заповеднике."}, {"n": 7, "text": "Некоторые обитатели заповедника занесены в Красную книгу: нерпа, лебедь-шипун, орлан-белохвост, пеликан.", "cat": "LIST", "hint": "После общего слова «обитатели» перечислены представители фауны."}], "full": [{"n": 1, "text": "«Вниз по матушке по Волге» — так пели бурлаки, называя матушкой величайшую реку Европы.", "cat": null, "hint": ""}, {"n": 2, "text": "Подобные народные песни относятся к бурлацким, так как создавали их бурлаки и пели во время тяжёлых артельных работ, как то: снятие баржи с мели, вбивание свай, перемещение тяжестей и т. д.", "cat": "LIST", "hint": "После вводящего перечень оборота «как то» названы виды работ."}, {"n": 3, "text": "Волга протекает по территории 15 регионов России: Тверской области, Московской области, Ярославской области, Костромской области, Ивановской области, Нижегородской области, Чувашской Республики, Республики Марий Эл, Республики Татарстан, Ульяновской области, Самарской области, Саратовской области, Волгоградской области, Астраханской области, Республики Калмыкии.", "cat": "LIST", "hint": "После слов «15 регионов России» перечислены регионы."}, {"n": 4, "text": "В реке водится около 80 видов рыб: белорыбица, белуга, ёрш, лещ, налим, осётр, сазан, сом, щука и многие другие.", "cat": "LIST", "hint": "После сочетания «около 80 видов рыб» перечислены рыбы."}, {"n": 5, "text": "В дельте Волги сложилась уникальная природная среда, поэтому здесь открыли Астраханский заповедник.", "cat": null, "hint": ""}, {"n": 6, "text": "В нём живут разнообразные представители флоры и фауны: встречаются диковинные растения, вольготно чувствуют себя редкие животные.", "cat": "BSP", "hint": "Во второй части раскрывается, какие именно животные и растения живут в заповеднике."}, {"n": 7, "text": "Некоторые обитатели заповедника занесены в Красную книгу: нерпа, лебедь-шипун, орлан-белохвост, пеликан.", "cat": "LIST", "hint": "После общего слова «обитатели» перечислены представители фауны."}]}, {"id": "42241", "answer": [2, 4], "items": [{"n": 2, "text": "Есть по его течению места, когда сотни километров, словно на фантастической киноленте, сменяются виды один прекраснее другого — вот представьте: версту-другую, забредя в реку по грудь, стоят могучие утёсы, быками их здесь зовут, по утёсам где гривы леса, где отдельная сосенка, частью корней, а то и одним корнем уцепившаяся за родной камень, и по каждой проточине, по каждому распадку ворохи кустарников акации, жимолости, таволожника.", "cat": "BSP", "hint": "Вторая часть раскрывает картину, которую предлагается представить читателю."}, {"n": 3, "text": "По всем утёсам кипень цветов: примулы, лилии, орхидеи, красодневы.", "cat": "LIST", "hint": "После общего слова «цветов» перечислены цветы."}, {"n": 4, "text": "Увидев эти красодневы в Колумбии, я, помнится, заорал от счастья, будто самое себе родное узрел, и всех заверял: эти в жёлтый рупор кричащие цветы неведомым путём попали сюда из Сибири.", "cat": "BSP", "hint": "Вторая часть раскрывает, в чём автор заверял слушателей."}], "full": [{"n": 1, "text": "Но чуден, всё ещё чуден Енисей летней порою!", "cat": null, "hint": ""}, {"n": 2, "text": "Есть по его течению места, когда сотни километров, словно на фантастической киноленте, сменяются виды один прекраснее другого — вот представьте: версту-другую, забредя в реку по грудь, стоят могучие утёсы, быками их здесь зовут, по утёсам где гривы леса, где отдельная сосенка, частью корней, а то и одним корнем уцепившаяся за родной камень, и по каждой проточине, по каждому распадку ворохи кустарников акации, жимолости, таволожника.", "cat": "BSP", "hint": "Вторая часть раскрывает картину, которую предлагается представить читателю."}, {"n": 3, "text": "По всем утёсам кипень цветов: примулы, лилии, орхидеи, красодневы.", "cat": "LIST", "hint": "После общего слова «цветов» перечислены цветы."}, {"n": 4, "text": "Увидев эти красодневы в Колумбии, я, помнится, заорал от счастья, будто самое себе родное узрел, и всех заверял: эти в жёлтый рупор кричащие цветы неведомым путём попали сюда из Сибири.", "cat": "BSP", "hint": "Вторая часть раскрывает, в чём автор заверял слушателей."}, {"n": 5, "text": "И хотя меня заверяли, что, пожалуй, всё было наоборот, я упорно не соглашался с вескими доводами и со всякой ботанической наукой.", "cat": null, "hint": ""}]}, {"id": "50586", "answer": [2, 7, 8], "items": [{"n": 1, "text": "С «поющими» песками можно встретиться не только в пустынях, но и в других местах: на берегах Кольского полуострова и Балтики, в долинах Лены и Вилюя, на озере Байкал.", "cat": "LIST", "hint": "После общего указания «в других местах» перечислены места."}, {"n": 2, "text": "Так т звуки.", "cat": null, "hint": ""}]}];

const CLASSIFY=[{"text": "По всем утёсам кипень цветов: примулы, лилии, орхидеи, красодневы.", "cat": "LIST", "explain": "После общего слова «цветов» перечислены цветы.", "source": "№ 42241"}, {"text": "Пригласят поиграть в народные игры: лапту, городки, горелки, ручеёк, чижика и другие.", "cat": "LIST", "explain": "После обобщающего сочетания «народные игры» перечислены игры.", "source": "№ 50694"}, {"text": "В Ледовитый океан впадают великие реки: Обь с Иртышом, Енисей с Ангарой, Лена с Алданом.", "cat": "LIST", "explain": "После обобщающего слова «реки» перечислены названия рек.", "source": "№ 14099"}, {"text": "Некоторые обитатели заповедника занесены в Красную книгу: нерпа, лебедь-шипун, орлан-белохвост, пеликан.", "cat": "LIST", "explain": "После общего слова «обитатели» перечислены представители фауны.", "source": "№ 42239"}, {"text": "Более богатое и яркое разнотравье: вика, люцерна, подморенник, тысячелистник — покрывает лесостепную зону.", "cat": "LIST", "explain": "После обобщающего слова «разнотравье» перечисляются растения.", "source": "№ 50699"}, {"text": "Молодой империи нужна была прежде всего своя Античность: легендарные правители, эпос и мифологический пантеон.", "cat": "LIST", "explain": "После обобщающего сочетания «своя Античность» названы её составляющие.", "source": "№ 52996"}, {"text": "В реке водится около 80 видов рыб: белорыбица, белуга, ёрш, лещ, налим, осётр, сазан, сом, щука и многие другие.", "cat": "LIST", "explain": "После сочетания «около 80 видов рыб» перечислены рыбы.", "source": "№ 42239"}, {"text": "Здесь обитает много животных: соболь, лисица, медведь, волк, росомаха, выдра, горностай, заяц-беляк, песец, белка.", "cat": "LIST", "explain": "После обобщающего слова «животных» перечислены животные.", "source": "№ 50704"}, {"text": "С наступлением весны парк ещё больше оживляется, сюда прилетают различные птицы: утки, гуси, лебеди, чайки, кулики.", "cat": "LIST", "explain": "После обобщающего слова «птицы» перечисляются названия птиц.", "source": "№ 50704"}, {"text": "Точнее было бы сказать: это преображение.", "cat": "BSP", "explain": "Вторая часть раскрывает смысл слов «точнее было бы сказать».", "source": "№ 57119"}, {"text": "Островский сдержал данное обещание: разрешение было получено.", "cat": "BSP", "explain": "Вторая часть поясняет, как Островский сдержал обещание.", "source": "№ 50709"}, {"text": "Особенно красива степь весной: среди зелени распускаются цветы.", "cat": "BSP", "explain": "Вторая часть поясняет, почему весенняя степь особенно красива.", "source": "№ 50699"}, {"text": "Есть и такое предположение: звучание песков вызывается подземными водами.", "cat": "BSP", "explain": "Вторая часть раскрывает содержание предположения.", "source": "№ 50586"}, {"text": "Но, пожалуй, скорее всего правильно иное: звуки объясняются электризацией песка.", "cat": "BSP", "explain": "Вторая часть уточняет, в чём состоит «иное» объяснение.", "source": "№ 50586"}, {"text": "Цензура посчитала так: это произведение якобы подрывает «авторитет царской власти».", "cat": "BSP", "explain": "После слов «посчитала так» сообщается, что именно решила цензура.", "source": "№ 50709"}, {"text": "Фаворский относился к иллюстрациям как учёный: он учитывал историю и культуру эпохи.", "cat": "BSP", "explain": "Вторая часть раскрывает, в чём проявлялся научный подход Фаворского.", "source": "№ 50700"}, {"text": "Его имя здесь свято чтут: местные старожилы рассказывают о поэте, поют песни на его слова.", "cat": "BSP", "explain": "Вторая часть поясняет, как местные жители чтут имя Некрасова.", "source": "№ 50694"}, {"text": "Создавая Сибирь, природа допустила просчёт: большинство её рек она направила с юга на север.", "cat": "BSP", "explain": "Во второй части поясняется, какой просчёт допустила природа.", "source": "№ 14099"}, {"text": "А она жизненно необходима: тут горячее солнце.", "cat": "BSP", "explain": "Вторая часть объясняет, почему вода жизненно необходима.", "source": "№ 14099"}, {"text": "Почти исчерпывающе в нём представлено собрание русских карт и атласов: русская картография имеет давнюю историю.", "cat": "BSP", "explain": "Вторая часть называет причину важности собрания: у картографии давняя история.", "source": "№ 52564"}, {"text": "Экскурсии к китам обычно начинаются рано утром: море в это время спокойнее, а шансы увидеть морских гигантов выше.", "cat": "BSP", "explain": "Вторая часть поясняет причину раннего начала экскурсий.", "source": "№ 61506"}, {"text": "И неслучайно: вода Тургояка по чистоте и прозрачности близка байкальской, а голубизной напоминает небесный аквамарин.", "cat": "BSP", "explain": "Вторая часть поясняет, почему сравнение с Байкалом не случайно.", "source": "№ 42233"}, {"text": "Многие туристы мечтают увидеть на Алтае именно это удивительное животное: наблюдение за снежным барсом способно произвести неизгладимое впечатление.", "cat": "BSP", "explain": "Во второй части сказано, почему туристы хотят увидеть снежного барса.", "source": "№ 67158"}, {"text": "Поэтому чаще всего экскурсии по горным маршрутам начинаются на рассвете: воздух в это время прохладнее, а шансы увидеть представителей алтайской фауны гораздо выше.", "cat": "BSP", "explain": "Вторая часть объясняет, почему экскурсии начинают на рассвете.", "source": "№ 67158"}, {"text": "Про него уральцы говорят: «Тургояк — младший брат Байкала».", "cat": "SPEECH", "explain": "После слов автора «уральцы говорят» приведена прямая речь.", "source": "№ 42233"}, {"text": "Ещё в XVII веке в отчётах первой соляной экспедиции было отмечено: «А земля — песок, а трава сочна...»", "cat": "SPEECH", "explain": "После слов «было отмечено» начинается прямая цитата.", "source": "№ 50699"}, {"text": "Но всё же нужно почаще задаваться вопросом: «А есть ли у вас право нарушать естественный природный баланс?»", "cat": "SPEECH", "explain": "После слов «задаваться вопросом» следует вопрос в виде прямой цитаты.", "source": "№ 14099"}, {"text": "Драматург не замедлил с ответом: «Разрешение на «Василису Мелентьеву» я готов дать с большим удовольствием».", "cat": "SPEECH", "explain": "После слов автора о данном ответе начинается прямая речь.", "source": "№ 50709"}, {"text": "Приезжайте в Заболотье, вживую услышьте строки произведения русского поэта: «Дети, я вам расскажу про Мазая…»", "cat": "SPEECH", "explain": "Двоеточие вводит цитату после слов «строки произведения».", "source": "№ 50694"}, {"text": "Исследователи отмечают: «Гербовые фигуры воспроизведены схематически, без излишней детализации, белым цветом».", "cat": "SPEECH", "explain": "Двоеточие вводит прямую речь после слов «исследователи отмечают».", "source": "№ 51264"}, {"text": "Наш проводник сразу предупреждает группу: «Соблюдайте тишину и не отходите далеко от тропы, ведь поведение животных трудно предсказать».", "cat": "SPEECH", "explain": "После слов «предупреждает группу» приведены слова проводника.", "source": "№ 67158"}, {"text": "Капитан нашего катера сразу предупреждает группу: «Сохраняйте тишину и не делайте резких движений, ведь киты очень чувствительны к шуму».", "cat": "SPEECH", "explain": "После слов автора «предупреждает группу» следует прямая речь.", "source": "№ 61506"}];

function home(){route='menu';idx=score=0;queue=[];answerLocked=false;show(`<div class="menu-wrap"><div class="menu-lead"><div class="eyebrow">ЕГЭ №21</div><div class="bigtitle">${CONFIG.title}</div><div class="intro">Три случайных экзаменационных задания с полными текстами и разбором.</div></div><div class="menu-cards"><section class="menu-card"><span class="menu-icon">▦</span><h2>Варианты ЕГЭ · 3 задания</h2><p>Отмечай номера предложений, где знак поставлен по одному правилу.</p><button class="primary" id="goExam">Начать →</button></section></div><div class="menu-footer"><button id="menuHelp">◉ Открыть справочник</button><span>В базе ${DATA.length} заданий · новая случайная тройка при повторе.</span></div></div>`);$('goExam').onclick=startExam;$('menuHelp').onclick=openReference;}
function startExam(){route='exam';queue=shuffle(DATA).slice(0,3);gameAttemptId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('e21_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));attemptTested={};attemptErrors={};gameSaved=false;idx=score=0;sel=new Set();answerLocked=false;renderExam();}
function startClassify(){route='single';queue=shuffle(CLASSIFY).slice(0, sampleSize);idx=score=0;answerLocked=false;renderSingle();}
function splitColumns(items){if(window.innerWidth<800)return [items,[]];
 let total=items.reduce((a,x)=>a+x.text.length+25,0);let acc=0,at=items.length>>1,best=Infinity;
 items.forEach((it,i)=>{acc+=it.text.length+25;const diff=Math.abs(acc-total/2);if(i<items.length-1&&diff<best){best=diff;at=i+1;}});return [items.slice(0,at),items.slice(at)];}
function punctText(s){return esc(s);}
function renderPassage(items){const cols=splitColumns(items);return `<div class="reading-viewport" id="reading"><div class="passage-columns" id="passageColumns">${cols.filter(c=>c.length).map(col=>`<div class="passage-col">${col.map(x=>`<div class="passage-item ${sel.has(x.n)?'picked':''}" data-item="${x.n}"><button class="sentence-number ${sel.has(x.n)?'on':''}" aria-label="Отметить предложение ${x.n}" aria-pressed="${sel.has(x.n)}" data-n="${x.n}">${x.n}</button><span class="passage-text">${punctText(x.text)}</span></div>`).join('')}</div>`).join('')}</div></div>`;}
function examButtons(){return `<div class="footer-info"><span class="eyebrow">Выбрано: <b id="selectedN">${numbers([...sel])}</b></span><span class="hint-info">Нажимай на номера прямо в тексте</span></div><button id="check" class="primary">Проверить ответ</button>`}
function renderExam(){if(idx>=queue.length){finish();return}answerLocked=false;const t=queue[idx];sel=new Set();show(`<div class="exercise">
 <div class="exercise-top"><div><span class="eyebrow">ЭКЗАМЕНАЦИОННЫЙ РЕЖИМ</span><h2>Задание ${idx+1} из ${queue.length} <span class="subhead">· база № ${esc(t.id)}</span></h2></div><button class="ghost" id="helpNow">? Справка</button></div>
 <div class="task-instruction">Найди предложения, в которых <strong>${CONFIG.topic.toLowerCase()}</strong> ставится <strong>по одному правилу</strong>. Отметь их номера.</div>
 ${renderPassage(t.full)}<div class="bottom">${examButtons()}</div></div>`);
 $('helpNow').onclick=openReference;main.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.n);sel.has(n)?sel.delete(n):sel.add(n);main.querySelectorAll(`[data-item="${n}"]`).forEach(e=>e.classList.toggle('picked',sel.has(n)));b.classList.toggle('on',sel.has(n));b.setAttribute('aria-pressed',sel.has(n));$('selectedN').textContent=numbers([...sel]);});$('check').onclick=checkExam;
 requestAnimationFrame(fitPassage);
}
function fitPassage(){const wrap=$('reading'),cols=$('passageColumns');if(!wrap||!cols)return;let size=window.innerWidth>=1600?36:window.innerWidth>=1200?30:window.innerWidth>=800?26:window.innerWidth>=530?20:16;
 const min=window.innerWidth>=800?11:10.5;
 cols.style.fontSize=size+'px';
 let attempts=0;while(size>min&&attempts++<100){const sub=[...cols.querySelectorAll('.passage-col')]; if(sub.every(c=>c.scrollHeight<=cols.clientHeight+1)&&cols.scrollWidth<=wrap.clientWidth+2)break;size=Math.max(min,Math.round((size-.35)*100)/100);cols.style.fontSize=size+'px'}
 // At short screen sizes, keep text available through the reading pane only.
 wrap.classList.toggle('allow-reading-scroll',[...cols.querySelectorAll('.passage-col')].some(c=>c.scrollHeight>cols.clientHeight+1));
}
function checkExam(){
 if(answerLocked)return;
 answerLocked=true;
 const t=queue[idx], correct=sel.size===t.answer.length&&t.answer.every(n=>sel.has(n));
 if(correct)score++;
 const group=t.full.find(x=>t.answer.includes(x.n))?.cat;
 const rule=('Двоеточие · '+String(ALLRULES[group]?.[0]||'единое пунктуационное правило')).slice(0,115);
 attemptTested[rule]=(attemptTested[rule]||0)+1;
 if(!correct)attemptErrors[rule]=(attemptErrors[rule]||0)+1;
 idx++;setStatus();setProgress();
 const explanations=t.full.map(x=>({n:x.n,text:x.text,cat:x.cat,hint:x.hint,correct:t.answer.includes(x.n),chosen:sel.has(x.n)}));
 const wholeText=`<details class="review-original"><summary>Посмотреть исходный текст целиком</summary><p class="review-original-legend">Бирюзовая полоса — номер, который ты выбрал до проверки.</p><div class="review-original-body">${explanations.map(x=>`<div class="review-original-sentence ${x.chosen?'orig-chosen':''}"><span class="orig-num">(${x.n})</span> ${esc(x.text)}</div>`).join('')}</div></details>`;
 const cards=explanations.map(x=>{
   const status=x.correct?(x.chosen?'✓ Верно отмечено':'! Нужно было отметить'):(x.chosen?'✕ Лишний номер':'✓ Верно пропущено');
   const statusClass=(x.correct===x.chosen)?'good':'bad';
   return `<article class="review-line"><b class="r-num">${x.n}</b><div class="review-detail">
     <div class="review-sentence">${esc(x.text)}</div>
     <div class="review-rule"><b>${esc(ALLRULES[x.cat]?.[0] || 'Нет целевого знака')}</b><span class="review-indicator ${statusClass}">${status}</span></div>
     <p class="review-hint">${esc(x.hint||ALLRULES[x.cat]?.[1]||'В этом предложении нет целевого знака, поэтому его номер не выбираем.')}</p>
   </div></article>`;
 }).join('');
 openReview(`<div class="resultbanner ${correct?'ok':'bad'}"><strong>${correct?'✓ Отлично!':'✕ Есть ошибки'}</strong><span>${correct?'Все номера найдены правильно.':'Сравни выбранные номера с правильным ответом и прочитай предложения рядом с пояснениями.'}</span></div>
 <div class="comparison"><div>Твой ответ <b>${numbers([...sel])}</b></div><div>Правильный <b>${numbers(t.answer)}</b></div></div>
 ${wholeText}<h3>Разбор пунктуации</h3><p class="review-intro">Каждое предложение приведено полностью: под ним — правило и пояснение. Можно разбирать номера по очереди прямо с экрана.</p><div class="review-list">${cards}</div>`, `Результат · задание № ${t.id}`,'Продолжить →',()=>renderExam());
}
function renderSingle(){if(idx>=queue.length){finish();return;}answerLocked=false;let it=queue[idx];show(`<div class="single-shell"><div class="exercise-top"><div><span class="eyebrow">ПОПРОБУЙ УЗНАТЬ ПРАВИЛО</span><h2>Пример ${idx+1} из ${queue.length}</h2></div><button class="ghost" id="helpNow">? Справка</button></div>
 <div class="single-instruction">Почему здесь стоит двоеточие? Выбери одно из трёх правил.</div><div class="single-content"><section class="single-question"><div class="single-sentence" id="singleSentence">${esc(it.text)}</div></section><section class="rule-grid">${Object.entries(RULES).map(([key,v])=>`<button class="rule-option" data-key="${key}">${esc(v[0])}</button>`).join('')}</section></div><div class="single-foot"><div class="helper">Один ответ · пояснение после каждого выбора</div><button class="ghost" id="skip">Пропустить →</button></div></div>`);
 $('helpNow').onclick=openReference;$('skip').onclick=()=>{idx++;renderSingle()};main.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>checkSingle(b.dataset.key));requestAnimationFrame(fitSingle);
}
function fitSingle(){const el=$('singleSentence');if(!el)return;let s=window.innerWidth>=900?52:window.innerWidth>=520?32:25;el.style.fontSize=s+'px';let tries=0;while(tries++<35&&s>16&&(el.scrollHeight>el.clientHeight+2||el.scrollWidth>el.clientWidth+3)){s-=1;el.style.fontSize=s+'px';}}
function checkSingle(chosen){if(answerLocked)return;answerLocked=true;const it=queue[idx], correct=it.cat===chosen;if(correct)score++;idx++;setStatus();setProgress();openReview(`<div class="resultbanner ${correct?'ok':'bad'}"><strong>${correct?'✓ Верно!':'✕ Не тот случай'}</strong><span>${correct?'Ты узнал пунктуационное правило.':'Вот как определить правило в этом предложении.'}</span></div><div class="comparison"><div>Выбрано <b>${esc(RULES[chosen][0])}</b></div><div>Нужно <b>${esc(RULES[it.cat][0])}</b></div></div><p class="original-example">${esc(it.text)}</p><div class="explanation"><strong>Почему:</strong> ${esc(it.explain)}</div><div class="source-note">Источник: ${esc(it.source||'учебная подборка')}</div>`,'Разбор ответа','Следующий пример →',()=>renderSingle());}
function openReference(){const body=`<div class="reference-intro">Три причины постановки двоеточия. Все разновидности БСП объединены в один пункт. Его можно открыть в любой момент, не теряя ответ.</div><div class="reference-grid">${Object.values(RULES).map(v=>`<article class="rule-reference"><h3>${esc(v[0])}</h3><p>${esc(v[1])}</p><div class="ref-example">${esc(v[2])}</div></article>`).join('')}</div>`;openReview(body,`${CONFIG.topic} · справочник`,'Вернуться к игре',()=>{},true);}
function openReview(content,title,btn,cb,ref=false){const back=$('dialogBack');back.classList.add('visible');back.setAttribute('aria-hidden','false');$('dialogTitle').textContent=title;$('dialogContent').innerHTML=content;$('dialogButton').textContent=btn;const onClose=()=>{back.classList.remove('visible');back.setAttribute('aria-hidden','true');$('dialogButton').onclick=null;cb?.();};$('dialogButton').onclick=onClose;$('dialogClose').onclick=onClose;back.onclick=e=>{if(e.target===back&&ref)onClose()};$('dialogContent').scrollTop=0;}
function sendGame21(){
 if(gameSaved)return;const st=$('saveStatus21');
 if(!tg||!tg.platform||tg.platform==='unknown'||typeof tg.sendData!=='function'){st.textContent='Открой через кнопку «🎮 Тренажёры» в Telegram для записи результата.';return;}
 const total=Object.values(attemptTested).reduce((n,v)=>n+v,0);if(total!==3){st.textContent='Нужно завершить три задания.';return;}
 const data={v:1,type:'game_result',gameId:'TR21_COLON',attemptId:gameAttemptId,correct:score,total,errors:attemptErrors,tested:attemptTested};
 try{$('saveResult21').disabled=true;tg.sendData(JSON.stringify(data));gameSaved=true;st.textContent='Результат отправлен.';}catch(e){$('saveResult21').disabled=false;st.textContent=String(e.message||e);}
}
function finish(){route='finish';setStatus();setProgress();show(`<div class="finish"><span class="eyebrow">ТРЕНИРОВКА ЗАВЕРШЕНА</span><div class="finish-icon">${CONFIG.sign}</div><h1>Результат: ${score} из ${queue.length}</h1><p>${score===queue.length?'Безупречная работа!':'Каждое выполненное задание приближает к уверенному решению ЕГЭ.'}</p><div class="finish-actions"><button id="saveResult21" class="primary">💾 Сохранить результат</button><button id="again" class="ghost">Сыграть ещё раз</button><button id="finishHome" class="ghost">В меню</button></div><p id="saveStatus21" style="font-size:13px;color:var(--muted);margin-top:10px"></p></div>`);$('again').onclick=()=>startExam();$('finishHome').onclick=home;$('saveResult21').onclick=sendGame21;}
$('home').onclick=()=>home();$('topHelp').onclick=openReference;
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(route==='exam')fitPassage();if(route==='single')fitSingle()},100)});
// Remember active mode for a replay.
const _oldStartExam=startExam;startExam=()=>{currentType='exam';_oldStartExam()};const _oldStartClassify=startClassify;startClassify=()=>{currentType='single';_oldStartClassify()};
home();
</script></body></html>
