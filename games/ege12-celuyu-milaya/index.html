const groupMatch=(s,k)=>k==='verb'?s.cat==='verb'||s.cat==='mood':k==='present'?s.cat==='present':k==='past'?s.cat==='past':k==='doublet'?s.doublet:k==='vy'?s.rule==='vy'||(s.cat==='verb'&&s.mask.toLowerCase().startsWith('вы')):k==='obes'?s.rule==='obes':k==='mood'?s.cat==='mood':s.rule===k;

// ПРИОРИТЕТ ТРУДНОСТИ: перечислены встречающиеся в базах пользователя формы;
// оценка сложности не создаёт новых слов и не меняет правильные ответы.
const HARD_PATTERN=/брезж|движим|приемл|неотъемл|незыбл|зыбл|зижд|алч|всеобъемл|колебл|мелющ|мелют|мелет|пыш|мечущ|ропщ|внемл|жажд|лепеч|маяч|обессил|обезмолв|предвид|обвеш|вывал|развеш|замеш|замес|выкач|пристрел|рассе|сеян|овеян|застел|стелющ|задерж|нестерп|клеящ|клеен|необита|выгор|высп|вытерп|дремл|мурлыч|хлещ|плещ|рыщ|гонящ|перемел|отча|раска|запомни|веру|вылет|таян|засе|вылин|пропол|скачущ|курлыч|тешущ|тешащ|неизбеж/i;
function difficulty(s){
 const text=[s.mask,s.stem,s.lemma,s.note].join(' ').toLowerCase();
 let p=0;
 if(HARD_PATTERN.test(text))p+=25;
 if(s.doublet)p+=23;
 if(s.special)p+=30;
 if(/устаревш|историческ|запомн|исключени|не путать|чередован/i.test(s.note))p+=14;
 if(s.cat==='mood')p+=30;
 if(s.imperative)p+=25;
 if(s.rule==='obes'||s.rule==='vy')p+=16;
 if(s.vy_stressed!==null&&s.vy_stressed!==undefined)p+=11;
 if(/^(?:вы|обес|обез)/i.test(s.mask))p+=6;
 if(/[ё́]/.test(s.mask))p+=2;
 if((s.ctx||'').includes('('))p+=4;
 return p;
}
const hardByGroup=new Map();
function hardPool(key){
 if(hardByGroup.has(key))return hardByGroup.get(key);
 const pool=ALL.filter(s=>groupMatch(s,key)&&guideEligible(s));
 // Форма и контекст могут повторяться в исходных заданиях: для алгоритма нужна уникальная форма.
 // Повелительное наклонение: исключение — сохраняем все 13 исходных вхождений.
 const ordered=pool.sort((a,b)=>difficulty(b)-difficulty(a)||a.id.localeCompare(b.id));
 const seen=new Set();const out=[];
 for(const s of ordered){
  const uniq=key==='mood'?s.id:canon(s.stem)+'|'+canon(s.lemma)+'|'+(key==='doublet'?canon(s.ctx):'');
  if(seen.has(uniq))continue;
  seen.add(uniq);out.push(s);
  if(out.length>=100)break;
 }
 hardByGroup.set(key,out);return out;
}
const CONJ_RULES='Сначала инфинитив. II спряжение: все глаголы на -ить (кроме брить, стелить), а также 11 исключений: гнать, дышать, держать, зависеть, видеть, слышать, обидеть, терпеть, вертеть, ненавидеть, смотреть. I спряжение: остальные глаголы на -ать, -еть, -оть, -уть, -ять и др. Отдельно запомни зиждиться и зыбиться — I спряжение. Особые причастия могут отличаться от ожидаемой модели.';
function letterClue(s){
 if(/брезж/i.test(s.mask))return 'Это особое причастие: спряжение исходного глагола здесь не позволяет механически выбрать букву. Вспомни историческую форму или справочник; готовую гласную не подсказываем.';
 if(s.imperative)return 'Определи наклонение по смыслу. В формах повелительного наклонения этой базы есть суффикс наклонения и показатель множественного числа. Попробуй сам.';
 if(s.cat==='past')return 'Причастие прошедшего времени; исходный глагол «'+(s.lemma||'…')+'». Гласная зависит от инфинитива и способа образования причастия, а не от спряжения. Проверь, какая группа подходит.';
 if(s.cat==='present')return 'Причастие настоящего времени; исходный глагол «'+(s.lemma||'…')+'», '+(s.conj===1?'I спряжение → цЕлУЮ':s.conj===2?'II спряжение → мИлАЯ':'проверь особую форму')+'. Вспомни нужную позицию; букву не подсказываем.'+( /брезж/i.test(s.mask)?' Здесь особое историческое написание, загляни в справочник.':'');
 return 'Форма глагола; инфинитив «'+(s.lemma||'…')+'», '+(s.conj===1?'I спряжение → цЕлУЮ':s.conj===2?'II спряжение → мИлАЯ':'проверь ударение или наклонение')+'. Выбирай гласную по месту в окончании.';
}
function stageClue(stage,s){
 if(stage.key==='letter')return letterClue(s);
 if(stage.key==='conj')return CONJ_RULES;
 if(stage.key==='inf')return s.doublet?'Сначала прочитай уточнение в скобках. Есть ли похожий глагол с иным значением? Вспомни именно нужный инфинитив.':'Сохрани вид и значение глагола, восстанови начальную форму. Сравни трудные формы в справочнике.';
 if(stage.key==='pastLogic'||stage.key==='logic')return 'В настоящем времени у глаголов и причастий нужна система спряжений; у причастий прошедшего — исходный инфинитив. Названия суффиксов пока не раскрываем.';
 if(stage.key==='time')return 'Определи время по смыслу формы и грамматическим признакам, не по случайному сходству букв.';
 if(stage.key==='mood')return 'Сравни просьбу или приказ (что сделайте?) с будущим временем (что сделаете?). Одинаковый вид слова не гарантирует одинакового написания.';
 if(stage.key==='vyStress')return 'Мысленно убери приставку вы- и произнеси слово с ударением. Если окончание ударное, именно оно подскажет букву.';
 return stage.why||'Посмотри на значение и форму слова.';
}

function stepsFor(s){
 const a=[];
 if(s.cat==='verb'||s.cat==='mood'){
  a.push({key:'mood',prompt:'Это повелительное наклонение?',opts:[['yes','Да: просьба или приказ'],['no','Нет: настоящее или будущее время']],good:s.imperative?'yes':'no',why:'Определи наклонение по значению и контексту.'});
  if(s.imperative){
   a.push({key:'moodSuffix',prompt:'Как устроена форма повелительного наклонения множественного числа?',opts:[['yes','Суффикс наклонения -и- и показатель числа -те'],['no','Личное окончание без повелительного суффикса']],good:'yes',why:'Повелительное наклонение имеет собственный способ образования.'});
   a.push({key:'letter',prompt:'Теперь выбери гласную.',good:s.letter,why:letterClue(s)});return a;
  }
  a.push({key:'vy',prompt:'Есть ли в начале формы приставка вы-?',opts:[['yes','Да'],['no','Нет']],good:/^вы/i.test(s.mask)?'yes':'no',why:'У глаголов с вы- проверь ударение после её удаления.'});
  if(/^вы/i.test(s.mask)&&s.vy_stressed!==null&&s.vy_stressed!==undefined){
   a.push({key:'vyStress',prompt:'Если отбросить вы-, окончание станет ударным?',opts:[['yes','Да'],['no','Нет']],good:s.vy_stressed?'yes':'no',why:'Ударение проверяется без приставки вы-.'});
   if(s.vy_stressed){a.push({key:'letter',prompt:'Вставь гласную из ударного окончания.',good:s.letter,why:letterClue(s)});return a}
  }
  a.push({key:'obes',prompt:'Есть ли приставка обес-/обез-?',opts:[['yes','Да'],['no','Нет']],good:/^обес|^обез/i.test(s.mask)?'yes':'no',why:'В паре обессилеть/обессилить значение влияет на инфинитив.'});
  if(/^обес|^обез/i.test(s.mask)&&s.obes_action){a.push({key:'obesAction',prompt:'Кто лишается способности / силы?',opts:[['self','Сам действующий'],['other','Другой объект']],good:s.obes_action,why:'На себя: инфинитив на -еть; на другого: на -ить.'})}
 }else{
  a.push({key:'time',prompt:'Это причастие настоящего или прошедшего времени?',opts:[['present','Настоящее'],['past','Прошедшее']],good:s.cat,why:'Определи время по форме и значению.'});
  if(/^обес|^обез/i.test(s.mask)&&s.obes_action)a.push({key:'obesAction',prompt:'Действие относится к себе или к другому?',opts:[['self','Сам лишился'],['other','Лишил другого']],good:s.obes_action,why:'На себя: глагол на -еть; на другого: глагол на -ить.'});
 }
 if(s.lemma){a.push({key:'inf',prompt:'Определи исходный инфинитив. Напиши его.',good:s.lemma,why:s.doublet?'Выбирай инфинитив по смыслу и контексту, не по созвучию.':'Восстанови исходную форму того же значения и вида.'})}
 const dependsOnConj=s.cat==='present'||s.cat==='verb'||s.cat==='mood';
 a.push({key:'logic',prompt:'От чего зависит пропущенная гласная?',opts:[['conj','От спряжения'],['inf','От инфинитива']],good:dependsOnConj?'conj':'inf',why:'Выбор зависит от времени и типа глагольной формы.'});
 if(dependsOnConj&&s.conj){a.push({key:'conj',prompt:'Какое спряжение у исходного глагола?',opts:[['1','I спряжение'],['2','II спряжение']],good:String(s.conj),why:CONJ_RULES})}
 a.push({key:'letter',prompt:'Теперь вставь гласную.',good:s.letter,why:letterClue(s)});
 return a;
}

if(st.showHint){const msg=screen.querySelector('#stageMsg');if(msg)msg.textContent='Подсказка: '+stageClue(stage,s)} }
function answerStage(val){if(st.view!=='guide-step')return;const s=st.guideWords[st.gidx],stage=st.steps[st.step];const ok=canon(val)===canon(stage.good);const sv=st.guideStageStats[stage.key]||(st.guideStageStats[stage.key]=[0,0]);sv[0]++;if(!ok){sv[1]++;st.hadError=true;st.guideErrors[stage.key]=(st.guideErrors[stage.key]||0)+1;mem.stages[stage.key]=mem.stages[stage.key]||[0,0];mem.stages[stage.key][0]++;mem.stages[stage.key][1]++;persist();st.stageFeedback='Не совсем. '+stageClue(stage,s);st.showHint=false;const el=screen.querySelector('#stageMsg');if(el){el.className='note err';el.textContent=st.stageFeedback}return}
mem.stages[stage.key]=mem.stages[stage.key]||[0,0];mem.stages[stage.key][0]++;persist();st.stageFeedback='';st.showHint=false;st.hintUsedForStep=false;st.step++;if(st.step<st.steps.length){showGuide();return}
track(s,st.hadError);st.guideRecords.push({id:s.id,rule:s.rule,stem:s.stem,ctx:s.ctx,wrong:st.hadError,doublet:!!s.doublet});st.view='guide-feedback';setTop((st.gidx+1)+' / '+st.guideWords.length);screen.innerHTML=header(st.hadError?'Алгоритм разобран с подсказками':'Все шаги верны',s.mask.replace('..',s.letter.toUpperCase()))+'<div class="scroll"><div class="panel"><div class="kicker">'+e(ruleName(s))+(s.doublet?' · ДВОЙНИК':'')+'</div><p class="note">'+e(s.note)+'</p></div></div><button class="primary" data-action="guide-next">'+(st.gidx===st.guideWords.length-1?'Завершить разбор':'Следующее слово →')+'</button>'}

function reference(){st.view='ref';setTop('Справочник');const blocks=[['1. Сначала определи форму','Глагол настоящего / простого будущего → личное окончание. Причастие настоящего → спряжение исходного глагола. Причастие прошедшего → гласная инфинитива и тип суффикса. Не применяй алгоритм спряжения ко всем причастиям подряд.'],['2. «Целую, милая»','I спряжение: Е, У, Ю — пишем -ешь/-ет/-ем/-ете/-ут/-ют, -ущ-/-ющ- и -ем-. II спряжение: И, А, Я — -ишь/-ит/-им/-ите/-ат/-ят, -ащ-/-ящ- и -им-.'],['3. Как определить спряжение',CONJ_RULES+' Важно: если окончание стало ударным после удаления приставки вы-, сначала используем ударение.'],['4. Исключения II спряжения','Гнать, держать, дышать, слышать; смотреть, видеть, ненавидеть, обидеть, терпеть, зависеть, вертеть. Многие приставочные производные сохраняют спряжение исходного глагола.'],['5. Исключения I спряжения','Брить, стелить; отдельно запомни зиждиться и зыбиться. Формы «стелешь», «бреешь» относятся к I спряжению.'],['6. Суффиксы настоящего времени','Действительные: I → -ущ-/-ющ-, II → -ащ-/-ящ-. Страдательные: I → -ем-, II → -им-. «Брезжущий» (от «брезжить») — особый случай. «Движимый» и «приемлемый» связаны с историческими формами; их нужно запомнить.'],['7. Суффиксы прошедшего времени','Перед -вш-, -в- сохраняется буква инфинитива перед -ть: посеять → посеявший, увидеть → увидевший. Перед -нн-: после -ать/-ять обычно -анн-/-янн-, после -ить/-еть и ряда других основ — -енн-. Особые образования и двойники проверяй по значению и справочнику.'],['8. Повелительное или изъявительное','«Вынесите сейчас!» = просьба / приказ, в данной базе суффикс -и- + окончание/показатель мн. ч. -те. «Вы вынесете завтра» = будущее время, окончание зависит от спряжения. Нельзя решать только по внешнему сходству -ите/-ете.'],['9. Обес-/обез-','Если субъект сам лишился силы / способности — непереходный глагол на -еть, обычно I спряжение. Если сделал кого-то лишённым чего-либо — переходный глагол на -ить, II спряжение. Сравни обессилеть и обессилить.'],['10. Двойники','«Замешанный в деле» ← замешать; «замешенное тесто» ← замесить. «Пристрелянное ружьё» ← пристрелять; «пристреленный заяц» ← пристрелить. «Выкачанная вода» ← выкачать; «выкаченный велосипед» ← выкатить. Сначала смысл, затем инфинитив, затем буква.'],['11. Глаголы на -ять','Сеять, веять, лелеять, таять, чуять, лаять — запоминай написание инфинитива; обычно это I спряжение. Но «стоять» относится ко II спряжению: стоишь, стоят; не следует автоматически считать все формы на -ять первым спряжением.']];screen.innerHTML=header('Справочник № 12','Объяснения из предоставленной базы с выверенными правилами.')+'<div class="scroll">'+blocks.map(([t,d])=>'<section class="entry"><strong>'+e(t)+'</strong><p>'+e(d)+'</p></section>').join('')+'</div><button data-action="home" class="primary">В меню</button>'}
function memorize(){
 st.view='memoriz';setTop('Запомнить');
 const exceptions=['брить','стелить','зиждиться','зыбиться','гнать','дышать','держать','зависеть','видеть','слышать','обидеть','терпеть','вертеть','ненавидеть','смотреть'];
 const specialPattern=/брезж|движим|приемл|неотъемл|незыбл|зижд|зыбл|внемл|объемл|всеобъемл|мелющ|мелют|мелешь|алчущ|пышущ|мечущ|тешущ|подравн|уравнен|выравнен|выровнен|поколеблен/i;
 const exceptional=new Map(),unusual=new Map();
 const sorted=[...ALL].sort((a,b)=>difficulty(b)-difficulty(a));
 for(const s of sorted){
  const inf=canon(s.lemma).replace(/ся$/,'');
  const root=exceptions.find(x=>inf.endsWith(x.replace(/ся$/,'')));
  const special=specialPattern.exec(s.stem||'');
  if(special){const k=special[0].toLowerCase();if(!unusual.has(k))unusual.set(k,s)}
  if(root&&!exceptional.has(root))exceptional.set(root,s);
 }
 function entries(pairs,label){return '<div class="kicker">'+e(label)+'</div>'+pairs.map(([group,s])=>'<div class="entry"><strong>'+e(s.stem)+'</strong> <span class="tag">'+e(s.lemma||group)+'</span><p>'+e(s.note)+'</p><button class="mini" data-action="guide-one" data-id="'+s.id+'">Разобрать по алгоритму</button></div>').join('')}
 const groupsA=[...exceptional.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ru'));
 const groupsB=[...unusual.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ru'));
 screen.innerHTML=header('Особые слова для запоминания','Исключения и необычные исторические/словарные формы, без обычных слов по общему правилу.')+'<div class="scroll">'+entries(groupsA,'Исключения спряжения: по одному образцу')+entries(groupsB,'Нестандартные формы и основы')+'</div>';
}

// Централизованные учебные отчёты НЕ являются результатами ЕГЭ и не идут в Тексторию.
// В Telegram sendData доступен лишь после запуска из Reply Keyboard и обычно закрывает Mini App.
// Поэтому каждая завершённая тренировка сохраняется в очереди до явной отправки учеником.
const E12_DIAG_MODES={drill:'Тренировка правила',guide:'Алгоритм',doublet:'Двойники',errors:'Повторение ошибок'};
const E12_STAGE_NAMES={mood:'Наклонение глагола',moodSuffix:'Образование повелительного',vy:'Приставка вы-',vyStress:'Проверка ударения без вы-',obes:'Приставка обес-/обез-',obesAction:'Обес-/обез-: на себя или на другого',time:'Время причастия',inf:'Определение инфинитива',conj:'Определение спряжения',logic:'Правило выбора буквы',pastLogic:'Прошедшее время: способ образования',letter:'Вставка гласной'};
function e12Category(kind,id){return kind+':'+id}
function e12Scope(key){return GROUPS.find(x=>x[0]===key)?.[1]||(key==='errors'?'Мои ошибки':key||'Алгоритм')}
function e12NewReport(mode,topic){return {v:1,type:'skill_result',gameId:'ege12-celuyu-milaya',attemptId:'e12-'+uid(),mode,topic:topic||mode,ruleStats:{},ruleNames:{},ruleTypes:{}}}
function e12Put(d,key,name,tested,wrong,kind){if(!tested)return;const old=d.ruleStats[key];if(old){old[0]+=tested;old[1]+=wrong}else{d.ruleStats[key]=[tested,wrong];d.ruleNames[key]=name.slice(0,120);d.ruleTypes[key]=kind}}
function e12WordDetails(d,rec){
 if(rec.wrong){e12Put(d,'miss:'+rec.id,'Ошибочное слово: '+(rec.stem||rec.id)+' · '+String(rec.ctx||'').slice(0,34),1,1,'lexeme')}
 else if(rec.wasError){e12Put(d,'fixed:'+rec.id,'Исправленное слово: '+(rec.stem||rec.id),1,0,'recovery')}
}
function e12Archive(d){
 const names=Object.keys(d.ruleStats);if(!names.length)throw Error('Пустая диагностика');
 // Защита от слишком длинных Telegram-пакетов; никаких скрытых пропусков категорий.
 const length=new TextEncoder().encode(JSON.stringify(d)).length;
 if(length>4096)throw Error('Диагностика превышает 4096 байт: '+length+'. Сообщи преподавателю, отчёт сохранён на устройстве.');
 const item={at:now(),attemptId:d.attemptId,mode:d.mode,topic:d.topic,report:d,attemptedAt:null};
 mem.diagnostics.push(item);
 persist();return item;
}
function diagnosticFromDrill(){
 const mode=st.mode==='errors'?'errors':'drill';const d=e12NewReport(mode,st.drillGroup);
 for(const r of st.drillRecords){e12Put(d,'r:'+r.rule,R[r.rule]||r.rule,1,Number(r.wrong),'word');e12WordDetails(d,r);if(st.drillGroup==='doublet')e12Put(d,'r:doublet',R.doublet,1,Number(r.wrong),'word')}
 return e12Archive(d);
}
function diagnosticFromGuide(){
 const mode=st.guideGroup==='doublet'?'doublet':'guide';const d=e12NewReport(mode,st.guideGroup||'single');
 for(const r of st.guideRecords){e12Put(d,'r:'+r.rule,R[r.rule]||r.rule,1,Number(r.wrong),'word');if(r.doublet)e12Put(d,'r:doublet',R.doublet,1,Number(r.wrong),'word');e12WordDetails(d,r)}
 for(const [key,stats] of Object.entries(st.guideStageStats)){e12Put(d,'s:'+key,E12_STAGE_NAMES[key]||key,stats[0],stats[1],'stage')}
 for(const [key,count] of Object.entries(st.guideHints)){e12Put(d,'h:'+key,'Запрос подсказки: '+(E12_STAGE_NAMES[key]||key),count,count,'hint')}
 return e12Archive(d);
}
function diagnosticSubmitBlock(item){return '<div class="panel diagSubmit"><p class="note"><b>Для учительской диагностики:</b> '+e(E12_DIAG_MODES[item.mode]||item.mode)+' · '+e(e12Scope(item.topic))+'. Отправка отдельная от рейтинга ЕГЭ.</p><button type="button" class="primary" data-action="diag-send" data-attempt="'+e(item.attemptId)+'">📩 Передать результаты преподавателю</button><p class="note" id="sendStatus" role="status">Открой игру через бота, чтобы сохранить отчёт в общей таблице.</p></div>'}
function diagQueue(){st.view='diag-queue';setTop('Диагностика');const items=(mem.diagnostics||[]).slice().reverse();screen.innerHTML=header('Отчёты для преподавателя','Каждая завершённая тренировка — отдельно от рейтинга Текстории.')+'<div class="scroll">'+(items.length?items.map(x=>'<div class="entry"><strong>'+e(new Date(x.at).toLocaleString('ru-RU'))+' · '+e(E12_DIAG_MODES[x.mode]||x.mode)+'</strong><p>'+e(e12Scope(x.topic))+' · '+(x.attemptedAt?'Отправка была инициирована, но не подтверждена':'Ожидает отправки')+'</p><button class="primary mini" data-action="diag-send" data-attempt="'+e(x.attemptId)+'">'+(x.attemptedAt?'📩 Повторить отправку':'📩 Отправить отчёт')+'</button></div>').join(''):'<div class="panel note">Пока нет завершённых учебных подходов.</div>')+'</div><div class="toolbar"><button data-action="home" class="plain">Главное меню</button></div><p class="note" id="sendStatus" role="status"></p>'}
function sendDiagnostic(attemptId){const item=mem.diagnostics.find(x=>x.attemptId===attemptId);if(!item)return;send(item.report,item)}

function history(){st.view='history';setTop('Рейтинг');screen.innerHTML=header('История ЕГЭ № 12','Каждые пять полностью решённых заданий дают результат от 0 до 5.')+'<div class="scroll">'+(!mem.history.length?'<div class="panel note">Пока нет завершённых попыток.</div>':mem.history.slice().reverse().map((h,i)=>'<div class="entry"><strong>'+e(new Date(h.at).toLocaleString('ru-RU'))+' · '+h.score+'/5</strong><p>Ошибочных слов: '+h.wrong+'. '+(h.sent?'Отправка инициирована':'Не отправлялось')+'</p><button class="mini" data-action="history-send" data-attempt="'+e(h.attemptId)+'">Повторить отправку</button></div>').join(''))+'</div>'}
function send(p,h){const target=document.getElementById('sendStatus');const say=x=>{if(target)target.textContent=x;else alert(x)};if(!p){say('Для этой попытки нет готового отчёта.');return}if(!tg||!tg.platform||tg.platform==='unknown'||typeof tg.sendData!=='function'){say('Открой игру из кнопки тренажёра в личном чате Telegram-бота. Через обычную ссылку результат не отправляется.');return}if(tg.initDataUnsafe?.query_id){say('Этот вариант открытия Telegram не поддерживает sendData. Открой игру через кнопку бота.');return}const data=JSON.stringify(p);if(new TextEncoder().encode(data).length>4096){say('Отчёт длиннее лимита Telegram. Повтори попытку или свяжись с преподавателем.');return}try{tg.sendData(data);if(h){h.sent=true;h.attemptedAt=now();persist()}say('Отправка запрошена. Проверь фактическую запись в статистике бота — Telegram не подтверждает сохранение автоматически.')}catch(ex){say('Telegram не принял отправку: '+ex.message)}}
function action(key,el){switch(key){case 'home':home();break;case 'exam':startExam();break;case 'exam-check':checkExam();break;case 'exam-next':nextExam();break;case 'rules':rulesMenu();break;case 'guide-menu':rulesMenu(true);break;case 'start-drill':startDrill(el.dataset.group);break;case 'start-guide':startGuide(el.dataset.group);break;case 'errors':startErrors();break;case 'doublets':startGuide('doublet');break;case 'memoriz':memorize();break;case 'ref':reference();break;case 'history':history();break;case 'diag-queue':diagQueue();break;case 'diag-send':sendDiagnostic(el.dataset.attempt);break;case 'guide-one':startGuide(null,el.dataset.id);break;case 'drill-check':checkDrill();break;case 'drill-next':drillNext();break;case 'restart-drill':startDrill(st.drillGroup);break;case 'guide-next':nextGuide();break;case 'hint':guideHint();break;case 'send':send(st.payload,mem.history.at(-1));break;case 'history-send':{const h=mem.history.find(x=>x.attemptId===el.dataset.attempt);send(h?.payload,h);break}}}
document.addEventListener('click',event=>{if(event.target.id==='homeBtn'){home();return}const el=event.target.closest('[data-action],[data-slot],[data-letter],[data-choose]');if(!el)return;if('letter'in el.dataset){setLetter(el.dataset.letter);return}if('slot'in el.dataset){st.active=Number(el.dataset.slot);showExamValues();return}if('choose'in el.dataset){answerStage(el.dataset.choose);return}if('action'in el.dataset){action(el.dataset.action,el);return}});
document.addEventListener('submit',ev=>{if(ev.target.id==='infForm'){ev.preventDefault();const input=document.getElementById('infText');answerStage(input?.value||'')}});
document.addEventListener('keydown',ev=>{if(/input|textarea/i.test(ev.target.tagName))return;if(st.view==='exam'||st.view==='drill-word'||(st.view==='guide-step'&&st.steps[st.step]?.key==='letter')){const x=canon(ev.key);if(/^[аеиоуыэюя]$/.test(x)){setLetter(x);ev.preventDefault()}else if(ev.key==='Backspace'){setLetter('');ev.preventDefault()}}});
window.addEventListener('resize',()=>{if(st.view==='exam')fitExamScreen()});
try{tg?.onEvent?.('viewportChanged',()=>{if(st.view==='exam')fitExamScreen()})}catch(e){}
home();
</script>
</body></html>
