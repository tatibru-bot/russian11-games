<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f7fc">
<title>ЕГЭ № 8 — тренажёр</title>
<style>
:root{color-scheme:light;--ink:#24314a;--muted:#62728d;--line:#dce4f1;--blue:#5265c9;--soft:#edf2ff;--good:#147d59;--bad:#a63c44}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{height:100%;height:100dvh;overflow:hidden;margin:0;background:#f5f7fc;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button{font:inherit;cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid #b1bfff;outline-offset:2px}
button:disabled{opacity:.48;cursor:default}
[hidden]{display:none!important}
.app{height:100%;height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;gap:9px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(8px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0}
.title strong{font-size:17px}.title span{display:block;font-size:11px;color:var(--muted)}
.progress{flex-shrink:0;padding:7px 10px;border-radius:12px;background:var(--soft);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:9px;background:#dde4f7;overflow:hidden;flex-shrink:0}
.bar>div{height:100%;background:var(--blue);width:6.67%;transition:width .15s}
.play{min-height:0;display:grid;flex:1;grid-template-rows:minmax(88px,1fr) auto auto;gap:8px}
.question{min-height:0;background:white;border:1px solid var(--line);border-radius:16px;padding:11px 12px;display:flex;flex-direction:column;gap:5px;box-shadow:0 4px 18px #24314a0b}
.question .hint{font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:10px;color:var(--muted)}
.question .sentence{min-height:0;flex:1;overflow:hidden;font-size:clamp(14px,3.9vw,19px);line-height:1.43;letter-spacing:.01em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:9;line-clamp:9}
.question .expand{font-size:12px;color:var(--blue);background:transparent;border:0;align-self:flex-start;padding:2px 0;text-align:left;font-weight:700;min-height:24px}
.choicearea{min-height:0}
.choicearea .label{font-size:11px;color:var(--muted);font-weight:700;margin:0 0 6px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(50px,auto);gap:7px}
.choice{min-height:52px;border:1.5px solid #d2dced;background:#fff;color:var(--ink);padding:7px 9px;text-align:left;font-size:clamp(12.5px,3.4vw,15px);font-weight:700;line-height:1.22;display:flex;align-items:center;gap:7px;word-break:normal;hyphens:auto}
.choice .num{font-size:11px;color:var(--blue);background:var(--soft);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;flex-shrink:0}
.choice.selected{border:2px solid var(--blue);background:#eef1ff}
.choice.selected .num{color:white;background:var(--blue)}
.choice:last-child:nth-child(odd){grid-column:1/-1}
.controls{display:flex;gap:8px;min-height:47px}
.controls button{min-height:47px;padding:9px 13px;border:1px solid #d6deed;background:white;font-weight:750}
.controls .prev{flex:0 0 95px}
.controls .next{flex:1;background:var(--blue);color:white;border-color:var(--blue)}
.finish{display:flex;flex-direction:column;flex:1;min-height:0;gap:9px}
.score{background:white;border:1px solid var(--line);padding:13px 15px;border-radius:16px;flex-shrink:0}
.score h2{margin:3px 0 0;font-size:23px}.score p{margin:4px 0;color:var(--muted)}
.review{overflow:auto;min-height:0;flex:1;overscroll-behavior:contain}
.review details{background:white;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;line-height:1.43}
.review summary{cursor:pointer;font-weight:750;color:var(--bad)}
.review .rule{color:#4a5a74;font-size:13px}
.review p{margin:8px 0}
.finishbuttons{flex-shrink:0;display:flex;flex-direction:column;gap:6px;background:#f5f7fc}
.finishbuttons button{min-height:44px;border:1px solid var(--line);font-weight:750;padding:8px}
.finishbuttons .save{background:var(--blue);color:white;border-color:var(--blue)}
.notice{font-size:12px;line-height:1.3;color:var(--muted);margin:0;text-align:center}
.overlay{position:fixed;inset:0;z-index:20;background:#f5f7fc;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.overlay .fulltext{flex:1;min-height:0;overflow:auto;background:white;padding:15px;border:1px solid var(--line);border-radius:15px;font-size:18px;line-height:1.5;overscroll-behavior:contain}
.overlay button{min-height:47px;background:var(--blue);color:white;border:0}
@media(max-height:700px){.app{gap:6px;padding-top:calc(5px + env(safe-area-inset-top,0px));padding-bottom:calc(5px + env(safe-area-inset-bottom,0px))}.question{padding:8px 10px}.choices{gap:5px;grid-auto-rows:minmax(46px,auto)}.choice{min-height:46px;padding:6px 7px}.choicearea .label{margin-bottom:4px}.top .title strong{font-size:15px}.top .title span{font-size:10px}.progress{padding:5px 8px}.controls button{min-height:42px}.controls{min-height:42px}}
@media(max-height:590px){.question .sentence{-webkit-line-clamp:6;line-clamp:6;font-size:clamp(13px,3.6vw,16px)}.choices{grid-auto-rows:minmax(42px,auto)}.choice{min-height:42px;font-size:12.7px}.choice .num{width:19px;height:19px}.controls button{min-height:42px;padding:6px 10px}}
@media(min-width:650px){.app{padding-left:20px;padding-right:20px}.choices{grid-auto-rows:minmax(58px,auto)}.choice{min-height:58px}}
</style>

<script>
const CFG={"id":"TR8_01","part":1,"groups":["s","o","p","g","k"],"names":{"s":"Нарушение связи между подлежащим и сказуемым","o":"Ошибка в построении предложения с однородными членами","p":"Нарушение в построении предложения с причастным оборотом","g":"Неправильное построение предложения с деепричастным оборотом","k":"Неправильное употребление падежной формы управляемого слова"},"rules":{"s":"Сказуемое должно согласовываться с подлежащим в числе, а при необходимости — в роде. В оборотах «те, кто…» / «все, кто…» главная часть обычно требует множественного числа.","o":"Однородные члены должны иметь одинаковую синтаксическую роль и правильное общее управление; части двойных союзов «не только… но и», «как… так и», «не столько… сколько» располагаются перед сопоставляемыми членами.","p":"Причастие согласуется с определяемым словом в роде, числе и падеже; зависимые слова причастного оборота не должны разрывать его или отрывать от определяемого слова.","g":"Действие деепричастия и действие сказуемого должны относиться к одному действующему лицу. В безличном предложении допустим оборот при инфинитиве, если действие подразумеваемого лица ясно.","k":"Проверь вопрос и падеж после предлога или управляющего слова: «благодаря», «согласно», «вопреки» — дательный; «по окончании», «по приезде» в значении «после» — предложный."},"data":{"s":[{"source":"2.4","text":"Те, кто увлекается дизайном одежды, оценит новую коллекцию модельера.","wrong":"оценит","right":"оценят","corrected":"Те, кто увлекается дизайном одежды, оценят новую коллекцию модельера."},{"source":"4.1","text":"Те, кто не освоил никакого ремесла и ведёт праздную жизнь, поступает дурно.","wrong":"поступает","right":"поступают","corrected":"Те, кто не освоил никакого ремесла и ведёт праздную жизнь, поступают дурно."},{"source":"7.1","text":"Детвора с утра резвились во дворе, не обращая внимания на прохожих.","wrong":"Детвора с утра резвились","right":"Детвора с утра резвилась","corrected":"Детвора с утра резвилась во дворе, не обращая внимания на прохожих."},{"source":"8.2","text":"Сочи очень гостеприимны: сюда приезжают на отдых жители всех регионов России.","wrong":"Сочи очень гостеприимны","right":"Сочи очень гостеприимен","corrected":"Сочи очень гостеприимен: сюда приезжают на отдых жители всех регионов России."},{"source":"9.8","text":"Все, кто любит поэзию Н.А. Некрасова, знает о его трудном жизненном и творческом пути.","wrong":"знает","right":"знают","corrected":"Все, кто любит поэзию Н.А. Некрасова, знают о его трудном жизненном и творческом пути."},{"source":"10.9","text":"Те, кто любит поэзию М.Ю. Лермонтова, знает факты биографии поэта.","wrong":"знает","right":"знают","corrected":"Те, кто любит поэзию М.Ю. Лермонтова, знают факты биографии поэта."},{"source":"11.1","text":"Идея всеобщей изменчивости и движения – главные идеи теории Гераклита.","wrong":"Идея всеобщей изменчивости и движения – главные идеи","right":"Идея всеобщей изменчивости и движения – главная идея","corrected":"Идея всеобщей изменчивости и движения – главная идея теории Гераклита."},{"source":"12.2","text":"Те, кто следит за новинками литературы, читал широко обсуждаемые произведения известной писательницы.","wrong":"читал","right":"читали","corrected":"Те, кто следит за новинками литературы, читали широко обсуждаемые произведения известной писательницы."},{"source":"13.9","text":"Все, кто неравнодушен к искусству, приглашается на фестиваль, который пройдёт в ближайшее воскресенье.","wrong":"приглашается","right":"приглашаются","corrected":"Все, кто неравнодушен к искусству, приглашаются на фестиваль, который пройдёт в ближайшее воскресенье."},{"source":"14.1","text":"Стая лебедей летели в тёплые края.","wrong":"Стая лебедей летели","right":"Стая лебедей летела","corrected":"Стая лебедей летела в тёплые края."},{"source":"21.9","text":"За кинофильм «Молодая гвардия» все, кто играл подпольщиков, получил Сталинскую премию.","wrong":"получил","right":"получили","corrected":"За кинофильм «Молодая гвардия» все, кто играл подпольщиков, получили Сталинскую премию."},{"source":"25.7","text":"Те, кто бывал в Волгограде, видел монумент «Родина-мать зовёт!».","wrong":"видел","right":"видели","corrected":"Те, кто бывал в Волгограде, видели монумент «Родина-мать зовёт!»."},{"source":"34.4","text":"Официально считается, что Сочи было основано 21 апреля 1838 года как форт Александрия.","wrong":"Сочи было основано","right":"Сочи был основан","corrected":"Официально считается, что Сочи был основан 21 апреля 1838 года как форт Александрия."},{"source":"35.4","text":"МГУ отпраздновало свой юбилей.","wrong":"МГУ отпраздновало","right":"МГУ отпраздновал","corrected":"МГУ отпраздновал свой юбилей."},{"source":"38.1","text":"Те, кто умеет пользоваться компьютером, имеет доступ к широкому информационному полю.","wrong":"имеет","right":"имеют","corrected":"Те, кто умеет пользоваться компьютером, имеют доступ к широкому информационному полю."},{"source":"39.4","text":"Те, кто противопоставляет себя обществу, обречён на одиночество.","wrong":"обречён","right":"обречены","corrected":"Те, кто противопоставляет себя обществу, обречены на одиночество."},{"source":"40.4","text":"Все, кто видел работу гончара, поражался его удивительному искусству.","wrong":"поражался","right":"поражались","corrected":"Все, кто видел работу гончара, поражались его удивительному искусству."},{"source":"41.4","text":"Все, кто рано начинает учить иностранный язык, овладевает им в совершенстве.","wrong":"овладевает","right":"овладевают","corrected":"Все, кто рано начинает учить иностранный язык, овладевают им в совершенстве."},{"source":"42.4","text":"Некоторые из тех, кто бывал на западе Мещёрского края, видел среди сосновых лесов восемь Боровых озёр, к которым добраться можно только через лес по карте и компасу.","wrong":"видел","right":"видели","corrected":"Некоторые из тех, кто бывал на западе Мещёрского края, видели среди сосновых лесов восемь Боровых озёр, к которым добраться можно только через лес по карте и компасу."},{"source":"44.4","text":"Те, кто стремится быть всегда в центре общего внимания и нравиться всем, ведёт себя зачастую очень эгоистично.","wrong":"ведёт","right":"ведут","corrected":"Те, кто стремится быть всегда в центре общего внимания и нравиться всем, ведут себя зачастую очень эгоистично."},{"source":"45.1","text":"Много молодёжи пришли сегодня на вечер танцев, организованный группой местных активистов.","wrong":"Много молодёжи пришли","right":"Много молодёжи пришло","corrected":"Много молодёжи пришло сегодня на вечер танцев, организованный группой местных активистов."},{"source":"47.3","text":"Молодёжь наверняка видели экранизацию романа Б.Л. Пастернака «Доктор Живаго».","wrong":"Молодёжь наверняка видели","right":"Молодёжь наверняка видела","corrected":"Молодёжь наверняка видела экранизацию романа Б.Л. Пастернака «Доктор Живаго»."},{"source":"51.9","text":"Многие из тех, кто посетил выставку, принял участие в социологическом опросе.","wrong":"принял","right":"приняли","corrected":"Многие из тех, кто посетил выставку, приняли участие в социологическом опросе."},{"source":"54.1","text":"Те, кто хотя бы раз разговаривал с графом Н.П. Румянцевым, был восхищён его неподражаемым остроумием.","wrong":"был восхищён","right":"были восхищены","corrected":"Те, кто хотя бы раз разговаривал с графом Н.П. Румянцевым, были восхищены его неподражаемым остроумием."},{"source":"60.3","text":"Все, кто интересуется историей старинных орденов и медалей, обращает на них внимание при рассмотрении портретов выдающихся деятелей прошлого.","wrong":"обращает","right":"обращают","corrected":"Все, кто интересуется историей старинных орденов и медалей, обращают на них внимание при рассмотрении портретов выдающихся деятелей прошлого."},{"source":"62.4","text":"Все, кто на экзамене показал отличные знания, награждён поездкой в Санкт-Петербург.","wrong":"награждён","right":"награждены","corrected":"Все, кто на экзамене показал отличные знания, награждены поездкой в Санкт-Петербург."},{"source":"63.3","text":"В марте те, кто достиг 18 лет, участвовал в выборах Президента Российской Федерации.","wrong":"участвовал","right":"участвовали","corrected":"В марте те, кто достиг 18 лет, участвовали в выборах Президента Российской Федерации."},{"source":"64.3","text":"Все, кто бывал в небольших городах Италии, видел каменные мосты, заросшие плющом, обветшалые старинные мраморные фасады зданий.","wrong":"видел","right":"видели","corrected":"Все, кто бывал в небольших городах Италии, видели каменные мосты, заросшие плющом, обветшалые старинные мраморные фасады зданий."},{"source":"27.2","text":"Все, кто побывал в Крыму, увёз с собой после расставания с ним яркие впечатления о море, горах, южных травах и цветах.","wrong":"увёз","right":"увезли","corrected":"Все, кто побывал в Крыму, увезли с собой после расставания с ним яркие впечатления о море, горах, южных травах и цветах."},{"source":"30.3","text":"Те, кто смотрит сериалы, наверняка видел экранизацию романа Бориса Пастернака «Доктор Живаго».","wrong":"видел","right":"видели","corrected":"Те, кто смотрит сериалы, наверняка видели экранизацию романа Бориса Пастернака «Доктор Живаго»."},{"source":"58.4","text":"Те, кто мечтает стать моряком, скорее всего, читал романы Ж. Верна и Р.Л. Стивенсона, книги И.А. Гончарова и К.М. Станюковича.","wrong":"читал","right":"читали","corrected":"Те, кто мечтает стать моряком, скорее всего, читали романы Ж. Верна и Р.Л. Стивенсона, книги И.А. Гончарова и К.М. Станюковича."}],"o":[{"source":"1.2","text":"На осенней выставке-ярмарке не только были представлены различные сорта арбузов и дынь, но и тыкв.","wrong":"не только были представлены различные сорта арбузов и дынь, но и тыкв","right":"были представлены не только различные сорта арбузов и дынь, но и тыкв","corrected":"На осенней выставке-ярмарке были представлены не только различные сорта арбузов и дынь, но и тыкв."},{"source":"2.1","text":"В жизни каждого человека как бывают успехи, так и неудачи.","wrong":"как бывают успехи, так и неудачи","right":"бывают как успехи, так и неудачи","corrected":"В жизни каждого человека бывают как успехи, так и неудачи."},{"source":"3.4","text":"Русские поэты XIX и XX веков знали и пользовались народной символикой в своих произведениях.","wrong":"знали и пользовались народной символикой","right":"знали народную символику и пользовались ею","corrected":"Русские поэты XIX и XX веков знали народную символику и пользовались ею в своих произведениях."},{"source":"6.1","text":"На общем собрании группы студенты не только обсуждали вопросы дисциплины, но и возможность досрочно сдать зачёты.","wrong":"не только обсуждали вопросы дисциплины, но и возможность досрочно сдать зачёты","right":"обсуждали не только вопросы дисциплины, но и возможность досрочно сдать зачёты","corrected":"На общем собрании группы студенты обсуждали не только вопросы дисциплины, но и возможность досрочно сдать зачёты."},{"source":"7.9","text":"Некоторые виды бамбука выращивают не столько ради практических целей, но и для красоты.","wrong":"не столько ради практических целей, но и для красоты","right":"не столько ради практических целей, сколько для красоты","corrected":"Некоторые виды бамбука выращивают не столько ради практических целей, сколько для красоты."},{"source":"8.1","text":"Автор статьи исследует и рассуждает о причинах неудачного выступления гимнастов на чемпионате города.","wrong":"исследует и рассуждает о причинах","right":"исследует причины и рассуждает о них","corrected":"Автор статьи исследует причины и рассуждает о них неудачного выступления гимнастов на чемпионате города."},{"source":"9.7","text":"Ребята не только посещали музеи, парки, усадьбы, а также организовали школьный музей боевой славы.","wrong":"не только посещали музеи, парки, усадьбы, а также организовали","right":"не только посещали музеи, парки, усадьбы, но и организовали","corrected":"Ребята не только посещали музеи, парки, усадьбы, но и организовали школьный музей боевой славы."},{"source":"11.4","text":"Многие россияне одобряют не только проведение акции «Георгиевская ленточка», но и активно принимают в ней участие.","wrong":"одобряют не только проведение акции «Георгиевская ленточка», но и активно принимают в ней участие","right":"не только одобряют проведение акции «Георгиевская ленточка», но и активно принимают в ней участие","corrected":"Многие россияне не только одобряют проведение акции «Георгиевская ленточка», но и активно принимают в ней участие."},{"source":"12.3","text":"В исследованиях автор опирался на данные как толковых словарей, так и на материалы летописей.","wrong":"на данные как толковых словарей, так и на материалы летописей","right":"как на данные толковых словарей, так и на материалы летописей","corrected":"В исследованиях автор опирался как на данные толковых словарей, так и на материалы летописей."},{"source":"13.8","text":"Нас поразили не только низкие цены на научные книги, но и на художественную литературу.","wrong":"не только низкие цены на научные книги, но и на художественную литературу","right":"низкие цены не только на научные книги, но и на художественную литературу","corrected":"Нас поразили низкие цены не только на научные книги, но и на художественную литературу."},{"source":"14.4","text":"Из листового металла не только делают корпуса машин и приборов, но и посуду.","wrong":"не только делают корпуса машин и приборов, но и посуду","right":"делают не только корпуса машин и приборов, но и посуду","corrected":"Из листового металла делают не только корпуса машин и приборов, но и посуду."},{"source":"16.2","text":"Международная общественность понимает и озабочена проблемами экономики развивающихся стран.","wrong":"понимает и озабочена проблемами","right":"понимает проблемы и озабочена ими","corrected":"Международная общественность понимает проблемы и озабочена ими экономики развивающихся стран."},{"source":"19.1","text":"Праздник не только пришёл из языческой культуры, а также сохранился после принятия христианства.","wrong":"не только пришёл из языческой культуры, а также сохранился","right":"не только пришёл из языческой культуры, но и сохранился","corrected":"Праздник не только пришёл из языческой культуры, но и сохранился после принятия христианства."},{"source":"20.3","text":"В дальнейших исследованиях автор как опирался на данные исторических произведений, так и на материалы летописей.","wrong":"как опирался на данные исторических произведений, так и на материалы летописей","right":"опирался как на данные исторических произведений, так и на материалы летописей","corrected":"В дальнейших исследованиях автор опирался как на данные исторических произведений, так и на материалы летописей."},{"source":"21.2","text":"Два поколения расходились не столько потому, что одни были «отцами», а другие – «детьми», но и потому, что были представителями различных социальных сословий.","wrong":"не столько потому, что одни были «отцами», а другие – «детьми», но и потому","right":"не столько потому, что одни были «отцами», а другие – «детьми», сколько потому","corrected":"Два поколения расходились не столько потому, что одни были «отцами», а другие – «детьми», сколько потому, что были представителями различных социальных сословий."},{"source":"25.2","text":"Любимой забавой было взятие снежной крепости или кататься на санях с ледяной горки.","wrong":"взятие снежной крепости или кататься","right":"взятие снежной крепости или катание","corrected":"Любимой забавой было взятие снежной крепости или катание на санях с ледяной горки."},{"source":"27.1","text":"В эмиграции М.И. Цветаева часто вспоминала и восхищалась поэзией Б.Л. Пастернака.","wrong":"вспоминала и восхищалась поэзией","right":"вспоминала поэзию и восхищалась ею","corrected":"В эмиграции М.И. Цветаева часто вспоминала поэзию и восхищалась ею Б.Л. Пастернака."},{"source":"31.1","text":"В лицее обучали точным наукам и говорить на английском языке.","wrong":"обучали точным наукам и говорить на английском языке","right":"обучали точным наукам и английскому языку","corrected":"В лицее обучали точным наукам и английскому языку."},{"source":"32.4","text":"Юный А.П. Чехов должен был не только содержать себя самого и оплачивать своё учение в гимназии, а также помогать семье, бедствовавшей в Москве.","wrong":"не только содержать себя самого и оплачивать своё учение в гимназии, а также помогать","right":"не только содержать себя самого и оплачивать своё учение в гимназии, но и помогать","corrected":"Юный А.П. Чехов должен был не только содержать себя самого и оплачивать своё учение в гимназии, но и помогать семье, бедствовавшей в Москве."},{"source":"33.1","text":"Свыше шести тысячелетий янтарь служит человеку, который научился не только использовать его красоту, но и другие свойства.","wrong":"не только использовать его красоту, но и другие свойства","right":"использовать не только его красоту, но и другие свойства","corrected":"Свыше шести тысячелетий янтарь служит человеку, который научился использовать не только его красоту, но и другие свойства."},{"source":"34.3","text":"Сидящие на трибунах зрители дружно поддерживали и болели за свои команды.","wrong":"поддерживали и болели за свои команды","right":"поддерживали свои команды и болели за них","corrected":"Сидящие на трибунах зрители дружно поддерживали свои команды и болели за них."},{"source":"36.3","text":"Дети любят и заботятся о своих домашних питомцах.","wrong":"любят и заботятся о своих домашних питомцах","right":"любят своих домашних питомцев и заботятся о них","corrected":"Дети любят своих домашних питомцев и заботятся о них."},{"source":"38.3","text":"Это была не столько разведка боем, а настоящая битва.","wrong":"не столько разведка боем, а настоящая битва","right":"не столько разведка боем, сколько настоящая битва","corrected":"Это была не столько разведка боем, сколько настоящая битва."},{"source":"39.5","text":"Причастия способны не только образно описать предмет или явление, а также представить его признак в динамике.","wrong":"не только образно описать предмет или явление, а также представить","right":"не только образно описать предмет или явление, но и представить","corrected":"Причастия способны не только образно описать предмет или явление, но и представить его признак в динамике."},{"source":"40.3","text":"А.С. Пушкин был первым среди тех, кто не только признавал, а также поощрял литературное дарование Н.В. Гоголя.","wrong":"не только признавал, а также поощрял","right":"не только признавал, но и поощрял","corrected":"А.С. Пушкин был первым среди тех, кто не только признавал, но и поощрял литературное дарование Н.В. Гоголя."},{"source":"41.3","text":"Не столько талантом, но и трудолюбием обеспечивается достижение успеха в работе.","wrong":"Не столько талантом, но и трудолюбием","right":"Не столько талантом, сколько трудолюбием","corrected":"Не столько талантом, сколько трудолюбием обеспечивается достижение успеха в работе."},{"source":"52.9","text":"А.С. Пушкин не отказался и остался верным декабристским идеалам.","wrong":"не отказался и остался верным декабристским идеалам","right":"не отказался от декабристских идеалов и остался им верен","corrected":"А.С. Пушкин не отказался от декабристских идеалов и остался им верен."},{"source":"57.3","text":"Сегодня люди воспринимают и думают о жизни иначе, чем прежде.","wrong":"воспринимают и думают о жизни","right":"воспринимают жизнь и думают о ней","corrected":"Сегодня люди воспринимают жизнь и думают о ней иначе, чем прежде."},{"source":"59.6","text":"Каждое утро поэт спускался к морю, чтобы жадно вдыхать и наслаждаться морским воздухом.","wrong":"вдыхать и наслаждаться морским воздухом","right":"вдыхать морской воздух и наслаждаться им","corrected":"Каждое утро поэт спускался к морю, чтобы жадно вдыхать морской воздух и наслаждаться им."},{"source":"56.3","text":"Речь оратора, сердце которого переполняет чувство восхищения учителем, взволнованная и проникновенна.","wrong":"взволнованная и проникновенна","right":"взволнованна и проникновенна","corrected":"Речь оратора, сердце которого переполняет чувство восхищения учителем, взволнованна и проникновенна."},{"source":"58.1","text":"Задолго до рассвета хозяйка не только затопила печь, а также испекла хлеб.","wrong":"не только затопила печь, а также испекла","right":"не только затопила печь, но и испекла","corrected":"Задолго до рассвета хозяйка не только затопила печь, но и испекла хлеб."}],"p":[{"source":"1.9","text":"Туристы увидели разожжённый костёр кем-то на другом берегу реки.","wrong":"разожжённый костёр кем-то","right":"разожжённый кем-то костёр","corrected":"Туристы увидели разожжённый кем-то костёр на другом берегу реки."},{"source":"3.1","text":"Чацкий бросил вызов обществу дворян-крепостников, ни во что не ставящим достоинство человека.","wrong":"не ставящим","right":"не ставящих","corrected":"Чацкий бросил вызов обществу дворян-крепостников, ни во что не ставящих достоинство человека."},{"source":"4.3","text":"Правильно распорядиться возможностями памяти – вот стоящая задача перед каждым человеком.","wrong":"стоящая задача перед каждым человеком","right":"задача, стоящая перед каждым человеком","corrected":"Правильно распорядиться возможностями памяти – вот задача, стоящая перед каждым человеком."},{"source":"5.8","text":"Нефтяные загрязнения являются угрозой всему живому в Мировом океане, возникающие при транспортировке нефти.","wrong":"Нефтяные загрязнения являются угрозой всему живому в Мировом океане, возникающие при транспортировке нефти","right":"Нефтяные загрязнения, возникающие при транспортировке нефти, являются угрозой всему живому в Мировом океане","corrected":"Нефтяные загрязнения, возникающие при транспортировке нефти, являются угрозой всему живому в Мировом океане."},{"source":"7.5","text":"Люди запасали топливо на зиму, погружённых в свои повседневные заботы.","wrong":"погружённых","right":"погружённые","corrected":"Люди запасали топливо на зиму, погружённые в свои повседневные заботы."},{"source":"8.4","text":"Расположенный рынок в центре города нуждался в реконструкции.","wrong":"Расположенный рынок в центре города","right":"Рынок, расположенный в центре города,","corrected":"Рынок, расположенный в центре города, нуждался в реконструкции."},{"source":"9.9","text":"Не приученные люди к физическому труду не смогут стать фермерами.","wrong":"Не приученные люди к физическому труду","right":"Не приученные к физическому труду люди","corrected":"Не приученные к физическому труду люди не смогут стать фермерами."},{"source":"10.1","text":"Экология является одной из молодых наук, занимающаяся охраной и восстановлением окружающей природы.","wrong":"занимающаяся","right":"занимающихся","corrected":"Экология является одной из молодых наук, занимающихся охраной и восстановлением окружающей природы."},{"source":"13.6","text":"Представим, что мы путешественники, которые получают много важной информации, помогающую ориентироваться в неизвестной местности.","wrong":"помогающую","right":"помогающей","corrected":"Представим, что мы путешественники, которые получают много важной информации, помогающей ориентироваться в неизвестной местности."},{"source":"14.6","text":"Наиболее древней является письменность шумеров, жившие в Междуречье, в Средней Азии.","wrong":"жившие","right":"живших","corrected":"Наиболее древней является письменность шумеров, живших в Междуречье, в Средней Азии."},{"source":"16.3","text":"Те, кто смотрит сериалы, наверняка знают об экранизации романа Б.Л. Пастернака «Доктор Живаго», впервые опубликованный за рубежом.","wrong":"опубликованный","right":"опубликованного","corrected":"Те, кто смотрит сериалы, наверняка знают об экранизации романа Б.Л. Пастернака «Доктор Живаго», впервые опубликованного за рубежом."},{"source":"18.4","text":"И в наши дни чеховские пьесы во многом остаются сложными для постановки, требовавшие когда-то реформы всей театральной системы.","wrong":"требовавшие когда-то реформы всей театральной системы","right":"хотя когда-то требовали реформы всей театральной системы","corrected":"И в наши дни чеховские пьесы во многом остаются сложными для постановки, хотя когда-то требовали реформы всей театральной системы."},{"source":"22.4","text":"В поросшем овраге густым орешником Травкин сделал привал.","wrong":"В поросшем овраге густым орешником","right":"В овраге, поросшем густым орешником,","corrected":"В овраге, поросшем густым орешником, Травкин сделал привал."},{"source":"25.3","text":"Известны исторические факты о найденных детях в зверином логове.","wrong":"о найденных детях в зверином логове","right":"о детях, найденных в зверином логове","corrected":"Известны исторические факты о детях, найденных в зверином логове."},{"source":"27.5","text":"В 1885 году В.Д. Поленов экспонировал на передвижной выставке девяносто семь этюдов, привезённым из поездки на Восток.","wrong":"привезённым","right":"привезённых","corrected":"В 1885 году В.Д. Поленов экспонировал на передвижной выставке девяносто семь этюдов, привезённых из поездки на Восток."},{"source":"28.4","text":"В поросшей ложбине густым орешником, невдалеке от озера, Травкин сделал привал.","wrong":"В поросшей ложбине густым орешником","right":"В ложбине, поросшей густым орешником,","corrected":"В ложбине, поросшей густым орешником,, невдалеке от озера, Травкин сделал привал."},{"source":"29.5","text":"Наверное, вы знакомы с термином «омографы», обозначающему слова, которые имеют одинаковый графический облик, но различаются значением и произношением.","wrong":"обозначающему","right":"обозначающим","corrected":"Наверное, вы знакомы с термином «омографы», обозначающим слова, которые имеют одинаковый графический облик, но различаются значением и произношением."},{"source":"30.4","text":"По мере развития киноискусства росло понимание сложности задач, стоящими перед интерпретаторами литературы.","wrong":"стоящими","right":"стоящих","corrected":"По мере развития киноискусства росло понимание сложности задач, стоящих перед интерпретаторами литературы."},{"source":"31.4","text":"На днях открывается рассказывающая выставка о людях-героях.","wrong":"рассказывающая выставка о людях-героях","right":"выставка, рассказывающая о людях-героях","corrected":"На днях открывается выставка, рассказывающая о людях-героях."},{"source":"34.9","text":"Все отправленные документы абитуриентом по почте должны поступить в вуз не позднее указанного срока.","wrong":"отправленные документы абитуриентом по почте","right":"отправленные абитуриентом по почте документы","corrected":"Все отправленные абитуриентом по почте документы должны поступить в вуз не позднее указанного срока."},{"source":"37.4","text":"У зачитывавшихся людей в детстве русскими сказками, былинами дух захватывало от богатырских подвигов.","wrong":"У зачитывавшихся людей в детстве русскими сказками, былинами","right":"У людей, зачитывавшихся в детстве русскими сказками, былинами,","corrected":"У людей, зачитывавшихся в детстве русскими сказками, былинами, дух захватывало от богатырских подвигов."},{"source":"38.7","text":"Ярким цветком, медленно расцветавший в душе А.А. Блока, было не только ощущение России как Родины, но и полное духовное слияние с ней.","wrong":"расцветавший","right":"расцветавшим","corrected":"Ярким цветком, медленно расцветавшим в душе А.А. Блока, было не только ощущение России как Родины, но и полное духовное слияние с ней."},{"source":"39.3","text":"Растрёпанные белые цветы напоминали хлопья пуха, прилипшим к стебелькам.","wrong":"прилипшим","right":"прилипшие","corrected":"Растрёпанные белые цветы напоминали хлопья пуха, прилипшие к стебелькам."},{"source":"40.5","text":"На мелководных участках растительность образует перемычки, разделяющими озеро на отдельные плёсы.","wrong":"разделяющими","right":"разделяющие","corrected":"На мелководных участках растительность образует перемычки, разделяющие озеро на отдельные плёсы."},{"source":"41.2","text":"Среди домов, построенными на этой улице, было несколько многоэтажных.","wrong":"построенными","right":"построенных","corrected":"Среди домов, построенных на этой улице, было несколько многоэтажных."},{"source":"44.9","text":"Во второй половине XX века появилась новая форма внешних миграций, получившие наименование «утечка умов».","wrong":"получившие","right":"получившая","corrected":"Во второй половине XX века появилась новая форма внешних миграций, получившая наименование «утечка умов»."},{"source":"45.2","text":"Монастырь стоял вдоль реки, на довольно высоком её берегу, заросшей густым кустарником.","wrong":"заросшей","right":"заросшем","corrected":"Монастырь стоял вдоль реки, на довольно высоком её берегу, заросшем густым кустарником."},{"source":"51.7","text":"С молодых лет Мясоедов входил в круг художников, боровшимся с рутиной академизма.","wrong":"боровшимся","right":"боровшихся","corrected":"С молодых лет Мясоедов входил в круг художников, боровшихся с рутиной академизма."},{"source":"52.3","text":"Пожелтевшие листья от осенних холодов мы находили в карманах своих плащей, в кепках – всюду.","wrong":"Пожелтевшие листья от осенних холодов","right":"Пожелтевшие от осенних холодов листья","corrected":"Пожелтевшие от осенних холодов листья мы находили в карманах своих плащей, в кепках – всюду."},{"source":"58.5","text":"Многие картины будоражили воображение зрителей, привыкшие к миру спокойных пейзажей и портретов.","wrong":"привыкшие","right":"привыкших","corrected":"Многие картины будоражили воображение зрителей, привыкших к миру спокойных пейзажей и портретов."},{"source":"59.1","text":"В «Юбилейном», относимых к позднему творчеству В.В. Маяковского, представлен глубокий динамичный монолог лирического героя.","wrong":"относимых","right":"относимом","corrected":"В «Юбилейном», относимом к позднему творчеству В.В. Маяковского, представлен глубокий динамичный монолог лирического героя."},{"source":"60.8","text":"Одна из памяток учебника, расположенные в конце книги, содержит информацию об особенностях структуры научной рецензии.","wrong":"расположенные","right":"расположенных","corrected":"Одна из памяток учебника, расположенных в конце книги, содержит информацию об особенностях структуры научной рецензии."},{"source":"62.8","text":"О русском солдате Андрее Соколове, испытавшему горечь утрат, но откликнувшемся на чужую беду, мы узнаём из рассказа М.А. Шолохова «Судьба человека».","wrong":"испытавшему","right":"испытавшем","corrected":"О русском солдате Андрее Соколове, испытавшем горечь утрат, но откликнувшемся на чужую беду, мы узнаём из рассказа М.А. Шолохова «Судьба человека»."},{"source":"63.2","text":"Каждый сотрудник должен следить за состоянием закреплённого компьютера за ним.","wrong":"закреплённого компьютера за ним","right":"закреплённого за ним компьютера","corrected":"Каждый сотрудник должен следить за состоянием закреплённого за ним компьютера."},{"source":"56.2","text":"В эпоху Екатерины II в Кремле было воздвигнуто одно из величественнейших и значительнейших с исторической точки зрения зданий, долго называемым Сенатом.","wrong":"называемым","right":"называвшееся","corrected":"В эпоху Екатерины II в Кремле было воздвигнуто одно из величественнейших и значительнейших с исторической точки зрения зданий, долго называвшееся Сенатом."}],"g":[{"source":"1.5","text":"Работая с ртутью и её соединениями, должны соблюдаться определённые правила.","wrong":"Работая с ртутью и её соединениями, должны соблюдаться определённые правила","right":"Работая с ртутью и её соединениями, необходимо соблюдать определённые правила","corrected":"Работая с ртутью и её соединениями, необходимо соблюдать определённые правила."},{"source":"2.2","text":"Осмотрев аппарат, стала ясна причина неполадок.","wrong":"Осмотрев аппарат, стала ясна причина неполадок","right":"Осмотрев аппарат, специалисты поняли причину неполадок","corrected":"Осмотрев аппарат, специалисты поняли причину неполадок."},{"source":"3.6","text":"Лентой извиваясь среди полей и лугов, длина реки составляла сотни километров.","wrong":"Лентой извиваясь среди полей и лугов, длина реки составляла сотни километров","right":"Ре ные обезьянам звуки и даже записали их на диктофон.","wrong":"нехарактерные обезьянам","right":"нехарактерные для обезьян","corrected":"В зоопарке мы услышали нехарактерные для обезьян звуки и даже записали их на диктофон."}]},"short":{"s":"Подлежащее и сказуемое","o":"Однородные члены","p":"Причастный оборот","g":"Деепричастный оборот","k":"Управление и падеж"}};
(function(){
"use strict";
const tg=(window.Telegram&&window.Telegram.WebApp)||null;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const el=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=x=>String(x).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const key="russian11:ege8:round-v2:"+CFG.id+":"+String(tg?.initDataUnsafe?.user?.id||"browser");
function readMemory(){try{const x=JSON.parse(localStorage.getItem(key)||"{}");return x&&typeof x==="object"?x:{}}catch(e){return {}}}
function saveMemory(m){try{localStorage.setItem(key,JSON.stringify(m))}catch(e){}}
function pick(){
 const current=readMemory(),remaining={},selected=[];
 CFG.groups.forEach(k=>{
  const bank=CFG.data[k],all=Array.from({length:bank.length},(_,i)=>i);
  const old=Array.isArray(current[k])?current[k].filter(x=>Number.isInteger(x)&&x>=0&&x<bank.length):[];
  let queue=old.length?old.slice():shuffle(all);
  const chosen=[];
  while(chosen.length<3){
   if(!queue.length)queue=shuffle(all.filter(i=>!chosen.includes(i)));
   const id=queue.shift();
   if(!chosen.includes(id))chosen.push(id);
  }
  remaining[k]=queue;
  chosen.forEach(i=>selected.push({...bank[i],kind:k,id:k+"-"+i}));
 });
 return {cards:shuffle(selected),remaining};
}
let cards=[],answers=[],pos=0,proposed={},attemptId="",finished=false;
function newGame(){
 const picked=pick();cards=picked.cards;proposed=picked.remaining;pos=0;answers=Array(15).fill(null);
 attemptId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():"ege8_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2);
 finished=false;el("finish").hidden=true;el("play").hidden=false;el("save").disabled=false;
 el("saveStatus").textContent="Результат отправится боту после нажатия кнопки.";
 render();
}
function render(){
 const card=cards[pos],answer=answers[pos];
 el("progress").textContent=(pos+1)+" / 15";
 el("bar").style.width=((pos+1)/15*100).toFixed(1)+"%";
 el("sentence").textContent=card.text;
 el("expand").hidden=false;
 const buttons=CFG.groups.map((k,i)=>'<button type="button" class="choice'+(answer===k?' selected':'')+'" data-kind="'+k+'" aria-pressed="'+(answer===k)+'" title="'+esc(CFG.names[k])+'"><span class="num">'+(i+1)+'</span><span>'+esc(CFG.short[k])+'</span></button>').join("");
 el("choices").innerHTML=buttons;
 el("choices").querySelectorAll("button").forEach(btn=>btn.addEventListener("click",()=>{answers[pos]=btn.dataset.kind;render()}));
 el("prev").disabled=pos===0;
 const next=el("next");
 next.disabled=!answer;
 next.textContent=pos===14?"Проверить раунд ✓":"Далее →";
}
function showFinish(){
 if(finished)return;
 finished=true;
 // Отмечаем просмотренные предложения только после полного прохождения раунда.
 saveMemory(proposed);
 const wrong=cards.map((c,i)=>({card:c,answer:answers[i],i})).filter(x=>x.card.kind!==x.answer);
 const correct=15-wrong.length;
 el("scoreTitle").textContent=correct+" из 15 · "+Math.round(100*correct/15)+"%";
 el("scoreSub").textContent=wrong.length?("Ошибок: "+wrong.length+". Ниже — разбор по правилам."):"Все типы ошибок определены верно!";
 const review=el("review");
 review.innerHTML=wrong.length?wrong.map(x=>'<details><summary>Предложение '+(x.i+1)+' · '+esc(CFG.names[x.card.kind])+'</summary><p>'+esc(x.card.text)+'</p><p>Твой ответ: <b>'+esc(CFG.names[x.answer])+'</b></p><p>Правильный ответ: <b>'+esc(CFG.names[x.card.kind])+'</b></p><p>Исправление: '+esc(x.card.corrected)+'</p><p class="rule">'+esc(CFG.rules[x.card.kind])+'</p></details>').join(""):'<div class="score"><b>Отлично!</b> Можно сохранить результат и открыть новый раунд.</div>';
 el("play").hidden=true;el("finish").hidden=false;
 el("save").onclick=()=>{
  const errors={};wrong.forEach(x=>{const name=CFG.names[x.card.kind];errors[name]=(errors[name]||0)+1});
  // Передаём не только ошибки, но и реально проверенные правила.
  // Иначе бот не сможет отличить идеальный ответ от правила, которого не было в раунде.
  const tested={};
  cards.forEach(c=>{
   const name=CFG.names[c.kind];
   tested[name]=(tested[name]||0)+1;
  });
  const data={v:1,type:"game_result",gameId:CFG.id,attemptId,correct,total:15,errors,tested};
  if(!tg||!tg.platform||tg.platform==="unknown"||typeof tg.sendData!=="function"){
   el("saveStatus").textContent="Для записи результата открой игру кнопкой «🎮 Тренажёры» внутри Telegram.";
   return;
  }
  try{
   el("save").disabled=true;
   tg.sendData(JSON.stringify(data));
   el("saveStatus").textContent="Результат отправлен боту.";
  }catch(err){
   el("save").disabled=false;
   el("saveStatus").textContent="Ошибка отправки: "+String(err.message||err);
  }
 };
}
el("prev").onclick=()=>{if(pos>0){pos--;render()}};
el("next").onclick=()=>{if(!answers[pos])return;if(pos<14){pos++;render()}else showFinish()};
el("again").onclick=()=>{newGame()};
el("expand").onclick=()=>{el("fulltext").textContent=cards[pos].text;el("overlay").hidden=false};
el("closeOverlay").onclick=()=>{el("overlay").hidden=true};
el("gameTitle").textContent="ЕГЭ № 8 · часть "+CFG.part;
newGame();
})();
</script>
