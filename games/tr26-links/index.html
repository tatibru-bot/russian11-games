<body>
<div id="app">
<header><div class="brand"><span class="emblem" aria-hidden="true">↔</span><div class="brandtext"><div class="eyebrow">ЕГЭ · Задание 26</div><div class="brandtitle">Нити текста</div></div></div><button id="referenceTop" class="top-btn" type="button">📚 Справочник</button></header>
<main id="main" aria-live="polite"></main>
<footer><span id="footerText">11 «К» · средства связи предложений</span><button type="button" id="homeTop">В меню</button></footer>
</div>
<div class="modalback hidden" id="modalBack" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Разбор</h2><button class="btn" type="button" id="modalClose">Закрыть</button></div><div id="modalBody" class="modalbody"></div></div></div>
<script>
(function(){
"use strict";
const TASKS=Array.isArray(window.TR26_TASKS)?window.TR26_TASKS:[];
const byId=new Map(TASKS.map(function(t){return [t.id,t];}));
const main=document.getElementById("main");
const tg=window.Telegram && window.Telegram.WebApp;
try{if(tg){tg.ready();tg.expand();}}catch(e){}
const user=tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : "browser";
const localKey="russian11:tr26:progress:v2:"+user,cloudKey="r11_tr26_progress_v2";
const legacyLocalKey="russian11:tr26:progress:v1:"+user,legacyCloudKey="r11_tr26_progress_v1";
const resetKeys=new Set(TASKS.filter(function(t){return t.id.startsWith("S");}).map(function(t){return t.id;}).concat(["R50341","R1899","R4115","R4544","R341","R455","R113"]));
const store=(function(){try{return window.localStorage;}catch(e){return null;}})();
let status={},scene="menu",returnScene="menu",session=null,cloudBusy=false,cloudDirty=false,changedHere=false,notice="";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(x){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x];});}
function btn(id,label,cl){return '<button type="button" id="'+id+'" class="btn '+(cl||"")+'">'+label+'</button>';}
function on(id,fn){const e=document.getElementById(id);if(e)e.addEventListener("click",fn);}
function randomList(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=x[i];x[i]=x[j];x[j]=t;}return x;}
function count(v){return Object.values(status).filter(function(x){return x===v;}).length;}
function sanitize(raw){
 const s={};if(!raw||typeof raw!=="object")return s;
 for(const k of Object.keys(raw)){if(byId.has(k)&&(raw[k]==="ok"||raw[k]==="error"))s[k]=raw[k];}
 return s;
}
function migrateOld(raw){
 const previous=sanitize(raw);
 for(const id of resetKeys)delete previous[id];
 return previous;
}
try{
 if(store){
  const current=store.getItem(localKey);
  if(current!==null)status=sanitize(JSON.parse(current));
  else {
   const older=sanitize(JSON.parse(store.getItem(legacyLocalKey)||"{}"));
   status=migrateOld(older);
   store.setItem(localKey,JSON.stringify(status));
   if(Object.keys(older).length!==Object.keys(status).length)
    notice="База исправлена: результаты по заданиям с прежними неверными текстами или ключами сброшены, остальные сохранены.";
  }
 }
}catch(e){}

function cloudPayload(){return JSON.stringify({v:2,c:Object.keys(status).filter(function(k){return status[k]==="ok";}).join(","),e:Object.keys(status).filter(function(k){return status[k]==="error";}).join(",")});}
function cloudWrite(){
 const cs=tg&&tg.CloudStorage;if(!cs||typeof cs.setItem!=="function")return;
 cloudDirty=true;if(cloudBusy)return;cloudBusy=true;
 const serialized=cloudPayload();
 if(serialized.length>4000){cloudBusy=false;return;}
 try{cs.setItem(cloudKey,serialized,function(){cloudBusy=false;if(cloudDirty){cloudDirty=false;const updated=cloudPayload();if(updated!==serialized)cloudWrite();}});}
 catch(e){cloudBusy=false;}
}
function persist(){changedHere=true;try{if(store)store.setItem(localKey,JSON.stringify(status));}catch(e){}cloudWrite();}
function decodeCloud(raw,legacy){
 const data=JSON.parse(raw),s={};
 (data.c||"").split(",").forEach(function(k){if(byId.has(k))s[k]="ok";});
 (data.e||"").split(",").forEach(function(k){if(byId.has(k))s[k]="error";});
 return legacy?migrateOld(s):s;
}
function applyCloud(raw,legacy){
 if(!raw||changedHere)return;
 try{
  const saved=decodeCloud(raw,legacy);
  status=legacy?Object.assign({},saved,status):saved;
  if(store)store.setItem(localKey,JSON.stringify(status));
  if(scene==="menu")renderMenu();
  if(legacy)cloudWrite();
 }catch(e){}
}
function cloudLoad(){
 const cs=tg&&tg.CloudStorage;if(!cs||typeof cs.getItem!=="function")return;
 try{cs.getItem(cloudKey,function(err,value){
  if(changedHere)return;
  if(!err&&value){applyCloud(value,false);return;}
  try{cs.getItem(legacyCloudKey,function(oldErr,oldValue){
   if(changedHere)return;
   if(!oldErr&&oldValue)applyCloud(oldValue,true);
   else if(Object.keys(status).length)cloudWrite();
  });}catch(e){}
 });}catch(e){}
}
function renderMenu(){
 scene="menu";session=session&&session.index<session.items.length?session:null;
 const total=TASKS.length,ok=count("ok"),bad=count("error"),newCount=total-ok-bad;
 main.innerHTML='<section class="menu"><div class="hero"><div class="eyebrow">Практикум по средствам связи</div><h1>Нити <span>текста</span></h1><p>Внимательно читай отрывок и выбирай номера предложений</p></div>'+
 '<div class="stats" aria-label="Личная статистика"><div class="stat"><strong>'+total+'</strong><span>Всего заданий в базе</span></div><div class="stat"><strong>'+ok+'</strong><span>Решено верно</span></div><div class="stat"><strong>'+bad+'</strong><span>Надо перерешить</span></div></div>'+
 '<div class="menugrid"><button id="startNew" class="menucard highlight"><span class="emoji">🎯</span><span class="info"><b>'+(newCount?"Начать 5 заданий":"Повторить 5 заданий")+'</b><small>'+(newCount?"Ещё не решено: "+newCount+" · каждый раунд — 5 заданий":"Все задания уже встречались")+'</small></span></button>'+
 '<button id="goErrors" class="menucard"><span class="emoji">🔁</span><span class="info"><b>Мои ошибки</b><small>Перерешать '+bad+' '+word(bad,"задание","задания","заданий")+' и перенести верные в освоенные</small></span></button>'+
 '<button id="goRef" class="menucard"><span class="emoji">📚</span><span class="info"><b>Справочник</b><small>Все средства связи, разборы и типичные ловушки</small></span></button></div>'+
 '<p class="menu-foot">'+(notice?esc(notice):"Прогресс сохраняется на устройстве; в Telegram используется облачная синхронизация, когда она доступна.")+'</p></section>';
 on("startNew",function(){startRound("new");});on("goErrors",showErrors);on("goRef",showReference);
}
function word(n,a,b,c){const d=n%10,h=n%100;return h>=11&&h<=14?c:d===1?a:d>=2&&d<=4?b:c;}
function startRound(mode,chosenId){
 const newItems=randomList(TASKS.filter(function(t){return !status[t.id];}));
 const right=randomList(TASKS.filter(function(t){return status[t.id]==="ok";}));
 const wrong=randomList(TASKS.filter(function(t){return status[t.id]==="error";}));
 let items=[];
 if(mode==="error"){items=chosenId?[byId.get(chosenId)].filter(Boolean):wrong.slice(0,5);}
 else{items=newItems.slice(0,5);if(items.length<5)items=items.concat(right.filter(function(t){return !items.includes(t);}).slice(0,5-items.length));if(items.length<5)items=items.concat(wrong.filter(function(t){return !items.includes(t);}).slice(0,5-items.length));}
 if(!items.length){notice="Заданий в выбранном разделе пока нет.";renderMenu();return;}
 session={mode,items,index:0,selected:[],answers:[],sent:false,attemptId:"tr26-"+Date.now()+"-"+Math.random().toString(36).slice(2,10)};
 renderExam();
}
function renderExam(){
 scene="exam";const t=session.items[session.index],done=!!session.answers[session.index],result=session.answers[session.index];
 const chosen=new Set(done?result.chosen:session.selected);
 const sentenceHtml=t.s.map(function(s){
   const n=s[0],label=s[1],pressed=chosen.has(n),cl=done?(t.a.includes(n)?"correct":pressed?"wrong":""):pressed?"selected":"";
   return '<button type="button" class="sentence '+cl+'" data-choice="'+n+'" aria-pressed="'+(pressed?"true":"false")+'" '+(done?"disabled":"")+'><span class="num">'+n+'</span><span>'+esc(label)+'</span></button>';
 }).join("");
 const answered=session.answers.length;
 const feedback=done?'<div class="feedback '+(result.ok?"good":"bad")+'"><div><strong>'+(result.ok?"✓ Верно!":"✕ Нужно повторить")+'</strong><p>Правильный ответ: '+t.a.join(", ")+'</p></div>'+btn("openWhy","Разбор","outline")+'</div>':'';
 main.innerHTML='<section class="exam"><div class="examtop"><b>'+(session.mode==="error"?"Отработка ошибок":"Раунд из 5 заданий")+'</b><span>Задание '+(session.index+1)+' из '+session.items.length+'</span></div>'+
 '<div class="track"><div style="width:'+(answered/session.items.length*100)+'%"></div></div>'+
 '<div class="prompt">'+esc(t.prompt)+'<div class="source">'+esc(t.source)+' · карточка '+esc(t.id)+' · предложения '+t.lo+'–'+t.hi+'</div></div>'+
 '<div id="reading" class="reading" aria-label="Предложения для выбора">'+sentenceHtml+'</div>'+
 '<div id="answerBar" class="answerbar">'+(done?"Ответ сохранён в личном прогрессе.":selectedLabel())+'</div>'+
 feedback+'<div class="actionbar">'+(done?btn("nextTask",session.index+1===session.items.length?"Завершить":"Следующее →","primary"):btn("checkTask","Проверить ответ","primary"))+
 btn("referenceInside","Справочник","outline")+'</div></section>';
 if(!done){main.querySelectorAll("[data-choice]").forEach(function(el){el.addEventListener("click",function(){
   const n=Number(el.getAttribute("data-choice")),pos=session.selected.indexOf(n);
   if(pos>=0)session.selected.splice(pos,1);else session.selected.push(n);
   session.selected.sort(function(a,b){return a-b;});
   el.classList.toggle("selected",pos<0);el.setAttribute("aria-pressed",pos<0?"true":"false");
   document.getElementById("answerBar").textContent=selectedLabel();
   const check=document.getElementById("checkTask");if(check)check.disabled=!session.selected.length;
 });});on("checkTask",submitAnswer);const check=document.getElementById("checkTask");if(check)check.disabled=!session.selected.length;}
 else{on("nextTask",nextTask);on("openWhy",function(){showModal("Разбор · "+t.id,t.why);});}
 on("referenceInside",showReference);
}
function selectedLabel(){return session.selected.length?"Выбрано: "+session.selected.join(", ")+" · можно выбрать несколько":"Нажми на номер каждого подходящего предложения";}
function submitAnswer(){
 if(!session||session.answers[session.index]||!session.selected.length)return;
 const t=session.items[session.index],chosen=session.selected.slice().sort(function(a,b){return a-b;});
 const ok=chosen.length===t.a.length&&t.a.every(function(n){return chosen.includes(n);});
 session.answers[session.index]={id:t.id,chosen,ok};
 status[t.id]=ok?"ok":"error";persist();
 const old=document.getElementById("reading"),scroll=old?old.scrollTop:0;
 renderExam();const r=document.getElementById("reading");if(r)r.scrollTop=scroll;
}
function nextTask(){if(session.index+1>=session.items.length){renderResults();return;}session.index++;session.selected=[];renderExam();}
function renderResults(){
 scene="results";const total=session.answers.length,score=session.answers.filter(function(x){return x.ok;}).length,full=total===5,telegram=!!(tg&&tg.platform&&tg.platform!=="unknown"&&typeof tg.sendData==="function");
 main.innerHTML='<section class="results"><span class="medal" aria-hidden="true">'+(score===total?"🏆":"🧩")+'</span><div><div class="eyebrow">'+(session.mode==="error"?"ОТРАБОТКА ЗАВЕРШЕНА":"РАУНД ЗАВЕРШЁН")+'</div><h1>Связь найдена!</h1><div class="score">'+score+' из '+total+'</div></div>'+
 '<p>Всего в базе: '+TASKS.length+' · решено верно: '+count("ok")+' · надо перерешить: '+count("error")+'</p>'+
 '<div class="result-actions">'+btn("resultMenu","В меню","outline")+btn("resultErrors","Мои ошибки","outline")+btn("resultNew","Ещё 5 заданий","gold")+
 (full?btn("sendTelegram",session.sent?"Результат отправлен":"Сохранить результат в Telegram","primary wide"):"")+'</div>'+
 '<p id="sendStatus">'+(!full?"Отработка меньше пяти заданий обновляет личный прогресс, но не отправляется как раунд из пяти.":telegram?"Завершённый раунд можно отправить в статистику бота.":"Для записи в статистику открой тренажёр через Telegram-бота.")+'</p></section>';
 on("resultMenu",renderMenu);on("resultErrors",showErrors);on("resultNew",function(){startRound("new");});on("sendTelegram",sendTelegram);
 const send=document.getElementById("sendTelegram");if(send)send.disabled=!telegram||session.sent;
}
function sendTelegram(){
 if(!session||session.sent||session.answers.length!==5||!tg||!tg.platform||tg.platform==="unknown"||typeof tg.sendData!=="function")return;
 const all=session.answers,correct=all.filter(function(a){return a.ok;}).length,skills="Связь предложений";
 const payload={v:1,type:"game_result",gameId:"TR26",attemptId:session.attemptId,correct,total:5,errors:{},tested:{},wrongRows:all.filter(function(x){return !x.ok;}).map(function(x){return {taskId:x.id,chosen:x.chosen,expected:byId.get(x.id).a};})};
 payload.errors[skills]=5-correct;payload.tested[skills]=5;
 try{tg.sendData(JSON.stringify(payload));session.sent=true;renderResults();const e=document.getElementById("sendStatus");if(e)e.textContent="Результат передан боту."; }
 catch(e){const el=document.getElementById("sendStatus");if(el)el.textContent="Не удалось отправить: "+String(e);}
}
function showErrors(){
 scene="errors";const errors=TASKS.filter(function(t){return status[t.id]==="error";});
 if(!errors.length){main.innerHTML='<div class="empty"><div style="font-size:60px">✨</div><h2>Ошибок пока нет</h2><p>Неверно решённые задания будут появляться здесь.</p>'+btn("emptyStart","Начать 5 заданий","primary")+'</div>';on("emptyStart",function(){startRound("new");});return;}
 main.innerHTML='<section class="errorlist"><div class="errorhead"><h2>Мои ошибки · '+errors.length+'</h2><p>Нажми на карточку для повторного решения. Верный ответ переместит её в «Решено верно».</p></div><div class="erroritems">'+errors.map(function(t){
  return '<button type="button" class="erroritem" data-retry="'+esc(t.id)+'"><strong>'+esc(t.id)+' · предложения '+t.lo+'–'+t.hi+'</strong><span>'+esc(t.prompt)+'</span></button>';
 }).join("")+'</div>'+btn("errorFive","Перерешать до 5 ошибок","primary")+'</section>';
 main.querySelectorAll("[data-retry]").forEach(function(el){el.addEventListener("click",function(){startRound("error",el.getAttribute("data-retry"));});});
 on("errorFive",function(){startRound("error");});
}
function showReference(){if(scene!=="reference")returnScene=scene;scene="reference";main.innerHTML='<section class="refscreen"><div class="refscroll">'+(window.TR26_REFERENCE||"Справочник пока недоступен.")+'</div>'+btn("refBack","← Назад","outline")+'</section>';on("refBack",backReference);}
function backReference(){if(returnScene==="exam"&&session)renderExam();else if(returnScene==="results"&&session)renderResults();else if(returnScene==="errors")showErrors();else renderMenu();}
function showModal(title,body){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalBody").innerHTML=String(body||"Для этого задания в источнике дан только ключ ответа. Посмотрите справочник.").split(/\n+/).filter(Boolean).map(function(x){return "<p>"+esc(x)+"</p>";}).join("");
 document.getElementById("modalBack").classList.remove("hidden");document.getElementById("modalClose").focus();
}
function closeModal(){document.getElementById("modalBack").classList.add("hidden");}
on("modalClose",closeModal);document.getElementById("modalBack").addEventListener("click",function(e){if(e.target.id==="modalBack")closeModal();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
on("referenceTop",showReference);on("homeTop",renderMenu);
cloudLoad();renderMenu();
})();
</script>
</body>
</html>
