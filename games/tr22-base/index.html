качестве ответа к пункту Д следует принять именно эпитет (пункт 5).\nОстальные изобразительно-выразительные средства (пункты 1, 4, 6, 9) остаются незадействованными.\nТаким образом, в ответе записываем: 37285."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"58076","options":["многосоюзие","вопросно-ответная форма изложения","литота","парцелляция","ассонанс","сравнение","риторическое обращение","эпифора","риторический вопрос"],"items":[{"text":"Сосны горного обрыва сливались в тёмную опушку и чернели, как горб спящего зверя...\n(И. А. Бунин)","term":"сравнение","source":"58076"},{"text":"Он захватил алюминиевую ложку с перекрученным стеблем. Сел лицом к окну. Вяло начал есть.\n(С. Д. Довлатов)","term":"парцелляция","source":"58076"},{"text":"И с отвращением читая жизнь мою,\nЯ трепещу, и проклинаю,\nИ горько жалуюсь, и горько слёзы лью,\nНо строк печальных не смываю.\n(А. С. Пушкин)","term":"многосоюзие","source":"58076"},{"text":"Сумрак тихий, сумрак сонный,\nЛейся в глубь моей души.\n(Ф. И. Тютчев)","term":"риторическое обращение","source":"58076"},{"text":"Вот оно, моё стадо рыжее!\nКто ж воспеть его лучше мог?\nВижу, вижу, как сумерки лижут\nСледы человечьих ног.\n(С. А. Есенин)","term":"риторический вопрос","source":"58076"}],"explanation":"Установим соответствия.\nА 6  — сравнение (как горб);\nБ 4  — парцелляция (сказуемые «оторваны» от первого предложения)\nВ 1  — многосоюзие (употребление двух и более союзов при ОЧ)\nГ 7  — риторическое обращение (к неодушевлённому предмету, сумраку)\nД 9  —  риторический вопрос (Кто ж воспеть его лучше мог?)"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"58077","options":["многосоюзие","вопросно-ответная форма изложения","олицетворение","риторическое обращение","антитеза","сравнение","метафора","эпифора","ассонанс"],"items":[{"text":"Тихо я в тёмные кудри вплетаю\nТайный стихов драгоценный алмаз.\n(А. А. Блок)","term":"метафора","source":"58077"},{"text":"Но однажды появился вертолёт. Он был похож на стрекозу. Он летел в сторону аэропорта.\n(С. Д. Довлатов)","term":"сравнение","source":"58077"},{"text":"Было тепло, всё радовало: и воздух, и небо, и белые облака, и весенний простор.\n(И. А. Бунин)","term":"многосоюзие","source":"58077"},{"text":"Ночевала тучка золотая на груди утёса-великана.\n(М. Ю. Лермонтов)","term":"олицетворение","source":"58077"},{"text":"О верные друзья! Настанет вскоре час — Приятный, сладостный, блаженный час свиданья.\n(Ф. И. Тютчев)","term":"риторическое обращение","source":"58077"}],"explanation":"Установим соответствия.\nА 7  — метафора\nБ 6  — сравнение (был похож)\nВ 1  — многосоюзие (употребление двух и более союзов при ОЧ)\nГ 3  — олицетворение (неодушевлённому предмету придаются свойства человека)\nД 4  — риторическое обращение (обращение к воображаемому кругу лиц)"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"58078","options":["многосоюзие","метонимия","метафора","парцелляция","бессоюзие","сравнение","олицетворение","вопросно-ответная форма изложения","риторическое обращение"],"items":[{"text":"Жизнь моя! Иль ты приснилась мне?\n(С. А. Есенин)","term":"риторическое обращение","source":"58078","rich":"<span class=\"emph\">Жизнь моя!</span> Иль ты приснилась мне?"},{"text":"Я в умиленье....\nЛюбуюсь вами, как дитя!\n(А. С. Пушкин)","term":"сравнение","source":"58078"},{"text":"— Ни души! — сказал ветер, облетев всю деревню и закрутив в удальстве пыль на дороге.\n(И. А. Бунин)","term":"олицетворение","source":"58078"},{"text":"Мне всегда будет душно и тесно в каменных ущельях городов, какими бы просторными и громадными они ни были.\n(А. А. Ким)","term":"метафора","source":"58078"},{"text":"Весь вечер были ужасные молнии, удары, ливень.\n(И. А. Бунин)","term":"бессоюзие","source":"58078"}],"explanation":"Установим соответствия.\nА 9  — риторическое обращение (к неодушевлённому предмету, жизни)\nБ 6  — сравнение (как дитя)\nВ 7  — олицетворение (неодушевлённому предмету придаются свойства человека)\nГ 3  — метафора\nД 5  —   бессоюзие (отсутствие союзов при двух и более ОЧ)"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"58079","options":["многосоюзие","анафора","литота","риторическое обращение","эпифора","сравнение","ассонанс","риторическое восклицание","метонимия"],"items":[{"text":"Вот уж целый год прошёл, как вы изволили поселиться по соседству со мной, мелким человечком, а я всё ещё не знаю Вас, а Вы меня, стрекозу жалкую, не знаете.\n(А. П. Чехов)","term":"литота","source":"58079"},{"text":"Какая тишина царила кругом!\n(И. А. Бунин)","term":"риторическое восклицание","source":"58079"},{"text":"Грустя, и плача, и смеясь, звенят ручьи моих стихов.\n(А. А. Блок)","term":"многосоюзие","source":"58079"},{"text":"Мир стал живым и безопасным, как на холсте.\n(С. Д. Довлатов)","term":"сравнение","source":"58079"},{"text":"О чём ты воешь, ветр ночной?\n(Ф. И. Тютчев)","term":"риторическое обращение","source":"58079"}],"explanation":"Установим соответствия.\nА 3  — литота (мелким человечком)\nБ 8  — риторическое восклицание\nВ 1  — многосоюзие (употребление двух и более союзов при ОЧ)\nГ 6  — сравнение\nД 4  —  риторическое обращение (к неодушевлённому предмету, сумраку)"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"58101","options":["сравнение","метонимия","антитеза","риторическое обращение","многосоюзие","градация","парцелляция","анафора","эпифора"],"items":[{"text":"И песнь его была ясна,\nКак мысли девы простодушной...\n(А. С. Пушкин)","term":"сравнение","source":"58101"},{"text":"Спать за прежний недосып,\nСпать в запас научен.\n(А. Т. Твардовский)","term":"анафора","source":"58101"},{"text":"В доме хохот и стёкла звенят,\nВ нём шинкуют, и квасят, и перчат,\nИ гвоздики кладут в маринад.\n(Б. Л. Пастернак))","term":"многосоюзие","source":"58101"},{"text":"И мы соглашались. Потому что он был наш.\n(По Ю. В. Трифонов)","term":"парцелляция","source":"58101"},{"text":"Я чувствую жесточайшую\nне по прошлому ностальгию —\nностальгию по настоящему.\n(А. А. Вознесенский)","term":"антитеза","source":"58101"}],"explanation":"Установим соответствия.\nА 1  — сравнение (ясна, как мысли).\nБ 8  — анафора, повтор слова «спать» в начале строк.\nВ 5  — многосоюзие, употребление союза более чем два раза.\nГ 7  — парцелляция, намеренно отделена часть предложения.\nД 3  — антитеза (не по прошлому, а по настоящему)."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"58376","options":["сравнение","аллитерация","антитеза","риторическое обращение","олицетворение","парцелляция","анафора","ассонанс","литота"],"items":[{"text":"— Я? Вам? Дал телефон? Что за ерунда! — не понимая, сказал Никитин.\n(Ю. В. Бондарев)","term":"парцелляция","source":"58376"},{"text":"Себя не видят синие просторы.\n(С. П. Щипачёв)","term":"олицетворение","source":"58376"},{"text":"Они всю жизнь растили клевер\nИ понимали толк в овсе…\nА я теперь пашу и сею\nЛишь на газетной полосе.\n(А. М. Иванов)","term":"антитеза","source":"58376"},{"text":"Рекой текут… позёмки.","term":"сравнение","source":"58376"},{"text":"Свищет ветер, серебряный ветер\nВ шёлковом шелесте снежного шума.\n(С. А. Есенин)","term":"аллитерация","source":"58376","rich":"<span class=\"phoneme\">С</span>вищет ветер, <span class=\"phoneme\">с</span>еребряный ветер<br>В <span class=\"phoneme\">ш</span>ёлковом <span class=\"phoneme\">ш</span>еле<span class=\"phoneme\">с</span>те <span class=\"phoneme\">с</span>нежного <span class=\"phoneme\">ш</span>ума."}],"explanation":"Установим соответствия.\nА 6  — парцелляция.\nБ 5  — олицетворение\nВ 3  — антитеза (они реально сеяли, а он  — лишь на бумаге)\nГ 1  — сравнение, выражено творительным падежом, как река. Парцелляции нет, потому что нет точки.\nД 2  — аллитерация, повторение согласных звуков."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"59258","options":["ассонанс","эпитет","синтаксический параллелизм","парцелляция","аллитерация","риторический вопрос","сравнение","метонимия","литота"],"items":[{"text":"Попадья Балдой не нахвалится,\nПоповна о Балде лишь и печалится.\n(А. С. Пушкин)","term":"синтаксический параллелизм","source":"59258"},{"text":"Что ж, если в Портленд нет возврата,\nПоделим золото как братья,\nПоскольку денежки чужие\nНе достаются без труда.\n(Б. Ш. Окуджава)","term":"метонимия","source":"59258","rich":"Что ж, если в Портленд нет возврата,<br>Поделим <span class=\"emph\">золото</span> как братья,<br>Поскольку денежки чужие<br>Не достаются без труда."},{"text":"Натуральный кислород —\nОн вкусней всего на свете,\nОн безвредней, чем кефир,\nИ полезнее конфет.\n(А. И. Иващенко и Г. Л. Васильев)","term":"сравнение","source":"59258"},{"text":"Между обломками скал ласково блестели тёмно-голубые клочки неба, украшенные крапинками звёзд.\n(По М. Горькому)","term":"эпитет","source":"59258"},{"text":"В синем небе, колокольнями\nпроколотом,\nМедный колокол, медный колокол\nТо ль возрадовался, то ли осерчал...\n(В. В. Высоцкий)","term":"аллитерация","source":"59258","rich":"В синем небе, <span class=\"phoneme\">к</span>оло<span class=\"phoneme\">к</span>ольнями<br>про<span class=\"phoneme\">к</span>олотом,<br>Медный <span class=\"phoneme\">к</span>оло<span class=\"phoneme\">к</span>ол, медный <span class=\"phoneme\">к</span>оло<span class=\"phoneme\">к</span>ол<br>То ль возрадовался, то ли осерчал..."}],"explanation":"Установим соответствия.\nА 3  — синтаксический параллелизм: две строки имеют строение подлежащее, дополнение, сказуемое.\nБ 8  — метонимия: не сам металл, а золотые монеты.\nВ 7  — сравнение.\nГ 2  — эпитет.\nД 5  — аллитерация, намеренно повторяющиеся согласные выделены."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"59285","options":["ассонанс","риторическое обращение","сравнение","парцелляция","литота","метафора","эпифора","синтаксический параллелизм","аллитерация"],"items":[{"text":"Липы душистой цветы распускаются…\nСпи, моя радость, усни!\n(К. Д. Бальмонт)","term":"ассонанс","source":"59285","rich":"Л<span class=\"phoneme\">и</span>пы душ<span class=\"phoneme\">и</span>стой цветы распускаются…<br>Сп<span class=\"phoneme\">и</span>, моя радость, усн<span class=\"phoneme\">и</span>!"},{"text":"В итоге — птицы не улетают вовремя в Африку, типы вроде меня реже и реже возвращаются восвояси.\n(И. А. Бродский)","term":"сравнение","source":"59285"},{"text":"Ах вы, сени мои, сени,\nСени новые мои!","term":"риторическое обращение","source":"59285"},{"text":"Хочу оставить на листе бумаги\nМоей судьбы глубокие овраги.\n(А. И. Иващенко и Г. Л. Васильев)","term":"метафора","source":"59285"},{"text":"С умным — хлопотно, с дураком — плохо,\nНужно что-то среднее, да где ж его взять.\n(Б. Ш. Окуджава)","term":"синтаксический параллелизм","source":"59285"}],"explanation":"Установим соответствия.\nА 1  — ассонанс, выделены гласные буквы.\nБ 3  — сравнение, выражено предлогом с именем сущ. «вроде меня».\nВ 2  — риторическое обращение.\nГ 6  — метафора, переносное значение слов.\nД 8  — синтаксический параллелизм (С умным  — хлопотно, с дураком  — плохо)"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"59886","options":["ассонанс","гипербола","синтаксический параллелизм","парцелляция","аллитерация","анафора","риторическое обращение","эпифора","литота"],"items":[{"text":"Долги ночи, жёстки зори\nВ ноябре — к зиме седой.\n(А. Т. Твардовский)","term":"синтаксический параллелизм","source":"59886"},{"text":"Человек нас десять было,\nБыл у нас и командир.\nИз бойцов. Мужчина дельный,\nМестность эту знал вокруг.\n(А. Т. Твардовский)","term":"парцелляция","source":"59886"},{"text":"Не кичусь родным я краем,\nНо пройди весь белый свет —\nКто в рожки тебе сыграет\nТак, как наш смоленский дед.\n(А. Т. Твардовский)","term":"гипербола","source":"59886"},{"text":"Звёзды слушают, как сани, убегая,\nговорят,\nИ, внимая им, горят,\nИ мечтая, и блистая, в небе духами парят.\n(Э. А. По. Перевод К. Д. Бальмонта)","term":"ассонанс","source":"59886"},{"text":"Я вольный ветер, я вечно вею, Волную волны, ласкаю ивы..\n(К. Д. Бальмонт)","term":"аллитерация","source":"59886","rich":"Я <span class=\"phoneme\">в</span>ольный <span class=\"phoneme\">в</span>етер, я <span class=\"phoneme\">в</span>ечно <span class=\"phoneme\">в</span>ею, <span class=\"phoneme\">В</span>олную <span class=\"phoneme\">в</span>олны, ласкаю и<span class=\"phoneme\">в</span>ы.."}],"explanation":"Найдём соответствия.\nА)  — 3, синтаксический параллелизм: Долги ночи, жёстки зори (одинаково построены соседние предложения)\nБ)  — 4, парцелляция: часть \"Из бойцов\"намеренно выделена в особое предложение.\nВ)  — 2, гипербола: выделенный фрагмент  — явное преувеличение.\nГ)  — 1,  ассонанс: обратите внимание на повторяющийся звук [а].\nД)  — 5, аллитерация: обратите внимание на повторяющийся звук [в]."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"59917","options":["эпифора","парцелляция","анафора","сравнение","вопросно-ответная форма изложения","метонимия","риторическое обращение","риторический вопрос","литота"],"items":[{"text":"Полем шёл, лесною кромкой,\nИзбегая лишних глаз,\nПодходил к селу в потёмках,\nИ служил ему котомкой\nБоевой противогаз.\n(А. Т. Твардовский)","term":"метонимия","source":"59917","rich":"Полем шёл, лесною кромкой,<br>Избегая лишних <span class=\"emph\">глаз</span>,<br>Подходил к селу в потёмках,<br>И служил ему котомкой<br>Боевой противогаз."},{"text":"И столбом поставил воду\nВдруг снаряд.\n(А. Т. Твардовский)","term":"сравнение","source":"59917"},{"text":"Мёрзлый грунт долби, лопата,\nТанк — дави, греми — граната..\n(А. Т. Твардовский)","term":"риторическое обращение","source":"59917"},{"text":"— А с чего мне врать, дружище?\nРассуди — какой расчёт?\n(А. Т. Твардовский)","term":"риторический вопрос","source":"59917"},{"text":"Вот сейчас он с разворота\nИ начнёт. И жизни даст.\n(А. Т. Твардовский)","term":"парцелляция","source":"59917"}],"explanation":"Найдём соответствия.\nА) Избегая лишних глаз ...  — 6) метонимия\nИспользуется перенос значения по смежности: часть (глаза) используется для обозначения целого (люди, наблюдатели). Герой избегал не буквально глаз, а людей.\nБ) И столбом поставил воду / Вдруг снаряд.  — 4) сравнение\nЗдесь использована форма творительного падежа для сравнения (творительный сравнения). Взрыв снаряда сравнивается с силой, которая поставила воду (подобно) столбу. Создаётся яркий зрительный образ.\nВ) Мёрзлый грунт долби, лопата, / Танк  — дави, греми  — граната...  — 7) риторическое обращение\nАвтор обращается к неодушевлённым предметам (лопата, танк, граната) как к живым существам, отдавая им приказы.\nГ)  — А с чего мне врать, дружище? / Рассуди  — какой расчёт?  — 8) риторический вопрос\nЗаданные вопросы не требуют ответа, их цель — утвердить мысль о том, что врать нет никакого смысла.\nД) Вот сейчас он с разворота / И начнёт. И жизни даст.  — 2) парцелляция\nЕдиное по смыслу предложение намеренно разделено на несколько коротких, интонационно обособленных частей (И начнёт. И жизни даст.). Это создаёт напряжение и подчёркивает решительность и стремительность действия."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"60228","options":["эпифора","риторическое обращение","синтаксический параллелизм","парцелляция","риторическое восклицание","вопросно-ответная форма изложения","сравнение","риторический вопрос","литота"],"items":[{"text":"С чрезвычайною точностью гость расспросил, кто в городе губернатор, кто председатель палаты, кто прокурор.\n(Н. В. Гоголь)","term":"синтаксический параллелизм","source":"60228"},{"text":"«Какое странное сооружение!» — невольно воскликнул проезжий, глядя на причудливый дом помещицы.\n(Н. В. Гоголь)","term":"риторическое восклицание","source":"60228"},{"text":"— Может быть, здесь... В этом, вами сейчас выраженном изъяснении скрыто другое?\n— Нет, — подхватил Чичиков...\n(По Н. В. Гоголю)","term":"парцелляция","source":"60228"},{"text":"Толстые умеют лучше тонких на этом свете обделывать дела свои...\n(По Н. В. Гоголю)","term":"сравнение","source":"60228"},{"text":"Сын роскоши, прохлад и нег,\nКуда, Мещерский, ты сокрылся?\nОставил ты сей жизни брег,\nК брегам ты мёртвых удалился.\n(Г. Р. Державин)","term":"вопросно-ответная форма изложения","source":"60228"}],"explanation":"Найдём соответствия.\nА) Синтаксический параллелизм (3)\nВ этом предложении Гоголь использует однотипное построение фраз: «...кто губернатор, кто председатель, кто прокурор». Это повторение одинаковых синтаксических конструкций, которое создаёт особый ритм и подчёркивает дотошность и деловой подход гостя.\nБ) Риторическое восклицание (5)\nФраза «Какое странное сооружение!»  — это не просто констатация факта, а выплеск эмоций, удивления героя. Восклицание, которое служит для передачи сильного чувства, а не для сообщения информации, и называется риторическим.\nВ) Парцелляция (4)\nРечь героя намеренно дробится на части с помощью многоточия («Может быть, здесь... В этом...»). Единое по смыслу предложение искусственно разделено на фрагменты, что передаёт неуверенность, задумчивость и попытку говорящего точнее сформулировать свою мысль.\nГ) Сравнение (7)\nВ этом предложении автор напрямую сравнивает две категории людей: «толстых» и «тонких». Грамматически это выражено через сравнительную степень наречия: «умеют лучше тонких». Это не просто противопоставление, а именно сравнение их способностей в житейских делах.\nД) Вопросно-ответная форма изложения (6)\nПоэт сначала задаёт вопрос («Куда, Мещерский, ты сокрылся?»), а затем сам же на него отвечает в последующих строках («Оставил ты сей жизни брег, / К брегам ты мёртвых удалился»). Такой приём позволяет автору выстроить размышление и подвести читателя к определённому выводу."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"60255","options":["эпифора","анафора","синтаксический параллелизм","метонимия","риторическое обращение","вопросно-ответная форма изложения","сравнение","парцелляция","антитеза"],"items":[{"text":"После обеда господин сел на диван, подложивши себе за спину подушку, которую в русских трактирах набивают чем-то чрезвычайно похожим на кирпич и булыжник.\n(По Н. В. Гоголю)","term":"сравнение","source":"60255"},{"text":"Манилов долго стоял на крыльце,\nпровожая глазами удалявшуюся бричку, и когда она уже совершенно стала не видна, он всё ещё стоял, куря трубку.\n(Н. В. Гоголь)","term":"метонимия","source":"60255","rich":"Манилов долго стоял на крыльце,<br>провожая <span class=\"emph\">глазами</span> удалявшуюся бричку, и когда она уже совершенно стала не видна, он всё ещё стоял, куря трубку."},{"text":"— Как-с? Извините... я несколько туг на ухо, мне послышалось престранное слово...\n— Я полагаю приобрести мёртвых, которые, впрочем, значились бы по ревизии как живые, — сказал Чичиков.\n(Н. В. Гоголь)","term":"антитеза","source":"60255"},{"text":"Пан Данило стал поглядывать на тёмную сторону, где из-за леса чернел земляной вал, из-за вала подымался старый за́мок.\n(По Н. В. Гоголю)","term":"синтаксический параллелизм","source":"60255"},{"text":"Пелеринка1 из фестончиков, на рукавах фестончики2, одни фестончики.\n(По Н. В. Гоголю)","term":"эпифора","source":"60255"}],"explanation":"Найдём соответствия.\nА) Сравнение (7)\nСравнение выражено лексически  — с помощью прилагательного со значением подобия с зависимыми словами: «похожим на кирпич и булыжник». Автор уподобляет набивку трактирной подушки тяжёлым строительным камням, чтобы с иронией подчеркнуть её чрезвычайную жёсткость и полное отсутствие уюта.\nБ) Метонимия (4)\nВыражение «провожая глазами»  — это классический пример метонимии. Манилов провожает бричку не буквально глазами как физическим органом, а своим взглядом, своим вниманием. Происходит перенос значения с органа чувств на его функцию.\nВ) Антитеза (9)\nВ реплике Чичикова сталкиваются два взаимоисключающих понятия: «мёртвых, которые, впрочем, значились бы... как живые». Это прямое противопоставление, на котором и строится весь абсурд и вся суть его аферы.\nГ) Синтаксический параллелизм (3)\nВ этом предложении автор использует синтаксический параллелизм, чтобы создать единую, панорамную картину. Он строит две части по абсолютно одинаковой синтаксической модели.\nДавайте посмотрим на эту модель. Для наглядности мы можем мысленно подставить опущенное союзное слово «где» во вторую часть:\n(где) [обстоятельство места] [сказуемое] [подлежащее]\n(где) из-за леса чернел вал\n(где) из-за вала подымался замок\nД) Эпифора (1)\nФраза построена на повторении одного и того же слова в конце каждой части: «на рукавах фестончики, одни фестончики». Такой приём — повторение слова или группы слов в конце смежных отрезков речи — называется эпифорой."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"60939","options":["эпифора","парцелляция","анафора","гипербола","риторическое обращение","вопросно-ответная форма изложения","литота","риторический вопрос","синтаксический параллелизм"],"items":[{"text":"Чем я ему помешал? Неужели я обожру совет народного хозяйства, если в помойке пороюсь?\n(М. А. Булгаков)","term":"риторический вопрос","source":"60939"},{"text":"Я знаю — солнце померкло б, увидев наших душ золотые россыпи!\n(В. В. Маяковский)","term":"гипербола","source":"60939"},{"text":"— О, глаза — значительная вещь. Вроде барометра.\n(М. А. Булгаков)","term":"парцелляция","source":"60939"},{"text":"Этот тухлой солонины лопать не станет... Этот ест обильно и не ворует. Этот не станет пинать ногой...\n(М. А. Булгаков)","term":"анафора","source":"60939"},{"text":"А вы думаете, я сужу по пальто? Вздор. Пальто теперь очень многие и из пролетариев носят.\n(М. А. Булгаков)","term":"вопросно-ответная форма изложения","source":"60939"}],"explanation":"А 8 Риторический вопрос  — вопрос, который ставится не с целью получить на него ответ, а для того, чтобы привлечь внимание к тому или иному явлению и выразить эмоциональное отношение автора. Герой не ждёт ответа, а использует вопрос для утверждения абсурдности обвинений в свой адрес.\nБ 4 Гипербола  — художественное средство, основанное на чрезмерном преувеличении. Утверждение, что солнце «померкло б», увидев красоту человеческих душ, является явным преувеличением, создающим грандиозный, космический образ.\nВ 2 Парцелляция  — стилистический приём, заключающийся в намеренном расчленении связного текста на несколько самостоятельных отрезков. Фраза «Вроде барометра» намеренно отделена от основного предложения («О, глаза — значительная вещь») для придания ей большей выразительности и веса.\nГ 3 Анафора  — повторение слова или группы слов в начале нескольких фраз или предложений. Повтор слова «Этот» в начале каждого предложения создаёт ритм и усиливает характеристику персонажа.\nД 6 Вопросно-ответная форма изложения  — приём, при котором автор (или герой) задаёт вопрос и сам же на него отвечает, создавая иллюзию диалога и вовлекая читателя в рассуждение. Герой задаёт вопрос («А вы думаете, я сужу по пальто?») и сразу же даёт на него ответ-опровержение («Вздор...»)."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"60966","options":["эпифора","литота","синтаксический параллелизм","метонимия","аллитерация","гипербола","сравнение","ассонанс","парцелляция"],"items":[{"text":"Молча вышли из кабинета, молча прошли приёмную, молча миновали переднюю.\n(По М. А. Булгакову)","term":"синтаксический параллелизм","source":"60966"},{"text":"Хозяин вваливался в чернобурой лисе, пахнущий мандаринами, сигарами, духами, лимонами, бензином и одеколоном.\n(М. А. Булгаков)","term":"метонимия","source":"60966","rich":"Хозяин вваливался в <span class=\"emph\">чернобурой лисе</span>, пахнущий мандаринами, сигарами, духами, лимонами, бензином и одеколоном."},{"text":"Дождь обрыдал тротуары,\nлужами сжатый жулик,\nмокрый, лижет улиц забитый булыжником труп.\n(В. В. Маяковский)","term":"аллитерация","source":"60966","rich":"До<span class=\"phoneme\">ж</span>дь обрыдал тротуары,<br>лу<span class=\"phoneme\">ж</span>ами с<span class=\"phoneme\">ж</span>атый <span class=\"phoneme\">ж</span>улик,<br>мокрый, ли<span class=\"phoneme\">ж</span>ет улиц забитый булы<span class=\"phoneme\">ж</span>ником труп."},{"text":"«Ошейник – всё равно что портфель», — сострил мысленно пёс.\n(М. А. Булгаков)","term":"сравнение","source":"60966"},{"text":"Нам, здоровенным,\nс шагом саженьим2,\nнадо не слушать, а рвать их.\n(В. В. Маяковский)","term":"гипербола","source":"60966"}],"explanation":"Установим соответствие.\nА) Молча вышли из кабинета, молча прошли приёмную, молча миновали переднюю.  — Три части предложения построены по одной модели: молча + глагол + существительное. Одинаковая синтаксическая конструкция повторяется трижды. Это синтаксический параллелизм (3).\nБ) Хозяин вваливался в чернобурой лисе...  — В чернобурой лисе  — значит «в шубе из чернобурой лисы». Название животного употреблено вместо названия изделия из него. Перенос по смежности: материал → изделие. Это метонимия (4).\nВ) Дождь обрыдал тротуары, лужами сжатый жулик, мокрый, лижет улиц забитый булыжником труп.  — В отрывке нарочито сконцентрирован звук Ж: дождь, лужами, сжатый, жулик, лижет, булыжником. Повтор одинаковых согласных звуков. Это аллитерация (5).\nГ) «Ошейник — всё равно что портфель», — сострил мысленно пёс.  — Ошейник сопоставляется с портфелем при помощи конструкции всё равно что. Один предмет уподобляется другому. Это сравнение (7).\nД) Нам, здоровенным, с шагом саженьим...  — Шаг саженьим  — шаг в сажень (около двух метров). Это явное преувеличение размера шага. Это гипербола (6)."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"61507","options":["эпифора","синтаксический параллелизм","анафора","гипербола","риторическое обращение","вопросно-ответная форма изложения","олицетворение","риторический вопрос","метонимия"],"items":[{"text":"Блеск горячий солнце сеет\nВдоль по невской глубине…\n(Ф. И. Тютчев)","term":"олицетворение","source":"61507","rich":"<span class=\"emph\">Блеск</span> горячий солнце сеет<br>Вдоль по невской глубине…"},{"text":"…Покосился повар:\n«Ничего себе едок —\nПарень этот новый».\nЛожку лишнюю кладёт,\nМолвит несердито:\n— Вам бы, знаете, во флот\nС вашим аппетитом.\n(А. Т. Твардовский)","term":"метонимия","source":"61507","rich":"…Покосился повар:<br>«Ничего себе едок —<br>Парень этот новый».<br><span class=\"emph\">Ложку</span> лишнюю кладёт,<br>Молвит несердито:<br>— Вам бы, знаете, во флот<br>С вашим аппетитом."},{"text":"Ночь глуха, земля сыра.\nЧуть костёр дымится.\n— Нет, ребята, спать пора,\nНачинай стелиться.\n(А. Т. Твардовский)","term":"синтаксический параллелизм","source":"61507"},{"text":"Что слава? Яркая заплата\nНа ветхом рубище певца.\n(А. С. Пушкин)","term":"вопросно-ответная форма изложения","source":"61507"},{"text":"Пусть ты чёрт. Да наши черти\nВсех чертей\nВ сто раз чертей.\n \n(А. Т. Твардовский)","term":"гипербола","source":"61507","rich":"Пусть ты чёрт. Да наши черти<br><span class=\"emph\">Всех чертей<br>В сто раз чертей.</span>"}],"explanation":"Установим соответствие.\nА)  Блеск горячий солнце сеет\nВдоль по невской глубине…\nВ выделенном фрагменте неодушевлённый предмет (солнце) наделяется свойствами живого существа (способностью сеять, как человек). Этот приём называется олицетворением (7).\nБ)  ...Ложку лишнюю кладёт...\nПовар кладёт в котелок не сам металлический предмет (ложку), а дополнительную порцию еды, отмеряемую этой ложкой (содержимое вместо вместилища). Такой перенос наименования по смежности называется метонимией (9).\nВ)  Ночь глуха, земля сыра.\nЧуть костёр дымится.\nВ первой строке мы видим одинаковое синтаксическое построение двух смежных конструкций: [Подлежащее + сказуемое (краткое прилагательное)], [Подлежащее + сказуемое (краткое прилагательное)]. Одинаковое построение соседних фраз называется синтаксическим параллелизмом (2). Обращение «ребята»  — не риторическое, а обычное.\nГ)  Что слава? Яркая заплата\nНа ветхом рубище певца.\nАвтор задаёт вопрос («Что слава?»), на который не ждёт ответа от читателя, так как сам же на него и отвечает в следующей строке. Это вопросно-ответная форма изложения (6).\nД)  Пусть ты чёрт. Да наши черти\nВсех чертей\nВ сто раз чертей.\nВ выделенном фрагменте используется намеренное, неправдоподобное художественное преувеличение свойств («в сто раз чертей»), чтобы подчеркнуть смелость и отчаянность русских солдат. Это гипербола (4)."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"61535","options":["эпифора","литота","анафора","бессоюзие","парцелляция","риторическое обращение","антитеза","ассонанс","аллитерация"],"items":[{"text":"...Давно ль\nЯ, кажется, тебя крестила?\nА я так на руки брала!\nА я так за уши драла!\nА я так пряником кормила!\n \n(А. С. Пушкин)","term":"анафора","source":"61535"},{"text":"Потом, покорствуя природе,\nДружатся с ней, к себе ведут,\nЦелуют, нежно руки жмут,\nВзбивают кудри ей по моде…\n \n(А. С. Пушкин)","term":"бессоюзие","source":"61535"},{"text":"О, набат, набат, набат,\nЕсли б ты вернул назад\nЭтот ужас, это пламя, эту искру, этот\nвзгляд…\n(Э. А. По, перевод К. Д. Бальмонта)","term":"ассонанс","source":"61535","rich":"О, н<span class=\"phoneme\">а</span>б<span class=\"phoneme\">а</span>т, н<span class=\"phoneme\">а</span>б<span class=\"phoneme\">а</span>т, н<span class=\"phoneme\">а</span>б<span class=\"phoneme\">а</span>т,<br>Если б ты вернул н<span class=\"phoneme\">а</span>з<span class=\"phoneme\">а</span>д<br>Этот уж<span class=\"phoneme\">а</span>с, это пл<span class=\"phoneme\">а</span>мя, эту искру, этот<br>взгляд…"},{"text":"Это есть художник Альтман,\nочень старый человек.\nПо-немецки значит Альтман —\nочень старый человек.\n \n(О. Э. Мандельштам)","term":"эпифора","source":"61535"},{"text":"Нежнее нежного\nЛицо твоё,\nБелее белого\nТвоя рука…\n \n(О. Э. Мандельштам)","term":"аллитерация","source":"61535","rich":"Нежнее нежного<br><span class=\"phoneme\">Л</span>ицо твоё,<br><span class=\"phoneme\">Б</span>е<span class=\"phoneme\">л</span>ее <span class=\"phoneme\">б</span>е<span class=\"phoneme\">л</span>ого<br>Твоя рука…"}],"explanation":"Установим соответствие.\nА)  ...Давно ль\nЯ, кажется, тебя крестила?\nА я так на руки брала!\nА я так за уши драла!\nА я так пряником кормила!\nЗдесь мы видим единоначатие (повтор одинаковых слов в начале смежных строк)  — анафору (3).\nБ)  Потом, покорствуя природе,\nДружатся с ней, к себе ведут,\nЦелуют, нежно руки жмут,\nВзбивают кудри ей по моде…\nВ этом фрагменте намеренно опущены союзы между однородными сказуемыми (дружатся, ведут, целуют, жмут, взбивают). Это создаёт динамику и стремительность действия. Такой приём называется бессоюзием (асиндетоном) (4).\nВ)  О, набат, набат, набат,\nЕсли б ты вернул назад\nЭтот ужас, это пламя, эту искру, этот\nвзгляд…\nВ выделенных жирным шрифтом местах повторяется ударный гласный звук [а] (буквы «а» и «я»). Намеренное повторение одинаковых или похожих гласных звуков для создания звуковой картины (в данном случае  — тревожного гула колокола)  — это ассонанс (8).\nГ)  Это есть художник Альтман,\nочень старый человек.\nПо-немецки значит Альтман  —\nочень старый человек.\nВ этом отрывке одинаковые слова или фразы повторяются в конце смежных строк. Такой приём называется эпифорой (1).\nД)  Нежнее нежного\nЛицо твоё,\nБелее белого\nТвоя рука…\nВ выделенных словах намеренно повторяются согласные звуки ([н], [ж], [л], [б]) для создания ощущения мягкости, нежности и плавности. Повторение согласных звуков в художественном тексте  — это аллитерация (9)."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"67132","options":["многосоюзие","гипербола","сравнение","риторическое восклицание","парцелляция","метонимия","вопросно-ответная форма изложения","риторическое обращение","синтаксический параллелизм"],"items":[{"text":"Средь оплывших свечей и вечерних молитв,\nСредь военных трофеев и мирных костров\nЖили книжные дети, не знавшие битв,\nИзнывая от мелких своих катастроф.\n(В. С. Высоцкий)","term":"синтаксический параллелизм","source":"67132"},{"text":"А в кипящих котлах прежних боен и смут\nСтолько пищи для маленьких наших мозгов!\n(В. С. Высоцкий)","term":"риторическое восклицание","source":"67132"},{"text":"Толку нет, что в миг тоскливый,\nКак снаряд берёт разбег,\nТёркин так же ждёт разрыва,\nКамнем кинувшись на снег.\n(А. Т. Твардовский)","term":"сравнение","source":"67132"},{"text":"Я на речке ноги вымою.\nКуда, реченька, течёшь?\nВ сторону мою, родимую,\nМожет, где-нибудь свернёшь.\n(А. Т. Твардовский)","term":"риторическое обращение","source":"67132"},{"text":"Сторона моя лесная...\nКаждый кустик мне — родня.\n(А. Т. Твардовский)","term":"гипербола","source":"67132"}],"explanation":"Определим изобразительно-выразительные средства языка, использованные в приведённых фрагментах.\nА) Синтаксический параллелизм  — фрагмент А.\nПервые две строки строфы («Средь оплывших свечей и вечерних молитв, / Средь военных трофеев и мирных костров») построены абсолютно одинаково: предлог «средь» + согласованное определение + существительное в Р. п. + союз И + согласованное определение + существительное в Р. п. Такое сходное, параллельное синтаксическое построение смежных строк называется синтаксическим параллелизмом.\nБ) Риторическое восклицание  — фрагмент Б.\nПредложение «Столько пищи для маленьких наших мозгов!» оканчивается восклицательным знаком и представляет собой экспрессивное высказывание, служащее для эмоционального усиления авторской мысли и придания речи патетического звучания.\nВ) Сравнение  — фрагмент В.\nВыделенное слово «камнем» употреблено в форме творительного падежа со значением сравнения (так называемый творительный сравнения): «камнем кинувшись» = стремительно упав, подобно камню.\nГ) Риторическое обращение  — фрагмент Г.\nСлово «реченька» представляет собой эмоциональное обращение к неодушевлённому предмету природы (реке). Такое обращение не требует реального ответа собеседника и служит для выражения нежного, сокровенного чувства лирического героя.\nД) Гипербола  — фрагмент Д.\nФрагмент «Каждый кустик мне  — родня» содержит явное поэтическое преувеличение (гиперболу): буквальное родство человека с растениями невозможно, однако этот образ подчёркивает безграничную, кровную любовь бойца к каждому уголку родного края."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"67159","options":["многосоюзие","эпифора","литота","парцелляция","метонимия","риторический вопрос","вопросно-ответная форма изложения","риторическое обращение","антитеза"],"items":[{"text":"Помороженный, простуженный\nОтдыхает он, герой,\nБитый, раненый, контуженный,\nДа здоровый и живой...\n(А. Т. Твардовский)","term":"антитеза","source":"67159"},{"text":"И уже, пригревшись, спал\nКрепко полк усталый.\n(А. Т. Твардовский)","term":"метонимия","source":"67159","rich":"И уже, пригревшись, спал<br>Крепко <span class=\"emph\">полк</span> усталый."},{"text":"Прощай, Москва!Не видать мне больше\nпролетариев и краковской колбасы...\n(М. А. Булгаков)","term":"риторическое обращение","source":"67159"},{"text":"Кто скачет, кто мчится под хладною\nмглой?\nЕздок запоздалый, с ним сын молодой.\n(В. И. Гёте, пер. В. А. Жуковского)","term":"вопросно-ответная форма изложения","source":"67159"},{"text":"Разве весело слышать дурное мнение\nо себе?\n(Н. В. Гоголь)","term":"риторический вопрос","source":"67159"}],"explanation":"Определим изобразительно-выразительные средства языка, использованные в приведённых фрагментах.\nА) Антитеза  — фрагмент А.\nВо фрагменте представлено яркое противопоставление (антитеза): ряд определений со значением увечий и лишений («битый, раненый, контуженный») резко противопоставляется жизнеутверждающему финалу с союзом ДА в значении НО: «Да здоровый и живой...».\nБ) Метонимия  — фрагмент Б.\nВыделенное слово «полк» употреблено в переносном значении на основе пространственной и логической смежности (метонимия): спит не само воинское подразделение как организация, а люди, солдаты, составляющие этот полк.\nВ) Риторическое обращение  — фрагмент В.\nФраза «Прощай, Москва!» представляет собой обращение к неодушевлённому предмету (городу), которое не рассчитано на реальный ответ, а служит для экспрессивного выражения горечи расставания и передачи внутреннего состояния героя (пса Шарика).\nГ) Вопросно-ответная форма изложения  — фрагмент Г.\nТекст строится как диалог автора с самим собой: сначала задаётся вопрос («Кто скачет, кто мчится под хладною мглой?»), а следом за ним даётся непосредственный ответ на него («Ездок запоздалый, с ним сын молодой»).\nД) Риторический вопрос  — фрагмент Д.\nВопросительное предложение «Разве весело слышать дурное мнение о себе?» не требует ответа от собеседника, так как ответ очевиден и заключён в самом вопросе: оно служит скрытым эмоциональным утверждением («Совсем невесело слышать о себе дурное мнение»)."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"67296","options":["риторическое восклицание","антитеза","сравнение","риторический вопрос","эпифора","метонимия","вопросно-ответная форма изложения","риторическое обращение","синтаксический параллелизм"],"items":[{"text":"Что я? Да я разве против?\n(По М. М. Рощину)","term":"риторический вопрос","source":"67296"},{"text":"Рассыпной звонок пролетел по квартире, и лакированная дверь открылась.\n(М. А. Булгаков)","term":"метонимия","source":"67296","rich":"<span class=\"emph\">Рассыпной звонок</span> пролетел по квартире, и лакированная дверь открылась."},{"text":"«В спальне принимать пищу, — заговорил он слегка придушенным голосом, — в смотровой читать, в приёмной одеваться, в комнате прислуги оперировать, в столовой осматривать...»\n(По М. А. Булгакову)","term":"синтаксический параллелизм","source":"67296"},{"text":"... Не то чтоб содрогнулась,\nИль стала вдруг бледна, красна...\nУ ней и бровь не шевельнулась;\nНе сжала даже губ она.\n(А. С. Пушкин)","term":"антитеза","source":"67296"},{"text":"Колесом за сини горы\nСолнце тихое скатилось.\n(С. А. Есенин)","term":"сравнение","source":"67296"}],"explanation":"Определим изобразительно-выразительные средства языка, использованные в приведённых фрагментах.\nА) Риторический вопрос  — фрагмент А.\nВопросительные предложения «Что я? Да я разве против?» не требуют ответа от собеседника, а служат эмоциональным выражением согласия и самооправдания героя.\nБ) Метонимия  — фрагмент Б.\nВыделенное слово «звонок» употреблено в переносном значении на основе смежности явлений (метонимия): по квартире физически летит не сам прибор (звонок), а издаваемый им резкий звук (трель).\nВ) Синтаксический параллелизм  — фрагмент В.\nФрагмент представляет собой цепь однотипно построенных синтаксических конструкций с одинаковым порядком слов: обстоятельство места («в спальне», «в смотровой», «в приёмной») + инфинитив («принимать пищу», «читать», «одеваться»).\nГ) Антитеза  — фрагмент Г.\nВо фрагменте использовано резкое противопоставление (антитеза): внешнее проявление крайнего волнения («бледна  — красна») противопоставляется ледяному, неподвижному спокойствию героини («и бровь не шевельнулась; не сжала даже губ она»).\nД) Сравнение  — фрагмент Д.\nСуществительное «колесом» употреблено в форме творительного падежа со значением сравнения (творительный сравнения): солнце скатилось, подобно катящемуся колесу."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"67323","options":["многосоюзие","синтаксический параллелизм","литота","парцелляция","аллитерация","эпифора","ассонанс","риторическое обращение","гипербола"],"items":[{"text":"Самая волшебная из волшебных сказок у нас едва ли избегнет упрёка в покушении на оскорбление личности!\n(М. Ю. Лермонтов)","term":"гипербола","source":"67323"},{"text":"Я вспомнил январь 1916 года, прифронтовую железнодорожную станцию Молодечно. Удивительную красоту потонувшего в снегах Полесья.\n(по В. П. Катаеву)","term":"парцелляция","source":"67323"},{"text":"Язык ни к черту, но занятно! Чтоб тебя черти разорвали, занятно!\n(По М. А. Булгакову)","term":"эпифора","source":"67323"},{"text":"Гроза омыла Москву 29 апреля, и стал сладостен воздух, и душа как-то смягчилась, и жить захотелось.\n(М. А. Булгаков)","term":"многосоюзие","source":"67323"},{"text":"Конец зиме, конец вьюгам, конец холоду.\n(М. А. Булгаков)","term":"синтаксический параллелизм","source":"67323"}],"explanation":"Определим изобразительно-выразительные средства языка, использованные в приведённых фрагментах.\nА) Гипербола  — фрагмент А.\nВысказывание содержит явное сатирическое преувеличение (гиперболу): автор намеренно гиперболизирует обидчивость и подозрительность публики, утверждая, что даже в невинной волшебной сказке непременно найдут оскорбление личности.\nБ) Парцелляция  — фрагмент Б.\nЕдиная синтаксическая конструкция намеренно расчленена точкой на два самостоятельных предложения: второе предложение представляет собой оторванное однородное дополнение («...станцию Молодечно. Удивительную красоту...»).\nВ) Эпифора  — фрагмент В.\nВ конце двух смежных восклицательных предложений повторяется одно и то же слово: «...но занятно! ...черти разорвали, занятно!». Единообразие концовок предложений называется эпифорой.\nГ) Многосоюзие  — фрагмент Г.\nВо фрагменте намеренно повторяется сочинительный соединительный союз И перед каждым простым предложением («...и стал сладостен воздух, и душа как-то смягчилась, и жить захотелось»), что замедляет речь и усиливает выразительность повествования.\nД) Синтаксический параллелизм  — фрагмент Д.\nПредложение состоит из трёх частей с тождественным грамматическим строением: существительное в И. п. («конец») + существительное в Д. п. («зиме», «вьюгам», «холоду»)."}],"glossary":{"аллитерация":["Повтор согласных звуков, создающий звуковой рисунок.","«Шуршат камыши» — шипящие ш, ш."],"анафора":["Повтор слова или сочетания в начале соседних отрезков речи.","«Вы помните… / Вы всё, конечно, помните…»"],"антитеза":["Выразительное противопоставление образов, мыслей или понятий.","«Начинал с энтузиазмом, а заканчивал с безразличием»."],"ассонанс":["Намеренный повтор гласных звуков для выразительности звучания.","«У наших ушки на макушке» — заметен звук [у]."],"бессоюзие":["Намеренное перечисление без союзов; в том числе между однородными членами или частями сложного предложения.","«Молнии, удары, ливень»."],"вопросно-ответная форма изложения":["Автор (или герой) задаёт вопрос и тут же самостоятельно отвечает на него.","«Что такое благодарность? Это ответ сердца…»"],"гипербола":["Художественное преувеличение.","«Очередь растянулась на километр»."],"градация":["Последовательное усиление или ослабление выразительности слов и образов.","«Жалуются, негодуют, вопиют»."],"инверсия":["Необычный порядок слов, подчёркивающий нужное слово или создающий ритм.","«Я голос твой далёкий слышу» вместо «Я слышу твой далёкий голос»."],"лексический повтор":["Повтор одного и того же слова или сочетания для усиления смысла.","«Верное слово… верное место»."],"литота":["Художественное преуменьшение размера, количества или значения.","«Собачка не более напёрстка»."],"метафора":["Скрытое образное сравнение: слово употреблено в переносном значении на основе сходства.","«Пламя июля» — знойное лето."],"метонимия":["Перенос названия по смежности: предмет — содержимое, место — люди и т. п.","«Зал встаёт» — встают зрители."],"многосоюзие":["Намеренное повторение союзов для ритма, перечисления, усиления.","«И гул, и брань, и разговор…»"],"олицетворение":["Наделение неживого предмета, явления природы свойствами живого человека.","«Луна улыбается»."],"парцелляция":["Намеренное разделение единой конструкции на короткие самостоятельные части.","«Я мужчина хоть куда. В полном расцвете сил»."],"риторический вопрос":["Вопрос, который не требует ответа и выражает утверждение или чувство.","«Разве весело слышать дурное мнение о себе?»"],"риторическое восклицание":["Эмоциональное восклицание, усиливающее выразительность мысли.","«Какая тишина царила кругом!»"],"риторическое обращение":["Выразительное обращение к отсутствующему, воображаемому, отвлечённому или неодушевлённому адресату.","«Как долго ждали мы тебя, весна!»"],"синтаксический параллелизм":["Сходное построение соседних предложений или строк.","«Мгновения спрессованы в года, / Мгновения спрессованы в столетия»."],"сравнение":["Сопоставление двух явлений по общему признаку: как, словно, будто, похож на, творительный сравнения и др.","«Зелень, как живопись»."],"эпитет":["Образное определение, передающее авторскую оценку или эмоциональный признак.","«Дивная пора»."],"эпифора":["Повтор слова или сочетания в конце соседних отрезков речи.","«…но занятно! / …черти разорвали, занятно!»"]}};
const $=id=>document.getElementById(id);
const letters=['А','Б','В','Г','Д'];
let rounds=[],ri=0,ci=0,selected=[],results=[],totalCorrect=0,forceFont=false,reviewIndex=0,reviewList=[],lock=false,showFull=false,attemptId='',gameSaved=false;
const tg=(window.Telegram&&window.Telegram.WebApp)||null;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const shuff=a=>{let b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name=t=>CONFIG.kind==='8'?CONFIG.names[t]:(t||'');
const short=t=>CONFIG.kind==='8'?(CONFIG.short[t]||CONFIG.names[t]):t;
function openModal(title,body,footer=[]){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalFoot').replaceChildren();footer.forEach(b=>{let el=document.createElement('button');el.className='action'+(b.primary?' primary':'');el.textContent=b.title;el.addEventListener('click',b.onClick);$('modalFoot').appendChild(el)});$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');}
function glossary(){const q=CONFIG.kind==='22'?CONFIG.glossary:CONFIG.rules;const keys=Object.keys(q).sort((a,b)=>name(a).localeCompare(name(b),'ru'));openModal('Справочник · '+keys.length+' правил','<input class="search" id="searchBox" placeholder="Найти термин или пример…"><div class="glossary" id="glossaryItems"></div>');function draw(){const term=($('searchBox')?.value||'').toLowerCase();$('glossaryItems').innerHTML=keys.filter(k=>(name(k)+' '+JSON.stringify(q[k])).toLowerCase().includes(term)).map(k=>{const v=CONFIG.kind==='22'?q[k]:[q[k],''];return '<article class="glItem"><strong>'+escapeHTML(name(k))+'</strong><p>'+escapeHTML(v[0])+'</p><em>'+escapeHTML(v[1]||'')+'</em></article>'}).join('')||'<p>Ничего не найдено</p>';} $('searchBox').addEventListener('input',draw);draw();}
function init(){ $('title').textContent=CONFIG.title; $('subtitle').textContent=CONFIG.subtitle; $('introTitle').textContent=CONFIG.title; $('introDesc').textContent=CONFIG.kind==='22'?(CONFIG.mode==='lesson'?'9 раундов: 4 лёгких, 2 контрольных и 3 сложных. Теперь один фрагмент и все варианты — на одном экране.':'Один вариант ЕГЭ: 5 фрагментов и 9 средств выразительности. После завершения можно сыграть снова с другим случайным заданием.'):'Одно предложение и все пять видов ошибок сразу на экране. Выбери категорию, чтобы перейти дальше.'; $('emblem').textContent=CONFIG.kind==='8'?'✎':'✦'; /* Один раунд: выбор количества скрыт. */ $('homeBtn').onclick=showIntro; $('fontBtn').onclick=()=>{forceFont=!forceFont;document.body.classList.toggle('large',forceFont);$('fontBtn').textContent=forceFont?'А−':'А+';requestAnimationFrame(fitQuote);};$('helpBtn').onclick=glossary;$('introHelp').onclick=glossary;$('startBtn').onclick=start;$('againBtn').onclick=start;$('saveGame22').onclick=saveGame22;$('finalHome').onclick=showIntro;$('closeModal').onclick=closeModal;$('prevBtn').onclick=()=>move(-1);$('nextFragment').onclick=()=>move(1);$('checkBtn').onclick=check;window.addEventListener('resize',()=>requestAnimationFrame(fitQuote));if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestAnimationFrame(fitQuote));showIntro();}
function showIntro(){closeModal();$('intro').classList.remove('hidden');$('play').classList.add('hidden');$('final').classList.add('hidden');}
function start(){closeModal();rounds=CONFIG.rounds.slice();if(CONFIG.mode==='practice'){rounds=shuff(rounds);rounds=rounds.slice(0,1);} else if(CONFIG.mode.startsWith('part')){ // regroup originals with fresh shuffling while keeping 3 examples per error type
 const keys=rounds[0].options;const pools={};for(const k of keys){const all=CONFIG.rounds.flatMap(r=>r.items.filter(x=>x.term===k));const unique=[...new Map(all.map(x=>[x.text,x])).values()];pools[k]=shuff(unique);}rounds=rounds.map((r,j)=>({...r,items:shuff(keys.flatMap(k=>[0,1,2].map(z=>pools[k][(j*3+z)%pools[k].length])))}));
 } else if(CONFIG.mode==='halloween'){rounds=rounds.map(r=>({...r,items:shuff(r.items)}));}
 attemptId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('r22_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));gameSaved=false;
 ri=0;ci=0;totalCorrect=0;results=[];$('intro').classList.add('hidden');$('final').classList.add('hidden');$('play').classList.remove('hidden');beginRound();}
function beginRound(){ci=0;selected=Array(5).fill(null);const r=rounds[ri]; // 15 items for EGE8, 5 for EGE22
 selected=Array(r.items.length).fill(null);showCard();}
function showCard(){const r=rounds[ri],it=r.items[ci],n=r.items.length; $('roundName').textContent=r.title;$('taskCounter').textContent='Раунд '+(ri+1)+'/'+rounds.length+'  ·  '+(ci+1)+'/'+n;$('progressFill').style.width=(((ri+(ci+1)/n)/rounds.length)*100)+'%'; $('promptTitle').textContent=CONFIG.kind==='22'?'Фрагмент '+letters[ci]:'Предложение '+(ci+1);$('source').textContent=r.source?(r.source==='банк ФИПИ'?'Банк ФИПИ':'База № '+r.source) : (it.source?'№ '+it.source:'');const m=it.text.match(/\n\s*(\([^()\n]*\))\s*$/);$('quote').innerHTML=it.rich || escapeHTML(m?it.text.slice(0,m.index).trim():it.text).replace(/\n/g,'<br>');$('quoteAuthor').textContent=m?m[1]:'';$('quoteAuthor').classList.toggle('hidden',!m); $('quote').classList.toggle('long',it.text.length>180);$('chosenLabel').textContent=selected[ci]===null?'Ответ не выбран':short(selected[ci]);$('cardNote').textContent=CONFIG.kind==='22'?'Какое средство используется?':'Какой вид грамматической ошибки?';$('selectedCount').textContent=selected.filter(Boolean).length+' / '+n+' ответов'; $('answers').className='answers '+(r.options.length===9?'nine':'five');$('answers').replaceChildren();r.options.forEach((t,j)=>{const b=document.createElement('button');b.type='button';b.className='choice'+(selected[ci]===t?' chosen':'')+(selected.some((v,i)=>i!==ci&&v===t)?' used':'');let digit=document.createElement('span');digit.className='digit';digit.textContent=j+1;b.appendChild(digit);const label=document.createElement('span');label.className='choiceText';label.textContent=short(t);b.appendChild(label);b.addEventListener('click',()=>choose(t));$('answers').appendChild(b)});$('prevBtn').disabled=ci===0;$('nextFragment').classList.toggle('hidden',ci===n-1);$('checkBtn').classList.toggle('hidden',ci!==n-1);$('checkBtn').disabled=selected.some(v=>v===null); $('checkBtn').textContent='Проверить ✓';requestAnimationFrame(fitQuote);}
function choose(t){if(lock)return;
 if(CONFIG.kind==='22'){
   const other=selected.findIndex((v,i)=>i!==ci&&v===t);
   if(other>=0)selected[other]=null;
 }else{
   const count=selected.filter((v,i)=>i!==ci&&v===t).length;
   if(count>=3){openModal('Категория заполнена','<p>В каждой группе должно быть <b>ровно три предложения</b>. Для категории «'+escapeHTML(short(t))+'» уже выбраны три. Вернись и измени один из них.</p>',[{title:'Понятно',primary:true,onClick:closeModal}]);return;}
 }
 selected[ci]=t;const n=rounds[ri].items.length;
 if(ci<n-1){ci++;showCard();}else showCard();}
function move(dir){ci=Math.max(0,Math.min(rounds[ri].items.length-1,ci+dir));showCard()}

function fitQuote(){
 if($('play').classList.contains('hidden'))return;
 const area=$('quoteArea'),text=$('quote');
 if(!area.clientWidth||!area.clientHeight)return;
 const screenW=innerWidth||1024,screenH=innerHeight||768;
 const mobile=screenW<=760;
 const max=mobile?Math.min(52,Math.max(26,screenW*.125)) : Math.min(132,Math.max(66,Math.min(screenW*.091,screenH*.18)));
 const min=mobile?12:19;
 const fixedAuthor=$('quoteAuthor');
 const extra=(fixedAuthor&&!fixedAuthor.classList.contains('hidden')?fixedAuthor.offsetHeight+8:0);
 const available=Math.max(40,area.clientHeight-extra-3);
 // Подбираем максимальный целый размер по действительной высоте текста.
 text.style.fontSize=min+'px';
 const fits=sz=>{text.style.fontSize=sz+'px';return text.scrollHeight<=available+1 && text.scrollWidth<=area.clientWidth-5};
 let lo=min,hi=Math.floor(max),best=min;
 while(lo<=hi){const mid=Math.floor((lo+hi)/2);if(fits(mid)){best=mid;lo=mid+1}else hi=mid-1;}
 text.style.fontSize=best+'px';
 text.style.lineHeight=best<24?'1.08':'1.12';
 // Точно так же увеличиваем подписи на кнопках вплоть до их предела.
 const choices=[...$('answers').querySelectorAll('.choice')];
 choices.forEach(btn=>{
   const el=btn.querySelector('.choiceText');if(!el)return;
   const upper=mobile?(forceFont?30:26):(forceFont?48:42);
   const lower=mobile?11:15;
   const style=getComputedStyle(btn);
   const w=Math.max(20,el.clientWidth+1);
   const h=Math.max(20,btn.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)-4);
   let low=lower,high=upper,optimal=lower;
   const okay=n=>{el.style.fontSize=n+'px';return el.scrollHeight<=h+1 && el.scrollWidth<=w+1;};
   while(low<=high){const mid=Math.floor((low+high)/2);if(okay(mid)){optimal=mid;low=mid+1}else high=mid-1;}
   el.style.fontSize=optimal+'px';
 });
}

function check(){const r=rounds[ri];if(selected.some(v=>v===null)){openModal('Не все ответы выбраны','<p>Заполни все '+r.items.length+' ответов.</p>');return;}const right=r.items.filter((it,i)=>it.term===selected[i]).length;totalCorrect+=right;results.push({r,selected:selected.slice(),right});reviewIndex=0;reviewList=r.items.map((it,i)=>({it,i,chosen:selected[i]})).filter(x=>x.it.term!==x.chosen);showSummary();}
function showSummary(){const last=results[results.length-1];const wrong=reviewList.length;let total=last.r.items.length;const nextLabel=ri<rounds.length-1?'Следующий раунд →':'Завершить тренировку 🏆';let body='<div class="resultBadge">'+last.right+' / '+total+'</div><p>'+(!wrong?'Все ответы верные! Отличная работа.':'Ошибок: '+wrong+'. Можно разобрать их по одной, без прокрутки списка.')+'</p>';
 openModal('Раунд '+(ri+1)+' завершён',body,[...(wrong?[{title:'Разобрать ошибки',onClick:()=>showReview(0)}]:[]),{title:nextLabel,primary:true,onClick:nextRound}]);}
function showReview(i){if(i<0){showSummary();return}if(i>=reviewList.length){showSummary();return}const obj=reviewList[i],item=obj.it;const from=short(obj.chosen),to=short(item.term);let body='<div class="pill">Ошибка '+(i+1)+' / '+reviewList.length+' · '+(CONFIG.kind==='22'?letters[obj.i]:'№ '+(obj.i+1))+'</div><h3>'+escapeHTML(item.text)+'</h3><p class="wrong">Твой ответ: '+escapeHTML(from)+'</p><p class="right">Верно: <b>'+escapeHTML(to)+'</b></p>';
 if(item.corrected)body+='<div class="corrected"><b>Правильно:</b> '+escapeHTML(item.corrected)+'</div>';
 let hint=item.hint || (CONFIG.kind==='22'?CONFIG.glossary[item.term]?.[0]:'');if(hint)body+='<p>'+escapeHTML(hint)+'</p>';body+='<p style="color:#89b7c2;font-size:14px">'+(item.source?'Источник № '+escapeHTML(item.source):'')+'</p>';
 openModal('Разбор ошибки',body,[{title:'← Назад',onClick:()=>showReview(i-1)},{title:i===reviewList.length-1?'К результату':'Следующая →',primary:true,onClick:()=>showReview(i+1)}]);}
function nextRound(){closeModal();ri++;if(ri>=rounds.length)finish();else beginRound()}
function saveGame22(){
 if(gameSaved)return;
 const status=$('saveStatus22');
 if(!tg||!tg.platform||tg.platform==='unknown'||typeof tg.sendData!=='function'){
  status.textContent='Чтобы записать результат в бота, открой игру через кнопку «🎮 Тренажёры» внутри Telegram.';return;
 }
 const tested={},errors={};
 results.forEach(round=>round.r.items.forEach((it,i)=>{
   tested[it.term]=(tested[it.term]||0)+1;
   if(round.selected[i]!==it.term)errors[it.term]=(errors[it.term]||0)+1;
 }));
 const total=Object.values(tested).reduce((n,x)=>n+x,0);
 if(total!==5){status.textContent='Не удалось проверить завершённый раунд.';return;}
 const data={v:1,type:'game_result',gameId:'TR22_BASE',attemptId,correct:totalCorrect,total,errors,tested};
 try{$('saveGame22').disabled=true;tg.sendData(JSON.stringify(data));gameSaved=true;status.textContent='Результат отправлен боту.';}
 catch(e){$('saveGame22').disabled=false;status.textContent='Не удалось отправить: '+String(e.message||e);}
}
function finish(){closeModal();$('play').classList.add('hidden');$('final').classList.remove('hidden');const total=rounds.reduce((s,r)=>s+r.items.length,0);$('finalScore').textContent=totalCorrect+' / '+total;$('finalDesc').textContent='Верно '+Math.round(totalCorrect/total*100)+'%. Пройдено раундов: '+rounds.length+'. Можно сыграть снова: следующее задание выбирается случайно из всей базы.';}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
