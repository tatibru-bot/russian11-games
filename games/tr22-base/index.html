const CONFIG={"kind":"22","mode":"practice","title":"ЕГЭ № 22 · Нарешка базы","subtitle":"1 задание ЕГЭ · 5 фрагментов","rounds":[{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55227","options":["многосоюзие","лексический повтор","антитеза","парцелляция","гипербола","сравнение","ассонанс","эпифора","эпитет"],"items":[{"text":"Есть имена и есть такие даты,\n— Они нетленной сущности полны.\n(А. Т. Твардовский)","term":"лексический повтор","source":"55227"},{"text":"Есть в осени первоначальной\nКороткая, но дивная пора \n(Ф. И. Тютчев)","term":"эпитет","source":"55227"},{"text":"День вечереет, небо опустело.\n(И. А. Бунин)","term":"ассонанс","source":"55227","rich":"Д<span class=\"phoneme\">е</span>нь в<span class=\"phoneme\">е</span>ч<span class=\"phoneme\">е</span>р<span class=\"phoneme\">е</span><span class=\"phoneme\">е</span>т, н<span class=\"phoneme\">е</span>бо опуст<span class=\"phoneme\">е</span>ло."},{"text":"Где бодрый серп гулял и падал колос,\nТеперь уж пусто всё — простор везде.\n(Ф. И. Тютчев)","term":"антитеза","source":"55227"},{"text":"Рояль был весь раскрыт, и струны в нем дрожали, \nКак и сердца у нас за песнею твоей.\n(А. А. Фет)","term":"сравнение","source":"55227"}],"explanation":"A 2  — лексический повтор (есть/есть)\nБ 9  — эпитет, выраженный именем прилагательным.\nВ 7  —  ассонанс, повторяющиеся буквы е придают фразе ритм и организуют её.\nГ 3  — антитеза, части предложения противопоставлены друг другу.\nД 6  — сравнение, представлено сложноподчинённым предложением с союзом «как»."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55324","options":["многосоюзие","метафора","антитеза","инверсия","эпитет","сравнение","ассонанс","анафора","гипербола"],"items":[{"text":"Стихает ветер, даль расчистив,\nРазлито солнце по земле.\n(Б. Л. Пастернак)","term":"метафора","source":"55324","rich":"Стихает ветер, даль <span class=\"emph\">расчистив</span>,<br><span class=\"emph\">Разлито</span> солнце по земле."},{"text":"Словно я весенней гулкой ранью\nПроскакал на розовом коне.\n(С. А. Есенин)","term":"эпитет","source":"55324","rich":"Словно я весенней <span class=\"emph\">гулкой</span> ранью<br>Проскакал на <span class=\"emph\">розовом</span> коне."},{"text":"Просвечивает зелень листьев,\nКак живопись в цветном стекле.\n(Б. Л. Пастернак)","term":"сравнение","source":"55324"},{"text":"Там, где калина цветёт,\nНежная девушка в белом\nНежную песню поёт.\n(С. А. Есенин)","term":"анафора","source":"55324"},{"text":"Я голос твой далёкий слышу\n(А. А. Тарковский)","term":"инверсия","source":"55324"}],"explanation":"А 2  — метафора, слова употреблены в переносном значении.\nБ 5  —  выделенные слова являются эпитетами.\nВ 6  — сравнение, выражено сравнительным оборотом с союзом «как».\nГ 8  — анафора, одно и то же слово в начале смежных строк (нежная, нежную).\nД 4  — инверсия, нарушение обычного порядка слов (ср: я слышу твой далёкий голос)."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55325","options":["многосоюзие","анафора","антитеза","парцелляция","метафора","сравнение","ассонанс","эпифора","эпитет"],"items":[{"text":"В степи поодаль есть родник,\nТечёт в траве он струйкой ясной...\n(В. А. Солоухин)","term":"эпитет","source":"55325","rich":"В степи поодаль есть родник,<br>Течёт в траве он струйкой <span class=\"emph\">ясной</span>..."},{"text":"Придёт оно, большое, как глоток...\n(Р. И. Рождественский)","term":"сравнение","source":"55325"},{"text":"Сгорела вешняя трава\nВ высоком пламени июля\n(В. А. Солоухин)","term":"метафора","source":"55325","rich":"<span class=\"emph\">Сгорела</span> вешняя трава<br>В высоком <span class=\"emph\">пламени</span> июля"},{"text":"И там безумствует, и плачет,\nИ на себе рубашку рвёт\n(А. С. Кушнер)","term":"многосоюзие","source":"55325"},{"text":"Не время в шахматы играть,\nНе время песни распевать!\n(А. Н. Некрасов)","term":"анафора","source":"55325"}],"explanation":"А 9  — эпитет.\nБ 6  — сравнение, выражено сравнительным оборотом.\nВ 5  — метафора: сгореть трава может, но не в пламени июля, здесь две метафоры.\nГ 1  — многосоюзие, союз и повторяется три раза.\nД 2  — анафора, две рядом стоящие строки начинаются одинаково (не/не)"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55326","options":["сравнение","синтаксический параллелизм","антитеза","парцелляция","гипербола","инверсия","аллитерация","олицетворение","риторическое восклицание"],"items":[{"text":"Дух бродяжий! ты все реже, реже\nРасшевеливаешь пламень уст.\n(С. А. Есенин)","term":"аллитерация","source":"55326","rich":"Дух б<span class=\"phoneme\">р</span>одяжий! ты все <span class=\"phoneme\">р</span>еже, <span class=\"phoneme\">р</span>еже<br><span class=\"phoneme\">Р</span>асшевеливаешь пламень уст."},{"text":"Мгновения спрессованы в года,\nМгновения спрессованы в столетия.\n(Р. И. Рождественский)","term":"синтаксический параллелизм","source":"55326"},{"text":"Люблю обычные слова,\nКак неизведанные страны.\n(Д. С. Самойлов)","term":"сравнение","source":"55326"},{"text":"Упало яблоко — пора —\nИ ветка, охнув, распрямилась.\n(В. И. Шемчушенко)","term":"олицетворение","source":"55326","rich":"Упало яблоко — пора —<br>И ветка, <span class=\"emph\">охнув</span>, распрямилась."},{"text":"На пажитях немых люблю в мороз трескучий\nПри свете солнечном я солнца блеск колючий\n(А. А. Фет)","term":"инверсия","source":"55326"}],"explanation":"А 7  — аллитерация, употребление одинаковых согласных букв.\nБ 2  — синтаксический параллелизм, одинаковая модель в двух рядом стоящих предложениях: подл+сказуемое-кр. причастие+ дополнение с предлогом.\nВ 1  — сравнение, выражено сравнительным оборотом с союзом «как».\nГ 8  — олицетворение, ветка наделена свойством человека.\nД 6  — инверсия, нарушение обычного порядка слов (ср.: я люблю на немых пажитях в трескучий мороз при солнечном свете колючий блеск солнца. Пажити  — это устаревшее слово «пастбище»."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55388","options":["вопросно-ответная форма изложения","синтаксический параллелизм","антитеза","парцелляция","гипербола","сравнение","риторический вопрос","эпифора","метафора"],"items":[{"text":"Людей неинтересных в мире нет.\nИх судьбы — как истории планет.","term":"сравнение","source":"55388"},{"text":"Есть в мире этом самый лучший миг.\nЕсть в мире этом самый страшный час,","term":"синтаксический параллелизм","source":"55388"},{"text":"Таков закон безжалостной игры.\nНе люди умирают, а миры.","term":"антитеза","source":"55388"},{"text":"Уходят люди… Их не возвратить.\nИх тайные миры не возродить.","term":"метафора","source":"55388"},{"text":"Людей мы помним, грешных и земных.\nА что мы знали, в сущности, о них?\n \n(Е. Евтушенко)","term":"риторический вопрос","source":"55388"}],"explanation":"А 6  — сравнение, союзом «как» присоединяется сказуемое, ср. их судьбы  — это истории\nБ 2  — синтаксический параллелизм, одинаковая модель построения в двух рядом стоящих предложениях: сказуемое+обстоят.+определение+определение+определение+ подл.\nВ 3  — антитеза, резкое противопоставление понятий «люди» и «миры»\nГ 9  — метафора, переносное значение слова, люди уходят из мира людей.\nД 7  — риторический вопрос."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55389","options":["многосоюзие","лексический повтор","метафора","парцелляция","гипербола","сравнение","олицетворение","эпифора","эпитет"],"items":[{"text":"Шар луны под звездным абажуром\nОзарял уснувший городок.","term":"метафора","source":"55389","rich":"<span class=\"emph\">Шар луны под звездным абажуром</span><br>Озарял уснувший городок."},{"text":"Шли, смеясь, по набережной хмурой\nПарень со спортивною фигурой\nИ девчонка — хрупкий стебелёк.","term":"эпитет","source":"55389","rich":"Шли, смеясь, по набережной <span class=\"emph\">хмурой</span><br>Парень со спортивною фигурой<br>И девчонка — <span class=\"emph\">хрупкий</span> стебелёк."},{"text":"Два плечистых темных силуэта\nВыросли вдруг как из-под земли.","term":"сравнение","source":"55389"},{"text":"Как швыряла молнии гроза.","term":"олицетворение","source":"55389","rich":"Как <span class=\"emph\">швыряла</span> молнии гроза."},{"text":"Очередь в поликлинике растянулась на километр.","term":"гипербола","source":"55389"}],"explanation":"А 3  — метафора, употребление выделенных слов в переносном смысле.\nБ 9  — эпитеты, два имени прилагательных с ярко выраженной эмоциональной окраской.\nВ 6  — сравнение, выражено фразеологизмом с союзом «как».\nГ 7  — олицетворение, молния наделяется свойством человека.\nД 5  — гипербола (не может быть очередь в здании быть такой длины)."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55391","options":["многосоюзие","гипербола","антитеза","парцелляция","метафора","сравнение","ассонанс","анафора","эпитет"],"items":[{"text":"Есть имена и есть такие даты, —\nОни нетленной сущности полны.\n(А. Т. Твардовский)","term":"эпитет","source":"55391"},{"text":"Да, можно выжить в зной, в грозу, в морозы,\nДа, можно голодать и холодать.\n(К. Симонов)","term":"анафора","source":"55391"},{"text":"Она [гроза] звенела по траве,\nС размаху вышибая дверь\nВ стремительность и крутизну. \nИ вниз. К обрыву. Под уклон.\nК воде. К беседке из надежд\n(П. Коган)","term":"парцелляция","source":"55391"},{"text":"Где бодрый серп гулял и падал колос,\nТеперь уж пусто всё — простор везде.\n(Ф. И. Тютчев)","term":"метафора","source":"55391"},{"text":"Ключа студёная вода\nБежит, как и весной бежала.\n(В. Солоухин)","term":"сравнение","source":"55391"}],"explanation":"А 9  — эпитет.\nБ 8  — анафора, одно и то же слово в начале смежных строк (да, да).\nВ 4  — парцелляция, намеренное разбиение одного предложения на части.\nГ 5  — метафора, переносное значение слова.\nД 6  — сравнение, представлено сложноподчинённым предложением с союзом «как»."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55392","options":["многосоюзие","эпифора","эпитет","парцелляция","гипербола","сравнение","аллитерация","синтаксический параллелизм","олицетворение"],"items":[{"text":"Красиво падала листва,\nКрасиво плыли пароходы.\n(С. Самойлов)","term":"синтаксический параллелизм","source":"55392"},{"text":"То ли мёд, то ли горькая чаша,\nто ли адский огонь, то ли храм\n(Б. Окуджава)","term":"многосоюзие","source":"55392"},{"text":"любовь идёт ко мне,\nидёт, как песня к горлу!\n(Р. Рождественский)","term":"сравнение","source":"55392"},{"text":"И только радуги в тумане\nВокруг неярких фонарей\nПоведали тебе заране\nО близости любви моей.\n(А. Тарковский)","term":"олицетворение","source":"55392"},{"text":"Звон колокольный звал к заутрене\n(В. Соколов)","term":"аллитерация","source":"55392","rich":"<span class=\"phoneme\">З</span>вон колокольный <span class=\"phoneme\">з</span>вал к <span class=\"phoneme\">з</span>аутрене"}],"explanation":"А 8  — синтаксический параллелизм, одинаковая модель построения в двух рядом стоящих предложениях: обстоят.+сказуемое+подл.\nБ 1  — многосоюзие, употребляется союз «то ли» четыре раза.\nВ 6  — сравнение\nГ 9  — олицетворение, радуги наделяются свойством человека.\nД 7  — аллитерация: заметьте, как звучат звуки з, передавая звон."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55394","options":["многосоюзие","лексический повтор","антитеза","парцелляция","олицетворение","инверсия","ассонанс","эпифора","риторическое восклицание"],"items":[{"text":"любовь идёт ко мне,\nидёт, как песня к горлу!\n(Р. Рождественский)","term":"лексический повтор","source":"55394"},{"text":"И праздничные торжества\nСправлял сентябрь первоначальный\n(Д. Самойлов)","term":"олицетворение","source":"55394"},{"text":"Прекрасна ты, душа людская! Небу,\nБездонному, спокойному, ночному,\nМерцанью звёзд подобна ты порой!\n(И. А. Бунин)","term":"инверсия","source":"55394"},{"text":"Да, мне нравилась девушка в белом,\nНо теперь я люблю в голубом.\n(С. Есенин)","term":"антитеза","source":"55394"},{"text":"Одна... кругом и жизнь, и говор, и движенье\n(А. Апухтин)","term":"многосоюзие","source":"55394"}],"explanation":"А 2  — лексический повтор (идёт/идёт).\nБ 5  — олицетворение, сентябрь наделяется свойствами человека.\nВ 6  — инверсия, нарушение порядка слов, ср.: Ты порой подобна бездонному, спокойному, ночному небу, мерцанью звёзд.\nГ 3  — антитеза, первое предложение противопоставлено второму.\nД 1  — многосоюзие, союз и повторяется три раза.\nЭпитета нет в списке терминов, поэтому в В выбираем инверсию.\nРиторическое восклицание имеет особые признаки, его нет среди примеров. Найдите описание термина в правиле к заданию."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55395","options":["многосоюзие","синтаксический параллелизм","антитеза","парцелляция","олицетворение","метонимия","риторическое обращение","сравнение","эпитет"],"items":[{"text":"Он целовал её так, словно у неё во рту был запас кислорода, необходимый для поддержания жизни...\n(Джена Шоуолтер)","term":"сравнение","source":"55395"},{"text":"И праздничные торжества\nСправлял сентябрь первоначальный\n(Д. Самойлов)","term":"эпитет","source":"55395"},{"text":"Прекрасна ты, душа людская!\n(И. А. Бунин)","term":"риторическое обращение","source":"55395"},{"text":"Не все я в небе ненавидел,\nНе все я в мире презирал\n(А. Пушкин)","term":"синтаксический параллелизм","source":"55395"},{"text":"Лунный диск, на млечную дорогу\nВыбравшись, шагал наискосок...\n(Э. Асадов)","term":"олицетворение","source":"55395"}],"explanation":"А 8  — сравнение, представлено сложноподчинённым предложением с союзом «словно».\nБ 9  — эпитет.\nВ 7  — риторическое обращение.\nГ 2  — синтаксический параллелизм, одинаковая модель построения двух смежных строк: доп.+подл.+обстоятельство+ сказуемое.\nД 5  — олицетворение, лунный диск наделяется свойствами человека."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55396","options":["бессоюзие","риторический вопрос","антитеза","синтаксический параллелизм","риторическое обращение","анафора","метафора","эпифора","эпитет"],"items":[{"text":"Березы желтою резьбой\nБлестят в лазури голубой.\n(И. А. Бунин)","term":"метафора","source":"55396","rich":"Березы желтою <span class=\"emph\">резьбой</span><br><span class=\"emph\">Блестят</span> в лазури голубой."},{"text":"Разве весело слышать дурное мнение о себе?\n(Н. Гоголь)","term":"риторический вопрос","source":"55396"},{"text":"Не Бог, не Бог нас создал. Это мы Богов творили рабским сердцем.\n(И. А. Бунин)","term":"антитеза","source":"55396"},{"text":"И она смотрела с восхищеньем\nВ смелые, горячие глаза…\n(А. Асадов)","term":"эпитет","source":"55396","rich":"И она смотрела с восхищеньем<br>В смелые, <span class=\"emph\">горячие</span> глаза…"},{"text":"Светлою волною всколыхнулись свечи.\nТемною волною всколыхнулись думы.\n(М. Цветаева)","term":"синтаксический параллелизм","source":"55396"}],"explanation":"А 7  — метафора, резьба берез (ассоциация по форме листочков). Не сравнение, потому что сказать «берёзы блестят, как желтая резьба» не получится.\nБ 2  — риторический вопрос.\nВ 3  — антитеза, противопоставление между частями сложного предложения.\nГ 9  — эпитет.\nД 4  — синтаксический параллелизм, одинаковое синтаксическое строение двух смежных строк."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55397","options":["многосоюзие","лексический повтор","антитеза","парцелляция","гипербола","сравнение","олицетворение","анафора","эпитет"],"items":[{"text":"Грубым дается радость. Нежным дается печаль.","term":"антитеза","source":"55397","rich":"<span class=\"emph\">Грубым</span> дается <span class=\"emph\">радость</span>. <span class=\"emph\">Нежным</span> дается <span class=\"emph\">печаль</span>."},{"text":"Восхищаться уж я не умею и пропасть не хотел бы в глуши, но, наверно, навеки имею нежность грустную русской души.","term":"эпитет","source":"55397","rich":"Восхищаться уж я не умею и пропасть не хотел бы в глуши, но, наверно, навеки имею нежность <span class=\"emph\">грустную</span> русской души."},{"text":"Что не могли в словах сказать уста,\nПусть пулями расскажут пистолеты.","term":"олицетворение","source":"55397","rich":"Что не могли в словах сказать уста,<br>Пусть пулями <span class=\"emph\">расскажут</span> пистолеты."},{"text":"О любви в словах не говорят,\nО любви мечтают лишь украдкой,","term":"анафора","source":"55397"},{"text":"Россия. Какое красивое слово! И роса, и сила, и синее что-то…\n \n(С. Есенин)","term":"многосоюзие","source":"55397"}],"explanation":"А 3  — антитеза, противопоставление первого предложения второму, причём по двум понятиям, то есть с использованием двух рядов антонимов: грубый−нежный, печаль−радость.\nБ 9  — эпитет.\nВ 7  — олицетворение, пистолеты наделяются свойством человека.\nГ 8  — анафора, одно и то же слово в начале смежных строк (о, о).\nД 1  — многосоюзие, союз и повторяется трижды.\nПочему в Д не парцелляция?\nЭти предложения нельзя «склеить» в одно без потери смысла и структуры. Они самодостаточны.\nДля сравнения — парцелляция выглядит так:\n«Он был счастлив. Абсолютно. Безоговорочно.»"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55398","options":["риторический вопрос","эпитет","антитеза","парцелляция","метонимия","гипербола","вопросно-ответная форма изложения","эпифора","метафора"],"items":[{"text":"И зал встаёт, и зал поёт, и в зале дышится легко\n(К. Симонов)","term":"метонимия","source":"55398","rich":"И <span class=\"emph\">зал</span> встаёт, и зал поёт, и в зале дышится легко"},{"text":"Как дерево роняет тихо листья,\nТак я роняю грустные слова.\n(С. Есенин)","term":"эпитет","source":"55398","rich":"Как дерево роняет тихо листья,<br>Так я роняю <span class=\"emph\">грустные</span> слова."},{"text":"Начинал он работу с энтузиазмом, а заканчивал с безразличием.","term":"антитеза","source":"55398"},{"text":"Кто я? Что я? Только лишь мечтатель,\nСинь очей утративший во мгле.\n(С. Есенин)","term":"вопросно-ответная форма изложения","source":"55398"},{"text":"Как в смирительную рубашку,\nМы природу берем в бетон.\n(С. Есенин)","term":"метафора","source":"55398","rich":"Как в смирительную рубашку,<br>Мы природу <span class=\"emph\">берем в бетон</span>."}],"explanation":"А 5  — метонимия, встаёт и поёт не зал, а люди, находящиеся в нём.\nБ 2  — эпитет\nВ 3  — антитеза, противопоставление начинал / заканчивал, с энтузиазмом / с безразличием\nГ 7  — вопросно-ответная форма изложения\nД 9  — метафора, природу нельзя в прямом смысле взять в бетон."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55399","options":["многосоюзие","литота","антитеза","метафора","анафора","сравнение","ассонанс","парцелляция","эпитет"],"items":[{"text":"Вы помните,\nВы всё, конечно, помните…","term":"анафора","source":"55399"},{"text":"Дивно устроен наш свет... Тот имеет отличного повара, но, к сожалению, такой маленький рот, что больше двух кусочков никак не может пропустить..","term":"литота","source":"55399"},{"text":"Снова грусть и тоска мою грудь облегли, и печалью слегка веет вновь издали.","term":"метафора","source":"55399"},{"text":"Все мы порою, как дети.\nЧасто смеемся и плачем:\nВыпали нам на свете\nРадости и неудачи.","term":"сравнение","source":"55399"},{"text":"Невесёлого счастья залог —\nСумасшедшее сердце поэта.","term":"эпитет","source":"55399"}],"explanation":"А 5  — анафора, словом «Вы» начинаются две рядом стоящие строки.\nБ 2  — литота, явное преуменьшение: такой маленький рот, что больше двух кусочков никак не может пропустить..\nВ 4  — метафора, выделенные глаголы употреблены в переносном значении.\nГ 6  — сравнение, выражено сравнительным оборотом с союзом «как».\nД 9  — эпитет(ы)"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55426","options":["метонимия","эпифора","риторическое восклицание","эпитет","гипербола","сравнение","ассонанс","лексический повтор","метафора"],"items":[{"text":"Шипенье пенистых бокалов\n(А. Пушкин)","term":"метонимия","source":"55426","rich":"Шипенье пенистых <span class=\"emph\">бокалов</span>"},{"text":"Какое же это счастье — оказаться вновь дома!","term":"риторическое восклицание","source":"55426"},{"text":"Она подумала: неужели эта красота еще и сейчас является людям, неужели за это время, которое она прожила на свете, красота совсем нисколько не увяла и не померкла?\n(В. Распутин)","term":"лексический повтор","source":"55426"},{"text":"«Вот на этом поле, — сказал Ноздрев, указывая пальцем на поле, — русаков такая гибель, что земли не видно».\n(Н. В. Гоголь)","term":"гипербола","source":"55426"},{"text":"Как эмаль, сверкает море,\nИ багряные закаты\nНа готическом соборе,\nСловно гарпии, крылаты.\n(А. А. Фет)","term":"сравнение","source":"55426"}],"explanation":"А 1  — метонимия, шипят не бокалы, а шампанское в них.\nБ 3  — риторическое восклицание.\nВ 8  — лексический повтор, слово «неужели».\nГ 5  — гипербола, г-н Ноздрёв явно преувеличивает («Мертвые души»)\nД 6  — сравнение, выражено сравнительными оборотами с союзом «как» и «словно»"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55427","options":["бессоюзие","лексический повтор","метонимия","парцелляция","риторическое обращение","сравнение","аллитерация","эпифора","эпитет"],"items":[{"text":"Ты не плачь, береза, бедная,\nне сетуй! Рана не смертельна, вылечится к лету...\n(А. Толстой)","term":"риторическое обращение","source":"55427"},{"text":"Лес, первый иней, талая вода.\nШел дождь, шиповник цвел, метель трубила...\n(В. Тушнова)","term":"бессоюзие","source":"55427"},{"text":"Адмирал видел смерть не раз. Та была бледная, белая. Встречал ее спокойно. Не тронула. Теперь другая. Красная. Страшна.\n(В. Зазубрин)","term":"парцелляция","source":"55427"},{"text":"Чуть слышно, бесшумно\nШуршат камыши.\n(К. Бальмонт)","term":"аллитерация","source":"55427","rich":"Чуть слы<span class=\"phoneme\">ш</span>но, бес<span class=\"phoneme\">ш</span>умно<br><span class=\"phoneme\">Ш</span>ур<span class=\"phoneme\">ш</span>ат камы<span class=\"phoneme\">ш</span>и."},{"text":"Перед ним возник горизонт, зловещий и внезапный.","term":"эпитет","source":"55427"}],"explanation":"А 5  — риторическое обращение.\nБ 1  — бессоюзие, ни одного союза между частями сложных предложений.\nВ 4  — парцелляция, намеренный отрыв слов от основного предложения.\nГ 7  — аллитерация, обратите внимание на обилие шипящих звуков.\nД 9  — эпитет(ы)"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55428","options":["многосоюзие","литота","антитеза","риторический вопрос","гипербола","сравнение","ассонанс","метафора","эпитет"],"items":[{"text":"Что ж ты жадно глядишь на дорогу\n(Н. Некрасов)","term":"эпитет","source":"55428"},{"text":"Глупым правит краткий миг.\nУмный знает все из книг.\nУмный глупому — не пара.\nУмный — груз, а глупый — тара.\n(Д. Хармс)","term":"антитеза","source":"55428"},{"text":"Скажи-ка, дядя, ведь не даром Москва, спаленная пожаром, французу отдана?\n(М. Лермонтов)","term":"риторический вопрос","source":"55428"},{"text":"У наших ушки на макушке,\nЧуть утро осветило пушки\nИ леса синие верхушки —\nФранцузы тут как тут.\n(М. Лермонтов)","term":"ассонанс","source":"55428","rich":"<span class=\"phoneme\">У</span> наших <span class=\"phoneme\">у</span>шки на мак<span class=\"phoneme\">у</span>шке,<br>Ч<span class=\"phoneme\">у</span>ть <span class=\"phoneme\">у</span>тро осветило п<span class=\"phoneme\">у</span>шки<br>И леса синие верх<span class=\"phoneme\">у</span>шки —<br>Франц<span class=\"phoneme\">у</span>зы т<span class=\"phoneme\">у</span>т как т<span class=\"phoneme\">у</span>т."},{"text":"Душа людская — та же льдина\nИ так же тает от лучей.\n(М. Цветаева)","term":"метафора","source":"55428"}],"explanation":"А 9  — эпитет, в данном примере выражен наречием.\nБ 3  — антитеза, с несколькими рядами антонимов (глупый−умный, груз−тара)\nВ 4  — риторический вопрос.\nГ 7  — ассонанс, буква «у» придаёт ритм стихотворению, и поэтому вовсе не случайно оно так легко запоминается.\nД 8  — метафора, переносное значение; душа не может таять, она не льдина. Здесь Марина Цветаева даже подсказку даёт, с чем мысленно сравнила душу.\nОпределение эпитета дано в материалах от ФИПИ, эти материалы опубликованы в «Правиле» к заданию."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55429","options":["многосоюзие","гипербола","антитеза","парцелляция","метонимия","сравнение","ассонанс","анафора","олицетворение"],"items":[{"text":"Гу...гу...гу...Бу...бу...бу... — ворчала серенькая зимняя даль где-то на западе.\n(М. Булгаков)","term":"олицетворение","source":"55429","rich":"Гу...гу...гу...Бу...бу...бу... — <span class=\"emph\">ворчала</span> серенькая зимняя даль где-то на западе."},{"text":"«Книга — хранилище знаний. Книга — вместилище всего\nвеликого опыта человечества. Книга — неистощимый источник высокого эстетического наслаждения, глубоких раздумий.\n(Б. Пастернак)","term":"анафора","source":"55429"},{"text":"Только слышно на улице где-то\nодинокая бродит гармонь\n(М. Исаковский)","term":"метонимия","source":"55429","rich":"Только слышно на улице где-то<br>одинокая бродит <span class=\"emph\">гармонь</span>"},{"text":"Из груди извлечет не речь, но стон; и не привет, упрёк услышит он\n(М. Лермонтов)","term":"антитеза","source":"55429"},{"text":"Надо мною свод воздушный,\nСловно синее стекло\n(А. Ахматова)","term":"сравнение","source":"55429"}],"explanation":"А 9  — олицетворение, даль ворчит, как человек.\nБ 8  — анафора, словом «книга» начинается каждое предложение.\nВ 5  — метонимия, не гармонь бродит, а гармонист.\nГ 3  — антитеза, две пары антонимов образуют её: «речь−стон», «не привет−упрёк».\nД 6  — сравнение, выражено сравнительным оборотом с союзом «словно»\nВ цитатах с ассонансом и аллитерацией всегда выделяются буквы. Обратитесь, пожалуйста, к правилу к заданию."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55430","options":["многосоюзие","риторический вопрос","антитеза","парцелляция","гипербола","сравнение","ассонанс","метафора","эпитет"],"items":[{"text":"Серой белкой прыгну на ольху,\nЛасочкой пугливой пробегу,\nЛебедью тебя я стану звать.\n(А. Ахматова)","term":"сравнение","source":"55430"},{"text":"Взложу на тетиву тугую,\nПослушный лук согну в дугу,\nА там пошлю наудалую,\nИ горе нашему врагу.\n(А. Пушкин)","term":"ассонанс","source":"55430","rich":"Взлож<span class=\"phoneme\">у</span> на тетив<span class=\"phoneme\">у</span> т<span class=\"phoneme\">у</span>г<span class=\"phoneme\">у</span>ю,<br>Посл<span class=\"phoneme\">у</span>шный л<span class=\"phoneme\">у</span>к согн<span class=\"phoneme\">у</span> в д<span class=\"phoneme\">у</span>г<span class=\"phoneme\">у</span>,<br>А там пошлю на<span class=\"phoneme\">у</span>дал<span class=\"phoneme\">у</span>ю,<br>И горе нашем<span class=\"phoneme\">у</span> враг<span class=\"phoneme\">у</span>."},{"text":"В любой любви есть капля яда,\nЛюбовь прошла — в душе досада,\nИ горечь сердце обожгла\n(И. А. Бунин)","term":"метафора","source":"55430","rich":"В любой любви есть капля яда,<br>Любовь прошла — в душе досада,<br>И горечь сердце <span class=\"emph\">обожгла</span>"},{"text":"Восток пурпуровым ковром\nЗажгла стыдливая Аврора\n(Ф. И. Тютчев)","term":"эпитет","source":"55430","rich":"Восток <span class=\"emph\">пурпуровым ковром</span><br>Зажгла <span class=\"emph\">стыдливая</span> Аврора"},{"text":"И какой же русский не любит быстрой езды? Его ли душе, стремящейся закружиться, загуляться,\nсказать иногда: «Черт побери все!» — его ли душе не любить ее?\n(Н. Гоголь)","term":"риторический вопрос","source":"55430"}],"explanation":"А 6  — сравнение, выражено творительным падежом (как белка, как ласочка)\nБ 7  — ассонанс, обратите внимание на количество букв у и на то, что у Пушкина они ещё и почти все ударные.\nВ 8  — метафора, обжигать физически и в переносном смысле  — это разные вещи.\nГ 9  — эпитет(ы).\nД 2  — риторический вопрос.\nЛаска  — это мелкий хищный зверёк."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"55431","options":["многосоюзие","риторическое обращение","вопросно-ответная форма изложения","парцелляция","риторическое восклицание","сравнение","аллитерация","эпифора","эпитет"],"items":[{"text":"Какое лето, что за лето!\nДа это просто колдовство\n(Ф. И. Тютчев)","term":"риторическое восклицание","source":"55431"},{"text":"Париж бежит, провожая меня, во всей невозможной красе.\n(В. Маяковский)","term":"аллитерация","source":"55431","rich":"Пари<span class=\"phoneme\">ж</span> бе<span class=\"phoneme\">ж</span>ит, прово<span class=\"phoneme\">ж</span>ая меня, во всей невозмо<span class=\"phoneme\">ж</span>ной красе."},{"text":"Он\nПеред нами\nОткрывает душу,\nА может быть, и новые моря,\nИ новую неведомую сушу,\nИ глубь, и высь...\n(И. А. Бунин)","term":"многосоюзие","source":"55431"},{"text":"А! Это снова ты. Не отроком влюбленным,\nНо мужем дерзостным, суровым, непреклонным\nТы в этот дом вошел и на меня глядишь\n(А. Ахматова)","term":"эпитет","source":"55431","rich":"А! Это снова ты. Не отроком влюбленным,<br>Но мужем <span class=\"emph\">дерзостным, суровым, непреклонным</span><br>Ты в этот дом вошел и на меня глядишь"},{"text":"Дело, конечно, было не в текстах ролей, плохих, хороших, в конце концов, это же ремесло, профессия — оплодотворять слова, ситуации, придуманные кем-то. Наполнять их содержанием. Смыслом. Действием. Собой. Своей сутью. Жизнью.\n(С. Вишневская)","term":"парцелляция","source":"55431"}],"explanation":"А 5  — риторическое восклицание.\nБ 7  — аллитерация, повтор буквы ж.\nВ 1  — многосоюзие, союз и повторяется четырежды.\nГ 9  — эпитет(ы). Выделение шрифтом является подсказкой.\nД 4  — парцелляция, намеренный отрыв слов от их основного предложения."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56099","options":["градация","синтаксический параллелизм","литота","многосоюзие","метонимия","гипербола","парцелляция","эпифора","сравнение"],"items":[{"text":"А за стенкою альт колдует —\nЭто с нами великий Бах.\n(А. А. Ахматова)","term":"метонимия","source":"56099","rich":"А за стенкою альт колдует —<br>Это с нами великий <span class=\"emph\">Бах</span>."},{"text":"И гул, и брань, и разговор,\nИ смех, и струнный перебор.\n(Д. С. Самойлов)","term":"многосоюзие","source":"56099"},{"text":"Крутой раствор особого цемента\nРассчитан был на тысячи веков.\n(А. Т. Твардовский)","term":"гипербола","source":"56099"},{"text":"Белый аист московский на белое небо взлетел,\nчёрный аист московский на чёрную землю спустился.\n(Б. Ш. Окуджава)","term":"синтаксический параллелизм","source":"56099"},{"text":"Вьётся в топке пламень белый,\nБелый⁠-⁠белый, будто снег.\n(Н. М. РУбцов)","term":"сравнение","source":"56099"}],"explanation":"А 5 метонимия  — В данном случае А. Ахматова говорит о произведениях Баха, а не о самом композиторе.\nБ 4 многосоюзие  — Несколько односоставных предложений включены в одно при помощи повторяющего союза «и».\nВ 6 гипербола  — Обратите внимание на фразу «тысячу веков», явное преувеличение.\nГ 2 синтаксический параллелизм  — Одинаковая синтаксическая модель рядом стоящих предложений: определение, подл., определение, определение, дополнение с предлогом, сказуемое.\nД 9 сравнение  — Сравнительный оборот выражен сочетанием слов «будто снег»."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56126","options":["литота","антитеза","сравнение","олицетворение","эпитет","анафора","парцелляция","многосоюзие","риторическое обращение"],"items":[{"text":"Пусть ветер, рябину занянчив,\nПугает её перед сном.\n(Б. Л. Пастернак)","term":"олицетворение","source":"56126"},{"text":"И цветы, и шмели, и трава, и колосья,\nИ лазурь, и полуденный зной...\nСрок настанет — Господь сына блудного спросит:\n«Был ли счастлив ты в жизни земной?»\n(И. А. Бунин)","term":"многосоюзие","source":"56126"},{"text":"Над чёрной канавой,\nНад битвой бурьянной,\nПоследнею славой\nВстаёшь, — безымянной.\n(М. И. Цветаева)","term":"эпитет","source":"56126"},{"text":"Гарун бежал быстрее лани,\nБыстрей, чем заяц от орла;\nБежал он в страхе с поля брани,\nГде кровь черкесская текла.\n(М. Ю. Лермонтов)","term":"сравнение","source":"56126"},{"text":"Цветы, любовь, деревня, праздность,\nПоля! я предан вам душой.\n(А. С. Пушкин)","term":"риторическое обращение","source":"56126"}],"explanation":"Установим соответствия.\nА 4 олицетворение  — придание свойств человека рябине (занянчив, пугает)\nБ 8 многосоюзие  — в одном предложении соединены простые назывные, союз «и» повторяется\nВ 5 эпитет  — битва названа «бурьянной», слава «последней». Это не логические определения, а несущие оценку автора.\nГ 3 сравнение  — быстрее лани, Быстрей, чем заяц от орла;\nД 9 риторическое обращение  — Обращение не с конкретной целью обратиться с речью к названным предметам.\nАнафора выражается только полнозначными словами. Смотрите правило к заданию от ФИПИ.\nВыделяются отдельные слова только на усмотрение автора-составителя."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56516","options":["градация","эпитет","гипербола","бессоюзие","метафора","парцелляция","риторический вопрос","эпифора","синтаксический параллелизм"],"items":[{"text":"Из тины тень, из сини сон,\nпока на Дон не ляжет день.\n \n(Н. Н. Асеев)","term":"метафора","source":"56516"},{"text":"Я иду. Покупаю букет по пути.\n \n(Б. А. Слуцкий)","term":"парцелляция","source":"56516"},{"text":"Ты, слово мое, как сады в глубине,\nты, слава моя, как сады и ограды.\n \n(О. А. Седакова)","term":"синтаксический параллелизм","source":"56516"},{"text":"Разве мало ему страданий,\nЧто вынес он до сих пор?\n \n(А. А. Ахматова)","term":"риторический вопрос","source":"56516"},{"text":"Твой город, улицу и дом,\nЧто так перу привычны были,\nМогу забыть.\n \n(Л. А. Алексеева)","term":"градация","source":"56516"}],"explanation":"Установим соответствия.\nА 5 метафора, переносное значение выделенного словосочетания.\nБ 6 парцелляция, второе предложение «оторвано» от первого, хотя имеет одно и то же подлежащее и должно быть оформлено через запятую.\nВ 9 синтаксический параллелизм, синтаксическая модель рядом стоящих строк одинакова.\nГ 7 риторический вопрос, в котором уже есть ответ.\nД 1 градация, от города к дому  — всё более конкретно уточняется место."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56543","options":["риторическое обращение","метонимия","риторический вопрос","эпитет","вопросно-ответная форма изложения","ассонанс","аллитерация","многосоюзие","антитеза"],"items":[{"text":"Из тины тень, из сини сон,\nпока на Дон не ляжет день.\n \n(Н. Н. Асеев)","term":"аллитерация","source":"56543","rich":"Из <span class=\"phoneme\">т</span>ины <span class=\"phoneme\">т</span>ень, из сини сон,<br>пока на Дон не ляже<span class=\"phoneme\">т</span> день."},{"text":"И не надо ходить. И нельзя не пойти.\nЯ иду. Покупаю букет по пути.\n \n(Б. А. Слуцкий)","term":"антитеза","source":"56543"},{"text":"Ты, слово мое, как сады в глубине,\nты, слава моя, как сады и ограды.\n \n(О. А. Седакова)","term":"риторическое обращение","source":"56543"},{"text":"Разве мало я живу на свете?\nСтрашно и выговорить, сколько\n \n(О. А. Седакова)","term":"вопросно-ответная форма изложения","source":"56543"},{"text":"Твой город, улицу и дом,\nЧто так перу привычны были,\nМогу забыть.\n \n(Л. А. Алексеева)","term":"метонимия","source":"56543","rich":"Твой город, улицу и дом,<br>Что так <span class=\"emph\">перу</span> привычны были,<br>Могу забыть."}],"explanation":"Установим соответствия.\nА  — 7 аллитерация, повторение одинаковых или однородных согласных звуков или звукосочетаний.\nБ  — 9 антитеза: не надо ходить и нельзя не пойти.\nВ  — 1 риторическое обращение, обращение к неодушевлённым адресатам или фиктивным по существу.\nГ  — 5 вопросно-ответная форма изложения, представляет собой диалог говорящего/пишущего с самим собой.\nД  — 2 обращаем внимание на выделенное жирным слово «перу», вспоминаем, что именно метонимия всегда будет выделена (об этом можно прочитать в Правиле к заданию) и проверяем, является ли выделенное слово метонимией. Да, является, так как имеется в виду, что город и улица были привычны не перу, а человеку, который писал им. Перенос по смежности «орудие-человек»."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56978","options":["антитеза","гипербола","лексический повтор","метонимия","олицетворение","риторическое восклицание","риторическое обращение","сравнение","эпитет"],"items":[{"text":"И озеро с волной зеркальной,\nИ луг с цветным своим ковром.\n(П. А. Вяземский)","term":"эпитет","source":"56978"},{"text":"Мужество рождается в борьбе.\n(Н. А. Островский)","term":"олицетворение","source":"56978"},{"text":"Какая прелесть в речах твоих!\n(А. Н. Островский)","term":"риторическое восклицание","source":"56978"},{"text":"И тот, кто с песней по жизни шагает,\nТот никогда и нигде не пропадёт.\n(В. И. Лебедев-Кумач)","term":"лексический повтор","source":"56978"},{"text":"Материнская ласка не знает конца.\n(Пословица)","term":"гипербола","source":"56978"}],"explanation":"Установим соответствия.\nА 9  — эпитет (волна зеркальная).\nБ 5  — олицетворение.\nВ 6  — риторическое восклицание\nГ 3  — лексический повтор.\nД 2  — гипербола."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56979","options":["антитеза","вопросно-ответная форма изложения","гипербола","литота","метонимия","парцелляция","риторический вопрос","синтаксический параллелизм","сравнение"],"items":[{"text":"Врага отбросила Москва,\nИ спасена Россия.\n(А. Т. Твардовский)","term":"метонимия","source":"56979","rich":"Врага отбросила <span class=\"emph\">Москва</span>,<br>И спасена <span class=\"emph\">Россия</span>."},{"text":"Он уже рассказал мне о себе, а мне было нечего рассказывать.\n(М. Ю. Лермонтов)","term":"антитеза","source":"56979"},{"text":"Поздняя осень. Грачи улетели,\nЛес обнажился, поля опустели.\n(Н. А. Некрасов)","term":"синтаксический параллелизм","source":"56979"},{"text":"Как можно судить о творчестве Льва Николаевича Толстого, посмотрев фильм, но не прочитав «Войны и мира»?\n(Из газет)","term":"риторический вопрос","source":"56979"},{"text":"А много ль рассветов ты встретил в лесу?\nНе больше, чем два или три.\n(С. Я. Маршак)","term":"вопросно-ответная форма изложения","source":"56979"}],"explanation":"Установим соответствия.\nА 5  — метонимия.\nБ 1  — антитеза.\nВ 8  — синтаксический параллелизм. Он построен на базе трёх соседних простых предложений, имеющих абсолютно одинаковую структуру: [Подлежащее (сущ.)] + [Сказуемое (глагол)]\nГ 7  — риторический вопрос.\nД 2  — вопросно-ответная форма изложения."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56980","options":["антитеза","вопросно-ответная форма изложения","гипербола","многосоюзие","олицетворение","парцелляция","риторический вопрос","сравнение","эпитет"],"items":[{"text":"— Где ж лучше?\n— Где нас нет.\n(А. С. Грибоедов)","term":"вопросно-ответная форма изложения","source":"56980"},{"text":"Длинные серёжки развешаны, словно колокольчики, по ветвям.\n(Е. В. Максимов)","term":"сравнение","source":"56980"},{"text":"Его убийца хладнокровно навёл удар...\n(М. Ю. Лермонтов)","term":"эпитет","source":"56980"},{"text":"Недаром говорится,\nЧто дело мастера боится.\n(И. А. Крылов)","term":"олицетворение","source":"56980","rich":"Недаром говорится,<br>Что дело мастера <span class=\"emph\">боится</span>."},{"text":"Дома новы, но предрассудки стары.\n(А. С. Грибоедов)","term":"антитеза","source":"56980"}],"explanation":"А 2  — вопросно-ответная форма изложения.\nБ 8  — сравнение.\nВ 9  — эпитет (наречие «хладнокровно»)\nГ 5  — олицетворение\nД 1  — антитеза."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56981","options":["анафора","ассонанс","олицетворение","метафора","метонимия","многосоюзие","антитеза","сравнение","эпифора"],"items":[{"text":"Вы правы: из огня тот выйдет невредим,\nКто с вами день пробыть успеет.\n(А. С. Грибоедов)","term":"метафора","source":"56981"},{"text":"Кто кивер чистил весь избитый,\nКто штык точил, ворча сердито,\nКусая длинный ус.\n(М. Ю. Лермонтов)","term":"анафора","source":"56981"},{"text":"Лодка была точно приклеена к чёрной воде.\n(М. Горький)","term":"сравнение","source":"56981"},{"text":"...Вечные французы,\n...Когда избавит нас творец\nОт шляпок их! чепцов! и шпилек! и булавок!\nИ книжных и бисквитных лавок!..\n(А. С. Грибоедов)","term":"многосоюзие","source":"56981"},{"text":"Дома новы, но предрассудки стары.\n(А. С. Грибоедов)","term":"антитеза","source":"56981"}],"explanation":"А 4  — метафора (выйти из огня).\nБ 1  — анафора (Кто/Кто).\nВ 8  — сравнение (союз «точно»).\nГ 6  — многосоюзие\nД 7  — антитеза."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56982","options":["антитеза","ассонанс","бессоюзие","лексический повтор","метонимия","парцелляция","сравнение","эпитет","эпифора"],"items":[{"text":"Люблю родную сторону\nВо всём её наряде скромном.\n(М. В. Исаковский)","term":"эпитет","source":"56982"},{"text":"Я расхохотался, увидев эту маленькую фигурку под огромной косматой шапкой.\n(М. Ю. Лермонтов)","term":"антитеза","source":"56982"},{"text":"Писательский талант состоит в умении выбрать верное слово и поставить его на верное место.\n(К. Чуковский)","term":"лексический повтор","source":"56982"},{"text":"Шум его [моря], подобный ропоту засыпающего города, напомнил мне старые годы.\n(М. Ю. Лермонтов)","term":"сравнение","source":"56982"},{"text":"Я мужчина хоть куда. В полном расцвете сил.\n(Из мультфильма)","term":"парцелляция","source":"56982"}],"explanation":"А 8  — эпитет.\nБ 1  — антитеза (маленькую/ огромной).\nВ 4  — лексический повтор (верное).\nГ 7  — сравнение (подобный).\nД 6  — парцелляция, намеренный отрыв слов от их основного предложения."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56983","options":["аллитерация","анафора","антитеза","бессоюзие","градация","метафора","многосоюзие","парцелляция","сравнение"],"items":[{"text":"Имей смелость иметь своё мнение. Имей мудрость скрывать его.\n(Алан Рикман)","term":"анафора","source":"56983"},{"text":"Несчастным или счастливым человека делают только его мысли, а не внешние обстоятельства.\n(Фридрих Вильгельм Ницше)","term":"антитеза","source":"56983"},{"text":"Когда закрывается одна дверь к счастью, открывается другая. Но мы часто так долго смотрим на первую, что не замечаем вторую.\n(Хелен Келлер)","term":"метафора","source":"56983"},{"text":"Окрестный лес, как бы в тумане,\nСинел в дыму пороховом.\nА там вдали грядой нестройной,\nНо вечно гордой и спокойной,\nТянулись горы...\n(М. Ю. Лермонтов)","term":"сравнение","source":"56983"},{"text":"Но отчего же нигде ни палаток, ни торговцев, ни наваленных товаров?\n(А. С. Серафимович)","term":"многосоюзие","source":"56983"}],"explanation":"А 2  — анафора (Имей/Имей).\nБ 3  — антитеза.\nВ 6  — метафора, причём расширенная. В этой цитате есть также антитеза, но двух антитез быть в ответе не может.\nГ 9  — сравнение (тянулись «грядой», Тв. падеж).\nД 7  — многосоюзие."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56996","options":["вопросно-ответная форма изложения","метафора","парцелляция","олицетворение","гипербола","бессоюзие","метонимия","риторический вопрос","риторическое обращение"],"items":[{"text":"Как долго ждали мы тебя, весна!\n(Я. Омельченко)","term":"риторическое обращение","source":"56996"},{"text":"Благородный человек погибнет в окружении конкуренции и злобы? Нет! Именно он и победит.\n(Борис Михайлович Бим-Бад)","term":"вопросно-ответная форма изложения","source":"56996"},{"text":"— Мыслимое ли дело добывать — да раз за разом! — столь осторожных птиц?!\n(В. Ростовцев)","term":"риторический вопрос","source":"56996"},{"text":"Я ехал по земле, везде засеянной хлебом.\n(А. С. Пушкин)","term":"метонимия","source":"56996","rich":"Я ехал по земле, везде засеянной <span class=\"emph\">хлебом</span>."},{"text":"На обсохших сжатых полях, на их колючей жёлтой щетине заблестела... осенняя паутина.\n(А. И. Куприн)","term":"метафора","source":"56996"}],"explanation":"А 9  — риторическое обращение (весна).\nБ 1  — вопросно-ответная форма изложения.\nВ 8  — риторический вопрос .\nГ 7  — метонимия (хлеб/зерно, пшеница).\nД 2  — метафора (щетина полей)."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56997","options":["бессоюзие","ассонанс","метафора","литота","анафора","риторическое восклицание","гипербола","многосоюзие","сравнение"],"items":[{"text":"— Мыслимое ли дело добывать — да раз за разом! — столь осторожных птиц неимоверной величины?!\n(В. Ростовцев)","term":"гипербола","source":"56997"},{"text":"И как же счастлив человек, который всю жизнь, каждый день делает открытия!\n(Алексей Алексеевич Леонтьев)","term":"риторическое восклицание","source":"56997"},{"text":"Одиннадцатый класс как песочные часы. Сверху — школа, снизу — ты.\n(Наталья Михайлова)","term":"сравнение","source":"56997"},{"text":"На самом же деле люди не равны ни телом, ни душою, ни духом.\n(Иван Александрович Ильин)","term":"многосоюзие","source":"56997"},{"text":"Таким образом, справедливость означает именно неравенство: беречь ребёнка, помогать слабому, снисходить к уставшему, ухаживать за больным; проявлять больше строгости к безвольному, больше доверия честному, больше осторожности к болтуну; герою оказывать почести.\n(Иван Александрович Ильин)","term":"бессоюзие","source":"56997"}],"explanation":"А 7  — гипербола.\nБ 6  — риторическое восклицание.\nВ 9  — сравнение.\nГ 8  — многосоюзие (ни/ни/ни).\nД 1  — бессоюзие."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56998","options":["риторическое восклицание","олицетворение","эпитет","вопросно-ответная форма изложения","метафора","эпифора","гипербола","анафора","ассонанс"],"items":[{"text":"А горы зноем дышали в небо.\n(М. Горький)","term":"олицетворение","source":"56998"},{"text":"Прощай, свободная стихия!\nВ последний раз передо мной\nТы катишь волны голубые\nИ блещешь гордою красой.\n(А. С. Пушкин)","term":"эпитет","source":"56998"},{"text":"Любовь к Отечеству не может... угаснуть в наших сердцах.\n(А. Н. Толстой)","term":"метафора","source":"56998"},{"text":"С моей душой стряслась беда.\nС душой моей стряслась беда.\n(С. А. Есенин)","term":"эпифора","source":"56998"},{"text":"Не пой! не пой мне! Пощади.\nИ так огонь горит в груди.\n(С. А. Есенин)","term":"анафора","source":"56998"}],"explanation":"А 2  — олицетворение (горы дышат).\nБ 3  —  эпитет.\nВ 5  — метафора (любовь угаснуть)\nГ 6  — эпифора.\nД 8  — анафора. Обратитесь к правилам от ФИПИ (прикреплены к заданию)."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"56999","options":["риторическое обращение","анафора","метонимия","вопросно-ответная форма изложения","эпифора","многосоюзие","риторический вопрос","гипербола","олицетворение"],"items":[{"text":"Отчего прослыл я шарлатаном?\nОтчего прослыл я скандалистом?\n(С. А. Есенин)","term":"анафора","source":"56999"},{"text":"Луна будет улыбаться весь вечер.\n(А. П. Чехов)","term":"олицетворение","source":"56999"},{"text":"В три года Горюхино... обнищало.\n(А. С. Пушкин)","term":"метонимия","source":"56999","rich":"В три года <span class=\"emph\">Горюхино</span>... обнищало."},{"text":"А люди разве не цветы?\nО милая, почувствуй ты,\nЗдесь не пустынные слова.\n(С. А. Есенин)","term":"риторический вопрос","source":"56999"},{"text":"Что такое благодарность? Это ответ живого, любящего сердца на оказанное ему благодеяние.\n(Иван Александрович Ильин)","term":"вопросно-ответная форма изложения","source":"56999"}],"explanation":"А 2  — анафора.\nБ 9  — олицетворение (луна улыбаться).\nВ 3  — метонимия.\nГ 7  — риторический вопрос.\nД 4  — вопросно-ответная форма изложения.\nПо задумке разработчиков, одно и то же средство выразительности может встречаться в разных цитатах. Да, под буквой А можно увидеть риторический вопрос. Тогда что в Г? Обращение «О милая» не риторическое, а больше и нет ничего из списка. Следовательно, Г  — это 7. Букве А остаётся анафора."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57000","options":["гипербола","риторическое восклицание","многосоюзие","метафора","литота","метонимия","аллитерация","лексический повтор","парцелляция"],"items":[{"text":"Я счастлив тем, что я оттуда, из той зимы, из той избы.\n(А. Т. Твардовский)","term":"лексический повтор","source":"57000"},{"text":"Порядочный человек от вас за тридевять земель убежать готов.\n(Ф. Достоевский)","term":"гипербола","source":"57000"},{"text":"Знаете ли что? Пойдемте теперь к ней все вместе. Она живет отсюда в двух шагах.\n(И. С. Тургенев)","term":"литота","source":"57000"},{"text":"Да будет проклят твой род в лице предков и потомков! Да будут они изгнаны с высот прекрасного Кавказа! Да не увидят они никогда благословенной Грузии!\n(А. И. Куприн)","term":"риторическое восклицание","source":"57000"},{"text":"Разве я не знаю, что он не стал бы обманывать меня, что он не имеет видов на Сорокину, что он не влюблен в Кити, что он не изменит мне?\n(Л. Н. Толстой)","term":"многосоюзие","source":"57000"}],"explanation":"А 8  — лексический повтор (я, той).\nБ 1  — гипербола (за тридевять земель).\nВ 5  — литота.\nГ 2  — риторическое восклицание. Не может быть лексическим повтором, так как слово «да» не является знаменательным.\nД 3  — многосоюзие. В этом примере есть также лексический повтор, но двух повторов в ответе быть не может."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57001","options":["литота","метафора","риторическое восклицание","вопросно-ответная форма изложения","риторическое обращение","синтаксический параллелизм","гипербола","многосоюзие","анафора"],"items":[{"text":"[Богатырь]С горы на гору стал перескакивать,\nC холмы на холмы стал перемахивать,\nМелки реченьки, озёрка промеж ног пускал.\n(из фольклора)","term":"гипербола","source":"57001"},{"text":"Ваш шпиц — прелестный шпиц, не более наперстка,\nЯ гладил всё его: как шёлковая шёрстка.\n(А. С. Грибоедов)","term":"литота","source":"57001"},{"text":"Господи, сколько бутылок! Ах, какая я глупенькая! Так вот она дружба-то!\n(Н. Г. Чернышевский)","term":"риторическое восклицание","source":"57001"},{"text":"Оставь мне, Господи,\nБолезнь мою почетную,\nПо ней я дворянин!\n(Н. А. Некрасов)","term":"риторическое обращение","source":"57001"},{"text":"Потому что посылают лес пилить — иду, дают ... палку в руки — беру, велят печи в канцелярии топить — топлю.\n(А. П. Чехов)","term":"синтаксический параллелизм","source":"57001"}],"explanation":"А 7  — гипербола.\nБ 1  — литота.\nВ 3  — риторическое восклицание.\nГ 5  — риторическое обращение.\nД 6  — синтаксический параллелизм."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57087","options":["лексический повтор","риторическое обращение","градация","парцелляция","олицетворение","сравнение","анафора","метонимия","гипербола"],"items":[{"text":"То слезы в три ручья, то рот до ушей.\n \n(Ф. А. Абрамов)","term":"гипербола","source":"57087"},{"text":"Шумен, весел был салон...\nКак, однако, милы пляски\nПерешедших Рубикон!..\n \n(К. К. Случевский)","term":"метонимия","source":"57087","rich":"Шумен, весел был <span class=\"emph\">салон</span>...<br>Как, однако, милы пляски<br>Перешедших Рубикон!.."},{"text":"Прошло ещё несколько недель, и вдруг судьба сурово, но всё же милостиво улыбнулась Илье.\n \n(М. Горький)","term":"олицетворение","source":"57087"},{"text":"Не прислав предварительного письма, никого не предупредив, свалился он как снег на голову.\n \n(И. С. Тургенев)","term":"сравнение","source":"57087"},{"text":"Кого ни послушаешь, почти все на что-то жалуются, негодуют, вопиют\n \n(По М. Е. Салтыкову-Щедрину)","term":"градация","source":"57087"}],"explanation":"Установим соответствия.\nА 9 явная гипербола, отличный пример;\nБ 8 метонимия, не салон, а люди в нём;\nВ 5 олицетворение, судьба улыбнулась (как человек);\nГ 6 сравнение, выраженное фразеологизмом, поэтому нет запятой;\nД 3 градация, постепенное нарастание силы проявления в значениях слов-сказуемых"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57120","options":["метонимия","сравнение","лексический повтор","эпифора","литота","инверсия","градация","олицетворение","многосоюзие"],"items":[{"text":"Ещё одна буря в стакане воды произошла на ровном месте.\n \n(Л. Зорин)","term":"литота","source":"57120"},{"text":"Засвистал он по-соловьиному, в другой\nзашипел по-змеиному, а в третий\nзарявкал по-звериному — под Ильёю конь окарачился...\n \n(И. И. Лаженчиков)","term":"сравнение","source":"57120"},{"text":"Там шептались, нежно жались,\nк травам травы обвивались, обнимали свет,\nсвет рождался, и по всем листам дубравы\nпробуждался шум в ответ.\n \n(Л. Д. Семёнов)","term":"олицетворение","source":"57120"},{"text":"Мальчик добрый, хороший... светлая\nголова и достоин лучшей участи.\n \n(А. П. Чехов)","term":"метонимия","source":"57120","rich":"Мальчик добрый, хороший... светлая<br><span class=\"emph\">голова</span> и достоин лучшей участи."},{"text":"Не верю я в утешных снов избыток\nТого, кто спит, улыбке вопреки.\n \n(Б. А. Ахмадулина)","term":"инверсия","source":"57120"}],"explanation":"Установим соответствия.\nА  — литота. По мнению авторов задания, буря в стакане  — это нечто совершенно незначительное, мелкое, а значит, литота.\nБ  — сравнение.\nВ  — олицетворение.\nГ  — метонимия.\nД  — инверсия."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57524","options":["многосоюзие","риторическое восклицание","градация","парцелляция","олицетворение","сравнение","эпифора","метонимия","гипербола"],"items":[{"text":"Что вижу я? Латинские стихи!\nСтократ священ союз меча и лиры,\nЕдиный лавр их дружно обвивает.\n(А. С. Пушкин)","term":"гипербола","source":"57524"},{"text":"Сначала к делу стала присматриваться власть прокурорская, затем его взяла в руки власть судебная...\n(А. Ф. Кони)","term":"метонимия","source":"57524","rich":"Сначала к делу стала присматриваться <span class=\"emph\">власть прокурорская</span>, затем его взяла в руки <span class=\"emph\">власть судебная</span>..."},{"text":"Да, на бароновых похоронах\nПрольётся больше денег, нежель слёз.\nПошли вам Бог скорей наследство.\n(А. С. Пушкин)","term":"сравнение","source":"57524"},{"text":"На прощанье Анна Михайловна подарила мне платок. Вышитый, наверное, ещё в её девичестве.\n(В. Н. Крупин)","term":"парцелляция","source":"57524"},{"text":"Есть упоение в бою,\nИ бездны мрачной на краю,\nИ в разъярённом океане,\nСредь грозных волн и бурной тьмы,\nИ в аравийском урагане,\nИ в дуновении Чумы.\n(А. С. Пушкин)","term":"многосоюзие","source":"57524"}],"explanation":"Установим соответствия.\nА 9  — гипербола во фразеологизме, слово «стократ» означает «во много раз».\nБ 8  — метонимия. Ведёт дела не власть, а судьи и прокуроры.\nВ 6  — сравнение. Устаревший сравнительный союз «нежель», равен союзу «чем».\nГ 4  — парцелляция. Причастный оборот в виде отдельного предложения.\nД 1  — многосоюзие."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57552","options":["аллитерация","риторический вопрос","литота","сравнение","ассонанс","парцелляция","метонимия","анафора","вопросно-ответная форма изложения"],"items":[{"text":"Не в моде\nТеперь такие песни! Но всё ж есть\nЕщё простые души: рады таять\nОт женских слёз и слепо верят им.\n(А. С. Пушкин)","term":"метонимия","source":"57552","rich":"Не в моде<br>Теперь такие песни! Но всё ж есть<br>Ещё простые <span class=\"emph\">души</span>: рады таять<br>От женских слёз и слепо верят им."},{"text":"Он скакал козлом и посылал ей\nвоздушные поцелуи.\n(В. Я. Шишков)","term":"сравнение","source":"57552","rich":"Он скакал <span class=\"emph\">козлом</span> и посылал ей<br>воздушные поцелуи."},{"text":"Что пользы, если Моцарт будет жив\nИ новой высоты ещё достигнет?\nПодымет ли он тем искусство? Нет.\n(А. С. Пушкин)","term":"вопросно-ответная форма изложения","source":"57552","rich":"Что пользы, если Моцарт будет жив<br>И новой высоты ещё достигнет?<br><span class=\"emph\">Подымет ли он тем искусство? Нет.</span>"},{"text":"Монголов (это Чинков угадал) всегда неприязненно думал о золоте. О самородном металле, приобретшем властную силу над миром.\n(По О. М. Куваеву)","term":"парцелляция","source":"57552"},{"text":"Мне, мне молиться с вами, Дона Анна!\nЯ не достоин участи такой.\nЯ не дерзну порочными устами\nМольбу святую вашу повторять —\nЯ только издали с благоговеньем\nСмотрю на вас.\n(А. С. Пушкин)","term":"анафора","source":"57552","rich":"Мне, мне молиться с вами, Дона Анна!<br><span class=\"emph\">Я</span> не достоин участи такой.<br><span class=\"emph\">Я</span> не дерзну порочными устами<br>Мольбу святую вашу повторять —<br><span class=\"emph\">Я</span> только издали с благоговеньем<br>Смотрю на вас."}],"explanation":"Установим соответствия.\nА 7  — метонимия (не души, а люди с такой душой).\nБ 4  — сравнение, выражено творительным падежом имени сущ., равносильно «как».\nВ 9  — вопросно-ответная форма изложения, на вопрос даёт ответ сам автор.\nГ 6  — парцелляция, намеренно отделена часть предложения.\nД 8  — анафора, местоимение Я в начале каждого предложения.\nОтвет на вопрос: Почему в пункте «Г» не подходит ассонанс? Повтор «о» многократный.\nЕсли подразумевается ассонанс и аллитерация, буквы всегда выделяются жирным шрифтом."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57629","options":["анафора","градация","метонимия","эпитет","парцелляция","многосоюзие","синтаксический параллелизм","метафора","риторический вопрос"],"items":[{"text":"Лучи солнца ворвались в окна и заиграли яркими медными пятнами на темных обоях, на скатерти, на хрустале, на лицах обедающих.\n(А. И. Куприн)","term":"метонимия","source":"57629","rich":"Лучи солнца ворвались в окна и заиграли яркими медными пятнами на темных обоях, на скатерти, на <span class=\"emph\">хрустале</span>, на лицах обедающих."},{"text":"Поют весёлые птицы, гудят невидимые струны, сочный воздух леса весь дрожит, полон ласковой музыки.\n(М. Горький)","term":"эпитет","source":"57629"},{"text":"Процветай, народ, —\nТвердый, как скрижаль,\nЖаркий, как гранат,\nЧистый, как хрусталь.\n(М. Цветаева)","term":"синтаксический параллелизм","source":"57629"},{"text":"Сквозь все невозможные невзгоды, сквозь мрак, холод и туман всегда пробиваются светлая мысль, бодрость, надежда и мужество.\n(М. Зощенко)","term":"метафора","source":"57629"},{"text":"Нежно-тонки очертанья\nЗадремавшей дали...\nПолно, разве есть страданья?\nРазве есть печали?\n(К. Бальмонт)","term":"риторический вопрос","source":"57629"}],"explanation":"Установим соответствия:\nА 3  — метонимия, не на хрустале, а изделиях из него;\nБ 4  — эпитет;\nВ 7  — синтаксический параллелизм, повторение одной и той же синтаксической модели (сравнительный оборот)\nГ 8  — метафора, переносное значение;\nД 9  — риторический вопрос, автор не ждёт ответа."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57630","options":["анафора","метонимия","метафора","бессоюзие","парцелляция","многосоюзие","риторическое обращение","сравнение","эпитет"],"items":[{"text":"Лучи солнца ворвались в окна и заиграли яркими медными пятнами на темных обоях, на скатерти, на хрустале, на лицах обедающих.\n(А. И. Куприн)","term":"метафора","source":"57630"},{"text":"Поют весёлые птицы, гудят невидимые струны, сочный воздух леса весь дрожит, полон ласковой музыки.\n(М. Горький)","term":"бессоюзие","source":"57630"},{"text":"Процветай, народ, —\nТвердый, как скрижаль,\nЖаркий, как гранат,\nЧистый, как хрусталь.\n(М. Цветаева)","term":"риторическое обращение","source":"57630"},{"text":"Да разве любят за что-нибудь? Любят так, просто!.. Настоящая любовь — она, как солнце в небе, неизвестно на чем держится.\n(М. Горький)","term":"сравнение","source":"57630"},{"text":"Нежно-тонки очертанья\nЗадремавшей дали...\nПолно, разве есть страданья?\nРазве есть печали?\n(К. Бальмонт)","term":"эпитет","source":"57630"}],"explanation":"Установим соответствия:\nА 3  — метафора, переносное значение;\nБ 4  — бессоюзие, нет союзов между частями сложного предложения;\nВ 7  — риторическое обращение, обращение не к конкретному лицу;\nГ 8  — сравнение, выражено сравнительным оборотом;\nД 9  — эпитет, образное определение, выражено причастием"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57632","options":["анафора","инверсия","метафора","бессоюзие","парцелляция","многосоюзие","риторическое восклицание","эпифора","эпитет"],"items":[{"text":"Лучи солнца ворвались в окна и заиграли яркими медными пятнами на темных обоях, на скатерти, на хрустале, на лицах обедающих.\n(А. И. Куприн)","term":"бессоюзие","source":"57632"},{"text":"Поют весёлые птицы, гудят невидимые струны, сочный воздух леса весь дрожит, полон ласковой музыки.\n(М. Горький)","term":"метафора","source":"57632"},{"text":"Нет в мире неба без орла.\nНет без орла вершины.\nНет в мире музыки без слез,\nНет правды без ошибки.\n(М. А. Дудин)","term":"анафора","source":"57632"},{"text":"Точно небо, высока ты,\nТочно море, широка ты,\nНеобъятная дорога молодежная!\n(М. И. Лебедев-Кумач)","term":"эпифора","source":"57632"},{"text":"Только тогда будешь в силах воздержаться от злых дел, когда научишься воздерживаться от злых мыслей.\n(Л. Н. Толстой)","term":"эпитет","source":"57632"}],"explanation":"Установим соответствия:\nА 4  — бессоюзие, нет союзов между однородным членами;\nБ 3  — метафора, переносное значение слова;\nВ 1  — анафора, повторение слова «Нет» в начале каждой строки;\nГ 8  — эпифора, повторение слова «Ты» в конце строк;\nД 9  — эпитет: слово «злых» несёт авторскую оценку."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57633","options":["сравнение","градация","антитеза","синтаксический параллелизм","эпитет","гипербола","аллитерация","олицетворение","литота"],"items":[{"text":"Ветер нежно играл с листьями деревьев, создавая неповторимую симфонию природы.","term":"олицетворение","source":"57633"},{"text":"Он был так зол, что готов был разнести весь дом.","term":"гипербола","source":"57633"},{"text":"Нет в мире неба без орла.\nНет без орла вершины.\nНет в мире музыки без слез,\nНет правды без ошибки.\n(М. А. Дудин)","term":"синтаксический параллелизм","source":"57633"},{"text":"Точно небо, высока ты,\nТочно море, широка ты,\nНеобъятная дорога молодежная!\n(М. И. Лебедев-Кумач)","term":"сравнение","source":"57633"},{"text":"Все притихли в каком-то грустном обаянии этого вечернего часа.\n(А. И. Куприн)","term":"эпитет","source":"57633"}],"explanation":"Установим соответствия:\nА 8  — олицетворение, разновидность метафоры, наделение неживых предметов чертами человека.\nБ 6  — гипербола, явное преувеличение силы злости;\nВ 4  — синтаксический параллелизм, сходное строение всей строфы; идентичны по строению 1 и 3 строка, 2 и 4.\nГ 1  — сравнение;\nД 5  — эпитет, слово «грустном» содержит авторскую оценку."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57634","options":["риторическое восклицание","сравнение","риторический вопрос","эпифора","вопросно-ответная форма изложения","метафора","олицетворение","парцелляция","гипербола"],"items":[{"text":"В гибком зеркале природы\nЗвезды — невод, рыбы — мы,\nБоги — призраки у тьмы.\n(В. Хлебников)","term":"метафора","source":"57634","rich":"В гибком зеркале природы<br>Звезды — <span class=\"emph\">невод</span>, рыбы — <span class=\"emph\">мы</span>,<br>Боги — <span class=\"emph\">призраки у тьмы</span>."},{"text":"Его любовь к музыке была настолько велика, что он мог слушать её вечность.","term":"гипербола","source":"57634"},{"text":"Процветай, народ, —\nТвердый, как скрижаль,\nЖаркий, как гранат,\nЧистый, как хрусталь.\n(М. Цветаева)","term":"сравнение","source":"57634"},{"text":"Да разве любят за что-нибудь? Любят так, просто!.. Настоящая любовь — она, как солнце в небе, неизвестно на чем держится.\n(М. Горький)","term":"вопросно-ответная форма изложения","source":"57634"},{"text":"О, весна! Как сердце счастья просит!\nКак сладка печаль моя весной!\n(И. А. Бунин)","term":"риторическое восклицание","source":"57634"}],"explanation":"Установим соответствия:\nА 6  — метафора, обратите внимание на такую форму, когда сказуемое является метафорой, имеет переносное значение. Если бы был союз «как»  — было бы сравнение;\nБ 9  — гипербола, явное преувеличение любви к музыке;\nВ 2  — сравнение, выражено сравнительными оборотами;\nГ 5  — вопросно-ответная форма изложения, автор сам отвечает на свой вопрос;\nД 1  — риторическое восклицание в части «Как...»"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57635","options":["метафора","аллитерация","сравнение","синтаксический параллелизм","ассонанс","бессоюзие","градация","эпитет","риторический вопрос"],"items":[{"text":"Я слушал вас... И мне едва\nНе снились вновь, как в час разлуки,\nДавно замолкшие слова,\nДавно исчезнувшие звуки\n(А. Н. Апухтин)","term":"синтаксический параллелизм","source":"57635"},{"text":"Идеал — путеводная звезда. Без нее нет твердого направления, а нет направления — нет жизни.\n(Л. Н. Толстой)","term":"метафора","source":"57635","rich":"Идеал — <span class=\"emph\">путеводная звезда</span>. Без нее нет твердого направления, а нет направления — нет жизни."},{"text":"Хронического счастья так же нет, как нетающего льда.\n(А. И. Герцен)","term":"сравнение","source":"57635","rich":"Хронического счастья так же нет, <span class=\"emph\">как нетающего льда</span>."},{"text":"Хотите дружбы настоящей?\nДостойны будете — придёт.\n(С. П. Щипачев)","term":"эпитет","source":"57635","rich":"Хотите дружбы <span class=\"emph\">настоящей</span>?<br>Достойны будете — придёт."},{"text":"Есть в русской природе усталая нежность,\nБезмолвная боль затаенной печали,\nБезвыходность горя, безгласность, безбрежность,\nХолодная высь, уходящие дали.\n(К. Бальмонт)","term":"бессоюзие","source":"57635"}],"explanation":"Установим соответствия:\nА 4  — синтаксический параллелизм  — одинаково построены две последние строки;\nБ 1  — метафора  — обратите внимание, сказуемое-метафора;\nВ 3  — сравнение;\nГ 8  — эпитет;\nД 6  — бессоюзие  — однородные подлежащие без союзов."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57636","options":["бессоюзие","метонимия","эпитет","многосоюзие","риторическое обращение","антитеза","метафора","эпифора","сравнение"],"items":[{"text":"Я слушал вас... И мне едва\nНе снились вновь, как в час разлуки,\nДавно замолкшие слова,\nДавно исчезнувшие звуки\n(А. Н. Апухтин)","term":"сравнение","source":"57636","rich":"Я слушал вас... И мне едва<br>Не снились вновь, <span class=\"emph\">как в час разлуки</span>,<br>Давно замолкшие слова,<br>Давно исчезнувшие звуки"},{"text":"Начало пути было легким, зато конец оказался трудным.","term":"антитеза","source":"57636"},{"text":"Хронического счастья так же нет, как нетающего льда.\n(А. И. Герцен)","term":"эпитет","source":"57636","rich":"<span class=\"emph\">Хронического</span> счастья так же нет, как нетающего льда."},{"text":"Хотите дружбы настоящей?\nДостойны будете — придёт.\nНайдёте и свою дорогу,\nЧтоб светлая вела звезда,\nно счастье к нашему порогу\nсамо приходит не всегда.\n(С. П. Щипачев)","term":"метафора","source":"57636","rich":"Хотите дружбы настоящей?<br>Достойны будете — придёт.<br>Найдёте и свою дорогу,<br>Чтоб светлая <span class=\"emph\">вела</span> звезда,<br>но счастье к нашему порогу<br>само <span class=\"emph\">приходит</span> не всегда."},{"text":"Сквозь все невозможные невзгоды, сквозь мрак, холод и туман всегда пробиваются светлая мысль, бодрость, надежда и мужество.\n(М. Зощенко)","term":"бессоюзие","source":"57636"}],"explanation":"Установим соответствия:\nА 9  — сравнение;\nБ 6  — антитеза  — лёгким/трудным;\nВ 3  — эпитет;\nГ 7  — метафора  — переносное значение слов;\nД 1  — *бессоюзие  — однородные подлежащие без союзов: светлая мысль, бодрость, надежда и мужество. Три подлежащих без союзов.\n*В источнике, на который ссылается ФИПИ в качестве словаря-справочника даётся вот такое уточнение:"},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57637","options":["сравнение","риторический вопрос","метафора","олицетворение","многосоюзие","анафора","эпифора","антитеза","гипербола"],"items":[{"text":"Мысли тоже рождаются, как живые дети, и их тоже долго вынашивают, прежде чем выпустить в свет.\n(М. М. Пришвин)","term":"сравнение","source":"57637"},{"text":"Мне много ль надо? Коврига хлеба\nИ капля молока, да это небо, да эти облака!\n(В. Хлебников)","term":"многосоюзие","source":"57637"},{"text":"Я — сын земли, где дни и годы — кратки,\nГде сладостна зеленая весна,\nГде тягостны безумных душ загадки,\nГде сны любви баюкает луна.\n(В. Брюсов)","term":"анафора","source":"57637"},{"text":"Да жалко и страшно, что жиром\nПорой заплывает душа.\n(Ю. В. Друнина)","term":"метафора","source":"57637"},{"text":"Правилу следуй упорно:\nЧтобы словам было тесно,\nМыслям — просторно.\n(Н. А. Некрасов)","term":"антитеза","source":"57637"}],"explanation":"Установим соответствия:\nА 1  — сравнение;\nБ 5  — многосоюзие  — назывные предложения в составе сложного, перед каждым сочинительный союз. Не риторический вопрос, так как автор сам отвечает на заданный вопрос;\nВ 6  — анафора  — одинаковое начало строк, наречие «где»;\nГ 3  — метафора  — переносное значение слова;\nД 8  — антитеза  — тесно/просторно (Это очень известная и всегда актуальная фраза)."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57638","options":["олицетворение","вопросно-ответная форма изложения","эпитет","риторическое восклицание","антитеза","анафора","риторическое обращение","синтаксический параллелизм","риторический вопрос"],"items":[{"text":"Есть в русской природе усталая нежность...\n(К. Бальмонт)","term":"эпитет","source":"57638"},{"text":"Мне много ль надо? Коврига хлеба\nИ капля молока, да это небо, да эти облака!\n(В. Хлебников)","term":"вопросно-ответная форма изложения","source":"57638"},{"text":"Сердце, сердце! Что ты плачешь?\nИль судьба тебе страшна?\nПолно! Что зима отымет —\nВсё отдаст тебе весна!\n(А. Н. Майков)","term":"риторический вопрос","source":"57638"},{"text":"Благословляю вас, леса,\nДолины, нивы, горы, воды!\nИ голубые небеса!\n(А. К. Толстой)","term":"риторическое обращение","source":"57638"},{"text":"И сердце в тайной радости тоскует,\nЧто жизнь, как степь, пуста и велика.\n(И. А. Бунин)","term":"олицетворение","source":"57638"}],"explanation":"Установим соответствия:\nА 3  — эпитет;\nБ 2  — вопросно-ответная форма изложения  — автор задал вопрос, сам на него ответил;\nВ 9  — риторический вопрос  — задан без цели получить ответ, см. правило к заданию;\nГ 7  — риторическое обращение  — обращение не к конкретному лицу, см. правило к заданию;\nД 1  — олицетворение  — сердце тоскует (наделено качествами человека)."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57639","options":["синтаксический параллелизм","эпитет","метафора","гипербола","антитеза","метонимия","парцелляция","сравнение","эпифора"],"items":[{"text":"Есть в русской природе усталая нежность,\nБезмолвная боль затаенной печали,\nБезвыходность горя, безгласность, безбрежность...\n(К. Бальмонт)","term":"метафора","source":"57639"},{"text":"Грубым дается радость.\nНежным дается печаль.\nМне ничего не надо,\nМне никого не жаль.\n(С. Есенин)","term":"синтаксический параллелизм","source":"57639"},{"text":"А мысль бьется в голове, как жаворонок в клетке.\n(К. К. Павлова)","term":"сравнение","source":"57639"},{"text":"Разговор выявляет свое первенство, а внимание рождает друзей. Вот почему разговор серебро, а молчание золото.\n(М. Пришвин)","term":"антитеза","source":"57639"},{"text":"И сердце в тайной радости тоскует,\nЧто жизнь, как степь, пуста и велика.\n(И. А. Бунин)","term":"эпитет","source":"57639"}],"explanation":"Установим соответствия:\nА 3  — метафора  — переносное значение выделенных слов;\nБ 1  — синтаксический параллелизм  — одинаковое построение 1 и 2, 3 и 4 строк;\nВ 8  — сравнение;\nГ 5  — антитеза  — противопоставление серебро/золото;\nД 2  — эпитет."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"57641","options":["многосоюзие","эпитет","метафора","гипербола","антитеза","метонимия","парцелляция","сравнение","эпифора"],"items":[{"text":"Годы, люди и народы\nУбегают навсегда,\nКак текучая вода.\n(В. Хлебников)","term":"сравнение","source":"57641"},{"text":"А вы ноктюрн сыграть могли бы\nНа флейте водосточных труб?\n(В. В. Маяковский)","term":"метафора","source":"57641"},{"text":"И посох мой благословляю,\nИ эту бедную суму,\nИ степь от краю и до краю,\nИ солнца свет, и ночи тьму,\nИ одинокую тропинку,\nПо коей, нищий, я иду.\n(А. К. Толстой)","term":"многосоюзие","source":"57641"},{"text":"Сердце, сердце! Что ты плачешь?\nИль судьба тебе страшна?\nПолно! Что зима отымет —\nВсё отдаст тебе весна!\n(А. Майков)","term":"антитеза","source":"57641"},{"text":"Идеал — путеводная звезда. Без нее нет твердого направления, а нет направления — нет жизни.\n(Л. Н. Толстой)","term":"эпитет","source":"57641"}],"explanation":"Установим соответствия:\nА 8  — сравнение  — убегают, как текучая вода;\nБ 3  — метафора  — вопрос содержит слова, которые употреблены в переносном смысле. Смысл: водосточная труба = флейта  — это не просто метафора, это декларация: настоящий поэт способен извлечь красоту из чего угодно, даже из самого грубого и прозаичного.\nВ 1  — многосоюзие  — однородные дополнения присоединены при помощи союза «и»;\nГ 5  — антитеза  — выделенные слова антонимы, как и зима/весна;\nД 2  — эпитет."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"58066","options":["риторическое обращение","анафора","олицетворение","сравнение","многосоюзие","парцелляция","бессоюзие","антитеза","эпифора"],"items":[{"text":"Как здесь легко дышится! Как здесь хорошо!","term":"анафора","source":"58066"},{"text":"Да здравствует мыло душистое,\nИ полотенце пушистое,\nИ зубной порошок,\nИ густой гребешок!\n(К. И. Чуковский)","term":"многосоюзие","source":"58066"},{"text":"Я — Великий Умывальник,\nЗнаменитый Мойдодыр,\nУмывальников Начальник\nИ мочалок Командир!\n(К. И. Чуковский)","term":"олицетворение","source":"58066"},{"text":"Сегодня властвую собою,\nА завтра прихотям я раб.\n(Г. Р. Державин)","term":"антитеза","source":"58066"},{"text":"Из перерубленной старой берёзы\nГрадом лилися прощальные слёзы.\n(Н. А. Некрасов)","term":"сравнение","source":"58066"}],"explanation":"А 2  — анафора, одинаковое начало рядом стоящих строк.\nБ 5  — многосоюзие, употребление двух и более союзов при однородных членах.\nВ 3  — олицетворение, придание неодушевлённому предмету качеств человека.\nГ 8  — антитеза, выражена антонимами сегодня-завтра, властвую собою-раб (соседние предложения).\nД 4  — сравнение, выражено творительным падежом градом (=как град).\nВнимательные читатели часто отмечают логическую загвоздку: в рамках сказки К. Чуковского Мойдодыр  — это уже изначально одушевлённый сказочный персонаж, поэтому его реплика воспринимается просто как монолог героя.\nОднако в рамках школьной программы и заданий ЕГЭ/ОГЭ данный фрагмент классифицируется как олицетворение. Для составителей тестов определяющим является то, что неодушевлённый в реальном мире предмет (умывальник) наделяется человеческим голосом, действиями и титулами («Начальник», «Командир»).\nЭто задание взято напрямую из официальных «Методических рекомендаций» ФИПИ 2025 года."},{"kind":"exam","title":"Задание из базы","description":"5 фрагментов · 9 средств · 4 лишних варианта","source":"58070","options":["анафора","гипербола","метафора","парцелляция","эпитет","аллитерация","лексический повтор","литота","многосоюзие"],"items":[{"text":"О, княже Даниил, твоя дорога\nОсвящена сияньем… дел!\n(М. В. Палиевский)","term":"метафора","source":"58070"},{"text":"Мир не безумен, надежда, есть надежда…\n(С. И. Злотников)","term":"лексический повтор","source":"58070"},{"text":"Он бегал день и ночь как угорелый.","term":"гипербола","source":"58070"},{"text":"Вашего-то золота кот наплакал…\n(Д. М. Мамин-Сибиряк)","term":"литота","source":"58070"},{"text":"Пробежала девчонка по росам,\nКолокольчик, смеясь, сорвала\nИ в свои золотистые косы\nЗагорелой рукою вплела.\n(М. В. Палиевский)","term":"эпитет","source":"58070"}],"explanation":"Образец решения от ФИПИ.\nВ примере под пунктом А О, княже Даниил, твоя дорога / Освящена сияньем… дел! одновременно использованы риторическое обращение (княже Даниил), риторическое восклицание, языковым средством выражения которого, кроме интонации, является междометие (о), и метафора (Освящена сияньем… дел). Поскольку среди терминов отсутствуют риторическое обращение и риторическое восклицание, в качестве ответа к пункту А следует принять метафору (пункт 3).\nВ примере под пунктом Б Мир не безумен, надежда, есть надежда одновременно использованы антитеза (безумен – надежда) и лексический повтор (надежда – надежда). Поскольку среди терминов отсутствует антитеза, в качестве ответа к пункту Б следует принять лексический повтор (пункт 7).\nВ примере под пунктом В Он бегал день и ночь как угорелый в составе фразеологизмов одновременно использованы гипербола (день и ночь) и сравнение (как угорелый). Поскольку среди терминов отсутствует сравнение, в качестве ответа к пункту В следует принять гиперболу (пункт 2).\nВ примере под пунктом Г Вашего-то золота кот наплакал одновременно использованы метонимия (золота) и в составе фразеологизма литота (кот наплакал). Поскольку среди терминов отсутствует метонимия, в качестве ответа к пункту Г следует принять литоту (пункт 8).\nВ примере под пунктом Д Пробежала девчонка по росам, / Колокольчик, смеясь, сорвала / И в свои золотистые косы / Загорелой рукою вплела использован эпитет (золотистые). Значит, в
