<body>
<div class="app">
 <header class="top"><div class="brand"><span class="mark" aria-hidden="true">🔥</span><div><strong>Адский суффиксный котёл</strong><small>ЕГЭ № 11 · Вставь буквы. Выживи.</small></div></div><span class="status" id="topStatus">0 / 5</span></header>
 <main id="screen" class="screen" aria-live="polite"></main>
</div>
<script>
(function(){
"use strict";
const DB=Array.isArray(window.CAULDRON_DB)?window.CAULDRON_DB:[];
const RULES=(window.CAULDRON_RULES||[]).map(function(a){return {id:a[0],title:a[1],anchor:a[2],text:a[3],example:a[4]}});
const byId=Object.fromEntries(RULES.map(function(r){return [r.id,r]}));
const tg=window.Telegram&&window.Telegram.WebApp||null;
try{tg&&tg.ready();tg&&tg.expand();}catch(e){}
const user=String(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id||"browser");
const KEY="russian11:ege11:hell:v1:"+user;
const norm=function(x){return String(x||"").toLocaleLowerCase("ru").replace(/ё/g,"е").trim()};
const esc=function(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")};
const screen=document.getElementById("screen"),topStatus=document.getElementById("topStatus");
const randomId=function(){return "e11-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10)};
function memoryRead(){try{const x=JSON.parse(localStorage.getItem(KEY)||"{}");return x&&typeof x==="object"?x:{}}catch(e){return {}}}
let mem=memoryRead();mem.history=Array.isArray(mem.history)?mem.history:[];mem.misses=mem.misses&&typeof mem.misses==="object"?mem.misses:{};mem.mastered=mem.mastered&&typeof mem.mastered==="object"?mem.mastered:{};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){}}
function shuffled(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=b[i];b[i]=b[j];b[j]=x}return b}
function smartRule(w){
 const old=w.rule,full=norm(w.full),exp=norm(w.explanation),ctx=norm(w.context);
 if(/ва/.test(full)&&!/безударн/.test(exp)&&/(?:перед.{0,15}ударн|ударн.{0,25}-?ва|отброс.{0,25}-?ва|убираем ударн)/.test(exp))return "verb-stressedva";
 if(old==="adj-ivev"&&/ва(?:ть|я|ющ|вш|ет|ют|л|ли|ла)/.test(full))return "verb-ova";
 if(old==="other"||old==="exceptions"){
  if(/наречи/.test(exp)||/^\([^)]*\)\s*(?:из|до|с|в|на|за)[а-я]*\.\./.test(ctx))return "adverbs";
  if(/причаст|деепричаст|перед -н|перед суффиксом -н/.test(exp))return "verb-part";
  if(/прошедшего времени|перед -л-|прошедш/.test(exp)&&/(?:л|ла|ло|ли|лся|лась|лись)$/.test(full))return "verb-past";
  if(/(?:ть|ться)$/.test(full)&&/глагол|инфинитив|неопределённой формы|суффикс/.test(exp))return "verb-infin";
  if(/-ва-|ударным ва|ударное -ва/.test(exp)&&/в[а-я]/.test(full))return "verb-stressedva";
  if(/суффиксы? -к-|суффиксы? -ск-/.test(exp)&&/кий$/.test(full))return "adj-ksk";
  if(/-инств-|-енств-|-от-|-ет-/.test(exp))return "noun-abstract";
 }
 if(old==="noun-agent2")return "noun-agent";
 return old in byId?old:"other";
}
const WORDS=[];const seen=new Set();
DB.forEach(function(q){q.rows.forEach(function(r,ri){r.slots.forEach(function(raw,si){const w=Object.assign({},raw,{key:q.id+":"+ri+":"+si,sourceId:q.id,rule:smartRule(raw)});if(!seen.has(w.key)){WORDS.push(w);seen.add(w.key)}})})});
const POOLS={};const uniqueByRule={};WORDS.forEach(function(w){if(!POOLS[w.rule]){POOLS[w.rule]=[];uniqueByRule[w.rule]=new Set()}const k=norm(w.full)+"|"+norm(w.context);if(!uniqueByRule[w.rule].has(k)){POOLS[w.rule].push(w);uniqueByRule[w.rule].add(k)}});
const alphabet=shuffled([...new Set(WORDS.map(function(w){return norm(w.letter)}))].filter(function(x){return /^[а-я]$/.test(x)})).sort(function(a,b){return "аеиоуыэюясчщцткн".indexOf(a)-"аеиоуыэюясчщцткн".indexOf(b)});
alphabet.push("⌫");
const state={view:"home",mode:null,exam:[],examIndex:0,results:[],pack:[],values:[],active:0,feedback:null,attemptId:null,payload:null,ruleId:null,saveStatus:""};
function avg(){if(!mem.history.length)return null;return mem.history.reduce(function(s,x){return s+(Number(x.score)||0)},0)/mem.history.length}
function league(s){return s==null?-1:s<2?0:s<3.5?1:s<4.5?2:3}
const TITLES=["Жалкий грешник","Подающий надежды чертёнок","Демоническая сущность","Сам Сатана"];
function avatar(rank){const n=Math.max(0,rank);return '<svg role="img" aria-label="'+esc(TITLES[n])+'" class="avatar rank'+n+'" viewBox="0 0 100 100"><defs><linearGradient id="avflame" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe7a1"/><stop offset="1" stop-color="#f25c39"/></linearGradient></defs><path class="flame" d="M13 73 Q-3 50 26 26 Q23 52 42 41 Q49 15 62 11 Q54 32 76 44 Q80 28 91 26 Q90 61 85 76 Z"/><path class="horn" d="M23 32 Q2 20 13 1 Q18 19 37 28 Z"/><path class="horn" d="M76 32 Q96 18 87 1 Q83 21 62 28 Z"/><path class="face" d="M18 38 Q22 24 50 23 Q77 24 82 40 L85 65 Q78 90 50 91 Q22 90 15 65 Z"/><path d="M29 47 Q39 41 46 49 Q37 59 28 52 Z M54 49 Q62 40 72 47 Q72 56 62 56 Z" class="eye"/><path class="mouth" d="M34 70 Q50 82 66 70"/><path d="M39 72 L43 80 L47 74 M53 74 L57 80 L61 72" fill="#fff0d6"/>'+(n===3?'<path d="M24 27 L31 6 L44 20 L52 0 L62 20 L77 6 L82 27 Z" fill="url(#avflame)" stroke="#ffe3a6" stroke-width="2"/>':'')+'</svg>'}
function rankLabel(){const a=avg(),n=league(a);return n<0?"Рейтинг ещё не открыт":TITLES[n]}
function updateTop(){if(state.mode==="exam"&&state.view==="play")topStatus.textContent=(state.examIndex+1)+" / 5";else if(state.mode==="exam"&&state.view==="feedback")topStatus.textContent=(state.examIndex+1)+" / 5";else if(state.mode==="rule"||state.mode==="errors")topStatus.textContent="5 слов";else topStatus.textContent=mem.history.length?avg().toFixed(2)+" / 5":"ЕГЭ 11"}
function heading(title,sub){return '<div class="selectorHead panel"><h2>'+esc(title)+'</h2><p>'+esc(sub)+'</p></div>'}
function home(){
state.view="home";state.mode=null;const a=avg(),rank=league(a);
screen.innerHTML='<div class="home"><div class="homeTop panel">'+avatar(rank)+'<div><h1>Суффиксы не прощают ошибок</h1><div class="rankTitle">'+esc(rankLabel())+'</div><div class="metric">Средний результат: '+(a==null?"—":a.toFixed(2))+' / 5 · Раундов: '+mem.history.length+'</div><div class="subtitle">Верных словоформ: '+Object.keys(mem.mastered).length+' · На повторении: '+Object.keys(mem.misses).length+'</div></div></div><div class="menu"><button data-action="start-exam"><span><span class="menuName">🔥 Задания ЕГЭ</span><span class="menuDesc">5 номеров · оценка из 5 · статистика Telegram</span></span><span class="symbol">⚔️</span></button><button data-action="rules"><span><span class="menuName">🧪 Тренировка по правилам</span><span class="menuDesc">Выбери правило и вставь буквы в 5 слов</span></span><span class="symbol">📜</span></button><button data-action="errors"><span><span class="menuName">💀 Мои ошибки</span><span class="menuDesc">Исправь слово — оно станет верным</span></span><span class="symbol">🕯️</span></button><button data-action="guide"><span><span class="menuName">📖 Справочник</span><span class="menuDesc">Правила, образцы и кодовые слова</span></span><span class="symbol">🔮</span></button></div><div class="miniNote">В базе '+DB.length+' проверенных заданий · буквы Е и Ё считаются одинаковыми · регистр не важен</div></div>';updateTop()}
function selectRules(){state.view="rules";state.mode=null;const counts={};Object.values(mem.misses).forEach(function(w){counts[w.rule]=(counts[w.rule]||0)+1});const list=RULES.filter(function(r){return (POOLS[r.id]||[]).length>=5}).sort(function(a,b){return (counts[b.id]||0)-(counts[a.id]||0)||a.title.localeCompare(b.title,"ru")});screen.innerHTML='<div class="selector">'+heading("Тренировка по правилам","Каждый раунд — 5 слов, результат не отправляется в бот.")+'<div class="scroll">'+list.map(function(r){return '<button class="ruleChoice" data-action="start-rule" data-rule="'+esc(r.id)+'"><span><strong>'+esc(r.title)+'</strong><small>Код: '+esc(r.anchor)+' · Слов: '+POOLS[r.id].length+'</small></span><span class="count">'+(counts[r.id]?("Ошибок: "+counts[r.id]):"Тренировать")+'</span></button>'}).join("")+'</div><div class="toolbar"><button class="ghost" data-action="home">← В котёл</button></div></div>';updateTop()}
function guide(){state.guideFrom=state.view;state.view="guide";screen.innerHTML='<div class="reference"><div class="referenceHead panel"><h2>📖 Гримуар суффиксов</h2><p>23 правила из базы заданий. Сначала запомни кодовое слово, затем прочти объяснение.</p></div><div class="scroll">'+RULES.map(function(r){return '<section class="ruleBox"><h3>'+esc(r.title)+'</h3><p class="mnemonic">🔑 '+esc(r.anchor)+'</p><p>'+esc(r.text)+'</p><p><b>Как применить:</b> '+esc(r.example)+'</p>'+((POOLS[r.id]||[]).length>=5?'<button data-action="start-rule" data-rule="'+esc(r.id)+'">Отработать 5 слов</button>':"")+'</section>'}).join("")+'</div><div class="toolbar"><button class="ghost" data-action="back-guide">← Назад</button></div></div>';updateTop()}
function startExam(){state.mode="exam";state.exam=shuffled(DB).slice(0,5);state.examIndex=0;state.results=[];state.attemptId=randomId();state.payload=null;startEntry()}
function startRule(id){const pool=POOLS[id]||[];if(pool.length<5)return;state.mode="rule";state.ruleId=id;state.pack=shuffled(pool).slice(0,5);state.attemptId=randomId();startEntry()}
function startErrors(){const bad=Object.values(mem.misses);if(!bad.length){state.view="errors";screen.innerHTML='<div class="finished">'+heading("Мои ошибки","Все исправленные слова переходят в освоенные.")+'<div class="panel empty">Здесь пока нет слов для повторения. Пройди раунд ЕГЭ или потренируй конкретное правило.</div><div class="toolbar"><button data-action="home">← В котёл</button></div></div>';updateTop();return}state.mode="errors";state.pack=shuffled(bad).slice(0,5);state.attemptId=randomId();startEntry()}
function getRows(){if(state.mode==="exam"){const q=state.exam[state.examIndex];return q.rows.map(function(r,i){return {raw:r.raw,slots:r.slots.map(function(w,j){return Object.assign({},w,{key:q.id+":"+i+":"+j,rule:smartRule(w)})})}})}return state.pack.map(function(w){return {raw:w.context,slots:[w]}})}
function flat(rows){return rows.flatMap(function(r){return r.slots})}
function startEntry(){state.view="play";state.values=new Array(flat(getRows()).length).fill("");state.active=0;state.feedback=null;renderPlay()}
function letterButton(index,w){const value=state.values[index]||"";return '<button type="button" aria-label="Вписать букву в слово '+esc(w.full)+'" data-action="slot" data-index="'+index+'" class="slot'+(state.active===index?" active":"")+(value?" filled":"")+'">'+esc(value?value.toUpperCase():"·")+'</button>'}
function masked(raw,slots,startIndex){let at=0,result="";for(let i=0;i<slots.length;i++){const w=slots[i],pos=raw.indexOf(w.mask,at);if(pos<0)continue;result+=esc(raw.slice(at,pos));const pivot=w.mask.indexOf("..");result+=esc(w.mask.slice(0,pivot))+letterButton(startIndex+i,w)+esc(w.mask.slice(pivot+2));at=pos+w.mask.length;}return result+esc(raw.slice(at))}
function renderPlay(){
state.view="play";const rows=getRows();let index=0;const content=rows.map(function(r,i){const out='<div class="qrow"><span class="rowNo">'+(i+1)+'</span><div class="line">'+masked(r.raw,r.slots,index)+'</div></div>';index+=r.slots.length;return out}).join("");
const exam=state.mode==="exam",name=exam?"Задание № 11 · "+(state.examIndex+1)+" из 5":state.mode==="rule"?(byId[state.ruleId]?.title||"Тренировка"):"Отработка ошибок";
const pips=exam?'<div class="pips">'+[0,1,2,3,4].map(function(x){return '<b class="'+(x<state.examIndex?"done":x===state.examIndex?"active":"")+'"></b>'}).join("")+'</div>':"";
const keys=alphabet.map(function(k){return '<button type="button" data-action="key" data-key="'+esc(k)+'" class="'+(k==="⌫"?"erase":"")+'" aria-label="'+(k==="⌫"?"Стереть букву":("Вставить "+k))+'">'+esc(k==="е"?"Е/Ё":k.toUpperCase())+'</button>'}).join("");
screen.innerHTML='<div class="play"><div class="playHead panel"><div><div class="mode">'+esc(name)+'</div><div class="tip">'+(exam?"Вставь по одной букве в каждый пропуск":"Пять слов · затем проверка")+'</div></div>'+pips+'</div><div class="rows">'+content+'</div><div class="keyboard" aria-label="Клавиатура для вставки букв">'+keys+'</div><div class="controls"><button class="ghost tiny" data-action="home">Меню</button><button class="primary" data-action="check" '+(state.values.every(Boolean)?"":"disabled")+'>Проверить все буквы</button></div></div>';updateTop()}
function inputLetter(k){if(state.view!=="play")return;if(k==="⌫"||k==="Backspace"){state.values[state.active]="";renderPlay();return}const letter=norm(k);if(!/^[а-я]$/.test(letter)||!alphabet.includes(letter))return;state.values[state.active]=letter;const next=state.values.findIndex(function(v,i){return i>state.active&&!v});if(next>=0)state.active=next;else{const first=state.values.indexOf("");if(first>=0)state.active=first;}renderPlay()}
function check(){if(state.view!=="play"||!state.values.every(Boolean))return;const rows=getRows(),words=flat(rows),wrong=[],tested={};words.forEach(function(w,i){const rule=w.rule||"other";tested[rule]=(tested[rule]||0)+1;const good=norm(state.values[i])===norm(w.letter);if(good){mem.mastered[w.key]=true;if(mem.misses[w.key])delete mem.misses[w.key];}else{const err=Object.assign({},w,{rule:rule,attempted:state.values[i]});mem.misses[w.key]=err;wrong.push(err)}});persist();state.feedback={wrong:wrong,words:words,tested:tested,perfect:wrong.length===0};if(state.mode==="exam"){state.results.push(state.feedback)}showFeedback()}
function showFeedback(){state.view="feedback";const x=state.feedback;const title=x.perfect?"Все буквы на месте!":"Котёл разобрал твои ошибки";const subtitle=state.mode==="exam"?"Номер "+(state.examIndex+1)+": "+(x.perfect?"1 балл":"0 баллов")+" · Ошибок в словах: "+x.wrong.length:"Правильно: "+(x.words.length-x.wrong.length)+" из "+x.words.length;const list=x.wrong.length?x.wrong.map(function(w){return '<article class="feedbackItem"><strong>'+esc(w.full)+' · вместо '+esc(w.attempted.toUpperCase())+' нужно '+esc(w.letter.toUpperCase())+'</strong><div class="ruleTag">'+esc(byId[w.rule]?.title||"Суффикс")+'</div><p>'+esc(w.explanation||"Проверь образование слова и суффикс в справочнике.")+'</p></article>'}).join(""):'<div class="panel successNote">Ни одного ошибочного слова. Огонь на твоей стороне! 🔥</div>';
screen.innerHTML='<div class="feedback"><div class="feedbackHead panel"><h2>'+esc(title)+'</h2><p>'+esc(subtitle)+'</p></div><div class="scroll">'+list+'</div><div class="toolbar"><button class="ghost" data-action="guide">📖 Правила</button><button class="primary" data-action="advance">'+(state.mode==="exam"&&state.examIndex<4?"Следующий номер →":"Завершить раунд →")+'</button></div></div>';updateTop()}
function advance(){if(state.mode==="exam"){if(state.examIndex<4){state.examIndex++;startEntry()}else finishExam()}else finishDrill()}
function finishExam(){const score=state.results.filter(function(x){return x.perfect}).length;const errors={},tested={};state.results.forEach(function(r){Object.entries(r.tested).forEach(function(e){tested[e[0]]=(tested[e[0]]||0)+e[1]});r.wrong.forEach(function(w){errors[w.rule]=(errors[w.rule]||0)+1})});
state.payload={v:1,type:"game_result",gameId:"ege11-cauldron",attemptId:state.attemptId,correct:score,total:5,errors:errors,tested:tested};
mem.history.push({at:new Date().toISOString(),score:score,attemptId:state.attemptId,sent:false});persist();state.view="finish";
const a=avg(),r=league(a);screen.innerHTML='<div class="finished"><div class="finishHead panel"><h2>🏆 Итоги пяти испытаний</h2><p>Баллы даются только за полностью верный номер ЕГЭ.</p></div><div class="finishBody panel"><div class="finishAvatar">'+avatar(r)+'<div><div class="scoreBig">'+score+' / 5</div><div class="rankTitle">'+esc(TITLES[r])+'</div><p>Средний результат: '+a.toFixed(2)+' / 5 за '+mem.history.length+' раунд(ов)</p></div></div><p>Слов на повторении: '+Object.keys(mem.misses).length+'. Отработка ошибок и тренировки по правилам не добавляют баллы в рейтинг.</p></div><div class="scroll"><div class="panel finishBody"><strong>Статистика раунда</strong><p>Проверено слов: '+Object.values(tested).reduce(function(s,n){return s+n},0)+' · ошибочных вставок: '+Object.values(errors).reduce(function(s,n){return s+n},0)+'</p><p>Чтобы результат появился в боте, открой игру из Telegram и нажми «Сохранить».</p></div></div><div class="toolbar"><button class="ghost" data-action="home">В меню</button><button class="primary" data-action="send" id="saveResult">📩 Сохранить в Telegram</button></div><div class="note" id="saveStatus">'+esc(state.saveStatus)+'</div></div>';updateTop()}
function finishDrill(){state.view="drill-finish";screen.innerHTML='<div class="finished">'+heading("Тренировка завершена","Правильные ответы убраны из «Моих ошибок». Ошибочные остались для повторения.")+'<div class="panel finishBody"><div class="scoreBig">'+(state.feedback.words.length-state.feedback.wrong.length)+' / '+state.feedback.words.length+'</div><p>Из них ошибок: '+state.feedback.wrong.length+'. Рейтинг ЕГЭ не изменился.</p><p>Осталось повторить слов: '+Object.keys(mem.misses).length+'.</p></div><div class="toolbar"><button data-action="home" class="primary">Вернуться в котёл</button><button data-action="'+(state.mode==="rule"?"repeat-rule":"errors")+'" class="ghost">Ещё раунд</button></div></div>';updateTop()}
function send(){if(!state.payload)return;const status=document.getElementById("saveStatus");if(!tg||!tg.platform||tg.platform==="unknown"||typeof tg.sendData!=="function"){if(status)status.textContent="Открой через кнопку тренажёра внутри Telegram, чтобы отправить результат.";return}try{const h=mem.history.find(function(x){return x.attemptId===state.attemptId});if(h&&h.sent){if(status)status.textContent="Этот раунд уже отправлен.";return}tg.sendData(JSON.stringify(state.payload));if(h){h.sent=true;persist()}if(status)status.textContent="Результат отправлен в Telegram."}catch(e){if(status)status.textContent="Отправка не удалась: "+String(e.message||e)}}
document.addEventListener("click",function(e){const el=e.target.closest("button[data-action]");if(!el)return;const a=el.dataset.action;if(a==="home"){home();return}if(a==="start-exam"){startExam();return}if(a==="rules"){selectRules();return}if(a==="guide"){guide();return}if(a==="back-guide"){if(state.guideFrom==="feedback"&&state.feedback)showFeedback();else if(state.guideFrom==="play"&&state.mode)renderPlay();else home();return}if(a==="errors"){startErrors();return}if(a==="start-rule"){startRule(el.dataset.rule);return}if(a==="slot"){state.active=Number(el.dataset.index);renderPlay();return}if(a==="key"){inputLetter(el.dataset.key);return}if(a==="check"){check();return}if(a==="advance"){advance();return}if(a==="repeat-rule"){startRule(state.ruleId);return}if(a==="send"){send();return}});
document.addEventListener("keydown",function(e){if(state.view!=="play"||e.ctrlKey||e.altKey||e.metaKey)return;const key=e.key;if(key==="Backspace"||/^[а-яёА-ЯЁ]$/.test(key)){e.preventDefault();inputLetter(key)}});
if(DB.length<200||!RULES.length){screen.innerHTML='<div class="panel empty">Не удалось загрузить базу заданий. Обнови страницу.</div>';return}
home();
window.__CAULDRON_QA={counts:function(){return {tasks:DB.length,words:WORDS.length,rulePools:Object.fromEntries(Object.entries(POOLS).map(function(x){return [x[0],x[1].length]}))}},startExam:startExam,startRule:startRule,getState:function(){return {view:state.view,mode:state.mode,values:state.values.slice(),active:state.active,score:state.results.length}},keyboard:alphabet.slice()};
})();
</script>
</body></html>
